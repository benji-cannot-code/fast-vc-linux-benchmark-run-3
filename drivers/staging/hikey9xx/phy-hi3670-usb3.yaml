# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/hisilicon,hi3670-usb3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Kirin970 USB PHY

maintainers:
  - Mauro Carvalho Chehab <mchehab+huawei@kernel.org>

description: |+
  Bindings for USB3 PHY on HiSilicon Kirin 970.

properties:
  compatible:
    const: hisilicon,hi3670-usb-phy

  "#phy-cells":
    const: 0

  hisilicon,pericrg-syscon:
/* bench 22113.2.0 a5409f967e30 */
/* bench 22113.2.1 39433fd59116 */
/* bench 22113.2.2 bc2010db9bbc */
/* bench 22113.2.3 940f90aee765 */
/* bench 22113.2.4 8cc0952b6581 */
/* bench 22113.2.5 64404a31b4d7 */
/* bench 22113.2.6 e05d1a5d513d */
/* bench 22113.2.7 84a2dee6bbe3 */
/* bench 22113.2.8 a461fb5eb9e0 */
  hisilicon,pctrl-syscon:
    $ref: '/schemas/types.yaml#/definitions/phandle'
    description: phandle of syscon used to control usb tcxo.

  hisilicon,sctrl-syscon:
    $ref: '/schemas/types.yaml#/definitions/phandle'
    description: phandle of syscon used to control phy deep sleep.

  hisilicon,eye-diagram-param:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Eye diagram for phy.

  hisilicon,tx-vboost-lvl:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: TX level vboost for phy.
/* bench 18301.3.0 d042df8d9cbd */
/* bench 18301.3.1 b32e2e5ca5f6 */
/* bench 18301.3.2 21a6bf6f0510 */
/* bench 18301.3.3 b74e91bada63 */
/* bench 18301.3.4 a23f6e7d0125 */
/* bench 18301.3.5 ed8b1fa53a10 */
/* bench 18301.3.6 f5a15e3c87af */
  - compatible
  - hisilicon,pericrg-syscon
  - hisilicon,pctrl-syscon
  - hisilicon,sctrl-syscon
  - hisilicon,eye-diagram-param
  - hisilicon,tx-vboost-lvl
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    bus {
      #address-cells = <2>;
      #size-cells = <2>;

      usb3_otg_bc: usb3_otg_bc@ff200000 {
        compatible = "syscon", "simple-mfd";
        reg = <0x0 0xff200000 0x0 0x1000>;

        usb_phy {
          compatible = "hisilicon,hi3670-usb-phy";
          #phy-cells = <0>;
          hisilicon,pericrg-syscon = <&crg_ctrl>;
          hisilicon,pctrl-syscon = <&pctrl>;
          hisilicon,sctrl-syscon = <&sctrl>;
          hisilicon,eye-diagram-param = <0xfdfee4>;
          hisilicon,tx-vboost-lvl = <0x5>;
        };
      };
    };
