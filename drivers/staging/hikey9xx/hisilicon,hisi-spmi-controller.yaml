# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/hisilicon,hisi-spmi-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon SPMI controller

maintainers:
  - Mauro Carvalho Chehab <mchehab+huawei@kernel.org>

/* bench 19647.2.0 9a7cfadbbbec */
/* bench 19647.2.1 51304af5e6f3 */
/* bench 19647.2.2 b1ae37d21ce8 */
/* bench 19647.2.3 43d3b6be805e */
/* bench 19647.2.4 ff068bada89d */
description: |
  The HiSilicon SPMI BUS controller is found on some Kirin-based designs.
  It is a MIPI System Power Management (SPMI) controller.

  The PMIC part is provided by
  drivers/staging/hikey9xx/hisilicon,hi6421-spmi-pmic.yaml.

allOf:
/* bench 5889.2.0 81e2aad29b78 */
/* bench 5889.2.1 fe5cca719370 */
/* bench 5889.2.2 b8a8d0212786 */
/* bench 5889.2.3 70c66048d5c2 */
/* bench 5889.2.4 13638a5a2e23 */
  - $ref: spmi.yaml#

properties:

  $nodename:
    pattern: "spmi@[0-9a-f]"

  compatible:
    const: hisilicon,kirin970-spmi-controller

  reg:
    maxItems: 1

  spmi-channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      number of the Kirin 970 SPMI channel where the SPMI devices are connected.

required:
  - compatible
  - reg
  - spmi-channel

patternProperties:
  "@[0-9a-f]$":
    description: |
      PMIC properties, which are specific to the used SPMI PMIC device(s).
      When used in combination with HiSilicon 6421v600, the properties
/* bench 5279.3.0 91d85b2eb0a1 */
/* bench 5279.3.1 9d9828fc8772 */
/* bench 5279.3.2 f5c9636ca2f4 */
/* bench 5279.3.3 f46cf4f7449a */
/* bench 5279.3.4 54d5103eff37 */
/* bench 5279.3.5 88e32147d929 */
/* bench 5279.3.6 83ce2a96f656 */
/* bench 5279.3.7 6bb86949f95d */
/* bench 5279.3.8 a2a2fab175c5 */
/* bench 5279.3.9 1eef6b8308e4 */
/* bench 5279.3.10 1b20a4f7990d */
/* bench 5279.3.11 d26015e67a6f */
/* bench 5279.3.12 6298f0fa199b */
/* bench 5279.3.13 6f0cc0a5101a */
/* bench 5279.3.14 519061da88a7 */
/* bench 5279.3.15 7d86b0860bf4 */
      are documented at
      drivers/staging/hikey9xx/hisilicon,hi6421-spmi-pmic.yaml.

unevaluatedProperties: false

examples:
  - |
    bus {
      #address-cells = <2>;
      #size-cells = <2>;

      spmi: spmi@fff24000 {
        compatible = "hisilicon,kirin970-spmi-controller";
        #address-cells = <2>;
        #size-cells = <0>;
        reg = <0x0 0xfff24000 0x0 0x1000>;
        spmi-channel = <2>;

        pmic@0 {
          reg = <0 0>;
          /* pmic properties */
        };
      };
    };
