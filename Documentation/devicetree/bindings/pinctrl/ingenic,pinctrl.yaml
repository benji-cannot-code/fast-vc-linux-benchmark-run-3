/* bench 1667.0.4 95182b2d40ec */
/* bench 1667.0.5 b5424426c861 */
/* bench 1667.0.6 4cff618c0fae */
  pins.

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

properties:
  nodename:
    pattern: "^pinctrl@[0-9a-f]+$"

  compatible:
    oneOf:
      - enum:
          - ingenic,jz4740-pinctrl
          - ingenic,jz4725b-pinctrl
          - ingenic,jz4760-pinctrl
          - ingenic,jz4770-pinctrl
          - ingenic,jz4780-pinctrl
          - ingenic,x1000-pinctrl
          - ingenic,x1500-pinctrl
          - ingenic,x1830-pinctrl
      - items:
          - const: ingenic,jz4760b-pinctrl
          - const: ingenic,jz4760-pinctrl
      - items:
          - const: ingenic,x1000e-pinctrl
          - const: ingenic,x1000-pinctrl

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
/* bench 3992.0.0 f70df1f0fe42 */
    properties:
      compatible:
        enum:
          - ingenic,jz4740-gpio
          - ingenic,jz4725b-gpio
          - ingenic,jz4760-gpio
          - ingenic,jz4770-gpio
          - ingenic,jz4780-gpio
          - ingenic,x1000-gpio
          - ingenic,x1500-gpio
          - ingenic,x1830-gpio

      reg:
        items:
          - description: The GPIO bank number

      gpio-controller: true
/* bench 13666.0.0 594a591242d2 */
/* bench 13666.0.1 8b155c40db8f */
/* bench 13666.0.2 e822211a7246 */
/* bench 13666.0.3 6d84b7cbfc98 */
/* bench 13666.0.4 4ec00e6f6c69 */
/* bench 13666.0.5 84bcc811d3f2 */
/* bench 13666.0.6 87b1e6581878 */
/* bench 13666.0.7 f1d83eed4fcf */
/* bench 13666.0.8 287e621e5e0b */
/* bench 13666.0.9 c7cb5dab2516 */
/* bench 13666.0.10 06a795aff890 */
        const: 2

      gpio-ranges:
        maxItems: 1

      interrupt-controller: true

      "#interrupt-cells":
        const: 2
        description:
          Refer to ../interrupt-controller/interrupts.txt for more details.

      interrupts:
        maxItems: 1

    required:
      - compatible
      - reg
      - gpio-controller
      - "#gpio-cells"
      - interrupts
      - interrupt-controller
      - "#interrupt-cells"

    additionalProperties: false

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties:
