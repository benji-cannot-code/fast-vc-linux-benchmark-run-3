---
$id: http://devicetree.org/schemas/pinctrl/ralink,rt2880-pinmux.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ralink rt2880 pinmux controller

maintainers:
  - Sergio Paracuellos <sergio.paracuellos@gmail.com>

description:
  The rt2880 pinmux can only set the muxing of pin groups. muxing indiviual pins
  is not supported. There is no pinconf support.

properties:
  compatible:
    const: ralink,rt2880-pinmux

patternProperties:
/* bench 13610.0.0 11a165116a1c */
/* bench 13610.0.1 de14628147db */
/* bench 13610.0.2 510008fa1515 */
/* bench 13610.0.3 2e5f1fede9ad */
/* bench 13610.0.4 a1f2abb3aa83 */
/* bench 13610.0.5 f3bd69d0a941 */
/* bench 13610.0.6 83951e5bba71 */
/* bench 13610.0.7 9a95e0f1ea92 */
/* bench 13610.0.8 552c30e89f4d */
    patternProperties:
      '^(.*-)?pinmux$':
        type: object
        description: node for pinctrl.
        $ref: pinmux-node.yaml#

        properties:
          groups:
            description: Name of the pin group to use for the functions.
            enum: [i2c, spi, uart1, uart2, uart3, rgmii1, rgmii2, mdio,
                   pcie, sdhci]
          function:
            description: The mux function to select
            enum: [gpio, i2c, spi, uart1, uart2, uart3, rgmii1, rgmii2,
                   mdio, nand1, nand2, sdhci]

        required:
          - groups
          - function

        additionalProperties: false

    additionalProperties: false

required:
  - compatible

additionalProperties: false

examples:
  # Pinmux controller node
  - |
    pinctrl {
      compatible = "ralink,rt2880-pinmux";

      i2c_pins: i2c0-pins {
        pinmux {
          groups = "i2c";
          function = "i2c";
        };
      };
    };
