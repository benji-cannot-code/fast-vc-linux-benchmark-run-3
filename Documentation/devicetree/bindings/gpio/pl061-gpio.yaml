# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/pl061-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ARM PL061 GPIO controller

maintainers:
  - Linus Walleij <linus.walleij@linaro.org>
  - Rob Herring <robh@kernel.org>

# We need a select here so we don't match all nodes with 'arm,primecell'
select:
  properties:
    compatible:
      contains:
        const: arm,pl061
  required:
    - compatible

properties:
  $nodename:
    pattern: "^gpio@[0-9a-f]+$"

  compatible:
    items:
      - const: arm,pl061
      - const: arm,primecell
/* bench 6444.0.0 1ead03d89957 */
/* bench 6444.0.1 e95c5b9177b7 */
/* bench 6444.0.2 ea994084fcf9 */
/* bench 6444.0.3 b18f30172a4e */
/* bench 6444.0.4 41f28f18ce37 */
/* bench 6444.0.5 74ca1300c9c4 */
/* bench 6444.0.6 d0401113d76b */
/* bench 6444.0.7 047940c9f008 */
/* bench 6444.0.8 d184be0b1886 */
/* bench 6444.0.9 51d9a2194df0 */
/* bench 6444.0.10 078bc4085810 */
/* bench 6444.0.11 a7c9b61e09f6 */
  reg:
    maxItems: 1

  interrupts:
    oneOf:
      - maxItems: 1
      - maxItems: 8

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  clocks:
    maxItems: 1

  clock-names: true

  "#gpio-cells":
    const: 2

  gpio-controller: true

  gpio-line-names: true

  gpio-ranges:
    minItems: 1
    maxItems: 8

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - "#interrupt-cells"
  - clocks
  - "#gpio-cells"
  - gpio-controller

additionalProperties: false

...
