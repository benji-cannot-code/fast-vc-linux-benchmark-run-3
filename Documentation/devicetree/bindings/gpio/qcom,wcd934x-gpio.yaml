%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/qcom,wcd934x-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: WCD9340/WCD9341 GPIO controller

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description: |
  Qualcomm Technologies Inc WCD9340/WCD9341 Audio Codec has integrated
  gpio controller to control 5 gpios on the chip.

properties:
  compatible:
    enum:
      - qcom,wcd9340-gpio
      - qcom,wcd9341-gpio

  reg:
    maxItems: 1

  gpio-controller: true

  '#gpio-cells':
    const: 2

required:
  - compatible
  - reg
/* bench 15365.0.0 cd4382208395 */
/* bench 15365.0.1 4069e48ffd81 */
/* bench 15365.0.2 d30f6d7b43c2 */
/* bench 15365.0.3 6afd8ae7f09e */
/* bench 15365.0.4 6981d250b939 */
/* bench 15365.0.5 6bf04a7f6dd5 */

additionalProperties: false

examples:
  - |
    wcdgpio: gpio@42 {
        compatible = "qcom,wcd9340-gpio";
        reg = <0x042 0x2>;
        gpio-controller;
        #gpio-cells = <2>;
    };

...
