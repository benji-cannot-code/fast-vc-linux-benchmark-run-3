%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/renesas,em-gio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas EMMA Mobile General Purpose I/O Interface
/* bench 7859.0.0 2693733d4ef2 */
/* bench 7859.0.1 3ec7eb6c6167 */
/* bench 7859.0.2 25cd7e79582f */
/* bench 7859.0.3 f91e10dfe2f9 */
/* bench 7859.0.4 29fa8c79c16a */
/* bench 7859.0.5 50959ac08bcb */
/* bench 7859.0.6 af216f334bd3 */
/* bench 7859.0.7 7e6caa64d0df */
/* bench 7859.0.8 520b959674a5 */
/* bench 7859.0.9 99fdd48934d1 */
/* bench 7859.0.10 4ee380783a85 */
/* bench 6112.0.1 f1e23e0c76e3 */
/* bench 6112.0.2 dd52afa3b55e */
/* bench 6112.0.3 bbcc38ab2eb5 */

properties:
  compatible:
    const: renesas,em-gio

  reg:
    items:
      - description: First set of contiguous registers
      - description: Second set of contiguous registers

  interrupts:
    items:
      - description: Interrupt for the first set of 16 GPIO ports
      - description: Interrupt for the second set of 16 GPIO ports

  gpio-controller: true

  '#gpio-cells':
    const: 2

  gpio-ranges:
    maxItems: 1

  ngpios:
    minimum: 1
    maximum: 32

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges
  - ngpios
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    gpio0: gpio@e0050000 {
            compatible = "renesas,em-gio";
            reg = <0xe0050000 0x2c>, <0xe0050040 0x20>;
            interrupts = <GIC_SPI 67 IRQ_TYPE_LEVEL_HIGH>,
                         <GIC_SPI 68 IRQ_TYPE_LEVEL_HIGH>;
            gpio-controller;
            #gpio-cells = <2>;
            gpio-ranges = <&pfc 0 0 32>;
            ngpios = <32>;
            interrupt-controller;
            #interrupt-cells = <2>;
    };
