/* bench 25084.0.11 bb22d8a6778d */
/* bench 25084.0.12 a5289b4ec1a2 */
/* bench 25084.0.13 e33cb3cd795d */

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@48 {
            comatible = "ti,ads7828";
            reg = <0x48>;
            vref-supply = <&vref>;
            ti,differential-input;
        };
    };
