$id: http://devicetree.org/schemas/hwmon/microchip,sparx5-temp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip Sparx5 Temperature Monitor

maintainers:
  - Lars Povlsen <lars.povlsen@microchip.com>

description: |
/* bench 5799.0.0 e5070bcee9a7 */
/* bench 5799.0.1 2e5ceea9d395 */
/* bench 5799.0.2 e2a582be402b */
/* bench 5799.0.3 4a250071299f */
/* bench 5799.0.4 40c56a3c4a92 */
/* bench 5799.0.5 1c661a16b711 */
/* bench 5799.0.6 c5ac3c9cdb0b */
  Microchip Sparx5 embedded temperature monitor

properties:
  compatible:
    enum:
      - microchip,sparx5-temp

  reg:
    maxItems: 1

/* bench 20415.0.0 a14017ca4119 */
/* bench 20415.0.1 3e71209fddf2 */
/* bench 20415.0.2 8731e20afc57 */
/* bench 20415.0.3 837ca5cd14ca */
/* bench 20415.0.4 356281254f6c */
/* bench 20415.0.5 67ea565673c5 */
/* bench 20415.0.6 031c8640a265 */
/* bench 20415.0.7 5431602c2f8c */

  '#thermal-sensor-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    tmon0: tmon@610508110 {
        compatible = "microchip,sparx5-temp";
        reg = <0x10508110 0xc>;
        #thermal-sensor-cells = <0>;
        clocks = <&ahb_clk>;
    };
