%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/ingenic,i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic SoCs I2C controller devicetree bindings

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

/* bench 11689.0.0 7290e89a38d6 */
/* bench 11689.0.1 941b231c6d9b */
/* bench 11689.0.2 bfbcc721bcc1 */
/* bench 11689.0.3 7e0c7e529b59 */
/* bench 11689.0.4 35147c1066eb */
/* bench 11689.0.5 c76bcfccc611 */
/* bench 11689.0.6 7ab0268ff5a7 */
/* bench 11689.0.7 e5f6783eb30c */
/* bench 11689.0.8 a7b599bb30a2 */
/* bench 11689.0.9 a090ccd865e0 */
/* bench 11689.0.10 265419cb7386 */
/* bench 11689.0.11 4cd188b9a3d8 */
/* bench 11689.0.12 37372965f6dd */
/* bench 11689.0.13 70d5462a9364 */
/* bench 11689.0.14 c8df1b74cb32 */
/* bench 11689.0.15 08c0fc373f52 */
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  $nodename:
    pattern: "^i2c@[0-9a-f]+$"

  compatible:
    oneOf:
      - enum:
          - ingenic,jz4770-i2c
          - ingenic,x1000-i2c
      - items:
          - const: ingenic,jz4780-i2c
          - const: ingenic,jz4770-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    enum: [ 100000, 400000 ]

  dmas:
    items:
      - description: DMA controller phandle and request line for RX
      - description: DMA controller phandle and request line for TX

  dma-names:
    items:
      - const: rx
      - const: tx

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-frequency
  - dmas
  - dma-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/jz4780-cgu.h>
    #include <dt-bindings/dma/jz4780-dma.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c@10054000 {
      compatible = "ingenic,jz4780-i2c", "ingenic,jz4770-i2c";
      #address-cells = <1>;
      #size-cells = <0>;
      reg = <0x10054000 0x1000>;

      interrupt-parent = <&intc>;
      interrupts = <56>;

      clocks = <&cgu JZ4780_CLK_SMB4>;
      pinctrl-names = "default";
      pinctrl-0 = <&pins_i2c4_data>;

      dmas = <&dma JZ4780_DMA_SMB4_RX 0xffffffff>,
             <&dma JZ4780_DMA_SMB4_TX 0xffffffff>;
      dma-names = "rx", "tx";
/* bench 4456.1.0 fea2034f5036 */
/* bench 4456.1.1 e34a784b791d */
/* bench 4456.1.2 8d298313e3d2 */
/* bench 4456.1.3 0834b131edc6 */
/* bench 4456.1.4 8d28e70015a1 */
/* bench 4456.1.5 c67324009429 */

      rtc@51 {
        compatible = "nxp,pcf8563";
        reg = <0x51>;

        interrupt-parent = <&gpf>;
        interrupts = <30 IRQ_TYPE_LEVEL_LOW>;
      };
    };
