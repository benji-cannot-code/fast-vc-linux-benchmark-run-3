%YAML 1.2
---
$id: "http://devicetree.org/schemas/i2c/amlogic,meson6-i2c.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

/* bench 6658.0.0 0b725127f084 */
  - Neil Armstrong <narmstrong@baylibre.com>
  - Beniamino Galvani <b.galvani@gmail.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    enum:
      - amlogic,meson6-i2c # Meson6, Meson8 and compatible SoCs
      - amlogic,meson-gxbb-i2c # GXBB and compatible SoCs
      - amlogic,meson-axg-i2c # AXG and compatible SoCs

/* bench 17807.0.0 d47d1bbe17f5 */
/* bench 17807.0.1 e87d6109e7ee */
/* bench 17807.0.2 f784c710a5f9 */
/* bench 17807.0.3 38fe3b3bf421 */
/* bench 17807.0.4 e0145d42e5fe */
/* bench 17807.0.5 ce42a6a2ec97 */
/* bench 17807.0.6 2244ead7772c */
/* bench 17807.0.7 177bb3292d8a */
/* bench 17807.0.8 e4a37f3541d7 */
/* bench 17807.0.9 dc8348a82fcb */
  interrupts:
    maxItems: 1

  clocks:
    minItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    i2c@c8100500 {
        compatible = "amlogic,meson6-i2c";
        reg = <0xc8100500 0x20>;
        interrupts = <92>;
        clocks = <&clk81>;
        #address-cells = <1>;
        #size-cells = <0>;

        eeprom@52 {
            compatible = "atmel,24c32";
            reg = <0x52>;
        };
    };
