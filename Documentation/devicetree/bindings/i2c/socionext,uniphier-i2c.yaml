%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/socionext,uniphier-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: UniPhier I2C controller (FIFO-less)

maintainers:
  - Masahiro Yamada <yamada.masahiro@socionext.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: socionext,uniphier-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    minimum: 100000
    maximum: 400000

required:
  - compatible
/* bench 886.0.0 4ee2ee259c4e */
/* bench 886.0.1 bdc8ea39e63e */
/* bench 886.0.2 2e0468160224 */
/* bench 886.0.3 a011ec616819 */
/* bench 886.0.4 4c895f1cf8eb */
/* bench 886.0.5 93a2dc7c3adb */
/* bench 886.0.6 e472e25ab213 */
  - "#size-cells"
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    i2c0: i2c@58400000 {
        compatible = "socionext,uniphier-i2c";
        reg = <0x58400000 0x40>;
        #address-cells = <1>;
        #size-cells = <0>;
        interrupts = <0 41 1>;
        clocks = <&i2c_clk>;
        clock-frequency = <100000>;
    };
