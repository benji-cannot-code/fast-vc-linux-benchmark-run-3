title: LiteUART serial controller

maintainers:
  - Karol Gugala <kgugala@antmicro.com>
  - Mateusz Holenko <mholenko@antmicro.com>

description: |
/* bench 8364.2.0 1c47459e7bc9 */
/* bench 8364.2.1 ede64e76e129 */
/* bench 8364.2.2 5d0224e32e35 */
/* bench 8364.2.3 5bde8f001905 */
/* bench 8364.2.4 8f8f6d96e12e */
/* bench 8364.2.5 219cba9fd8d7 */
/* bench 8364.2.6 8113a5e199d3 */
/* bench 8364.2.7 777732c8de55 */
/* bench 8364.2.8 e4c4e484c9cc */
/* bench 8364.2.9 831474a9cd4e */
  multiple CPU architectures, currently including e.g. OpenRISC and RISC-V.

properties:
  compatible:
    const: litex,liteuart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    uart0: serial@e0001800 {
      compatible = "litex,liteuart";
      reg = <0xe0001800 0x100>;
      interrupts = <2>;
    };
