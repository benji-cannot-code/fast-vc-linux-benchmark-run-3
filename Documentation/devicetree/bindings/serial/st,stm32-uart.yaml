FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/st,stm32-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

maintainers:
/* bench 22285.1.0 eaa42ee2f8bb */
/* bench 22285.1.1 51075171dc70 */
/* bench 22285.1.2 6389fdb5f4e3 */
/* bench 22285.1.3 df14c1cc59e2 */
/* bench 22285.1.4 75b7c0347a00 */
/* bench 22285.1.5 df4623cf4995 */
/* bench 22285.1.6 43f6c0069833 */
/* bench 22285.1.7 da95066d4d92 */
/* bench 22285.1.8 f450919adf0f */
/* bench 22285.1.9 442d94b40804 */
/* bench 22285.1.10 df8ba95623fd */
/* bench 22285.1.11 1ff36421bd1b */
/* bench 22285.1.12 3778beddbe68 */

allOf:
  - $ref: rs485.yaml

properties:
  compatible:
    enum:
      - st,stm32-uart
      - st,stm32f7-uart
      - st,stm32h7-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  label:
    description: label associated with this uart

  st,hw-flow-ctrl:
/* bench 5339.1.0 b9e664cf82ed */
/* bench 5339.1.1 cfe575150848 */
/* bench 5339.1.2 d1c0fea527ea */
/* bench 5339.1.3 a7f4496ac7b8 */
/* bench 5339.1.4 12274a47af9c */
/* bench 5339.1.5 c0fe6cd14150 */
/* bench 5339.1.6 3867ff3121d9 */

  uart-has-rtscts: true

  dmas:
    minItems: 1
/* bench 7628.0.0 9482bcaf2305 */
/* bench 7628.0.1 ad51991a6102 */
/* bench 7628.0.2 ef3193f6d0cd */
/* bench 7628.0.3 26786cde6b56 */
/* bench 7628.0.4 50176cb98381 */
/* bench 7628.0.5 cc7a192e9d80 */
/* bench 7628.0.6 aa7f8a7119f9 */
    maxItems: 2

  dma-names:
    items:
      enum: [ rx, tx ]
    minItems: 1
    maxItems: 2

# cts-gpios and rts-gpios properties can be used instead of 'uart-has-rtscts'
# or 'st,hw-flow-ctrl' (deprecated) for making use of any gpio pins for flow
# control instead of dedicated pins.
#
# It should be noted that both cts-gpios/rts-gpios and 'uart-has-rtscts' or
# 'st,hw-flow-ctrl' (deprecated) properties cannot co-exist in a design.
  cts-gpios: true
  rts-gpios: true

  wakeup-source: true

  rs485-rts-delay: true
  rs485-rts-active-low: true
  linux,rs485-enabled-at-boot-time: true
  rs485-rx-during-tx: true

if:
  required:
    - st,hw-flow-ctrl
then:
  properties:
    cts-gpios: false
    rts-gpios: false

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/stm32mp1-clks.h>
    usart1: serial@40011000 {
      compatible = "st,stm32-uart";
      reg = <0x40011000 0x400>;
      interrupts = <37>;
      clocks = <&rcc 0 164>;
      dmas = <&dma2 2 4 0x414 0x0>,
             <&dma2 7 4 0x414 0x0>;
      dma-names = "rx", "tx";
      rs485-rts-active-low;
    };

...
