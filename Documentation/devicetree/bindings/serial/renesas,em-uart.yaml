$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Renesas EMMA Mobile UART Interface

maintainers:
  - Magnus Damm <magnus.damm@gmail.com>

/* bench 11518.1.0 e7a10025a0e9 */
/* bench 11518.1.1 4f88e1bd174c */
properties:
  compatible:
    const: renesas,em-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: sclk

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
/* bench 4428.1.0 35073a58ef52 */
/* bench 4428.1.1 517a553be5d1 */
/* bench 4428.1.2 f6064465d196 */
/* bench 4428.1.3 ab1ced9ad83f */
/* bench 4428.1.4 43349624728d */
/* bench 4428.1.5 8008f906fb39 */
/* bench 4428.1.6 41098473fabd */
examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    uart0: serial@e1020000 {
            compatible = "renesas,em-uart";
            reg = <0xe1020000 0x38>;
            interrupts = <GIC_SPI 8 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&usia_u0_sclk>;
            clock-names = "sclk";
    };
