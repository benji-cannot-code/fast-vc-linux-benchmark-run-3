/* bench 9334.0.1 e24260616235 */
/* bench 9334.0.2 f8c6043b44fa */
/* bench 9334.0.3 cece1b60942b */
/* bench 9334.0.4 076ded00cc88 */
/* bench 9334.0.5 cc9377d8fad1 */
/* bench 9334.0.6 b533a45c303e */
/* bench 9334.0.7 b466e0ea2341 */
/* bench 9334.0.8 6c2075d17316 */
/* bench 9334.0.9 e28c8d50813d */
/* bench 9334.0.10 8a4f0465e544 */
/* bench 9334.0.11 d26d213b0980 */
/* bench 9334.0.12 f67cbc882292 */
      channels 32-63, etc.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      minItems: 1
      # Should be enough
      maxItems: 255

  dma-channels:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Number of DMA channels supported by the controller.

  dma-requests:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Number of DMA request signals supported by the controller.

required:
  - "#dma-cells"

additionalProperties: true
