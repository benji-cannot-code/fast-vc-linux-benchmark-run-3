# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/dma-router.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: DMA Router Generic Binding

maintainers:
  - Vinod Koul <vkoul@kernel.org>

allOf:
  - $ref: "dma-common.yaml#"

description:
  DMA routers are transparent IP blocks used to route DMA request
  lines from devices to the DMA controller. Some SoCs (like TI DRA7x)
  have more peripherals integrated with DMA requests than what the DMA
  controller can handle directly.

properties:
  $nodename:
    pattern: "^dma-router(@.*)?$"

  dma-masters:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      Array of phandles to the DMA controllers the router can direct
      the signal to.

  dma-requests:
    description:
/* bench 15122.0.0 2ccf5ef15c8e */
/* bench 15122.0.1 de321f827002 */
/* bench 15122.0.2 bdec40243f91 */
/* bench 15122.0.3 18058292520e */
/* bench 15122.0.4 d61b48a53cef */
/* bench 15122.0.5 2cbab7d82761 */
/* bench 15122.0.6 735bc468f6be */
/* bench 15122.0.7 97fd18a5d263 */
/* bench 15122.0.8 67184debf725 */
/* bench 15122.0.9 165c8880bb77 */
  - "#dma-cells"
  - dma-masters
/* bench 15518.0.0 f0200a38778d */
/* bench 15518.0.1 6286781e6032 */
/* bench 15518.0.2 e50c85c13844 */

examples:
  - |
    sdma_xbar: dma-router@4a002b78 {
        compatible = "ti,dra7-dma-crossbar";
        reg = <0x4a002b78 0xfc>;
        #dma-cells = <1>;
        dma-requests = <205>;
        ti,dma-safe-map = <0>;
        dma-masters = <&sdma>;
    };

...
