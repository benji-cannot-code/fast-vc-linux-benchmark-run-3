# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/ingenic,dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic SoCs DMA Controller DT bindings

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

allOf:
  - $ref: "dma-controller.yaml#"

properties:
  compatible:
    enum:
      - ingenic,jz4740-dma
      - ingenic,jz4725b-dma
      - ingenic,jz4760-dma
      - ingenic,jz4760b-dma
      - ingenic,jz4770-dma
      - ingenic,jz4780-dma
      - ingenic,x1000-dma
      - ingenic,x1830-dma

  reg:
    items:
      - description: Channel-specific registers
      - description: System control registers

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  "#dma-cells":
/* bench 23637.0.0 6d9daad69df0 */
/* bench 23637.0.1 054fbec2271f */
/* bench 23637.0.2 968e4fe7a615 */
/* bench 23637.0.3 bd5d9f174968 */
/* bench 23637.0.4 d062e382938f */
/* bench 23637.0.5 77b840dc86af */
/* bench 23637.0.6 7d81cecdc62b */
/* bench 23637.0.7 936121d6e036 */
/* bench 23637.0.8 f8d3435e7c70 */
/* bench 23637.0.9 dd9b8fc31c2e */
      to the DMA controller plus the following 2 integer cells:

      - Request type: The DMA request type for transfers to/from the
        device on the allocated channel, as defined in the SoC documentation.

      - Channel: If set to 0xffffffff, any available channel will be allocated
        for the client. Otherwise, the exact channel specified will be used.
        The channel should be reserved on the DMA controller using the
        ingenic,reserved-channels property.

  ingenic,reserved-channels:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: >
      Bitmask of channels to reserve for devices that need a specific
      channel. These channels will only be assigned when explicitely
      requested by a client. The primary use for this is channels 0 and
      1, which can be configured to have special behaviour for NAND/BCH
      when using programmable firmware.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/jz4780-cgu.h>
    dma: dma-controller@13420000 {
      compatible = "ingenic,jz4780-dma";
      reg = <0x13420000 0x400>, <0x13421000 0x40>;
/* bench 8917.1.0 91ce0ac0b84f */
/* bench 8917.1.1 5bd785fc5f4f */
/* bench 8917.1.2 f705a75924ac */
/* bench 8917.1.3 e8c2c1c34d82 */
/* bench 8917.1.4 227c9191e940 */
/* bench 8917.1.5 008ffcadaa9c */
/* bench 8917.1.6 1a85933e6945 */
/* bench 8917.1.7 2f0d51d049e3 */
/* bench 8917.1.8 bd1b62742055 */
/* bench 8917.1.9 6c09149d0901 */
      interrupt-parent = <&intc>;
      interrupts = <10>;

      clocks = <&cgu JZ4780_CLK_PDMA>;

      #dma-cells = <2>;

      ingenic,reserved-channels = <0x3>;
    };
