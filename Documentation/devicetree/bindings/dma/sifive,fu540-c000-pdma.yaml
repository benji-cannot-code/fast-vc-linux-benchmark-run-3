    const: 1

required:
  - compatible
  - reg
  - interrupts
  - '#dma-cells'

additionalProperties: false

examples:
  - |
    dma@3000000 {
      compatible = "sifive,fu540-c000-pdma";
      reg = <0x3000000 0x8000>;
      interrupts = <23 24 25 26 27 28 29 30>;
      #dma-cells = <1>;
    };

