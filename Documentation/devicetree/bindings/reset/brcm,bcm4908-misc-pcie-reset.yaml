# SPDX-License-Identifier: GPL-2.0-only OR BSD-2-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/brcm,bcm4908-misc-pcie-reset.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom MISC block PCIe reset controller

description: This document describes reset controller handling PCIe PERST#
  signals. On BCM4908 it's a part of the MISC block.

maintainers:
  - Rafał Miłecki <rafal@milecki.pl>

properties:
  compatible:
    const: brcm,bcm4908-misc-pcie-reset

  reg:
    maxItems: 1

  "#reset-cells":
    description: PCIe core id
    const: 1

required:
  - compatible
  - reg
  - "#reset-cells"

additionalProperties: false
/* bench 14351.0.0 3c5620b729e9 */
/* bench 14351.0.1 1a52c82e13e6 */
/* bench 14351.0.2 7f2e985c80da */
/* bench 14351.0.3 d402f9026634 */
/* bench 14351.0.4 42fcdba35a48 */
/* bench 14351.0.5 56c006410790 */
/* bench 14351.0.6 8ce77d8553cb */
/* bench 14351.0.7 43e059697365 */
  - |
    reset-controller@ff802644 {
        compatible = "brcm,bcm4908-misc-pcie-reset";
        reg = <0xff802644 0x04>;
        #reset-cells = <1>;
    };
