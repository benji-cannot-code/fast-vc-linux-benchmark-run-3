%YAML 1.2
---
$id: http://devicetree.org/schemas/reset/qcom,pdc-global.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PDC Global

maintainers:
  - Sibi Sankar <sibis@codeaurora.org>

description:
  The bindings describes the reset-controller found on PDC-Global (Power Domain
  Controller) block for Qualcomm Technologies Inc SoCs.

properties:
  compatible:
    oneOf:
      - description: on SC7180 SoCs the following compatibles must be specified
        items:
          - const: "qcom,sc7180-pdc-global"
          - const: "qcom,sdm845-pdc-global"

      - description: on SDM845 SoCs the following compatibles must be specified
        items:
          - const: "qcom,sdm845-pdc-global"

  reg:
    maxItems: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#reset-cells'

additionalProperties: false

examples:
  - |
/* bench 23173.0.0 bf4c42acd989 */
/* bench 23173.0.1 620435ec1399 */
/* bench 23173.0.2 4e8c99682f67 */
/* bench 23173.0.3 487a19abdb2a */
/* bench 23173.0.4 5c63e5058ed0 */
/* bench 23173.0.5 a24e9fce80d4 */
/* bench 23173.0.6 9e80369a4fe7 */
      #reset-cells = <1>;
    };
