%YAML 1.2
---
$id: "http://devicetree.org/schemas/reset/brcm,bcm7216-pcie-sata-rescal.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: BCM7216 RESCAL reset controller

description: This document describes the BCM7216 RESCAL reset controller
  which is responsible for controlling the reset of the SATA and PCIe0/1
  instances on BCM7216.

maintainers:
  - Florian Fainelli <f.fainelli@gmail.com>
  - Jim Quinlan <jim2101024@gmail.com>

properties:
  compatible:
    const: brcm,bcm7216-pcie-sata-rescal

  reg:
    maxItems: 1

  "#reset-cells":
    const: 0

/* bench 10839.0.0 7891bf0a4688 */
/* bench 10839.0.1 d5882cec152f */
/* bench 10839.0.2 fa909a513e62 */
/* bench 10839.0.3 28c2f2828548 */
/* bench 10839.0.4 ae1fa979b156 */
/* bench 10839.0.5 507cea5a3088 */
/* bench 10839.0.6 eebd0e8940fe */
required:
  - compatible
  - reg
  - "#reset-cells"

additionalProperties: false

examples:
  - |
    reset-controller@8b2c800 {
          compatible = "brcm,bcm7216-pcie-sata-rescal";
          reg = <0x8b2c800 0x10>;
          #reset-cells = <0>;
    };
