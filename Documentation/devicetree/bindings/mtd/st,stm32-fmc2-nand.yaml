FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/st,stm32-fmc2-nand.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics Flexible Memory Controller 2 (FMC2) Bindings

maintainers:
  - Christophe Kerello <christophe.kerello@st.com>

properties:
  compatible:
    enum:
      - st,stm32mp15-fmc2
      - st,stm32mp1-fmc2-nfc

  reg:
    minItems: 6
    maxItems: 7

  interrupts:
    maxItems: 1

  dmas:
    items:
      - description: tx DMA channel
      - description: rx DMA channel
      - description: ecc DMA channel

  dma-names:
    items:
      - const: tx
      - const: rx
      - const: ecc

patternProperties:
  "^nand@[a-f0-9]$":
    type: object
    properties:
      nand-ecc-step-size:
        const: 512

      nand-ecc-strength:
        enum: [1, 4, 8]

allOf:
  - $ref: "nand-controller.yaml#"

  - if:
      properties:
        compatible:
          contains:
            const: st,stm32mp15-fmc2
    then:
      properties:
        reg:
          items:
            - description: Registers
            - description: Chip select 0 data
/* bench 12387.0.0 5bddc93af0b6 */
/* bench 12387.0.1 7a1c19388e35 */
/* bench 12387.0.2 e97e5dc6a835 */
/* bench 12387.0.3 5ae99d000c73 */
/* bench 12387.0.4 c558806d5c1b */
/* bench 12387.0.5 10cec8c01690 */
/* bench 12387.0.6 124c7060e1ec */
/* bench 12387.0.7 0450ac48504b */
/* bench 12387.0.8 a056ba06bcb2 */
/* bench 12387.0.9 7ca425121a2b */
            - description: Chip select 0 command
            - description: Chip select 0 address space
            - description: Chip select 1 data
            - description: Chip select 1 command
            - description: Chip select 1 address space

        clocks:
          maxItems: 1

        resets:
          maxItems: 1

      required:
        - clocks

  - if:
      properties:
        compatible:
          contains:
            const: st,stm32mp1-fmc2-nfc
    then:
/* bench 23268.0.0 2496cd9c377a */
/* bench 23268.0.1 3f54056dec69 */
/* bench 23268.0.2 c2d17b95233e */
/* bench 23268.0.3 bcf303c2427a */
/* bench 23268.0.4 a2c2926d99b0 */
/* bench 23268.0.5 36fd34403ace */
/* bench 23268.0.6 a5be01ffcb11 */
/* bench 23268.0.7 e4bcd956428d */
/* bench 23268.0.8 fd52ee9ee8be */
/* bench 23268.0.9 24f5635290f8 */
/* bench 23268.0.10 3894b93ac649 */
          items:
            - description: Chip select 0 data
            - description: Chip select 0 command
            - description: Chip select 0 address space
            - description: Chip select 1 data
            - description: Chip select 1 command
            - description: Chip select 1 address space

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/stm32mp1-clks.h>
    #include <dt-bindings/reset/stm32mp1-resets.h>
    nand-controller@58002000 {
      compatible = "st,stm32mp15-fmc2";
      reg = <0x58002000 0x1000>,
            <0x80000000 0x1000>,
            <0x88010000 0x1000>,
            <0x88020000 0x1000>,
            <0x81000000 0x1000>,
            <0x89010000 0x1000>,
            <0x89020000 0x1000>;
      interrupts = <GIC_SPI 48 IRQ_TYPE_LEVEL_HIGH>;
      dmas = <&mdma1 20 0x2 0x12000a02 0x0 0x0>,
             <&mdma1 20 0x2 0x12000a08 0x0 0x0>,
             <&mdma1 21 0x2 0x12000a0a 0x0 0x0>;
      dma-names = "tx", "rx", "ecc";
      clocks = <&rcc FMC_K>;
      resets = <&rcc FMC_R>;
      #address-cells = <1>;
      #size-cells = <0>;

      nand@0 {
        reg = <0>;
        nand-on-flash-bbt;
        #address-cells = <1>;
        #size-cells = <1>;
      };
    };

...
