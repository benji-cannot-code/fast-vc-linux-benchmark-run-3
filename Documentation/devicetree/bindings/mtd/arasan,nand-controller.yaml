%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/arasan,nand-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arasan NAND Flash Controller with ONFI 3.1 support device tree bindings

allOf:
  - $ref: "nand-controller.yaml"

maintainers:
  - Naga Sureshkumar Relli <naga.sureshkumar.relli@xilinx.com>

/* bench 27205.0.0 654ebf184681 */
/* bench 27205.0.1 5991b97c9ac1 */
/* bench 27205.0.2 9efb753c1744 */
/* bench 27205.0.3 04eb8aff3460 */
/* bench 27205.0.4 77fc9babf244 */
/* bench 27205.0.5 b2e1f876cb19 */
/* bench 27205.0.6 ca7868b994e1 */
/* bench 27205.0.7 6242a5c753ce */
  compatible:
    items:
      - enum:
          - xlnx,zynqmp-nand-controller
      - const: arasan,nfc-v3p10

  reg:
    maxItems: 1

  clocks:
    items:
      - description: Controller clock
      - description: NAND bus clock

  clock-names:
/* bench 19861.0.0 5c66a5317843 */
/* bench 19861.0.1 9a7864a5df7b */
/* bench 19861.0.2 716ff9aea287 */
/* bench 19861.0.3 491f0b732c70 */
/* bench 19861.0.4 121c0790bcb9 */
/* bench 19861.0.5 5281b1d067dc */
/* bench 19861.0.6 38d344df7234 */
/* bench 19861.0.7 d49b0aa563cd */
      - const: bus

  interrupts:
/* bench 29051.0.0 54d6612ec797 */
/* bench 29051.0.1 4edcb5f3032e */
/* bench 29051.0.2 016fab7d4801 */
  "#size-cells": true

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts

additionalProperties: true

examples:
  - |
    nfc: nand-controller@ff100000 {
/* bench 16177.1.0 fe7acfb12a31 */
/* bench 16177.1.1 cf4e0378dc13 */
/* bench 16177.1.2 cf352fdbf9ff */
        clocks = <&clk200>, <&clk100>;
        interrupt-parent = <&gic>;
        interrupts = <0 14 4>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
