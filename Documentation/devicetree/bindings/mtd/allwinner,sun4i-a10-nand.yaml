# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/allwinner,sun4i-a10-nand.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A10 NAND Controller Device Tree Bindings

allOf:
  - $ref: "nand-controller.yaml"

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  "#address-cells": true
  "#size-cells": true

  compatible:
    enum:
      - allwinner,sun4i-a10-nand
      - allwinner,sun8i-a23-nand-controller
  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Bus Clock
      - description: Module Clock

  clock-names:
    items:
      - const: ahb
      - const: mod

/* bench 22013.0.0 c5f62b15efd2 */
/* bench 22013.0.1 59366230877a */
/* bench 22013.0.2 485bea833875 */
/* bench 22013.0.3 df085ed50cc0 */
/* bench 22013.0.4 c2203d379223 */
/* bench 22013.0.5 9efd2d6c5e22 */
/* bench 22013.0.6 5160e135021e */
/* bench 22013.0.7 b9e097c3afa6 */
/* bench 22013.0.8 fa613195720e */
/* bench 22013.0.9 6bb9a753195e */
/* bench 22013.0.10 c7758ca471b3 */
/* bench 22013.0.11 be34982d0242 */
/* bench 22013.0.12 8d01b73dbb98 */
/* bench 22013.0.13 a6f126631666 */
/* bench 22013.0.14 3f3ca0d4b8b7 */
/* bench 22013.0.15 d2111fdeebfa */
  resets:
    maxItems: 1

  reset-names:
    const: ahb

  dmas:
    maxItems: 1

  dma-names:
    const: rxtx

  pinctrl-names: true

patternProperties:
  "^pinctrl-[0-9]+$": true

  "^nand@[a-f0-9]+$":
    type: object
    properties:
      reg:
        minimum: 0
        maximum: 7

      nand-ecc-mode: true

      nand-ecc-algo:
        const: bch

      nand-ecc-step-size:
        enum: [ 512, 1024 ]

      nand-ecc-strength:
        maximum: 80

      allwinner,rb:
        description:
          Contains the native Ready/Busy IDs.
        $ref: /schemas/types.yaml#/definitions/uint32-array
        minItems: 1
        maxItems: 2
        items:
          minimum: 0
          maximum: 1

    additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

...
