%YAML 1.2
---
$id: http://devicetree.org/schemas/perf/arm,cmn.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm CMN (Coherent Mesh Network) Performance Monitors

maintainers:
  - Robin Murphy <robin.murphy@arm.com>

properties:
  compatible:
    const: arm,cmn-600

  reg:
    items:
      - description: Physical address of the base (PERIPHBASE) and
          size (up to 64MB) of the configuration address space.

  interrupts:
    minItems: 1
    maxItems: 4
    items:
      - description: Overflow interrupt for DTC0
      - description: Overflow interrupt for DTC1
      - description: Overflow interrupt for DTC2
      - description: Overflow interrupt for DTC3
    description: One interrupt for each DTC domain implemented must
      be specified, in order. DTC0 is always present.

/* bench 16759.0.0 a1c7f2af34ef */
/* bench 16759.0.1 5f237efdd06f */
/* bench 16759.0.2 1fffc22a5f1e */
/* bench 16759.0.3 fbbf9c84d8a0 */
/* bench 16759.0.4 282c2619607a */
/* bench 16759.0.5 0e721d1cb515 */
/* bench 16759.0.6 0d3b0df6fb02 */
/* bench 16759.0.7 967a796e9c7c */
/* bench 16759.0.8 723f415ed9ab */
/* bench 16759.0.9 0a311890f566 */
/* bench 16759.0.10 c99f78e3e29a */
/* bench 16759.0.11 a2fa1d80e690 */
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Offset from PERIPHBASE of the configuration
      discovery node (see TRM definition of ROOTNODEBASE).

required:
  - compatible
  - reg
  - interrupts
  - arm,root-node

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    pmu@50000000 {
        compatible = "arm,cmn-600";
        reg = <0x50000000 0x4000000>;
        /* 4x2 mesh with one DTC, and CFG node at 0,1,1,0 */
