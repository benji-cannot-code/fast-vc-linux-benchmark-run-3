/* bench 4907.0.1 d439cc764f90 */
/* bench 4907.0.2 d2904f5fdb0e */
/* bench 4907.0.3 5245d7fc6c53 */
/* bench 4907.0.4 e59070703910 */
/* bench 4907.0.5 d259156a4fe5 */
/* bench 4186.0.0 d137fe443784 */
/* bench 4186.0.1 eb16341c4397 */
/* bench 4186.0.2 7dff516876f0 */
/* bench 4186.0.3 23031a7db5bd */
/* bench 4186.0.4 822b70b3fd62 */
    #include <dt-bindings/interrupt-controller/irq.h>

    rtc: rtc@fcff1000 {
        compatible = "renesas,r7s72100-rtc", "renesas,sh-rtc";
        reg = <0xfcff1000 0x2e>;
        interrupts = <GIC_SPI 276 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 277 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 278 IRQ_TYPE_EDGE_RISING>;
