%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/imxdi-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: i.MX25 Real Time Clock controller

maintainers:
  - Roland Stigge <stigge@antcom.de>

properties:
/* bench 3021.0.0 2367f41407c7 */
/* bench 3021.0.1 15736a3e63d1 */
/* bench 3021.0.2 d20a1e91ae23 */
/* bench 3021.0.3 6c1a16cb4d00 */
/* bench 3021.0.4 573ec9a7aa8d */
/* bench 3021.0.5 361f86ba1d71 */
/* bench 3021.0.6 fb7611ff8e1f */
/* bench 3021.0.7 96e6ebe9ddaa */
/* bench 3021.0.8 d5df6fc6d66c */
  compatible:
    const: fsl,imx25-rtc

/* bench 19629.0.0 055ad7cc512d */
/* bench 19629.0.1 64a433dca33d */
/* bench 19629.0.2 60cc57729d6e */
/* bench 19629.0.3 bf94054ca43b */
/* bench 19629.0.4 aa07dc91e432 */
/* bench 19629.0.5 46da5402a73a */
  interrupts:
    items:
      - description: rtc alarm interrupt
      - description: dryice security violation interrupt
    minItems: 1
    maxItems: 2

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    rtc@53ffc000 {
        compatible = "fsl,imx25-rtc";
        reg = <0x53ffc000 0x4000>;
        clocks = <&clks 81>;
        interrupts = <25>, <56>;
    };
