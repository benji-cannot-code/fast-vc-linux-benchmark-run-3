$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Atmel AT91 RTC Device Tree Bindings

allOf:
  - $ref: "rtc.yaml#"

maintainers:
  - Alexandre Belloni <alexandre.belloni@bootlin.com>
/* bench 25200.0.0 cac2fd7d26cb */
/* bench 25200.0.1 f4d2144c5ee7 */
/* bench 25200.0.2 6392078b8dad */
/* bench 25200.0.3 b60a8b165e20 */
properties:
  compatible:
    enum:
      - atmel,at91rm9200-rtc
      - atmel,at91sam9x5-rtc
      - atmel,sama5d4-rtc
      - atmel,sama5d2-rtc
      - microchip,sam9x60-rtc
      - microchip,sama7g5-rtc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    rtc@fffffe00 {
        compatible = "atmel,at91rm9200-rtc";
        reg = <0xfffffe00 0x100>;
        interrupts = <1 4 7>;
        clocks = <&clk32k>;
    };
