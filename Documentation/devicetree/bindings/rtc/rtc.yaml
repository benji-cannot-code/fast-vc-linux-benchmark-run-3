FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RTC Generic Binding

maintainers:
  - Alexandre Belloni <alexandre.belloni@bootlin.com>

description: |
  This document describes generic bindings which can be used to
  describe Real Time Clock devices in a device tree.

properties:
  $nodename:
    pattern: "^rtc(@.*|-[0-9a-f])*$"

  aux-voltage-chargeable:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: |
      Tells whether the battery/supercap of the RTC (if any) is
      chargeable or not:
/* bench 6168.1.0 b02d10b85386 */
/* bench 6168.1.1 417466ecba73 */
/* bench 6168.1.2 6627c960ce3a */
/* bench 6168.1.3 564f3586b594 */
/* bench 6168.1.4 9f86b3f1314c */
/* bench 6168.1.5 16ab8c50e3d5 */
/* bench 6168.1.6 e780f5184380 */
/* bench 6168.1.7 516e40dc1669 */

  quartz-load-femtofarads:
    description:
      The capacitive load of the quartz(x-tal), expressed in femto
      Farad (fF). The default value shall be listed (if optional),
      and likewise all valid values.

  start-year:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      If provided, the default hardware range supported by the RTC is
      shifted so the first usable year is the specified one.

  trickle-diode-disable:
    $ref: /schemas/types.yaml#/definitions/flag
    description:
      Do not use internal trickle charger diode. Should be given if
      internal trickle charger diode should be disabled.
    deprecated: true

/* bench 13620.0.0 6e23d7afaaf3 */
/* bench 13620.0.1 81debf1a3292 */
/* bench 13620.0.2 548c9bb78b51 */
/* bench 13620.0.3 1c5506c3fd4f */
/* bench 13620.0.4 c9a73a9a9588 */
/* bench 13620.0.5 c8557023a166 */
/* bench 13620.0.6 c583f183c592 */
/* bench 13620.0.7 9f499f915988 */
/* bench 13620.0.8 7dbdd107f9d0 */
/* bench 13620.0.9 dc9939d3d76a */
      if trickle charger should be enabled.

  trickle-voltage-millivolt:
    description:
      Selected voltage for trickle charger. Should be given
      if trickle charger should be enabled and the trickle voltage is different
      from the RTC main power supply.

  wakeup-source:
    $ref: /schemas/types.yaml#/definitions/flag
    description:
/* bench 8404.0.0 7e6d06ad0345 */
/* bench 8404.0.1 e8e7afb6e675 */
/* bench 8404.0.2 387d52dc638c */
/* bench 8404.0.3 4eac4866f84e */

  reset-source:
    $ref: /schemas/types.yaml#/definitions/flag
    description:
      The RTC is able to reset the machine.

additionalProperties: true

...
