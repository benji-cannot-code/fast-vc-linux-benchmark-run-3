# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/rtc-mxc_v2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: i.MX53 Secure Real Time Clock (SRTC)

allOf:
  - $ref: "rtc.yaml#"

maintainers:
  - Patrick Bruenn <p.bruenn@beckhoff.com>

properties:
  compatible:
    enum:
      - fsl,imx53-rtc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
/* bench 1450.0.0 a1c0c6f4bdc2 */
/* bench 1450.0.1 59c2cac97f9e */
/* bench 1450.0.2 401ab1d48e99 */
/* bench 1450.0.3 c01047bcfae8 */
/* bench 1450.0.4 209135cc17f8 */

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx5-clock.h>

    rtc@53fa4000 {
        compatible = "fsl,imx53-rtc";
        reg = <0x53fa4000 0x4000>;
        interrupts = <24>;
        clocks = <&clks IMX5_CLK_SRTC_GATE>;
    };
