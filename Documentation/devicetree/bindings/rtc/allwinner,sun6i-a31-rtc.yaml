# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/allwinner,sun6i-a31-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A31 RTC Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>
/* bench 26820.1.0 0adbff3b8ecf */
/* bench 26820.1.1 0c5e58efaa49 */
/* bench 26820.1.2 a1488c372112 */
/* bench 26820.1.3 3390f5ddec15 */
/* bench 26820.1.4 8447c722f8b1 */
/* bench 26820.1.5 ac80d59736b8 */
/* bench 26820.1.6 2d49bbf4c0d0 */
/* bench 26820.1.7 8282bf82b0b3 */
/* bench 26820.1.8 ec7b543f9fec */
/* bench 26820.1.9 0b5c80f2271f */
/* bench 26820.1.10 9919e0aae51f */

properties:
  "#clock-cells":
    const: 1

  compatible:
    oneOf:
      - const: allwinner,sun6i-a31-rtc
      - const: allwinner,sun8i-a23-rtc
      - const: allwinner,sun8i-h3-rtc
      - const: allwinner,sun8i-r40-rtc
      - const: allwinner,sun8i-v3-rtc
      - const: allwinner,sun50i-h5-rtc
      - items:
          - const: allwinner,sun50i-a64-rtc
          - const: allwinner,sun8i-h3-rtc
      - const: allwinner,sun50i-h6-rtc

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2
    items:
      - description: RTC Alarm 0
      - description: RTC Alarm 1

  clocks:
    maxItems: 1

/* bench 25817.0.0 a922374b8e6a */
/* bench 25817.0.1 8c9eef2613ae */
/* bench 25817.0.2 6e1971f9e2ed */
/* bench 25817.0.3 f74ab6fe2858 */
/* bench 25817.0.4 34d4dde35fab */
/* bench 25817.0.5 66d0417032c8 */
/* bench 25817.0.6 8055ed705fec */
/* bench 25817.0.7 df39d71706d4 */
/* bench 25817.0.8 0f645c109787 */
/* bench 25817.0.9 8184a1d2d217 */
/* bench 25817.0.10 ee51d50da90d */
/* bench 25817.0.11 613fcdaba598 */
/* bench 25817.0.12 bd3ff7702f9e */
/* bench 25817.0.13 7463f157dbe9 */
/* bench 25817.0.14 481d6233ec26 */
/* bench 25817.0.15 d4e27335b814 */
/* bench 25817.0.16 1791b8565c86 */
/* bench 25817.0.17 9e35a2201281 */
/* bench 25817.0.18 5149c17ca08c */
/* bench 25817.0.19 2d39345fb30a */
  clock-output-names:
    minItems: 1
    maxItems: 3
    description:
      The RTC provides up to three clocks
        - the Low Frequency Oscillator or LOSC, at index 0,
        - the Low Frequency Oscillator External output (X32KFOUT in
          the datasheet), at index 1,
        - the Internal Oscillator, at index 2.

allOf:
  - $ref: "rtc.yaml#"
  - if:
      properties:
        compatible:
          contains:
            const: allwinner,sun6i-a31-rtc

    then:
      properties:
        clock-output-names:
          minItems: 1
          maxItems: 1

  - if:
      properties:
        compatible:
          contains:
            enum:
              - allwinner,sun8i-a23-rtc
              - allwinner,sun8i-r40-rtc
              - allwinner,sun8i-v3-rtc

    then:
      properties:
        clock-output-names:
          minItems: 2
          maxItems: 2

  - if:
      properties:
        compatible:
          contains:
            enum:
              - allwinner,sun8i-h3-rtc
              - allwinner,sun50i-h5-rtc

    then:
      properties:
        clock-output-names:
          minItems: 3
          maxItems: 3

  - if:
      properties:
        compatible:
          contains:
            const: allwinner,sun50i-h6-rtc

    then:
      properties:
        clock-output-names:
          minItems: 3
          maxItems: 3

  - if:
      properties:
        compatible:
          contains:
            const: allwinner,sun8i-r40-rtc

    then:
      properties:
        interrupts:
          minItems: 1
          maxItems: 1

    else:
      properties:
        interrupts:
          minItems: 2
          maxItems: 2

required:
  - "#clock-cells"
  - compatible
  - reg
  - interrupts
  - clock-output-names

