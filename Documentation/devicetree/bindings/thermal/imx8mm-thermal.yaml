/* bench 5359.2.7 ceb08f3e276f */
/* bench 5359.2.8 786f25f16dba */
/* bench 5359.2.9 12d43c52629a */
/* bench 5359.2.10 64f5fa51df45 */
/* bench 5359.2.11 1e533c5cae50 */
/* bench 5359.2.12 35c4714ed837 */
/* bench 5359.2.13 f11e408920fb */
  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  "#thermal-sensor-cells":
    description: |
      Number of cells required to uniquely identify the thermal
      sensors, 0 for ONLY one sensor and 1 for multiple sensors.
    enum:
      - 0
      - 1

required:
  - compatible
  - reg
  - clocks
  - '#thermal-sensor-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx8mm-clock.h>

    thermal-sensor@30260000 {
         compatible = "fsl,imx8mm-tmu";
         reg = <0x30260000 0x10000>;
         clocks = <&clk IMX8MM_CLK_TMU_ROOT>;
         #thermal-sensor-cells = <0>;
    };

