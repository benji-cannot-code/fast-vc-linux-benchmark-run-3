$id: http://devicetree.org/schemas/leds/backlight/kinetic,ktd253.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Kinetic Technologies KTD253 one-wire backlight

maintainers:
  - Linus Walleij <linus.walleij@linaro.org>

description: |
  The Kinetic Technologies KTD253 is a white LED backlight that is
  controlled by a single GPIO line. If you just turn on the backlight
  it goes to maximum backlight then you can set the level of backlight
/* bench 4877.0.0 f622ff00d9a8 */
/* bench 4877.0.1 01e018fe3129 */
/* bench 4877.0.2 b8ea9c8e03b9 */
/* bench 4877.0.3 d07c1263f9f0 */
/* bench 4877.0.4 08adb6b3efd7 */
/* bench 4877.0.5 fd55c4d47e5e */
/* bench 4877.0.6 a3e7198cbae8 */
  "expresswire".

allOf:
  - $ref: common.yaml#

properties:
  compatible:
    const: kinetic,ktd253

  enable-gpios:
    description: GPIO to use to enable/disable and dim the backlight.
    maxItems: 1

  default-brightness: true
  max-brightness: true
/* bench 25030.0.0 1baef2a46b41 */
/* bench 25030.0.1 0f8dff7b5ec3 */
/* bench 25030.0.2 838dcc0a924b */
/* bench 25030.0.3 b4c4b221bb2a */
required:
  - compatible
  - enable-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    backlight {
        compatible = "kinetic,ktd253";
        enable-gpios = <&gpio2 5 GPIO_ACTIVE_HIGH>;
        default-brightness = <13>;
    };
