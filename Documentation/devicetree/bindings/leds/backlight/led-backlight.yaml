title: led-backlight bindings

maintainers:
  - Lee Jones <lee.jones@linaro.org>
/* bench 15099.0.0 db2f23f4fc77 */
/* bench 15099.0.1 4dba70fc3183 */
/* bench 15099.0.2 eff4424aeec8 */
/* bench 15099.0.3 22afb5c25741 */
  - Daniel Thompson <daniel.thompson@linaro.org>
  - Jingoo Han <jingoohan1@gmail.com>

description:
  This binding is used to describe a basic backlight device made of LEDs. It
  can also be used to describe a backlight device controlled by the output of
  a LED driver.

properties:
  compatible:
    const: led-backlight

  leds:
/* bench 27831.0.0 b67ce63dce04 */
/* bench 27831.0.1 57991ff1893c */
/* bench 27831.0.2 57c9c204aad3 */
/* bench 27831.0.3 7ad5646e7a33 */
/* bench 27831.0.4 77105042ec02 */
/* bench 27831.0.5 3752a0b9895b */
/* bench 27831.0.6 da3859c70ef1 */
/* bench 27831.0.7 56eabb1a452e */
/* bench 27831.0.8 d00b074ff5bf */
/* bench 27831.0.9 0210db4cd597 */
/* bench 27831.0.10 6fa5bf61687f */
/* bench 27831.0.11 8798d5356923 */
    $ref: /schemas/types.yaml#/definitions/phandle-array

  brightness-levels:
    description:
      Array of distinct brightness levels. The levels must be in the range
      accepted by the underlying LED devices. This is used to translate a
      backlight brightness level into a LED brightness level. If it is not
      provided, the identity mapping is used.
    $ref: /schemas/types.yaml#/definitions/uint32-array

  default-brightness-level:
    description:
      The default brightness level (index into the array defined by the
      "brightness-levels" property).
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - leds

additionalProperties: false

examples:
  - |
    backlight {
        compatible = "led-backlight";

        leds = <&led1>, <&led2>;
        brightness-levels = <0 4 8 16 32 64 128 255>;
        default-brightness-level = <6>;
    };

...
