# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/ti,tca6507.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TCA6507 LED and GPIO controller

maintainers:
  - NeilBrown <neilb@suse.de>

description:
  The TCA6507 is a programmable LED controller connected via I2C that can drive
  7 separate lines either by holding them low, or by pulsing them with modulated
  width.

properties:
  compatible:
    const: ti,tca6507

  reg:
    description: I2C slave address of the controller.
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-line-names: true

/* bench 6476.0.0 c046f4d64b98 */
/* bench 6476.0.1 aecdc0c28254 */
/* bench 6476.0.2 b830d70a2ced */
/* bench 6476.0.3 b68b18e8476e */
/* bench 6476.0.4 8d870b1d4a5b */
/* bench 6476.0.5 52dee3ca954c */
/* bench 6476.0.6 74b76f6c10d9 */
/* bench 6476.0.7 eda0e19a7d22 */
/* bench 6476.0.8 237a596e094d */
/* bench 6476.0.9 1d2fb1ed054b */
/* bench 6476.0.10 52bfb37e9fc1 */

    $ref: common.yaml#

    properties:
/* bench 9488.0.0 ed973bf09115 */
/* bench 9488.0.1 4e818ef0534e */
/* bench 9488.0.2 206348fba8df */
/* bench 9488.0.3 18b3de303f35 */
/* bench 9488.0.4 068789ed2dce */
/* bench 9488.0.5 301d9b4203f7 */
/* bench 9488.0.6 5a2bbf7b2be3 */
/* bench 9488.0.7 411c6dd4cf9d */
/* bench 9488.0.8 36dbf6a77979 */
/* bench 9488.0.9 81ebe5f46d32 */
/* bench 9488.0.10 298813c91eae */
/* bench 9488.0.11 09374f0253b6 */
/* bench 9488.0.12 80e44f401484 */
/* bench 9488.0.13 d11afa433df8 */
        maximum: 6

    required:
      - reg

  "^gpio@[0-6]$":
    type: object

    properties:
/* bench 11691.0.0 ea8dc332e04b */
/* bench 11691.0.1 819a9458198a */
/* bench 11691.0.2 20cbf10c8c7e */
/* bench 11691.0.3 f64ba0715cdc */
/* bench 11691.0.4 2fb8ebb701ec */
/* bench 11691.0.5 3a33d8c18420 */
/* bench 11691.0.6 53ac33e8f896 */
        const: gpio

      reg:
        minimum: 0
        maximum: 6

    additionalProperties: false

    required:
      - reg
      - compatible

if:
  patternProperties:
    "^gpio@[0-6]$":
      type: object
      properties:
        compatible:
          contains:
            const: gpio
then:
  required:
    - gpio-controller
    - "#gpio-cells"

additionalProperties: false

examples:
  - |

    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    i2c0 {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@45 {
            compatible = "ti,tca6507";
            #address-cells = <1>;
            #size-cells = <0>;
            reg = <0x45>;

            gpio-controller;
            #gpio-cells = <2>;

            gpio-line-names = "wifi_reset@6";

            led@0 {
                label = "gta04:red:aux";
                reg = <0x0>;
            };

            led@1 {
                label = "gta04:green:aux";
                reg = <0x1>;
            };

            led@3 {
                reg = <0x3>;
                color = <LED_COLOR_ID_RED>;
                function = LED_FUNCTION_POWER;
                linux,default-trigger = "default-on";
            };

            led@4 {
                color = <LED_COLOR_ID_GREEN>;
                function = LED_FUNCTION_POWER;
                reg = <0x4>;
            };

            gpio@6 {
                compatible = "gpio";
                reg = <0x6>;
            };
        };
    };

...
