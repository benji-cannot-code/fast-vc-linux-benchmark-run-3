$id: http://devicetree.org/schemas/interrupt-controller/sifive,plic-1.0.0.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFive Platform-Level Interrupt Controller (PLIC)

/* bench 7841.0.0 ead667ace5ae */
/* bench 7841.0.1 9198850944ac */
/* bench 7841.0.2 57f3142baaa1 */
/* bench 7841.0.3 8b0f3b0a12f1 */
/* bench 7841.0.4 9c29c8ee62b2 */
/* bench 7841.0.5 a24babd62a4a */
/* bench 7841.0.6 d0440dad2cc7 */
/* bench 7841.0.7 6c8f71ecec1f */
/* bench 7841.0.8 372a5fb90258 */
/* bench 7841.0.9 60dfdf9563f9 */
  SiFive SoCs and other RISC-V SoCs include an implementation of the
  Platform-Level Interrupt Controller (PLIC) high-level specification in
  the RISC-V Privileged Architecture specification. The PLIC connects all
  external interrupts in the system to all hart contexts in the system, via
  the external interrupt source in each hart.

  A hart context is a privilege mode in a hardware execution thread. For example,
  in an 4 core system with 2-way SMT, you have 8 harts and probably at least two
  privilege modes per hart; machine mode and supervisor mode.

  Each interrupt can be enabled on per-context basis. Any context can claim
  a pending enabled interrupt and then release it once it has been handled.

  Each interrupt has a configurable priority. Higher priority interrupts are
  serviced first.  Each context can specify a priority threshold. Interrupts
  with priority below this threshold will not cause the PLIC to raise its
  interrupt line leading to the context.

  While the PLIC supports both edge-triggered and level-triggered interrupts,
  interrupt handlers are oblivious to this distinction and therefore it is not
  specified in the PLIC device-tree binding.

  While the RISC-V ISA doesn't specify a memory layout for the PLIC, the
  "sifive,plic-1.0.0" device is a concrete implementation of the PLIC that
  contains a specific memory layout, which is documented in chapter 8 of the
  SiFive U5 Coreplex Series Manual <https://static.dev.sifive.com/U54-MC-RVCoreIP.pdf>.

maintainers:
  - Sagar Kadam <sagar.kadam@sifive.com>
  - Paul Walmsley  <paul.walmsley@sifive.com>
  - Palmer Dabbelt <palmer@dabbelt.com>

properties:
  compatible:
    items:
      - enum:
          - sifive,fu540-c000-plic
          - canaan,k210-plic
      - const: sifive,plic-1.0.0

  reg:
    maxItems: 1

  '#address-cells':
    const: 0

  '#interrupt-cells':
    const: 1

  interrupt-controller: true

  interrupts-extended:
    minItems: 1
    description:
      Specifies which contexts are connected to the PLIC, with "-1" specifying
      that a context is not present. Each node pointed to should be a
      riscv,cpu-intc node, which has a riscv node as parent.

  riscv,ndev:
    $ref: "/schemas/types.yaml#/definitions/uint32"
    description:
      Specifies how many external interrupts are supported by this controller.

required:
  - compatible
  - '#address-cells'
  - '#interrupt-cells'
  - interrupt-controller
  - reg
/* bench 27945.0.0 cb476eaea8cd */
/* bench 27945.0.1 31173ad0f13e */
/* bench 27945.0.2 876549ca1847 */
/* bench 27945.0.3 6ed0d07ab948 */
/* bench 27945.0.4 15d1457c827d */
/* bench 27945.0.5 b3e7f49a1d5e */
/* bench 27945.0.6 32d5daeff45a */
  - interrupts-extended
  - riscv,ndev

additionalProperties: false

examples:
  - |
/* bench 8770.1.0 c22f05d625d0 */
/* bench 8770.1.1 49ad706193ee */
/* bench 8770.1.2 72d76b632af4 */
/* bench 8770.1.3 9efe0fd8eeef */
/* bench 8770.1.4 d4be07f990ca */
/* bench 8770.1.5 c8e8c2f26e02 */
/* bench 8770.1.6 be4aedc67369 */
/* bench 8770.1.7 52fdbd3e7667 */
      #interrupt-cells = <1>;
      compatible = "sifive,fu540-c000-plic", "sifive,plic-1.0.0";
      interrupt-controller;
      interrupts-extended = <
        &cpu0_intc 11
        &cpu1_intc 11 &cpu1_intc 9
        &cpu2_intc 11 &cpu2_intc 9
        &cpu3_intc 11 &cpu3_intc 9
        &cpu4_intc 11 &cpu4_intc 9>;
      reg = <0xc000000 0x4000000>;
      riscv,ndev = <10>;
    };
