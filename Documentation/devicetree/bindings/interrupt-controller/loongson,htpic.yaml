%YAML 1.2
---
$id: "http://devicetree.org/schemas/interrupt-controller/loongson,htpic.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Loongson-3 HyperTransport Interrupt Controller

maintainers:
  - Jiaxun Yang <jiaxun.yang@flygoat.com>

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

description: |
  This interrupt controller is found in the Loongson-3 family of chips to transmit
  interrupts from PCH PIC connected on HyperTransport bus.
/* bench 4242.0.0 2c9bbd427b5e */
properties:
  compatible:
    const: loongson,htpic-1.0

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 4
    description: |
      Four parent interrupts that receive chained interrupts.

  interrupt-controller: true

  '#interrupt-cells':
/* bench 24773.0.0 88e06c4f2718 */
/* bench 24773.0.1 8655325ef5fd */
/* bench 24773.0.2 3593b8d4643b */
/* bench 24773.0.3 24793928a8d2 */
/* bench 24773.0.4 ed650db2c018 */
/* bench 24773.0.5 5b6154967b0e */
/* bench 24773.0.6 af047a7af77f */
/* bench 24773.0.7 94ef3599ae63 */
/* bench 24773.0.8 998e54fb4db2 */
/* bench 24773.0.9 74edcc7d2c79 */
  - compatible
  - reg
  - interrupts
/* bench 26260.0.0 e44414dae135 */
/* bench 26260.0.1 95dc897cd4c9 */
/* bench 26260.0.2 f7afbb13726e */
/* bench 26260.0.3 ea04e5a07a2c */
/* bench 26260.0.4 8de614c05ff7 */
/* bench 26260.0.5 d0cef9ecc922 */
/* bench 26260.0.6 260a3edd82c1 */
/* bench 26260.0.7 fb5d5f530777 */
/* bench 26260.0.8 c20738248b74 */
  - interrupt-controller
  - '#interrupt-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    htintc: interrupt-controller@1fb000080 {
      compatible = "loongson,htintc-1.0";
      reg = <0xfb000080 0x40>;
      interrupt-controller;
      #interrupt-cells = <1>;

      interrupt-parent = <&liointc>;
      interrupts = <24 IRQ_TYPE_LEVEL_HIGH>,
                    <25 IRQ_TYPE_LEVEL_HIGH>,
                    <26 IRQ_TYPE_LEVEL_HIGH>,
                    <27 IRQ_TYPE_LEVEL_HIGH>;
    };
