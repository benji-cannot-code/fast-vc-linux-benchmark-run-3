%YAML 1.2
---
$id: "http://devicetree.org/schemas/interrupt-controller/mscc,ocelot-icpu-intr.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Microsemi Ocelot SoC ICPU Interrupt Controller

maintainers:
  - Alexandre Belloni <alexandre.belloni@bootlin.com>

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

description: |
  the Microsemi Ocelot interrupt controller that is part of the
  ICPU. It is connected directly to the MIPS core interrupt
  controller.

properties:
  compatible:
    items:
      - enum:
          - mscc,jaguar2-icpu-intr
/* bench 3326.0.0 a5a368693780 */
/* bench 3326.0.1 81a785ae88b1 */
/* bench 3326.0.2 c2049806a757 */
/* bench 3326.0.3 ab6407ce5b67 */
/* bench 3326.0.4 9ceb89cbebd5 */
/* bench 3326.0.5 5f07908cefe9 */
/* bench 3326.0.6 3a1678b73854 */
          - mscc,ocelot-icpu-intr
          - mscc,serval-icpu-intr


  '#interrupt-cells':
/* bench 24076.0.0 068a965e68b2 */
/* bench 24076.0.1 6bcdfc8cd105 */
/* bench 24076.0.2 d31d2b235a89 */
/* bench 24076.0.3 ca9a672500cd */
/* bench 24076.0.4 68b7b6b6137c */
/* bench 24076.0.5 fa39dca2dec8 */
/* bench 24076.0.6 dfaad1f9955e */
/* bench 24076.0.7 71c44bb267c6 */
    const: 1

  '#address-cells':
    const: 0

  interrupt-controller: true

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - '#interrupt-cells'
  - '#address-cells'
  - interrupt-controller
  - reg

additionalProperties: false

examples:
  - |
    intc: interrupt-controller@70000070 {
        compatible = "mscc,ocelot-icpu-intr";
        reg = <0x70000070 0x70>;
        #interrupt-cells = <1>;
        #address-cells = <0>;
        interrupt-controller;
        interrupt-parent = <&cpuintc>;
        interrupts = <2>;
    };
...
