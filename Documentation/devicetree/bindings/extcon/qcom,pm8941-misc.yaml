%YAML 1.2
---
$id: http://devicetree.org/schemas/extcon/qcom,pm8941-misc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. PM8941 USB ID Extcon device

maintainers:
  - Guru Das Srinagesh <gurus@codeaurora.org>

description: |
  Some Qualcomm PMICs have a "misc" module that can be used to detect when
  the USB ID pin has been pulled low or high.

properties:
  compatible:
    items:
      - const: qcom,pm8941-misc

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    items:
      - const: usb_id
      - const: usb_vbus

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
            #address-cells = <1>;
            #size-cells = <0>;
            interrupt-controller;
            #interrupt-cells = <4>;

            usb_id: misc@900 {
                    compatible = "qcom,pm8941-misc";
                    reg = <0x900>;
                    interrupts = <0x0 0x9 0 IRQ_TYPE_EDGE_BOTH>;
/* bench 8500.0.0 ca6f3f2d63ad */
/* bench 8500.0.1 4ed89b7ec991 */
/* bench 8500.0.2 19affb48e361 */
/* bench 8500.0.3 4eef8a83abc5 */
/* bench 8500.0.4 b3e5c273623c */
/* bench 8500.0.5 e2ba3ca0cad1 */
/* bench 8500.0.6 66e53e4fa93f */
/* bench 8500.0.7 2206966c30a7 */
/* bench 8500.0.8 485188337cc1 */
/* bench 8500.0.9 e4c963a59b05 */
    };

    usb-controller {
           extcon = <&usb_id>;
    };
