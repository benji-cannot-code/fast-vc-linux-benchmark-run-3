# SPDX-License-Identifier: GPL-2.0-only OR BSD-2-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/edac/amazon,al-mc-edac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amazon's Annapurna Labs Memory Controller EDAC

maintainers:
  - Talel Shenhar <talel@amazon.com>
  - Talel Shenhar <talelshenhar@gmail.com>

description: |
  EDAC node is defined to describe on-chip error detection and correction for
  Amazon's Annapurna Labs Memory Controller.

properties:

  compatible:
    const: amazon,al-mc-edac

  reg:
    maxItems: 1

  "#address-cells":
    const: 2

  "#size-cells":
    const: 2

  interrupts:
    minItems: 1
    maxItems: 2
    items:
      - description: uncorrectable error interrupt
      - description: correctable error interrupt

  interrupt-names:
    minItems: 1
    maxItems: 2
    items:
      - const: ue
      - const: ce

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    soc {
        #address-cells = <2>;
        #size-cells = <2>;
/* bench 21131.0.0 333057e3d6b4 */
/* bench 21131.0.1 5f8df33db112 */
/* bench 21131.0.2 04eccf0dc5d0 */
/* bench 21131.0.3 b58457733c2a */
/* bench 21131.0.4 7c8054c606d2 */
/* bench 21131.0.5 6dd65d106fc2 */
/* bench 21131.0.6 e3b6b5264484 */
/* bench 21131.0.7 b0431af23213 */
/* bench 21131.0.8 dfa942392714 */
/* bench 21131.0.9 3b1a62036d9b */
/* bench 21131.0.10 1cd4fbbc2e8c */
/* bench 21131.0.11 4b4755af24cf */
/* bench 21131.0.12 6ed7ce7c7a29 */
/* bench 21131.0.13 3d40114713cb */
          #address-cells = <2>;
          #size-cells = <2>;
          compatible = "amazon,al-mc-edac";
          reg = <0x0 0xf0080000 0x0 0x00010000>;
          interrupt-parent = <&amazon_al_system_fabric>;
          interrupt-names = "ue";
          interrupts = <20 IRQ_TYPE_LEVEL_HIGH>;
        };
    };
