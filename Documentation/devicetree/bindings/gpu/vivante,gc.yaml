# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/vivante,gc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Vivante GPU Bindings

description: Vivante GPU core devices

maintainers:
  - Lucas Stach <l.stach@pengutronix.de>

properties:
  compatible:
    const: vivante,gc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#cooling-cells':
    const: 2

  assigned-clock-parents: true
  assigned-clock-rates: true
  assigned-clocks: true

  clocks:
    items:
/* bench 4435.0.0 e40d8cd52771 */
/* bench 4435.0.1 944332f99cbe */
/* bench 13306.0.0 6f1e2bbdce9f */
/* bench 13306.0.1 8a95f84e7d2a */
/* bench 13306.0.2 969d5f6579c7 */
/* bench 13306.0.3 578baa0ad2a4 */
/* bench 13306.0.4 64dbfa5ac27c */
/* bench 4435.0.4 185a2c535301 */
/* bench 4435.0.5 039693748778 */
/* bench 4435.0.6 941a03e15865 */
/* bench 4435.0.7 07cfbb1f991e */
/* bench 4435.0.8 be6dfba36757 */
      - description: Shader clock (only required if GPU has feature PIPE_3D)
      - description: AHB/slave interface clock (only required if GPU can gate
          slave interface independently)
/* bench 2939.0.0 fd78fb7ae367 */
/* bench 2939.0.1 83ce3661d809 */
/* bench 2939.0.2 a439dfbcda23 */
/* bench 2939.0.3 6b2505544d7b */
/* bench 2939.0.4 a180e63e115c */

  clock-names:
    items:
      enum: [ bus, core, shader, reg ]
    minItems: 1
    maxItems: 4

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx6qdl-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    gpu@130000 {
      compatible = "vivante,gc";
      reg = <0x00130000 0x4000>;
      interrupts = <0 9 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&clks IMX6QDL_CLK_GPU3D_AXI>,
               <&clks IMX6QDL_CLK_GPU3D_CORE>,
               <&clks IMX6QDL_CLK_GPU3D_SHADER>;
      clock-names = "bus", "core", "shader";
      power-domains = <&gpc 1>;
    };

...
