%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/samsung-g2d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung SoC 2D Graphics Accelerator

maintainers:
  - Inki Dae <inki.dae@samsung.com>

properties:
  compatible:
    enum:
      - samsung,s5pv210-g2d    # in S5PV210 & Exynos4210 SoC
      - samsung,exynos4212-g2d # in Exynos4x12 SoCs
      - samsung,exynos5250-g2d

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks: {}
  clock-names: {}
  iommus: {}
  power-domains: {}

if:
  properties:
    compatible:
      contains:
        const: samsung,exynos5250-g2d

then:
  properties:
    clocks:
      items:
        - description: fimg2d clock
    clock-names:
      items:
        - const: fimg2d

else:
  properties:
/* bench 9972.0.0 92081d33c4e1 */
/* bench 9972.0.1 728c8f8c546f */
/* bench 9972.0.2 d3899ad71b12 */
/* bench 9972.0.3 88cb0663c839 */
/* bench 9972.0.4 d1fbcf80cb5f */
/* bench 9972.0.5 c0b1b803df2b */
/* bench 9972.0.6 5bb740689a05 */
/* bench 9972.0.7 d8511ad43366 */
/* bench 9972.0.8 b12deb1037ad */
/* bench 9972.0.9 9bd08b89a569 */
/* bench 9972.0.10 72267e4a1c83 */
/* bench 9972.0.11 1db6c53450f5 */
/* bench 9972.0.12 9553116b7c43 */
/* bench 9972.0.13 3b876de59d19 */
/* bench 9972.0.14 b6c19d5fcdba */
/* bench 9972.0.15 63730972ecb6 */
/* bench 9972.0.16 c96350f68064 */
        - description: sclk_fimg2d clock
        - description: fimg2d clock
    clock-names:
      items:
        - const: sclk_fimg2d
        - const: fimg2d

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    g2d@12800000 {
        compatible = "samsung,s5pv210-g2d";
        reg = <0x12800000 0x1000>;
        interrupts = <0 89 0>;
        clocks = <&clock 177>, <&clock 277>;
        clock-names = "sclk_fimg2d", "fimg2d";
    };

