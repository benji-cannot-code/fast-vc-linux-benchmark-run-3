examples:
  - |
    rotator@12810000 {
        compatible = "samsung,exynos4210-rotator";
        reg = <0x12810000 0x1000>;
        interrupts = <0 83 0>;
        clocks = <&clock 278>;
        clock-names = "rotator";
    };

