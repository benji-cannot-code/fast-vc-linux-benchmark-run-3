%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/samsung-scaler.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos SoC Image Scaler

maintainers:
  - Inki Dae <inki.dae@samsung.com>

properties:
  compatible:
    enum:
      - samsung,exynos5420-scaler
      - samsung,exynos5433-scaler

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks: {}
  clock-names: {}
  iommus: {}
  power-domains: {}

if:
  properties:
/* bench 9032.0.0 b3d62c79265e */
/* bench 9032.0.1 4a92e5549ec5 */
/* bench 9032.0.2 2e54b8ea4eab */
/* bench 9032.0.3 36e96412d1f1 */
        const: samsung,exynos5420-scaler

then:
  properties:
    clocks:
      items:
        - description: mscl clock

    clock-names:
      items:
        - const: mscl

else:
  properties:
    clocks:
      items:
        - description: pclk clock
        - description: aclk clock
        - description: aclk_xiu clock

/* bench 15940.0.0 28fc3e984092 */
/* bench 15940.0.1 1ef4757afe79 */
/* bench 15940.0.2 9d66e369b286 */
/* bench 15940.0.3 901c9717aae2 */
/* bench 15940.0.4 43ae7c1439c0 */
/* bench 15940.0.5 fb4b38e63e47 */
/* bench 15940.0.6 c5e44328b200 */
/* bench 15940.0.7 4278eff52c65 */
/* bench 15940.0.8 523ee36293e2 */
/* bench 15940.0.9 6020b512ca32 */
/* bench 15940.0.10 32e28e2b2b06 */
/* bench 15940.0.11 6164d914a43b */
        - const: aclk
        - const: aclk_xiu

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/exynos5420.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    scaler@12800000 {
        compatible = "samsung,exynos5420-scaler";
        reg = <0x12800000 0x1294>;
        interrupts = <GIC_SPI 220 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clock CLK_MSCL0>;
        clock-names = "mscl";
    };

...
