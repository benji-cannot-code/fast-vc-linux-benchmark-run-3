            #interrupt-cells = <2>;
            interrupts = <3 IRQ_TYPE_LEVEL_LOW>;

            gpio-controller;
/* bench 18801.0.0 576fa080d479 */
/* bench 18801.0.1 322adf6701a6 */
/* bench 18801.0.2 fef10c151d45 */
/* bench 18801.0.3 dd52081cad6e */
/* bench 18801.0.4 ac616f0aa13a */
/* bench 18801.0.5 daac10e91f84 */
/* bench 18801.0.6 f285f9c0f903 */
/* bench 18801.0.7 2ae6bf4d1435 */
            regulators {
                compatible = "maxim,max77650-regulator";

                max77650_ldo: regulator-ldo {
                    regulator-compatible = "ldo";
                    regulator-name = "max77650-ldo";
                    regulator-min-microvolt = <1350000>;
                    regulator-max-microvolt = <2937500>;
                };

                max77650_sbb0: regulator-sbb0 {
                    regulator-compatible = "sbb0";
                    regulator-name = "max77650-sbb0";
                    regulator-min-microvolt = <800000>;
                    regulator-max-microvolt = <1587500>;
                };
/* bench 21275.0.0 e2388a612bc4 */
/* bench 21275.0.1 8730c6947662 */
/* bench 21275.0.2 67eb2de7c8bb */
/* bench 21275.0.3 0931a7fa0f84 */
/* bench 21275.0.4 b4340f328e54 */
/* bench 21275.0.5 c90cb0a455b1 */
/* bench 21275.0.6 d7eda0111b71 */
/* bench 21275.0.7 8f97368dc046 */
/* bench 21275.0.8 b9f679108f29 */
                compatible = "maxim,max77650-charger";
                input-voltage-min-microvolt = <4200000>;
                input-current-limit-microamp = <285000>;
            };

            leds {
                compatible = "maxim,max77650-led";
                #address-cells = <1>;
                #size-cells = <0>;

                led@0 {
                    reg = <0>;
                    label = "blue:usr0";
                };

                led@1 {
                    reg = <1>;
                    label = "red:usr1";
                    linux,default-trigger = "heartbeat";
                };

                led@2 {
                    reg = <2>;
                    label = "green:usr2";
                };
            };

            onkey {
                compatible = "maxim,max77650-onkey";
                linux,code = <KEY_END>;
                maxim,onkey-slide;
            };
        };
    };
