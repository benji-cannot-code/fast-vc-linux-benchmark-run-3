additionalProperties: false

examples:
  - |
    timer@2c000600 {
      compatible = "arm,cortex-a9-global-timer";
      reg = <0x2c000600 0x20>;
      interrupts = <1 13 0xf01>;
      clocks = <&arm_periph_clk>;
    };
