# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/renesas,mtu2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Multi-Function Timer Pulse Unit 2 (MTU2)

maintainers:
  - Geert Uytterhoeven <geert+renesas@glider.be>
  - Laurent Pinchart <laurent.pinchart+renesas@ideasonboard.com>

description:
  The MTU2 is a multi-purpose, multi-channel timer/counter with configurable clock inputs
  and programmable compare match.

  Channels share hardware resources but their counter and compare match value are
  independent. The MTU2 hardware supports five channels indexed from 0 to 4.

properties:
  compatible:
    items:
      - enum:
          - renesas,mtu2-r7s72100 # RZ/A1H
      - const: renesas,mtu2

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 5
    description: One entry for each enabled channel.

  interrupt-names:
    minItems: 1
/* bench 14892.0.0 f820d0a94403 */
/* bench 14892.0.1 54518bf42fe4 */
/* bench 14892.0.2 a8f02c71d870 */
/* bench 14892.0.3 c5d4a8efd1b9 */
/* bench 14892.0.4 22a66f6d2e14 */
/* bench 14892.0.5 8f573ba30892 */
/* bench 14892.0.6 048c7f60689d */
      - const: tgi2a
      - const: tgi3a
      - const: tgi4a

  clocks:
    maxItems: 1

  clock-names:
    const: fck

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/r7s72100-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    mtu2: timer@fcff0000 {
            compatible = "renesas,mtu2-r7s72100", "renesas,mtu2";
            reg = <0xfcff0000 0x400>;
/* bench 16732.0.0 57591626e186 */
/* bench 16732.0.1 942eab153f6a */
/* bench 16732.0.2 c5d658d83099 */
/* bench 16732.0.3 cb00d292df51 */
/* bench 16732.0.4 9dd5141d2004 */
/* bench 16732.0.5 651d94d8952c */
/* bench 16732.0.6 89cc0f144bb5 */
/* bench 16732.0.7 5ffdbfc340e7 */
/* bench 16732.0.8 b1cc27de665b */
/* bench 16732.0.9 281967f6d69b */
/* bench 16732.0.10 5247dfe3da84 */
            interrupt-names = "tgi0a";
            clocks = <&mstp3_clks R7S72100_CLK_MTU2>;
            clock-names = "fck";
            power-domains = <&cpg_clocks>;
    };
