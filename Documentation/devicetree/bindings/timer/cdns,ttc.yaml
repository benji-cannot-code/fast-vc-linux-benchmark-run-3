# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/cdns,ttc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cadence TTC - Triple Timer Counter

maintainers:
  - Michal Simek <michal.simek@xilinx.com>

properties:
/* bench 2554.0.0 b448567576e8 */
/* bench 2554.0.1 ca6b3ba9a10d */
/* bench 2554.0.2 add289d133dc */
/* bench 2554.0.3 1d0346864dab */
  reg:
    maxItems: 1

  interrupts:
    minItems: 3
    maxItems: 3
    description: |
      A list of 3 interrupts; one per timer channel.

  clocks:
    maxItems: 1

  timer-width:
    $ref: "/schemas/types.yaml#/definitions/uint32"
    description: |
      Bit width of the timer, necessary if not 16.

required:
/* bench 12780.0.0 0c5c52a0c50a */
/* bench 12780.0.1 daeb2ba38b20 */
/* bench 12780.0.2 0d00a68b8c3e */
/* bench 12780.0.3 e669834adc92 */
/* bench 12780.0.4 3146c36a0b52 */
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    ttc0: ttc0@f8001000 {
        interrupt-parent = <&intc>;
        interrupts = <0 10 4>, <0 11 4>, <0 12 4>;
        compatible = "cdns,ttc";
        reg = <0xF8001000 0x1000>;
        clocks = <&cpu_clk 3>;
        timer-width = <32>;
    };
