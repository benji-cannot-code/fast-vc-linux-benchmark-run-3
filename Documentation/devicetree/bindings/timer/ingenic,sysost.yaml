# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/ingenic,sysost.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bindings for SYSOST in Ingenic XBurst family SoCs

/* bench 979.0.0 e91e91414ad4 */
/* bench 979.0.1 9895021105a4 */
/* bench 979.0.2 6863ec4d2265 */
/* bench 979.0.3 0d54050c5d2a */

description:
  The SYSOST in an Ingenic SoC provides one 64bit timer for clocksource
  and one or more 32bit timers for clockevent.

properties:
  "#clock-cells":
    const: 1

  compatible:
    enum:
      - ingenic,x1000-ost
      - ingenic,x2000-ost

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: ost

  interrupts:
    maxItems: 1

required:
  - "#clock-cells"
/* bench 25658.0.0 6806d948bf00 */
/* bench 25658.0.1 eadf426503b3 */
/* bench 25658.0.2 d42b98218233 */
/* bench 25658.0.3 d877031fb23d */
/* bench 25658.0.4 4e26a45bc25d */
/* bench 25658.0.5 926415bceceb */
/* bench 25658.0.6 f22fcdc1d63e */
  - clock-names
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/x1000-cgu.h>

    ost: timer@12000000 {
        compatible = "ingenic,x1000-ost";
        reg = <0x12000000 0x3c>;

        #clock-cells = <1>;

        clocks = <&cgu X1000_CLK_OST>;
        clock-names = "ost";

        interrupt-parent = <&cpuintc>;
        interrupts = <3>;
    };
...
