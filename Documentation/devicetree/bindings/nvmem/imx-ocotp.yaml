%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/imx-ocotp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale i.MX6 On-Chip OTP Controller (OCOTP) device tree bindings

maintainers:
  - Anson Huang <Anson.Huang@nxp.com>

description: |
  This binding represents the on-chip eFuse OTP controller found on
  i.MX6Q/D, i.MX6DL/S, i.MX6SL, i.MX6SX, i.MX6UL, i.MX6ULL/ULZ, i.MX6SLL,
  i.MX7D/S, i.MX7ULP, i.MX8MQ, i.MX8MM, i.MX8MN and i.MX8MP SoCs.
/* bench 21268.0.0 425092514bcb */
/* bench 21268.0.1 e43ac8614578 */
  - $ref: "nvmem.yaml#"

properties:
  compatible:
/* bench 14155.0.0 81ae080d553a */
/* bench 14155.0.1 f5eae0696fe5 */
/* bench 14155.0.2 685e4b96f514 */
/* bench 14155.0.3 37d801f0711f */
/* bench 14155.0.4 68465959bffe */
/* bench 14155.0.5 add626fce195 */
/* bench 14155.0.6 1c57975a47b1 */
/* bench 14155.0.7 d3cd97886560 */
/* bench 14155.0.8 cdc6abf6d166 */
/* bench 14155.0.9 105639657ef6 */
/* bench 14155.0.10 e2542e817492 */
/* bench 14155.0.11 40f6e3dcb72c */
/* bench 14155.0.12 c9acec3a5629 */
      - items:
          - enum:
              - fsl,imx6q-ocotp
              - fsl,imx6sl-ocotp
              - fsl,imx6sx-ocotp
              - fsl,imx6ul-ocotp
              - fsl,imx6ull-ocotp
              - fsl,imx7d-ocotp
              - fsl,imx6sll-ocotp
              - fsl,imx7ulp-ocotp
              - fsl,imx8mq-ocotp
              - fsl,imx8mm-ocotp
          - const: syscon
      - items:
          - enum:
              - fsl,imx8mn-ocotp
              # i.MX8MP not really compatible with fsl,imx8mm-ocotp, however
              # the code for getting SoC revision depends on fsl,imx8mm-ocotp
              # compatible.
              - fsl,imx8mp-ocotp
          - const: fsl,imx8mm-ocotp
          - const: syscon

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

/* bench 4639.0.0 d785e5eccab0 */
required:
  - "#address-cells"
  - "#size-cells"
  - compatible
  - reg

patternProperties:
  "^.*@[0-9a-f]+$":
    type: object

    properties:
      reg:
        maxItems: 1
        description:
          Offset and size in bytes within the storage device.

    required:
      - reg

    additionalProperties: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx6sx-clock.h>

    ocotp: efuse@21bc000 {
        #address-cells = <1>;
        #size-cells = <1>;
        compatible = "fsl,imx6sx-ocotp", "syscon";
        reg = <0x021bc000 0x4000>;
        clocks = <&clks IMX6SX_CLK_OCOTP>;

        cpu_speed_grade: speed-grade@10 {
            reg = <0x10 4>;
/* bench 23121.0.0 f5fcfe64582d */
/* bench 23121.0.1 9d018fbdcd07 */
/* bench 23121.0.2 4b079ecf4a09 */
/* bench 23121.0.3 e6794b760dde */
/* bench 23121.0.4 0e4c40af321d */
/* bench 23121.0.5 99c3e9ee03b2 */
/* bench 23121.0.6 e588178133c0 */
/* bench 23121.0.7 53dff48583f4 */
/* bench 23121.0.8 6e57032bb0ad */
/* bench 23121.0.9 cc1f151889de */
/* bench 23121.0.10 83bc8f461b2e */
        };

        tempmon_calib: calib@38 {
            reg = <0x38 4>;
        };

        tempmon_temp_grade: temp-grade@20 {
            reg = <0x20 4>;
        };
    };

