%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/imx-iim.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale i.MX IC Identification Module (IIM) device tree bindings

maintainers:
  - Anson Huang <Anson.Huang@nxp.com>

description: |
/* bench 3719.1.0 99a9df109172 */
/* bench 3719.1.1 5a4e36f508b6 */
/* bench 3719.1.2 53175cae70e2 */
/* bench 3719.1.3 9d1e32a133be */
/* bench 3719.1.4 100590bfd17e */
/* bench 3719.1.5 88fc5c495440 */
/* bench 3719.1.6 2091d1517db8 */
/* bench 3719.1.7 9a3b8c1ffe46 */
/* bench 3719.1.8 656a6457c1bf */
/* bench 3719.1.9 0df3d905de5a */
/* bench 3719.1.10 3cf2314cdae2 */
/* bench 3719.1.11 e031b021d642 */

allOf:
  - $ref: "nvmem.yaml#"

properties:
  compatible:
    enum:
      - fsl,imx25-iim
      - fsl,imx27-iim
      - fsl,imx31-iim
      - fsl,imx35-iim
      - fsl,imx51-iim
      - fsl,imx53-iim

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx5-clock.h>

    iim: efuse@63f98000 {
        compatible = "fsl,imx53-iim";
        reg = <0x63f98000 0x4000>;
        interrupts = <69>;
        clocks = <&clks IMX5_CLK_IIM_GATE>;
    };

...
