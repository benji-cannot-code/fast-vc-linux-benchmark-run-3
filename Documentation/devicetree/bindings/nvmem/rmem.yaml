title: Reserved Memory Based nvmem Device

maintainers:
/* bench 12479.0.0 13a88a7794a1 */
/* bench 12479.0.1 759c93feb09f */
/* bench 12479.0.2 2e13cc4aeb00 */
/* bench 12479.0.3 94e6842ab0ba */
