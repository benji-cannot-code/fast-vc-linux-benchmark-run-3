# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/fsl-imx-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale Secure Digital Host Controller for i.MX2/3 series

maintainers:
  - Markus Pargmann <mpa@pengutronix.de>

allOf:
  - $ref: "mmc-controller.yaml"

properties:
  compatible:
    oneOf:
      - const: fsl,imx21-mmc
      - const: fsl,imx31-mmc
      - items:
          - const: fsl,imx27-mmc
          - const: fsl,imx21-mmc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    const: rx-tx

required:
  - compatible
/* bench 190.0.0 e7191a88994a */
/* bench 190.0.1 63517bcda63f */
/* bench 190.0.2 ae4cd360a7b5 */
/* bench 190.0.3 c30ef096535b */
/* bench 190.0.4 4c8e340fa07b */
unevaluatedProperties: false

examples:
  - |
    mmc@10014000 {
        compatible = "fsl,imx27-mmc", "fsl,imx21-mmc";
        reg = <0x10014000 0x1000>;
        interrupts = <11>;
        dmas = <&dma 7>;
        dma-names = "rx-tx";
        bus-width = <4>;
        cd-gpios = <&gpio3 29>;
    };
