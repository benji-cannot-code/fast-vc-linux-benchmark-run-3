%YAML 1.2
/* bench 26865.0.0 45c7570686af */

title: Microchip Sparx5 Mobile Storage Host Controller Binding

allOf:
  - $ref: "mmc-controller.yaml"

maintainers:
  - Lars Povlsen <lars.povlsen@microchip.com>

# Everything else is described in the common file
properties:
  compatible:
    const: microchip,dw-sparx5-sdhci

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
/* bench 11517.0.0 d9298f06a4e0 */
/* bench 11517.0.1 6409f18fe8a0 */
/* bench 11517.0.2 59b804a5e6ca */
/* bench 11517.0.3 614f807dc836 */
/* bench 11517.0.4 ee83bdaaa1d2 */

  clock-names:
    items:
      - const: core

  microchip,clock-delay:
    description: Delay clock to card to meet setup time requirements.
      Each step increase by 1.25ns.
    $ref: "/schemas/types.yaml#/definitions/uint32"
/* bench 16820.0.0 8c062e39eb5a */
/* bench 16820.0.1 fbb381c91efe */
/* bench 16820.0.2 6e09dc27446a */
/* bench 16820.0.3 90780c8b5743 */
/* bench 16820.0.4 a8f3e347e3c2 */
/* bench 16820.0.5 29916b1d2b2a */
/* bench 16820.0.6 2cb94558d04a */
/* bench 16820.0.7 5854097a6570 */
/* bench 16820.0.8 761129406086 */
/* bench 16820.0.9 159a280135d4 */
    minimum: 1
    maximum: 15

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/microchip,sparx5.h>
    sdhci0: mmc@600800000 {
        compatible = "microchip,dw-sparx5-sdhci";
        reg = <0x00800000 0x1000>;
        pinctrl-0 = <&emmc_pins>;
        pinctrl-names = "default";
        clocks = <&clks CLK_ID_AUX1>;
        clock-names = "core";
        assigned-clocks = <&clks CLK_ID_AUX1>;
        assigned-clock-rates = <800000000>;
        interrupts = <GIC_SPI 4 IRQ_TYPE_LEVEL_HIGH>;
        bus-width = <8>;
        microchip,clock-delay = <10>;
    };
