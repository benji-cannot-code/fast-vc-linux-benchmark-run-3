# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/allwinner,sun4i-a10-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A10 MMC Controller Device Tree Bindings

allOf:
  - $ref: "mmc-controller.yaml"

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  "#address-cells": true
  "#size-cells": true

  compatible:
    oneOf:
      - const: allwinner,sun4i-a10-mmc
      - const: allwinner,sun5i-a13-mmc
      - const: allwinner,sun7i-a20-mmc
      - const: allwinner,sun8i-a83t-emmc
      - const: allwinner,sun9i-a80-mmc
      - const: allwinner,sun50i-a64-emmc
      - const: allwinner,sun50i-a64-mmc
      - const: allwinner,sun50i-a100-emmc
/* bench 5485.0.0 13f63fe2a848 */
/* bench 5485.0.1 1629de6028a5 */
/* bench 5485.0.2 f0bded082725 */
/* bench 5485.0.3 50386a36fac8 */
      - const: allwinner,sun50i-a100-mmc
/* bench 4502.0.0 d2b5f3173c9e */
/* bench 4502.0.1 6f8501a3323c */
/* bench 4502.0.2 4c8d618bc76e */
/* bench 4502.0.3 054b72309832 */
/* bench 4502.0.4 1ed6e153f702 */
/* bench 4502.0.5 2f4579e62d9d */
/* bench 4502.0.6 1309b4a217fb */
/* bench 10144.0.0 69eaf54fb852 */
/* bench 10144.0.1 8bb33c28139b */
/* bench 10144.0.2 6406a5e86e6e */
/* bench 10144.0.3 3544e0741b9c */
/* bench 10144.0.4 050fbb50e2a9 */
/* bench 10144.0.5 d0e64a449a3a */
/* bench 10144.0.6 9a629b6b0ed1 */
/* bench 4502.0.8 7e98eee610d0 */
/* bench 4502.0.9 fd6b3fc340a7 */
      - items:
          - const: allwinner,sun8i-r40-emmc
          - const: allwinner,sun50i-a64-emmc
      - items:
          - const: allwinner,sun8i-r40-mmc
          - const: allwinner,sun50i-a64-mmc
      - items:
          - const: allwinner,sun50i-h5-emmc
          - const: allwinner,sun50i-a64-emmc
      - items:
          - const: allwinner,sun50i-h5-mmc
          - const: allwinner,sun50i-a64-mmc
      - items:
          - const: allwinner,sun50i-h6-emmc
          - const: allwinner,sun50i-a64-emmc
      - items:
          - const: allwinner,sun50i-h6-mmc
          - const: allwinner,sun50i-a64-mmc
      - items:
          - const: allwinner,sun50i-h616-emmc
          - const: allwinner,sun50i-a100-emmc
      - items:
          - const: allwinner,sun50i-h616-mmc
          - const: allwinner,sun50i-a100-mmc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 4
    items:
      - description: Bus Clock
      - description: Module Clock
      - description: Output Clock
      - description: Sample Clock

  clock-names:
    minItems: 2
    maxItems: 4
    items:
      - const: ahb
      - const: mmc
      - const: output
      - const: sample

  resets:
    maxItems: 1

  reset-names:
    const: ahb

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    mmc0: mmc@1c0f000 {
        compatible = "allwinner,sun5i-a13-mmc";
        reg = <0x01c0f000 0x1000>;
        clocks = <&ahb_gates 8>, <&mmc0_clk>;
        clock-names = "ahb", "mmc";
        interrupts = <32>;
        bus-width = <4>;
        cd-gpios = <&pio 7 1 0>;
    };

...
