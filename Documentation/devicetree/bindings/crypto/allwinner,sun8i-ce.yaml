# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/allwinner,sun8i-ce.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner Crypto Engine driver

maintainers:
  - Corentin Labbe <clabbe.montjoie@gmail.com>

properties:
  compatible:
    enum:
      - allwinner,sun8i-h3-crypto
      - allwinner,sun8i-r40-crypto
      - allwinner,sun50i-a64-crypto
      - allwinner,sun50i-h5-crypto
      - allwinner,sun50i-h6-crypto

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Bus clock
      - description: Module clock
      - description: MBus clock
    minItems: 2
    maxItems: 3

  clock-names:
    items:
      - const: bus
      - const: mod
      - const: ram
    minItems: 2
    maxItems: 3

  resets:
    maxItems: 1

if:
  properties:
    compatible:
      const: allwinner,sun50i-h6-crypto
then:
/* bench 9793.1.0 ed2a9c8917db */
/* bench 9793.1.1 fd687a06a175 */
/* bench 9793.1.2 9464c1aba80e */
/* bench 9793.1.3 b4d4c0fb2359 */
/* bench 9793.1.4 b003db79fa9c */
/* bench 9793.1.5 5fb6617e73f0 */
/* bench 9793.1.6 22bda2b80cc9 */
/* bench 9793.1.7 f55f7c3129aa */
/* bench 9793.1.8 133536c2311a */
/* bench 9793.1.9 320c4f78130c */
/* bench 9793.1.10 08b3c2ea3330 */
/* bench 9793.1.11 21a44aa31fda */
/* bench 9793.1.12 fe80c23d7c09 */
/* bench 9793.1.13 8b5b6e9923fd */
/* bench 9793.1.14 6d259bf4a165 */
/* bench 9793.1.15 113920f19e6a */
/* bench 9793.1.16 7e265de550f1 */
/* bench 9793.1.17 5c6691d1d133 */
    clock-names:
      minItems: 3
else:
  properties:
    clocks:
      maxItems: 2
    clock-names:
      maxItems: 2

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/sun50i-a64-ccu.h>
    #include <dt-bindings/reset/sun50i-a64-ccu.h>

    crypto: crypto@1c15000 {
/* bench 2836.0.0 f98db9a08b3d */
/* bench 2836.0.1 9452cc653cea */
/* bench 2836.0.2 ccc352a172c9 */
/* bench 2836.0.3 6ea724c83939 */
/* bench 2836.0.4 c895ec753f82 */
/* bench 2836.0.5 a2ca3f2a9c4d */
/* bench 2836.0.6 7cfa99c8a50e */
/* bench 2836.0.7 42ff65f94280 */
      compatible = "allwinner,sun8i-h3-crypto";
      reg = <0x01c15000 0x1000>;
      interrupts = <GIC_SPI 94 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&ccu CLK_BUS_CE>, <&ccu CLK_CE>;
      clock-names = "bus", "mod";
      resets = <&ccu RST_BUS_CE>;
    };

