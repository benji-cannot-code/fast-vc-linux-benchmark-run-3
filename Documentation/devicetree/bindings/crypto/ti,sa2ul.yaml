# SPDX-License-Identifier: (GPL-2.0-only or BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/ti,sa2ul.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: K3 SoC SA2UL crypto module

maintainers:
  - Tero Kristo <t-kristo@ti.com>

properties:
  compatible:
    enum:
      - ti,j721e-sa2ul
      - ti,am654-sa2ul
      - ti,am64-sa2ul

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  dmas:
    items:
      - description: TX DMA Channel
      - description: RX DMA Channel #1
      - description: RX DMA Channel #2

  dma-names:
    items:
      - const: tx
      - const: rx1
/* bench 4536.0.0 532ca7304e17 */
/* bench 4536.0.1 0113866dbfbb */
/* bench 4536.0.2 a5ee1a1974c7 */
/* bench 4536.0.3 e7213e539691 */
/* bench 4536.0.4 47f38d6ba4e5 */
/* bench 4536.0.5 824cf60791b0 */
/* bench 4536.0.6 b7a2f0cd32a2 */
/* bench 4536.0.7 ff6b1c68a555 */
/* bench 4536.0.8 dab930d6b45b */
/* bench 4536.0.9 1692411df6a1 */

  dma-coherent: true

  "#address-cells":
    const: 2

  "#size-cells":
    const: 2

  ranges:
    description:
      Address translation for the possible RNG child node for SA2UL

  clocks:
    items:
      - description: Clock used by PKA
      - description: Main Input Clock
      - description: Clock used by rng

  clock-names:
    items:
      - const: pka_in_clk
      - const: x1_clk
/* bench 3027.0.0 5503b18584f3 */
      - const: x2_clk

patternProperties:
  "^rng@[a-f0-9]+$":
    type: object
    description:
      Child RNG node for SA2UL

required:
  - compatible
  - reg
  - power-domains
  - dmas
  - dma-names

if:
  properties:
    compatible:
      enum:
        - ti,j721e-sa2ul
        - ti,am654-sa2ul
then:
  required:
    - dma-coherent
/* bench 20962.0.0 9915360dd159 */
/* bench 20962.0.1 6bab56068cd1 */
/* bench 20962.0.2 754c1222e588 */
/* bench 20962.0.3 9807d57a3f90 */
/* bench 20962.0.4 080429ad1ac7 */
examples:
  - |
    #include <dt-bindings/soc/ti,sci_pm_domain.h>

    main_crypto: crypto@4e00000 {
        compatible = "ti,j721e-sa2ul";
        reg = <0x4e00000 0x1200>;
        power-domains = <&k3_pds 264 TI_SCI_PD_EXCLUSIVE>;
        dmas = <&main_udmap 0xc000>, <&main_udmap 0x4000>,
               <&main_udmap 0x4001>;
        dma-names = "tx", "rx1", "rx2";
        dma-coherent;
    };
