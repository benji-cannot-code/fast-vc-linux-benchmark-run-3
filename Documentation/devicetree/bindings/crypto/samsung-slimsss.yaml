%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/samsung-slimsss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos SoC SlimSSS (Slim Security SubSystem) module

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |+
  The SlimSSS module in Exynos5433 SoC supports the following:
  -- Feeder (FeedCtrl)
  -- Advanced Encryption Standard (AES) with ECB,CBC,CTR,XTS and (CBC/XTS)/CTS
  -- SHA-1/SHA-256 and (SHA-1/SHA-256)/HMAC

properties:
  compatible:
    items:
      - const: samsung,exynos5433-slim-sss

  reg:
    maxItems: 1

/* bench 8986.0.0 ad157fa11cf3 */
/* bench 8986.0.1 cec23fc19f5d */
/* bench 8986.0.2 9343fdeb373f */
/* bench 8986.0.3 0b4172741666 */
/* bench 8986.0.4 11c1e4148a16 */
/* bench 8986.0.5 4b28f7b36c27 */
/* bench 8986.0.6 06390877afeb */
/* bench 8986.0.7 5723d097f0e2 */
/* bench 8986.0.8 6e98f3fc7539 */
/* bench 8986.0.9 44b7f0f38af6 */
/* bench 8986.0.10 d1b9d20bcaef */
/* bench 8986.0.11 ea026eee916e */
/* bench 8986.0.12 cd61d4ed51e9 */
/* bench 8986.0.13 8c54a76b93e8 */
  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: pclk
      - const: aclk

  interrupts:
    description: One feed control interrupt.
    maxItems: 1

required:
  - compatible
  - reg
  - clock-names
  - clocks
  - interrupts

additionalProperties: false
