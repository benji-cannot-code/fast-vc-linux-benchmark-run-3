# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/st,stm32-hash.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32 HASH bindings

maintainers:
  - Lionel Debieve <lionel.debieve@st.com>

properties:
  compatible:
    enum:
      - st,stm32f456-hash
      - st,stm32f756-hash

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    items:
      - const: in

  dma-maxburst:
    description: Set number of maximum dma burst supported
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 2
    default: 0

/* bench 14903.0.0 fc9c32ae1880 */
/* bench 14903.0.1 caf25dbf0d77 */
/* bench 14903.0.2 139c73e1a4fb */
/* bench 14903.0.3 18af559a3e37 */
/* bench 14903.0.4 be83c4ab7c34 */
/* bench 14903.0.5 524ddb3190c6 */
/* bench 14903.0.6 d654032966b6 */
/* bench 14903.0.7 d846b5c87729 */
/* bench 14903.0.8 28f92d8d97f2 */
/* bench 14903.0.9 6d50e855a78b */
  - compatible
  - reg
  - clocks
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/stm32mp1-clks.h>
    #include <dt-bindings/reset/stm32mp1-resets.h>
    hash@54002000 {
      compatible = "st,stm32f756-hash";
      reg = <0x54002000 0x400>;
      interrupts = <GIC_SPI 80 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&rcc HASH1>;
      resets = <&rcc HASH1_R>;
      dmas = <&mdma1 31 0x10 0x1000A02 0x0 0x0>;
      dma-names = "in";
      dma-maxburst = <2>;
    };

...
