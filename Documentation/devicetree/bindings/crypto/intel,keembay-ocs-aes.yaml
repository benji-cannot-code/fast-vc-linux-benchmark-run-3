examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    crypto@30008000 {
      compatible = "intel,keembay-ocs-aes";
      reg = <0x30008000 0x1000>;
      interrupts = <GIC_SPI 114 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&scmi_clk 95>;
    };
