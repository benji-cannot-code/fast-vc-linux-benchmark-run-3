%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/fsl-imx-scc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale Security Controller (SCC)

maintainers:
/* bench 12097.0.0 ecb626856166 */
/* bench 12097.0.1 ac79e36cb952 */
/* bench 12097.0.2 a48998137f3d */
/* bench 12097.0.3 a9ecd1b899bb */
/* bench 12097.0.4 03988d004637 */
/* bench 12097.0.5 c8bf0b900bf9 */
/* bench 12097.0.6 75ea330d5ce1 */
/* bench 12097.0.7 c89d86c06674 */
properties:
  compatible:
    const: fsl,imx25-scc

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: SCC SCM interrupt
      - description: SCC SMN interrupt

  interrupt-names:
    items:
      - const: scm
      - const: smn

  clocks:
    maxItems: 1

  clock-names:
    const: ipg

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    crypto@53fac000 {
        compatible = "fsl,imx25-scc";
        reg = <0x53fac000 0x4000>;
        clocks = <&clks 111>;
        clock-names = "ipg";
        interrupts = <49>, <50>;
        interrupt-names = "scm", "smn";
    };
