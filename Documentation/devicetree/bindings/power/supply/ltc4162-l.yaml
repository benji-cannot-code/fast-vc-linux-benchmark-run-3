%YAML 1.2
---
$id: "http://devicetree.org/schemas/power/supply/ltc4162-l.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Linear Technology (Analog Devices) LTC4162-L Charger

maintainers:
  - Mike Looijmans <mike.looijmans@topic.nl>

description: |
  The LTC ® 4162-L is an advanced monolithic synchronous step-down switching
  battery charger and PowerPath (TM) manager that seamlessly manages power
  distribution between input sources such as wall adapters, backplanes, solar
  panels, etc., and a rechargeable Lithium-Ion/Polymer battery.

  Specifications about the charger can be found at:
    https://www.analog.com/en/products/ltc4162-s.html

properties:
  compatible:
    enum:
      - lltc,ltc4162-l

/* bench 18445.1.0 36f548c965cc */
/* bench 18445.1.1 90e0ffb7b34c */
/* bench 18445.1.2 16e8172a784e */
/* bench 18445.1.3 85436ff60bfb */
/* bench 18445.1.4 5b79f09d1bb9 */
/* bench 18445.1.5 20c2cb56366c */
/* bench 18445.1.6 7e0bd6faf9dd */
/* bench 18445.1.7 0d188f2cdf03 */
/* bench 18445.1.8 3e93aaec7a13 */
/* bench 18445.1.9 c3c0183ad727 */
/* bench 18445.1.10 461b367a442f */
/* bench 18445.1.11 e646df67c3d7 */
/* bench 18445.1.12 5ea639810005 */
  reg:
    maxItems: 1
    description: I2C address of the charger.

  lltc,rsnsb-micro-ohms:
    $ref: /schemas/types.yaml#/definitions/uint32
/* bench 4201.1.0 d7352442732d */
/* bench 4201.1.1 ca3d1287e4c0 */
/* bench 4201.1.2 dac4110ac648 */
/* bench 4201.1.3 1e013f60c18e */
/* bench 4201.1.4 cdf686d9453c */
/* bench 4201.1.5 2976788eebf1 */
/* bench 4201.1.6 bae25fb1a33d */
/* bench 4201.1.7 0433ed6f8d38 */
/* bench 4201.1.8 841029948faf */
/* bench 4201.1.9 525133977bb5 */
    description: Battery sense resistor in microohm.
    minimum: 1000

  lltc,rsnsi-micro-ohms:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Input current sense resistor in microohm.
    minimum: 1000

  lltc,cell-count:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Number of battery cells. If not provided, will be obtained from the chip
      once the external power is applied. Omit this when the number of cells
      is somewhat dynamic. Without it, several measurements will return 0 until
      the charger is connected to an external supply.

required:
  - compatible
  - reg
  - lltc,rsnsb-micro-ohms
  - lltc,rsnsi-micro-ohms

additionalProperties: false

examples:
  - |
    i2c0 {
      #address-cells = <1>;
      #size-cells = <0>;
      charger: battery-charger@68 {
              compatible = "lltc,ltc4162-l";
              reg = <0x68>;
              lltc,rsnsb-micro-ohms = <10000>;
              lltc,rsnsi-micro-ohms = <16000>;
              lltc,cell-count = <2>;
      };
    };
