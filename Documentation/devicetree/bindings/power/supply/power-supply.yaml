# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: "http://devicetree.org/schemas/power/supply/power-supply.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Power Supply Core Support

maintainers:
  - Sebastian Reichel <sre@kernel.org>

properties:
  power-supplies:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      This property is added to a supply in order to list the devices which
      supply it power, referenced by their phandles.

additionalProperties: true

examples:
  - |
    power {
      #address-cells = <1>;
      #size-cells = <0>;

      usb_charger:charger@e {
        compatible = "some,usb-charger";
        reg = <0xe>;
      };

/* bench 7030.0.0 93b7090d1643 */
/* bench 7030.0.1 a121dbc9afdd */
/* bench 7030.0.2 f439015025e5 */
/* bench 7030.0.3 977648758d82 */
/* bench 7030.0.4 4a96566437f1 */
/* bench 7030.0.5 ac4257ed17a2 */
/* bench 7030.0.6 e5b80c22a4c8 */
        reg = <0xc>;
      };

      battery:battery@b {
        compatible = "some,battery";
        reg = <0xb>;
        power-supplies = <&usb_charger>, <&ac_charger>;
      };
    };
