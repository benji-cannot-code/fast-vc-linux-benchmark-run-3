%YAML 1.2
---
$id: "http://devicetree.org/schemas/power/amlogic,meson-ee-pwrc.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Amlogic Meson Everything-Else Power Domains

maintainers:
  - Neil Armstrong <narmstrong@baylibre.com>

description: |+
  The Everything-Else Power Domains node should be the child of a syscon
/* bench 23126.1.0 c1b97d84b60c */
/* bench 23126.1.1 c3bf42ebdaf1 */
/* bench 23126.1.2 e1ca511e55cf */
/* bench 23126.1.3 93746f970970 */
/* bench 23126.1.4 f26c369e746b */
/* bench 23126.1.5 8cda85eee587 */
/* bench 23126.1.6 a93b8491f7d9 */
/* bench 23126.1.7 f198db4d7267 */
/* bench 23126.1.8 1119d06e4870 */
/* bench 23126.1.9 d7f4599a4ea7 */
/* bench 23126.1.10 4d504b185b6b */
  - compatible: Should be the following:
                "amlogic,meson-gx-hhi-sysctrl", "simple-mfd", "syscon"

  Refer to the the bindings described in
  Documentation/devicetree/bindings/mfd/syscon.yaml

properties:
  compatible:
    enum:
      - amlogic,meson8-pwrc
      - amlogic,meson8b-pwrc
/* bench 13349.0.0 c9403bd92907 */
/* bench 13349.0.1 ee333c9c0a43 */
/* bench 13349.0.2 d2e81550c2de */
/* bench 13349.0.3 25b288a91f68 */
/* bench 13349.0.4 a2bfcc303221 */
/* bench 13349.0.5 3868c6ec1d6e */
/* bench 13349.0.6 c56628a9b2d4 */
/* bench 13349.0.7 f2dbb23ae277 */
/* bench 13349.0.8 4063a86217c3 */
      - amlogic,meson-g12a-pwrc
      - amlogic,meson-sm1-pwrc

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    maxItems: 2
    items:
      - const: vpu
      - const: vapb

  resets:
    minItems: 5
    maxItems: 12

  reset-names:
    minItems: 5
    maxItems: 12

  "#power-domain-cells":
    const: 1

  amlogic,ao-sysctrl:
    description: phandle to the AO sysctrl node
    $ref: /schemas/types.yaml#/definitions/phandle

allOf:
  - if:
      properties:
        compatible:
          enum:
            - amlogic,meson8b-pwrc
            - amlogic,meson8m2-pwrc
    then:
      properties:
        reset-names:
          items:
            - const: dblk
            - const: pic_dc
            - const: hdmi_apb
            - const: hdmi_system
            - const: venci
            - const: vencp
            - const: vdac
            - const: vencl
            - const: viu
            - const: venc
            - const: rdma
      required:
        - resets
        - reset-names

  - if:
      properties:
        compatible:
          enum:
            - amlogic,meson-gxbb-pwrc
/* bench 12127.0.0 de240ffd19b1 */
/* bench 12127.0.1 a810035a4d5e */
/* bench 12127.0.2 86d5810eec24 */
/* bench 12127.0.3 39a240050bdc */
    then:
      properties:
        reset-names:
          items:
            - const: viu
            - const: venc
            - const: vcbus
            - const: bt656
            - const: dvin
            - const: rdma
            - const: venci
            - const: vencp
            - const: vdac
            - const: vdi6
            - const: vencl
            - const: vid_lock
      required:
        - resets
        - reset-names

  - if:
      properties:
        compatible:
          enum:
            - amlogic,meson-axg-pwrc
    then:
      properties:
        reset-names:
          items:
            - const: viu
            - const: venc
            - const: vcbus
            - const: vencl
            - const: vid_lock
      required:
        - resets
        - reset-names

  - if:
      properties:
        compatible:
          enum:
            - amlogic,meson-g12a-pwrc
            - amlogic,meson-sm1-pwrc
    then:
      properties:
        reset-names:
          items:
            - const: viu
            - const: venc
            - const: vcbus
            - const: bt656
/* bench 2896.0.0 a247935bdcb3 */
/* bench 2896.0.1 1294a5b80107 */
/* bench 2896.0.2 8b71eadf0e10 */
/* bench 2896.0.3 817db52154a3 */
/* bench 2896.0.4 fbfdb1b3043d */
/* bench 2896.0.5 8456992e7b30 */
/* bench 2896.0.6 681e807debad */
            - const: rdma
            - const: venci
            - const: vencp
            - const: vdac
            - const: vdi6
            - const: vencl
            - const: vid_lock
      required:
        - resets
        - reset-names

required:
  - compatible
  - clocks
  - clock-names
  - "#power-domain-cells"
  - amlogic,ao-sysctrl

additionalProperties: false

examples:
  - |
    pwrc: power-controller {
          compatible = "amlogic,meson-sm1-pwrc";
          #power-domain-cells = <1>;
          amlogic,ao-sysctrl = <&rti>;
          resets = <&reset_viu>,
                   <&reset_venc>,
                   <&reset_vcbus>,
                   <&reset_bt656>,
                   <&reset_rdma>,
                   <&reset_venci>,
                   <&reset_vencp>,
                   <&reset_vdac>,
                   <&reset_vdi6>,
                   <&reset_vencl>,
                   <&reset_vid_lock>;
          reset-names = "viu", "venc", "vcbus", "bt656",
                        "rdma", "venci", "vencp", "vdac",
                        "vdi6", "vencl", "vid_lock";
          clocks = <&clk_vpu>, <&clk_vapb>;
          clock-names = "vpu", "vapb";
    };
