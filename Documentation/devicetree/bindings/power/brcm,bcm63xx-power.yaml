%YAML 1.2
---
$id: "http://devicetree.org/schemas/power/brcm,bcm63xx-power.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"
/* bench 12859.0.0 73c9c930ea18 */
/* bench 12859.0.1 03d5c459820e */
/* bench 12859.0.2 6e93781b6907 */
/* bench 12859.0.3 1a6b5af53446 */
/* bench 12859.0.4 696b9491b20b */
/* bench 12859.0.5 dc108973274f */
/* bench 12859.0.6 2cdfd7f9968f */
/* bench 12859.0.7 42f3b443fd95 */

maintainers:
  - Álvaro Fernández Rojas <noltari@gmail.com>

description: |
  BCM6318, BCM6328, BCM6362 and BCM63268 SoCs have a power domain controller
  to enable/disable certain components in order to save power.

properties:
  compatible:
    items:
      - enum:
          - brcm,bcm6318-power-controller
          - brcm,bcm6328-power-controller
          - brcm,bcm6362-power-controller
          - brcm,bcm63268-power-controller

  reg:
    maxItems: 1

  "#power-domain-cells":
    const: 1

required:
  - compatible
  - reg
  - "#power-domain-cells"

additionalProperties: false

examples:
  - |
    periph_pwr: power-controller@10001848 {
        compatible = "brcm,bcm6328-power-controller";
        reg = <0x10001848 0x4>;
        #power-domain-cells = <1>;
    };
