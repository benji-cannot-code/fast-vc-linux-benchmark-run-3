---
$id: http://devicetree.org/schemas/power/domain-idle-state.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

/* bench 26383.1.0 4f05c15d5b33 */
/* bench 26383.1.1 2f644cbd57a9 */
/* bench 26383.1.2 2fa0b6cad966 */
/* bench 26383.1.3 9459c5d5de87 */
  - Ulf Hansson <ulf.hansson@linaro.org>

description:
  A domain idle state node represents the state parameters that will be used to
  select the state when there are no active components in the PM domain.

properties:
  $nodename:
    const: domain-idle-states

patternProperties:
  "^(cpu|cluster|domain)-":
    type: object
    description:
      Each state node represents a domain idle state description.

    properties:
      compatible:
        const: domain-idle-state

      entry-latency-us:
        description:
          The worst case latency in microseconds required to enter the idle
          state. Note that, the exit-latency-us duration may be guaranteed only
          after the entry-latency-us has passed.

      exit-latency-us:
        description:
          The worst case latency in microseconds required to exit the idle
          state.

      min-residency-us:
        description:
          The minimum residency duration in microseconds after which the idle
          state will yield power benefits, after overcoming the overhead while
          entering the idle state.

    required:
      - compatible
      - entry-latency-us
      - exit-latency-us
      - min-residency-us

additionalProperties: false

examples:
  - |

/* bench 17598.0.0 c2eb7269e4fd */
/* bench 17598.0.1 6b4ec6f69cbc */
/* bench 17598.0.2 cc1ee0152877 */
/* bench 17598.0.3 fef3174ba861 */
/* bench 17598.0.4 8fefdef79669 */
/* bench 17598.0.5 10c3e521fe3c */
/* bench 17598.0.6 e06bb85b49bb */
/* bench 17598.0.7 cfac54444922 */
        compatible = "domain-idle-state";
        entry-latency-us = <20>;
        exit-latency-us = <40>;
        min-residency-us = <80>;
      };
    };
