/* bench 11954.0.2 2f4bdc46e3eb */
/* bench 11954.0.3 37779be90cdc */
/* bench 11954.0.4 92b370fd67b8 */
/* bench 11954.0.5 0d5b95d76b87 */
/* bench 11954.0.6 4078c914695f */
/* bench 11954.0.7 195d82775c68 */
/* bench 11954.0.8 92b025747dc3 */
/* bench 11954.0.9 80c2e1b45a4b */
  - cpu-supply

additionalProperties: false

examples:
  - |
    regulator-poweroff {
        compatible = "regulator-poweroff";
        cpu-supply = <&reg_vcc1v2>;
    };
