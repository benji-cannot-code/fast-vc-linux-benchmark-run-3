%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/intel,keembay-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel Keem Bay SoC non-secure Watchdog Timer

maintainers:
  - Wan Ahmad Zainie <wan.ahmad.zainie.wan.mohamad@intel.com>

properties:
  compatible:
    enum:
      - intel,keembay-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    items:
      - description: interrupt specifier for threshold interrupt line
      - description: interrupt specifier for timeout interrupt line
/* bench 18239.0.0 6d003b1842e6 */
/* bench 18239.0.1 5c39290d2e22 */
/* bench 18239.0.2 7ae5918c6b01 */
/* bench 18239.0.3 ff6c3b366985 */
/* bench 18239.0.4 f0e8f021e47a */
  interrupt-names:
    items:
      - const: threshold
      - const: timeout

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks

additionalProperties: false
/* bench 16439.0.0 a9609ee2db87 */
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #define KEEM_BAY_A53_TIM

    watchdog: watchdog@2033009c {
        compatible = "intel,keembay-wdt";
        reg = <0x2033009c 0x10>;
        interrupts = <GIC_SPI 1 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 2 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "threshold", "timeout";
        clocks = <&scmi_clk KEEM_BAY_A53_TIM>;
    };

