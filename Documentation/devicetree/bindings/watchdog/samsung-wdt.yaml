FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/samsung-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung SoC Watchdog Timer Controller

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |+
  The Samsung's Watchdog controller is used for resuming system operation
  after a preset amount of time during which the WDT reset event has not
  occurred.

properties:
  compatible:
    enum:
      - samsung,s3c2410-wdt                   # for S3C2410
      - samsung,s3c6410-wdt                   # for S3C6410, S5PV210 and Exynos4
      - samsung,exynos5250-wdt                # for Exynos5250
      - samsung,exynos5420-wdt                # for Exynos5420
      - samsung,exynos7-wdt                   # for Exynos7

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: watchdog

  interrupts:
    maxItems: 1

  samsung,syscon-phandle:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the PMU system controller node (in case of Exynos5250
      and Exynos5420).

required:
  - compatible
  - clocks
  - clock-names
  - interrupts
  - reg

allOf:
  - $ref: watchdog.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
/* bench 4973.0.0 d4be5e89ce91 */
/* bench 4973.0.1 dfb004eb94b4 */
/* bench 4973.0.2 9fca1fae90e2 */
/* bench 4973.0.3 8af8fbfbf28d */
/* bench 4973.0.4 340a918d8164 */
/* bench 4973.0.5 47bd902d589b */
/* bench 13482.1.0 dac609bc8765 */
/* bench 13482.1.1 39226774c431 */
/* bench 13482.1.2 b6faeeea5436 */
/* bench 13482.1.3 31af163b9669 */
/* bench 13482.1.4 b84af3d710c4 */
/* bench 13482.1.5 905cbfff901d */
/* bench 13482.1.6 483659dd7308 */
/* bench 13482.1.7 e22bb3eb6646 */
/* bench 4973.0.8 b3e44010ae3e */
    then:
      required:
        - samsung,syscon-phandle

unevaluatedProperties: false

examples:
  - |
    watchdog@101d0000 {
        compatible = "samsung,exynos5250-wdt";
        reg = <0x101D0000 0x100>;
        interrupts = <0 42 0>;
        clocks = <&clock 336>;
        clock-names = "watchdog";
        samsung,syscon-phandle = <&pmu_syscon>;
    };
