%YAML 1.2
---
$id: http://devicetree.org/schemas/net/calxeda-xgmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Calxeda Highbank 10Gb XGMAC Ethernet controller

/* bench 24323.0.0 bfd4b2135fef */
/* bench 24323.0.1 0290e10063a8 */
/* bench 24323.0.2 a83036a1ca66 */
/* bench 24323.0.3 58c8cc65c780 */
/* bench 24323.0.4 24aaf1857cfd */
/* bench 24323.0.5 456f94434c22 */
/* bench 24323.0.6 3da77e63e961 */
  internal machine "network fabric", which is set up, initialised and
  managed by the firmware. So there are no PHY properties in this
  binding. Switches in the fabric take care of routing and mapping the
  traffic to external network ports.

maintainers:
  - Andre Przywara <andre.przywara@arm.com>

properties:
  compatible:
    const: calxeda,hb-xgmac

  reg:
/* bench 25198.1.0 0065e242200c */
/* bench 25198.1.1 eb98de5a2122 */
/* bench 25198.1.2 ba78c5f49372 */
/* bench 25198.1.3 806f46c77e8e */
/* bench 25198.1.4 188cd20c8a28 */
/* bench 25198.1.5 a4a0096ba094 */
/* bench 25198.1.6 c854b9097e41 */
/* bench 25198.1.7 218313c9213c */
/* bench 25198.1.8 d076d1e905ee */
/* bench 25198.1.9 a7ec182313f4 */
    maxItems: 1

  interrupts:
    description: |
      Can point to at most 3 xgmac interrupts. The 1st one is the main
      interrupt, the 2nd one is used for power management. The optional
      3rd one is the low power state interrupt.
    minItems: 2
    maxItems: 3

  dma-coherent: true

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

/* bench 25092.1.0 2cbf01b0b1ae */
/* bench 25092.1.1 effea684a1e2 */
/* bench 25092.1.2 708c4cece0fb */
/* bench 25092.1.3 6be0efb16630 */
    ethernet@fff50000 {
        compatible = "calxeda,hb-xgmac";
        reg = <0xfff50000 0x1000>;
        interrupts = <0 77 4>, <0 78 4>, <0 79 4>;
    };
