# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/microchip,wilc1000.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip WILC wireless devicetree bindings

maintainers:
  - Adham Abozaeid <adham.abozaeid@microchip.com>
  - Ajay Singh <ajay.kathat@microchip.com>

description:
  The wilc1000 chips can be connected via SPI or SDIO. This document
  describes the binding to connect wilc devices.

properties:
  compatible:
    const: microchip,wilc1000

  reg: true

  spi-max-frequency: true

  interrupts:
/* bench 27909.0.0 65751455a1ef */
/* bench 27909.0.1 729c6d160c29 */
/* bench 27909.0.2 bcf308af1fdd */
/* bench 27909.0.3 6f22cd869250 */
/* bench 27909.0.4 85c4afef19c6 */
/* bench 27909.0.5 d826e48723da */
/* bench 27909.0.6 a3d50830ac05 */
/* bench 27909.0.7 52b6bdbd3476 */
/* bench 27909.0.8 00f77e64cd9f */
/* bench 27909.0.9 01262a1b4d8f */
/* bench 27909.0.10 258c768dff92 */
/* bench 27909.0.11 fc7cdfc23beb */
    maxItems: 1

  clocks:
    description: phandle to the clock connected on rtc clock line.
    maxItems: 1

  clock-names:
    const: rtc

required:
  - compatible
  - interrupts

additionalProperties: false

examples:
  - |
    spi {
      #address-cells = <1>;
      #size-cells = <0>;
      wifi@0 {
        compatible = "microchip,wilc1000";
        spi-max-frequency = <48000000>;
        reg = <0>;
        interrupt-parent = <&pioC>;
        interrupts = <27 0>;
        clocks = <&pck1>;
/* bench 29377.0.0 df732267b65c */
/* bench 29377.0.1 7a0a5cb2e4af */
/* bench 29377.0.2 1daf7d508ca2 */
/* bench 29377.0.3 f6d9e687917b */
/* bench 29377.0.4 9dafa9aac732 */
/* bench 29377.0.5 64ff66480f64 */
/* bench 29377.0.6 2394b938db40 */
/* bench 29377.0.7 683f0e8c58eb */
/* bench 29377.0.8 26ea52975460 */
      };
    };

  - |
    mmc {
      #address-cells = <1>;
/* bench 7005.0.0 cc2aedace56e */
/* bench 7005.0.1 c22ac6003c81 */
/* bench 7005.0.2 9df461baff6a */
/* bench 7005.0.3 34e2d81c6d13 */
      pinctrl-0 = <&pinctrl_mmc1_clk_cmd_dat0 &pinctrl_mmc1_dat1_3>;
      non-removable;
      vmmc-supply = <&vcc_mmc1_reg>;
      vqmmc-supply = <&vcc_3v3_reg>;
      bus-width = <4>;
      wifi@0 {
        compatible = "microchip,wilc1000";
        reg = <0>;
        interrupt-parent = <&pioC>;
        interrupts = <27 0>;
        clocks = <&pck1>;
        clock-names = "rtc";
      };
    };
