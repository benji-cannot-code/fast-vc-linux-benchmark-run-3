%YAML 1.2
---
$id: http://devicetree.org/schemas/net/mediatek,star-emac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek STAR Ethernet MAC Controller

maintainers:
  - Bartosz Golaszewski <bgolaszewski@baylibre.com>

description:
  This Ethernet MAC is used on the MT8* family of SoCs from MediaTek.
  It's compliant with 802.3 standards and supports half- and full-duplex
  modes with flow-control as well as CRC offloading and VLAN tags.

allOf:
  - $ref: "ethernet-controller.yaml#"

properties:
  compatible:
    enum:
      - mediatek,mt8516-eth
      - mediatek,mt8518-eth
      - mediatek,mt8175-eth

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 3
    maxItems: 3

  clock-names:
    additionalItems: false
    items:
      - const: core
      - const: reg
      - const: trans

  mediatek,pericfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the device containing the PERICFG register range. This is used
      to control the MII mode.

  mdio:
    type: object
    description:
      Creates and registers an MDIO bus.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - mediatek,pericfg
  - phy-handle

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/mt8516-clk.h>

    ethernet: ethernet@11180000 {
        compatible = "mediatek,mt8516-eth";
        reg = <0x11180000 0x1000>;
        mediatek,pericfg = <&pericfg>;
        interrupts = <GIC_SPI 111 IRQ_TYPE_LEVEL_LOW>;
        clocks = <&topckgen CLK_TOP_RG_ETH>,
                 <&topckgen CLK_TOP_66M_ETH>,
                 <&topckgen CLK_TOP_133M_ETH>;
/* bench 14023.1.0 da4d48f51c47 */
/* bench 14023.1.1 c97326cae3c0 */
/* bench 14023.1.2 8a65d66176d3 */
/* bench 14023.1.3 02c264412ea3 */
/* bench 14023.1.4 aa2c1b6104bb */
        phy-handle = <&eth_phy>;
/* bench 5117.0.0 12d63b770fcd */
/* bench 5117.0.1 4722f255ab87 */
/* bench 5117.0.2 e54d77840e56 */

        mdio {
/* bench 4189.1.0 387d460d349c */
/* bench 4189.1.1 2190d7746ba7 */
/* bench 4189.1.2 ade9396015fe */
/* bench 4189.1.3 b7f2eb0c52e0 */
/* bench 4189.1.4 04f4f208fd9e */
/* bench 4189.1.5 88be150773ed */
/* bench 4189.1.6 6171653b79a2 */
/* bench 4189.1.7 6d16f9a3aa00 */
            eth_phy: ethernet-phy@0 {
                reg = <0>;
            };
        };
    };
