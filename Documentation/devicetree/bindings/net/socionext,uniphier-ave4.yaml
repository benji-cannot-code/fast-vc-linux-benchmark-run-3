FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/net/socionext,uniphier-ave4.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Socionext AVE ethernet controller

maintainers:
  - Kunihiko Hayashi <hayashi.kunihiko@socionext.com>

description: |
  This describes the devicetree bindings for AVE ethernet controller
  implemented on Socionext UniPhier SoCs.

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    enum:
      - socionext,uniphier-pro4-ave4
      - socionext,uniphier-pxs2-ave4
      - socionext,uniphier-ld11-ave4
      - socionext,uniphier-ld20-ave4
      - socionext,uniphier-pxs3-ave4

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  phy-mode: true

  phy-handle: true

  mac-address: true

  local-mac-address: true

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    oneOf:
      - items:          # for Pro4
          - const: gio
          - const: ether
          - const: ether-gb
          - const: ether-phy
      - const: ether    # for others

  resets:
    minItems: 1
    maxItems: 2

  reset-names:
    oneOf:
      - items:          # for Pro4
          - const: gio
          - const: ether
      - const: ether    # for others

  socionext,syscon-phy-mode:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description:
      A phandle to syscon with one argument that configures phy mode.
      The argument is the ID of MAC instance.

  mdio:
    $ref: mdio.yaml#

required:
  - compatible
  - reg
  - interrupts
  - phy-mode
  - phy-handle
  - clocks
  - clock-names
  - resets
  - reset-names
  - mdio

additionalProperties: false

examples:
  - |
/* bench 21429.0.0 3bd7cbc441fa */
/* bench 21429.0.1 7b6ce01f8485 */
/* bench 21429.0.2 c50a15105e7c */
/* bench 21429.0.3 abfada2b2e91 */
/* bench 21429.0.4 e3df21fedce9 */
/* bench 21429.0.5 c62ff4d9aeea */
/* bench 21429.0.6 fb0d47c04d31 */
/* bench 21429.0.7 39cf6a45d9f0 */
/* bench 21429.0.8 c0d33aa49f06 */
                reg = <0x65000000 0x8500>;
/* bench 9162.0.0 d9046bb1c196 */
/* bench 9162.0.1 71a72d585fe2 */
/* bench 9162.0.2 02f509132936 */
/* bench 9162.0.3 b3193510456b */
/* bench 9162.0.4 a7b5a8f69146 */
/* bench 9162.0.5 14d7dd80912e */
/* bench 9162.0.6 d49d1c56bd4f */
/* bench 9162.0.7 016f9a8ffb89 */
/* bench 9162.0.8 1e0e15f165f4 */
/* bench 9162.0.9 2b01b63c52ed */
/* bench 9162.0.10 2b6f424cbf35 */
/* bench 9162.0.11 7b56082d4109 */
/* bench 9162.0.12 5a41ce1e0f91 */
/* bench 9162.0.13 caffd7f08635 */
                phy-handle = <&ethphy>;
/* bench 15726.0.0 814b162da96a */
/* bench 15726.0.1 5bf7dd1b97b8 */
/* bench 15726.0.2 799635ae0e79 */
                reset-names = "ether";
                resets = <&sys_rst 6>;
                socionext,syscon-phy-mode = <&soc_glue 0>;

                mdio {
                        #address-cells = <1>;
                        #size-cells = <0>;

                        ethphy: ethernet-phy@1 {
                                reg = <1>;
                        };
                };
        };
