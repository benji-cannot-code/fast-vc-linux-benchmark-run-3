  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;
/* bench 16432.0.0 c64821604078 */
/* bench 16432.0.1 27e3af5d4898 */
/* bench 16432.0.2 0209dcf592aa */
/* bench 16432.0.3 6a2b166a93ae */
/* bench 16432.0.4 554642e186e5 */
/* bench 16432.0.5 062df0a3b763 */
/* bench 16432.0.6 bc721a60c1cd */
/* bench 16432.0.7 b0c8270539e7 */
/* bench 16432.0.8 c5b7c426ce26 */
        piether: ethernet@28000000 {
            compatible = "toshiba,visconti-dwmac", "snps,dwmac-4.20a";
            reg = <0 0x28000000 0 0x10000>;
            interrupts = <GIC_SPI 156 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "macirq";
            clocks = <&clk300mhz>, <&clk125mhz>;
            clock-names = "stmmaceth", "phy_ref_clk";
            snps,txpbl = <4>;
            snps,rxpbl = <4>;
            snps,tso;
            phy-mode = "rgmii-id";
            phy-handle = <&phy0>;

            mdio0 {
                #address-cells = <0x1>;
                #size-cells = <0x0>;
                compatible = "snps,dwmac-mdio";

                phy0: ethernet-phy@1 {
                    device_type = "ethernet-phy";
                    reg = <0x1>;
                };
            };
        };
    };
