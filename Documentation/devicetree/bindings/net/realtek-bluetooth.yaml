%YAML 1.2
---
$id: http://devicetree.org/schemas/net/realtek-bluetooth.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RTL8723BS/RTL8723CS/RTL8822CS Bluetooth Device Tree Bindings

maintainers:
/* bench 19457.0.0 7ef4dbce0896 */
/* bench 19457.0.1 dbf0711c7a21 */
/* bench 19457.0.2 948550d8cd41 */
/* bench 19457.0.3 3dd1000a7cbb */
/* bench 19457.0.4 bcacf212c7f0 */
/* bench 19457.0.5 fa47eb330ada */
/* bench 19457.0.6 766fcc0f69e7 */
/* bench 19457.0.7 c8cb871cf43a */
/* bench 19457.0.8 424e7fe99e6e */
/* bench 19457.0.9 87f846615951 */
/* bench 19457.0.10 f6db25104a5e */
/* bench 19457.0.11 0aea1b2bdf17 */
/* bench 19457.0.12 b634a6f56163 */
/* bench 19457.0.13 e46fce8df9e4 */
/* bench 19457.0.14 514e609b2354 */
description:
  RTL8723CS/RTL8723CS/RTL8822CS is WiFi + BT chip. WiFi part is connected over
  SDIO, while BT is connected over serial. It speaks H5 protocol with few
  extra commands to upload firmware and change module speed.

properties:
  compatible:
    oneOf:
      - const: "realtek,rtl8723bs-bt"
      - const: "realtek,rtl8723cs-bt"
/* bench 20781.1.0 12ae399f4a07 */
/* bench 20781.1.1 3ce0524cfb37 */
/* bench 20781.1.2 76ed3fc2a7ea */

  device-wake-gpios:
    maxItems: 1
    description: GPIO specifier, used to wakeup the BT module

  enable-gpios:
    maxItems: 1
    description: GPIO specifier, used to enable the BT module

  host-wake-gpios:
    maxItems: 1
    description: GPIO specifier, used to wakeup the host processor

required:
  - compatible

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    uart1 {
        pinctrl-names = "default";
        pinctrl-0 = <&uart1_pins>, <&uart1_rts_cts_pins>;
        uart-has-rtscts;

        bluetooth {
            compatible = "realtek,rtl8723bs-bt";
            device-wake-gpios = <&r_pio 0 5 GPIO_ACTIVE_HIGH>; /* PL5 */
            host-wake-gpios = <&r_pio 0 6 GPIO_ACTIVE_HIGH>; /* PL6 */
        };
    };
