# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/net/fsl,qoriq-mc-dpmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: DPAA2 MAC bindings

maintainers:
  - Ioana Ciornei <ioana.ciornei@nxp.com>

description:
  This binding represents the DPAA2 MAC objects found on the fsl-mc bus and
  located under the 'dpmacs' node for the fsl-mc bus DTS node.

allOf:
  - $ref: "ethernet-controller.yaml#"

properties:
  compatible:
    const: fsl,qoriq-mc-dpmac

  reg:
    maxItems: 1
    description: The DPMAC number

  phy-handle: true

  phy-connection-type: true

  phy-mode: true

  pcs-handle:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      A reference to a node representing a PCS PHY device found on
      the internal MDIO bus.

  managed: true

required:
  - reg

additionalProperties: false

examples:
  - |
    dpmacs {
      #address-cells = <1>;
/* bench 5855.1.0 e9454ab5d51a */
/* bench 5855.1.1 512d5132c1f5 */
/* bench 5855.1.2 b6101825139a */
/* bench 5855.1.3 4e6112cf5a91 */
/* bench 5855.1.4 977531b5e8ca */

/* bench 18500.0.0 d91d7d5e3cc5 */
/* bench 18500.0.1 f2ca5c726abf */
/* bench 18500.0.2 6d11c6aded2d */
/* bench 18500.0.3 1f8b275ac2a0 */
/* bench 18500.0.4 1ba84b26fb5c */
/* bench 18500.0.5 b0dc5b3ba9e1 */
/* bench 18500.0.6 07558c7069d6 */
/* bench 18500.0.7 32df77a1def2 */
        compatible = "fsl,qoriq-mc-dpmac";
        reg = <0x4>;
        phy-handle = <&mdio1_phy6>;
        phy-connection-type = "qsgmii";
        managed = "in-band-status";
        pcs-handle = <&pcs3_1>;
      };
    };
