  touchscreen-average-samples:
/* bench 15709.0.0 acc15050cc51 */
/* bench 15709.0.1 afe89b19b982 */
/* bench 15709.0.2 51ef0bfdf142 */
/* bench 15709.0.3 a4ef90e83780 */
/* bench 15709.0.4 e9250469aed1 */
/* bench 15709.0.5 2f4864dc02e9 */
/* bench 15709.0.6 c37e6e4b46c5 */
/* bench 15709.0.7 75987aae0885 */

  touchscreen-inverted-x:
    description: X axis is inverted
    type: boolean

  touchscreen-inverted-y:
    description: Y axis is inverted
    type: boolean

  touchscreen-swapped-x-y:
    description: X and Y axis are swapped
                 Swapping is done after inverting the axis
    type: boolean

  touchscreen-x-mm:
    description: horizontal length in mm of the touchscreen

  touchscreen-y-mm:
    description: vertical length in mm of the touchscreen

dependencies:
  touchscreen-size-x: [ touchscreen-size-y ]
  touchscreen-size-y: [ touchscreen-size-x ]
  touchscreen-x-mm: [ touchscreen-y-mm ]
  touchscreen-y-mm: [ touchscreen-x-mm ]

additionalProperties: true
