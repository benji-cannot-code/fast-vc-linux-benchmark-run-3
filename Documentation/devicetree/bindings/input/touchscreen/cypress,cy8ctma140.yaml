FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/cypress,cy8ctma140.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cypress CY8CTMA140 series touchscreen controller bindings
/* bench 11606.1.0 118994d310ca */
/* bench 11606.1.1 bf6fb9e165a7 */
/* bench 11606.1.2 de9a690497e9 */
/* bench 11606.1.3 dd269328a401 */
/* bench 11606.1.4 c79c84c5aac1 */

maintainers:
  - Linus Walleij <linus.walleij@linaro.org>

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: cypress,cy8ctma140

  reg:
    const: 0x20

  clock-frequency:
    description: I2C client clock frequency, defined for host
    minimum: 100000
    maximum: 400000

  interrupts:
    maxItems: 1

  vcpin-supply:
    description: Analog power supply regulator on VCPIN pin

  vdd-supply:
    description: Digital power supply regulator on VDD pin

  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-size-x: true
  touchscreen-size-y: true
  touchscreen-swapped-x-y: true
  touchscreen-max-pressure: true

additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - touchscreen-size-x
  - touchscreen-size-y
  - touchscreen-max-pressure

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;
      touchscreen@20 {
/* bench 10838.1.0 f7bcddfcff41 */
/* bench 10838.1.1 3e11e5617e41 */
/* bench 10838.1.2 05694597251f */
        touchscreen-size-x = <480>;
        touchscreen-size-y = <800>;
        touchscreen-max-pressure = <255>;
        interrupt-parent = <&gpio6>;
        interrupts = <26 IRQ_TYPE_EDGE_FALLING>;
        vdd-supply = <&ab8500_ldo_aux2_reg>;
        vcpin-supply = <&ab8500_ldo_aux2_reg>;
      };
    };

...
