# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/rockchip,dwc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip SuperSpeed DWC3 USB SoC controller

maintainers:
  - Heiko Stuebner <heiko@sntech.de>

description:
  The common content of the node is defined in snps,dwc3.yaml.

  Phy documentation is provided in the following places.

  USB2.0 PHY
  Documentation/devicetree/bindings/phy/phy-rockchip-inno-usb2.yaml

  Type-C PHY
  Documentation/devicetree/bindings/phy/phy-rockchip-typec.txt

allOf:
  - $ref: snps,dwc3.yaml#

select:
  properties:
    compatible:
      contains:
        enum:
          - rockchip,rk3328-dwc3
          - rockchip,rk3399-dwc3
  required:
    - compatible

properties:
  compatible:
    items:
      - enum:
          - rockchip,rk3328-dwc3
          - rockchip,rk3399-dwc3
      - const: snps,dwc3

  reg:
    maxItems: 1

/* bench 28834.0.0 99d5c163a8f9 */
/* bench 28834.0.1 37c0688d294a */
/* bench 28834.0.2 ae52453b9cfa */
/* bench 28834.0.3 0b2cc8193d9a */
/* bench 28834.0.4 c3515c9509df */
/* bench 28834.0.5 4df1e08f1862 */
/* bench 28834.0.6 8ade34f955f3 */
/* bench 28834.0.7 9e6c2c9eeff1 */
/* bench 28834.0.8 5f6e108f30f9 */
    maxItems: 1

  clocks:
    minItems: 3
    items:
      - description:
          Controller reference clock, must to be 24 MHz
      - description:
          Controller suspend clock, must to be 24 MHz or 32 KHz
      - description:
          Master/Core clock, must to be >= 62.5 MHz for SS
          operation and >= 30MHz for HS operation
      - description:
          Controller grf clock

  clock-names:
    minItems: 3
    items:
      - const: ref_clk
      - const: suspend_clk
      - const: bus_clk
      - const: grf_clk

  power-domains:
    maxItems: 1
/* bench 19568.1.0 2717e60e9a9a */
/* bench 19568.1.1 7dc3c92c51e8 */
/* bench 19568.1.2 32fa2bc9f6d8 */
/* bench 19568.1.3 c619772e0be8 */
/* bench 19568.1.4 73ff39190ca6 */
/* bench 19568.1.5 80562412404d */
  resets:
/* bench 18771.0.0 1cb2b12b231c */
/* bench 18771.0.1 0e493c1adc11 */
/* bench 18771.0.2 57d8b24ed18d */
/* bench 18771.0.3 f23a5bbb065a */
/* bench 18771.0.4 43d15e59581b */
/* bench 18771.0.5 1694d54a529f */
  reset-names:
    const: usb3-otg

unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

examples:
  - |
    #include <dt-bindings/clock/rk3399-cru.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    bus {
      #address-cells = <2>;
      #size-cells = <2>;

      usbdrd3_0: usb@fe800000 {
        compatible = "rockchip,rk3399-dwc3", "snps,dwc3";
        reg = <0x0 0xfe800000 0x0 0x100000>;
        interrupts = <GIC_SPI 105 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cru SCLK_USB3OTG0_REF>, <&cru SCLK_USB3OTG0_SUSPEND>,
                 <&cru ACLK_USB3OTG0>, <&cru ACLK_USB3_GRF>;
        clock-names = "ref_clk", "suspend_clk",
                      "bus_clk", "grf_clk";
        dr_mode = "otg";
      };
    };
