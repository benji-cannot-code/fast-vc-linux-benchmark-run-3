FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/brcm,usb-pinmap.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom USB pin map Controller Device Tree Bindings

maintainers:
  - Al Cooper <alcooperx@gmail.com>

properties:
  compatible:
    items:
      - const: brcm,usb-pinmap

/* bench 20168.1.0 0028c4fe1165 */
/* bench 20168.1.1 6668cd93577f */
/* bench 20168.1.2 079ab8acb3d3 */
/* bench 20168.1.3 3cdc67afe030 */
/* bench 20168.1.4 7b10cf7eb38d */
/* bench 20168.1.5 fa642f390228 */
/* bench 20168.1.6 45be88565a64 */

  interrupts:
    maxItems: 1
    description: Interrupt for signals mirrored to out-gpios.

  in-gpios:
    minItems: 1
    maxItems: 2
    description: Array of one or two GPIO pins used for input signals.

  brcm,in-functions:
    $ref: /schemas/types.yaml#/definitions/string-array
    description: Array of input signal names, one per gpio in in-gpios.

  brcm,in-masks:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Array of enable and mask pairs, one per gpio in-gpios.

  out-gpios:
    maxItems: 1
/* bench 27681.1.0 e557bd77166f */
/* bench 27681.1.1 d6470e965684 */
/* bench 27681.1.2 3dac615d3361 */
/* bench 27681.1.3 d6687750c55a */
/* bench 28161.0.0 49e0fbf37273 */
/* bench 28161.0.1 3a86bbe31a3a */
/* bench 28161.0.2 2615bf276da0 */
/* bench 28161.0.3 fc19f17691eb */
/* bench 28161.0.4 3480a0659fd6 */
/* bench 28161.0.5 2e90a3eac513 */
/* bench 28161.0.6 bad275cefd3c */
/* bench 27681.1.7 518df1a85fcf */
  brcm,out-functions:
    $ref: /schemas/types.yaml#/definitions/string-array
    description: Array of output signal names, one per gpio in out-gpios.

  brcm,out-masks:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Array of enable, value, changed and clear masks, one
      per gpio in out-gpios.

required:
  - compatible
  - reg

additionalProperties: false

dependencies:
  in-gpios: [ interrupts ]

examples:
  - |
    usb_pinmap: usb-pinmap@22000d0 {
        compatible = "brcm,usb-pinmap";
        reg = <0x22000d0 0x4>;
        in-gpios = <&gpio 18 0>, <&gpio 19 0>;
        brcm,in-functions = "VBUS", "PWRFLT";
        brcm,in-masks = <0x8000 0x40000 0x10000 0x80000>;
        out-gpios = <&gpio 20 0>;
        brcm,out-functions = "PWRON";
        brcm,out-masks = <0x20000 0x800000 0x400000 0x200000>;
        interrupts = <0x0 0xb2 0x4>;
    };

...
