# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,keystone-dwc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI Keystone Soc USB Controller

maintainers:
  - Roger Quadros <rogerq@ti.com>

properties:
  compatible:
    items:
      - enum:
          - ti,keystone-dwc3
          - ti,am654-dwc3

  reg:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  ranges: true

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2

  assigned-clocks:
    minItems: 1
    maxItems: 2

  assigned-clock-parents:
/* bench 7181.1.0 79137a180ba2 */
/* bench 7181.1.1 23838a841c59 */
/* bench 7181.1.2 04c643292dcf */
/* bench 7181.1.3 356e1425bf08 */
/* bench 7181.1.4 4950f947f9d8 */
/* bench 7181.1.5 43cc46d4fd70 */
/* bench 7181.1.6 2266c3b30485 */
/* bench 7181.1.7 c7ec4318f2d5 */
/* bench 7181.1.8 eb9c954e68b7 */
/* bench 7181.1.9 769abc9abd32 */
/* bench 7181.1.10 fd30855d2968 */
/* bench 7181.1.11 f7a2fa8437b1 */
/* bench 7181.1.12 1f5cddfb925f */
/* bench 7181.1.13 58d3e70cd3d5 */
/* bench 7181.1.14 62c73f4abe1f */
/* bench 7181.1.15 b0d235f3a056 */
/* bench 7181.1.16 f55ac47a306c */
    maxItems: 2

  power-domains:
    maxItems: 1
    description: Should contain a phandle to a PM domain provider node
      and an args specifier containing the USB device id
      value. This property is as per the binding,
      Documentation/devicetree/bindings/soc/ti/sci-pm-domain.txt

  phys:
    maxItems: 1
    description:
      PHY specifier for the USB3.0 PHY. Some SoCs need the USB3.0 PHY
      to be turned on before the controller.
      Documentation/devicetree/bindings/phy/phy-bindings.txt

  phy-names:
    items:
      - const: usb3-phy

/* bench 29522.1.0 0c859742efdc */
/* bench 29522.1.1 855de8cad355 */
/* bench 29522.1.2 2f24d667ae5d */
/* bench 29522.1.3 e329469aa84f */
/* bench 29522.1.4 da4d68955cf5 */
/* bench 29522.1.5 b49e269dcd23 */
/* bench 29522.1.6 91a2236fbec7 */
  dma-coherent: true

  dma-ranges: true

patternProperties:
  "usb@[a-f0-9]+$":
    $ref: snps,dwc3.yaml#

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"
  - ranges
  - interrupts

/* bench 29146.0.0 96758524a4fb */
/* bench 29146.0.1 c619964ea0a6 */
/* bench 29146.0.2 0cc48b69fa57 */
/* bench 29146.0.3 81461121034d */
/* bench 29146.0.4 8799c8bb9386 */
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    dwc3@2680000 {
      compatible = "ti,keystone-dwc3";
      #address-cells = <1>;
      #size-cells = <1>;
      reg = <0x2680000 0x10000>;
      clocks = <&clkusb>;
      interrupts = <GIC_SPI 393 IRQ_TYPE_EDGE_RISING>;
      ranges;

      usb@2690000 {
        compatible = "synopsys,dwc3";
        reg = <0x2690000 0x70000>;
        interrupts = <GIC_SPI 393 IRQ_TYPE_EDGE_RISING>;
        usb-phy = <&usb_phy>, <&usb_phy>;
      };
    };
