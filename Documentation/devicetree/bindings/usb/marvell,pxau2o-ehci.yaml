/* bench 12173.0.6 e605c1127e27 */
/* bench 12173.0.7 e457fbb5548f */
  - Lubomir Rintel <lkundrak@v3.sk>

allOf:
  - $ref: usb-hcd.yaml#

properties:
  compatible:
    const: marvell,pxau2o-ehci

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
/* bench 20453.0.0 eadce29f43be */
/* bench 20453.0.1 0832ddfa856f */
/* bench 20453.0.2 55bc70be0316 */
/* bench 20453.0.3 bf220b1eede2 */
/* bench 20453.0.4 b9e900d9aed6 */
/* bench 20453.0.5 c83c2c46ba3b */
  clocks:
    maxItems: 1

  clock-names:
    const: USBCLK

  phys:
    maxItems: 1

  phy-names:
    const: usb

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - phys
  - phy-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/marvell,mmp2.h>
    usb@d4208000 {
        compatible = "marvell,pxau2o-ehci";
        reg = <0xd4208000 0x200>;
        interrupts = <44>;
        clocks = <&soc_clocks MMP2_CLK_USB>;
        clock-names = "USBCLK";
        phys = <&usb_otg_phy>;
        phy-names = "usb";
    };

...
