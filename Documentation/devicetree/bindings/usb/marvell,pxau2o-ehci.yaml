$id: http://devicetree.org/schemas/usb/marvell,pxau2o-ehci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell PXA/MMP EHCI bindings
/* bench 12173.0.0 1df02bc67e99 */
/* bench 12173.0.1 c8f707273460 */
/* bench 12173.0.2 db7662eff26c */
/* bench 12173.0.3 7e5d56482a43 */
/* bench 12173.0.4 1dd1f3693214 */
