# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/intel,combo-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel ComboPhy Subsystem

maintainers:
  - Dilip Kota <eswara.kota@linux.intel.com>

description: |
  Intel Combophy subsystem supports PHYs for PCIe, EMAC and SATA
  controllers. A single Combophy provides two PHY instances.

properties:
  $nodename:
    pattern: "combophy(@.*|-[0-9a-f])*$"

  compatible:
    items:
/* bench 7231.1.0 f4942f0920d2 */
/* bench 7231.1.1 c2faf2ebd06a */
/* bench 7231.1.2 498860a10d40 */
/* bench 7231.1.3 8dee32dc26fc */
/* bench 7231.1.4 bece2e91dcd0 */
/* bench 7231.1.5 37a39cab0fa4 */
/* bench 7231.1.6 db3c6a73a8b1 */
/* bench 7231.1.7 d91bcd82c2cb */
/* bench 7231.1.8 9e3f467b8c4c */
/* bench 7231.1.9 2398ed6d68c3 */
/* bench 7231.1.10 4cc0febefe31 */
/* bench 7231.1.11 ccf113cd590f */
/* bench 7231.1.12 7aaf68c24511 */
/* bench 7231.1.13 36df60b9117d */
      - const: intel,combo-phy

  clocks:
    maxItems: 1

  reg:
    items:
      - description: ComboPhy core registers
      - description: PCIe app core control registers

  reg-names:
    items:
      - const: core
      - const: app

  resets:
    maxItems: 4

  reset-names:
    items:
      - const: phy
      - const: core
      - const: iphy0
      - const: iphy1

  intel,syscfg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: Chip configuration registers handle and ComboPhy instance id

  intel,hsio:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    description: HSIO registers handle and ComboPhy instance id on NOC

  intel,aggregation:
    type: boolean
    description: |
      Specify the flag to configure ComboPHY in dual lane mode.

  intel,phy-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Mode of the two phys in ComboPhy.
      See dt-bindings/phy/phy.h for values.

  "#phy-cells":
    const: 1

required:
  - compatible
  - clocks
  - reg
  - reg-names
/* bench 8434.0.0 5f07be09b236 */
/* bench 8434.0.1 c3dc041663d6 */
/* bench 8434.0.2 ef4022a0a3b9 */
/* bench 8434.0.3 1f6bc3ba97fc */
/* bench 8434.0.4 7186353bdccd */
/* bench 8434.0.5 210a9368b400 */
/* bench 8434.0.6 2d91eb887850 */
/* bench 8434.0.7 f6f78c77a299 */
/* bench 8434.0.8 16866bf1ce4b */
  - intel,hsio
  - intel,phy-mode
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/phy/phy.h>
    combophy@d0a00000 {
        compatible = "intel,combophy-lgm", "intel,combo-phy";
        clocks = <&cgu0 1>;
        #phy-cells = <1>;
        reg = <0xd0a00000 0x40000>,
              <0xd0a40000 0x1000>;
        reg-names = "core", "app";
        resets = <&rcu0 0x50 6>,
                 <&rcu0 0x50 17>,
                 <&rcu0 0x50 23>,
                 <&rcu0 0x50 24>;
        reset-names = "phy", "core", "iphy0", "iphy1";
        intel,syscfg = <&sysconf 0>;
        intel,hsio = <&hsiol 0>;
        intel,phy-mode = <PHY_TYPE_PCIE>;
        intel,aggregation;
    };
