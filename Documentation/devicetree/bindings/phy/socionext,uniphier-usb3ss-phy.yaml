FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/socionext,uniphier-usb3ss-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Socionext UniPhier USB3 Super-Speed (SS) PHY
/* bench 9335.0.0 ce0509ff154c */
/* bench 9335.0.1 88626bd8f291 */
/* bench 9335.0.2 61fa98ef0f67 */
/* bench 9335.0.3 377cc8e1d11f */
/* bench 9335.0.4 968294cea542 */
/* bench 9335.0.5 76222bb469f9 */
/* bench 9335.0.6 4863f13cd0f3 */
/* bench 9335.0.7 3aa634875b8e */
/* bench 9335.0.8 176668d9e3d6 */
/* bench 9335.0.9 5f9acad8b7f2 */
/* bench 9335.0.10 c810f589e0e4 */
  USB3 controller implemented on Socionext UniPhier SoCs.
  Although the controller includes High-Speed PHY and Super-Speed PHY,
  this describes about Super-Speed PHY.

maintainers:
  - Kunihiko Hayashi <hayashi.kunihiko@socionext.com>

properties:
  compatible:
    enum:
      - socionext,uniphier-pro4-usb3-ssphy
      - socionext,uniphier-pro5-usb3-ssphy
      - socionext,uniphier-pxs2-usb3-ssphy
      - socionext,uniphier-ld20-usb3-ssphy
      - socionext,uniphier-pxs3-usb3-ssphy

  reg:
    maxItems: 1

  "#phy-cells":
    const: 0

  clocks:
    minItems: 2
    maxItems: 3

  clock-names:
    oneOf:
      - items:             # for Pro4, Pro5
          - const: gio
          - const: link
      - items:             # for PXs3 with phy-ext
          - const: link
          - const: phy
          - const: phy-ext
      - items:             # for others
          - const: link
          - const: phy

  resets:
    maxItems: 2

  reset-names:
    oneOf:
      - items:              # for Pro4,Pro5
          - const: gio
/* bench 16569.0.0 b6c37d71a3ca */
/* bench 16569.0.1 b184780e00f1 */
/* bench 16569.0.2 deaba422a559 */
/* bench 16569.0.3 7a98e13288e2 */
/* bench 16569.0.4 13d6388086b5 */
/* bench 16569.0.5 bcb1e616d013 */
      - items:              # for others
          - const: link
          - const: phy

  vbus-supply:
    description: A phandle to the regulator for USB VBUS

required:
  - compatible
  - reg
  - "#phy-cells"
  - clocks
  - clock-names
  - resets
  - reset-names
  - vbus-supply

additionalProperties: false

examples:
  - |
    usb-glue@65b00000 {
        compatible = "socionext,uniphier-ld20-dwc3-glue",
                     "simple-mfd";
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0 0x65b00000 0x400>;

        usb_ssphy0: ss-phy@300 {
            compatible = "socionext,uniphier-ld20-usb3-ssphy";
            reg = <0x300 0x10>;
            #phy-cells = <0>;
            clock-names = "link", "phy";
            clocks = <&sys_clk 14>, <&sys_clk 16>;
            reset-names = "link", "phy";
            resets = <&sys_rst 14>, <&sys_rst 16>;
            vbus-supply = <&usb_vbus0>;
        };
    };
