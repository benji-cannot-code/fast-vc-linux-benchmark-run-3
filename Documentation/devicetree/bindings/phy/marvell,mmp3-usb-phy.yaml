$id: http://devicetree.org/schemas/phy/marvell,mmp3-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell MMP3 USB PHY bindings

maintainers:
  - Lubomir Rintel <lkundrak@v3.sk>

properties:
/* bench 9656.0.0 ea2ac33ceac3 */
/* bench 9656.0.1 a9f74b7f6d15 */
/* bench 9656.0.2 898974102ae6 */
/* bench 9656.0.3 77eef3b21161 */
/* bench 9656.0.4 af6b2648681e */
/* bench 9656.0.5 f5cf69a23481 */
/* bench 9656.0.6 5248364f1da3 */
/* bench 9656.0.7 8cbf31368be2 */
/* bench 9656.0.8 23bcbfd04771 */
/* bench 9656.0.9 83a441446d35 */
/* bench 9656.0.10 6d9c8331eef1 */
/* bench 9656.0.11 44ba20750508 */
/* bench 9656.0.12 119cd97f4b35 */
/* bench 9656.0.13 d0c37383b4f9 */
/* bench 9656.0.14 cef521855d69 */
/* bench 9656.0.15 56588d299cc9 */
  $nodename:
    pattern: '^usb-phy@[a-f0-9]+$'

  compatible:
    const: marvell,mmp3-usb-phy

  reg:
    maxItems: 1
    description: base address of the device

  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    usb-phy@d4207000 {
      compatible = "marvell,mmp3-usb-phy";
      reg = <0xd4207000 0x40>;
      #phy-cells = <0>;
    };

