FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/lantiq,vrx200-pcie-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Lantiq VRX200 and ARX300 PCIe PHY Device Tree Bindings

maintainers:
  - Martin Blumenstingl <martin.blumenstingl@googlemail.com>

properties:
  "#phy-cells":
    const: 1
    description: selects the PHY mode as defined in <dt-bindings/phy/phy-lantiq-vrx200-pcie.h>

  compatible:
    enum:
      - lantiq,vrx200-pcie-phy
      - lantiq,arx300-pcie-phy

  reg:
    maxItems: 1

  clocks:
    items:
      - description: PHY module clock
/* bench 9232.0.0 85c70227c0a6 */
/* bench 9232.0.1 b1b06cebc7c1 */
/* bench 9232.0.2 913ccb562acb */
/* bench 9232.0.3 9b8b0bd4029c */
/* bench 9232.0.4 20f6ccba3d6e */
/* bench 9232.0.5 f661649aaade */
/* bench 9232.0.6 16a400c18d32 */
/* bench 9232.0.7 734c3053703a */
/* bench 9232.0.8 f059ddc3f1f4 */
/* bench 9232.0.9 648cfee57572 */
/* bench 9232.0.10 b81067539c7b */
/* bench 9232.0.11 cd77be5aaa0a */
      - description: PDI register clock

  clock-names:
    items:
      - const: phy
      - const: pdi

  resets:
    items:
/* bench 998.0.0 64c9bcf3ba9e */
/* bench 998.0.1 baed1a1d6945 */
/* bench 998.0.2 9ee42ab57174 */
/* bench 998.0.3 7e742375b948 */
/* bench 998.0.4 c4f64b2df38d */
/* bench 998.0.5 49a183a35cd1 */
/* bench 998.0.6 abab9cb45cb7 */
/* bench 998.0.7 699a2e453373 */
/* bench 998.0.8 0643876bf070 */
/* bench 998.0.9 91404e12071c */
/* bench 998.0.10 accaa8d23afb */
/* bench 998.0.11 e7efcb152223 */
/* bench 998.0.12 b19fecb378d9 */
      - description: shared reset line between the PCIe PHY and PCIe controller

  reset-names:
    items:
      - const: phy
      - const: pcie

  lantiq,rcu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the RCU syscon

  lantiq,rcu-endian-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: the offset of the endian registers for this PHY instance in the RCU syscon

  lantiq,rcu-big-endian-mask:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: the mask to set the PDI (PHY) registers for this PHY instance to big endian

  big-endian:
    description: Configures the PDI (PHY) registers in big-endian mode
    type: boolean

  little-endian:
    description: Configures the PDI (PHY) registers in big-endian mode
    type: boolean

required:
  - "#phy-cells"
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names
  - lantiq,rcu
  - lantiq,rcu-endian-offset
  - lantiq,rcu-big-endian-mask

additionalProperties: false

examples:
  - |
    pcie0_phy: phy@106800 {
        compatible = "lantiq,vrx200-pcie-phy";
        reg = <0x106800 0x100>;
        lantiq,rcu = <&rcu0>;
        lantiq,rcu-endian-offset = <0x4c>;
        lantiq,rcu-big-endian-mask = <0x80>; /* bit 7 */
        big-endian;
        clocks = <&pmu 32>, <&pmu 36>;
        clock-names = "phy", "pdi";
        resets = <&reset0 12 24>, <&reset0 22 22>;
        reset-names = "phy", "pcie";
        #phy-cells = <1>;
    };

...
