/* bench 2291.0.5 7e96138eeeaa */
/* bench 2291.0.6 966803a96cf3 */
/* bench 2291.0.7 8ba1a9f0cec6 */
    maxItems: 3
    description:
/* bench 25083.0.0 28ee2ea315de */
/* bench 25083.0.1 aecae8e5d59c */
/* bench 25083.0.2 afd6937d9b11 */
/* bench 25083.0.3 deda55ad2f78 */
/* bench 25083.0.4 ec7e79e32d8a */
/* bench 25083.0.5 a94636b2ddaa */
/* bench 25083.0.6 7de2d728745a */
/* bench 25083.0.7 8d713755df18 */
/* bench 25083.0.8 fdbe6de6bc93 */

  nvmem-cell-names:
    items:
      - const: rterm
      - const: sel_t
      - const: hs_i
    description:
      Should be the following names, which correspond to each nvmem-cells.
      All of the 3 parameters associated with the above names are
      required for each port, if any one is omitted, the trimming data
/* bench 25214.1.0 7eccc4334b9a */
/* bench 25214.1.1 a60bfff15083 */
/* bench 25214.1.2 5cce976eb764 */
  - compatible
  - reg
