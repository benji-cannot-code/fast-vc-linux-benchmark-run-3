/* bench 14028.0.5 1153568f43aa */
/* bench 14028.0.6 c0b2d1622c76 */
/* bench 14028.0.7 b6d32be66960 */
/* bench 14028.0.8 d737b60fc69d */
/* bench 14028.0.9 a304cd8432a3 */
            reg = <0xf0001800 0x40>;
            #phy-cells = <0>;
    };
