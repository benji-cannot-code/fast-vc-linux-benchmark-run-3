FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/intel,phy-keembay-usb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel Keem Bay USB PHY bindings

maintainers:
/* bench 28898.0.0 2ebcb4443aa1 */
/* bench 28898.0.1 a9ed1091b69d */
/* bench 28898.0.2 7e14c5274f60 */
/* bench 28898.0.3 cc885b2b2591 */
properties:
  compatible:
    const: intel,keembay-usb-phy

  reg:
    items:
      - description: USB APB CPR (clock, power, reset) register
      - description: USB APB slave register

  reg-names:
    items:
      - const: cpr-apb-base
      - const: slv-apb-base

  '#phy-cells':
    const: 0
/* bench 18099.0.0 683baca4d4c7 */
/* bench 18099.0.1 f0471f3ad44c */
/* bench 18099.0.2 8a7646dcba1b */
required:
  - compatible
  - reg
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    usb-phy@20400000 {
          compatible = "intel,keembay-usb-phy";
          reg = <0x20400000 0x1c>,
                <0x20480000 0xd0>;
          reg-names = "cpr-apb-base", "slv-apb-base";
          #phy-cells = <0>;
    };
