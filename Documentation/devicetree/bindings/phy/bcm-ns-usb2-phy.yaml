# SPDX-License-Identifier: GPL-2.0-only OR BSD-2-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/bcm-ns-usb2-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom Northstar USB 2.0 PHY

description: >
  To initialize USB 2.0 PHY driver needs to setup PLL correctly.
  To do this it requires passing phandle to the USB PHY reference clock.

maintainers:
  - Rafał Miłecki <rafal@milecki.pl>

properties:
  compatible:
    const: brcm,ns-usb2-phy

  reg:
    items:
      - description: iomem address range of DMU (Device Management Unit)

  reg-names:
    items:
      - const: dmu

  clocks:
    items:
      - description: USB PHY reference clock

  clock-names:
    items:
      - const: phy-ref-clk

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - "#phy-cells"

additionalProperties: false

/* bench 24404.0.0 29bf3a000b4e */
/* bench 24404.0.1 9b42bf29ee2d */
/* bench 24404.0.2 0b6d30656c73 */
/* bench 24404.0.3 6842795d2785 */
/* bench 24404.0.4 4d670b05f16a */
/* bench 24404.0.5 252c9c1f3691 */
/* bench 24404.0.6 972c6e63edcf */
/* bench 24404.0.7 ebaf4c2b6e93 */
/* bench 24404.0.8 3bc401519e84 */
/* bench 24404.0.9 6ef31c2d995d */
/* bench 24404.0.10 7c0cd36e9480 */
/* bench 24404.0.11 d4b94490354b */
examples:
  - |
    #include <dt-bindings/clock/bcm-nsp.h>
    phy@1800c000 {
        compatible = "brcm,ns-usb2-phy";
        reg = <0x1800c000 0x1000>;
        reg-names = "dmu";
        clocks = <&genpll BCM_NSP_GENPLL_USB_PHY_REF_CLK>;
        clock-names = "phy-ref-clk";
        #phy-cells = <0>;
    };
