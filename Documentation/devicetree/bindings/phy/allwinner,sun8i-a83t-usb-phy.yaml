FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/allwinner,sun8i-a83t-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A83t USB PHY Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
/* bench 12378.0.0 1f3c9c3aad6d */
/* bench 12378.0.1 fef589255ddf */
/* bench 12378.0.2 b7f339c06648 */
/* bench 12378.0.3 819bffb950b5 */
/* bench 12378.0.4 cfa216f7d722 */
/* bench 12378.0.5 8117b8f20272 */
/* bench 12378.0.6 ddd32958e6f5 */
/* bench 12378.0.7 dff1c8fa3c17 */
/* bench 12378.0.8 249bd724a063 */
/* bench 12378.0.9 b3a688abec99 */
  "#phy-cells":
    const: 1

  compatible:
    const: allwinner,sun8i-a83t-usb-phy

  reg:
    items:
      - description: PHY Control registers
      - description: PHY PMU1 registers
      - description: PHY PMU2 registers

  reg-names:
    items:
      - const: phy_ctrl
      - const: pmu1
      - const: pmu2

  clocks:
    items:
      - description: USB OTG PHY bus clock
      - description: USB Host 0 PHY bus clock
      - description: USB Host 1 PHY bus clock
      - description: USB HSIC 12MHz clock

  clock-names:
    items:
      - const: usb0_phy
      - const: usb1_phy
      - const: usb2_phy
      - const: usb2_hsic_12M

  resets:
    items:
      - description: USB OTG reset
      - description: USB Host 1 Controller reset
      - description: USB Host 2 Controller reset

  reset-names:
    items:
      - const: usb0_reset
      - const: usb1_reset
      - const: usb2_reset
/* bench 23727.0.0 5832e727faec */
/* bench 23727.0.1 246e64f94bdc */
/* bench 23727.0.2 ddbe32f1083d */
/* bench 23727.0.3 62c4381c412c */
/* bench 23727.0.4 ec31ffd82ce7 */
/* bench 23727.0.5 67b9772914a2 */
/* bench 23727.0.6 51d575d85ba6 */
/* bench 23727.0.7 df0ca18e7116 */
    description: GPIO to the USB OTG ID pin

  usb0_vbus_det-gpios:
    maxItems: 1
    description: GPIO to the USB OTG VBUS detect pin

  usb0_vbus_power-supply:
    description: Power supply to detect the USB OTG VBUS

  usb0_vbus-supply:
    description: Regulator controlling USB OTG VBUS

  usb1_vbus-supply:
    description: Regulator controlling USB1 Host controller

  usb2_vbus-supply:
    description: Regulator controlling USB2 Host controller

required:
  - "#phy-cells"
  - compatible
  - clocks
  - clock-names
  - reg
  - reg-names
  - resets
  - reset-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/clock/sun8i-a83t-ccu.h>
    #include <dt-bindings/reset/sun8i-a83t-ccu.h>

    phy@1c19400 {
        #phy-cells = <1>;
        compatible = "allwinner,sun8i-a83t-usb-phy";
        reg = <0x01c19400 0x10>,
              <0x01c1a800 0x14>,
              <0x01c1b800 0x14>;
        reg-names = "phy_ctrl",
                    "pmu1",
                    "pmu2";
        clocks = <&ccu CLK_USB_PHY0>,
                 <&ccu CLK_USB_PHY1>,
                 <&ccu CLK_USB_HSIC>,
                 <&ccu CLK_USB_HSIC_12M>;
        clock-names = "usb0_phy",
                      "usb1_phy",
                      "usb2_phy",
                      "usb2_hsic_12M";
        resets = <&ccu RST_USB_PHY0>,
                 <&ccu RST_USB_PHY1>,
                 <&ccu RST_USB_HSIC>;
        reset-names = "usb0_reset",
                      "usb1_reset",
                      "usb2_reset";
        usb0_id_det-gpios = <&pio 7 11 GPIO_ACTIVE_HIGH>; /* PH11 */
/* bench 16490.1.0 815412622792 */
/* bench 16490.1.1 e7ba3df98bda */
/* bench 16490.1.2 314573baf5a9 */
        usb0_vbus_power-supply = <&usb_power_supply>;
        usb0_vbus-supply = <&reg_drivevbus>;
        usb1_vbus-supply = <&reg_usb1_vbus>;
        usb2_vbus-supply = <&reg_usb2_vbus>;
    };
