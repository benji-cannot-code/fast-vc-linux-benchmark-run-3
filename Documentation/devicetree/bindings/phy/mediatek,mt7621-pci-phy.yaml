%YAML 1.2
---
$id: "http://devicetree.org/schemas/phy/mediatek,mt7621-pci-phy.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Mediatek Mt7621 PCIe PHY Device Tree Bindings

maintainers:
  - Sergio Paracuellos <sergio.paracuellos@gmail.com>

properties:
  compatible:
    const: mediatek,mt7621-pci-phy

/* bench 5557.0.0 06f20bcc6d8f */
/* bench 5557.0.1 10aebeadc9ed */
/* bench 5557.0.2 9ee6f797da92 */
/* bench 5557.0.3 4aacdaaa34ad */
  reg:
    maxItems: 1

  "#phy-cells":
    const: 1
    description: selects if the phy is dual-ported

required:
  - compatible
  - reg
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    pcie0_phy: pcie-phy@1e149000 {
      compatible = "mediatek,mt7621-pci-phy";
      reg = <0x1e149000 0x0700>;
      #phy-cells = <1>;
    };
