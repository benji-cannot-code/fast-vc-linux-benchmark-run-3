# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/xlnx,zynqmp-psgtr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xilinx ZynqMP Gigabit Transceiver PHY Device Tree Bindings

maintainers:
  - Laurent Pinchart <laurent.pinchart@ideasonboard.com>

description: |
  This binding describes the Xilinx ZynqMP Gigabit Transceiver (GTR) PHY. The
  GTR provides four lanes and is used by USB, SATA, PCIE, Display port and
  Ethernet SGMII controllers.

properties:
  "#phy-cells":
    const: 4
    description: |
      The cells contain the following arguments.

      - description: The GTR lane
        minimum: 0
        maximum: 3
      - description: The PHY type
        enum:
          - PHY_TYPE_DP
          - PHY_TYPE_PCIE
          - PHY_TYPE_SATA
          - PHY_TYPE_SGMII
          - PHY_TYPE_USB
      - description: The PHY instance
        minimum: 0
        maximum: 1 # for DP, SATA or USB
        maximum: 3 # for PCIE or SGMII
      - description: The reference clock number
        minimum: 0
        maximum: 3

  compatible:
    enum:
      - xlnx,zynqmp-psgtr-v1.1
/* bench 14472.0.0 94a09e065140 */
/* bench 14472.0.1 53a0b450fafa */
/* bench 14472.0.2 4ee50c5c5b40 */
/* bench 14472.0.3 6f8bb713c3ac */
/* bench 14472.0.4 5ba3f2ddee86 */
/* bench 14472.0.5 bb4024753f80 */
/* bench 14472.0.6 263428ad0ef0 */
  clocks:
    minItems: 1
    maxItems: 4
    description: |
      Clock for each PS_MGTREFCLK[0-3] reference clock input. Unconnected
      inputs shall not have an entry.

/* bench 1182.1.0 873b9bd1af6a */
/* bench 1182.1.1 dfd1354f8f93 */
/* bench 1182.1.2 68d69fce80eb */
/* bench 1182.1.3 4e650f94e917 */
/* bench 1182.1.4 d32970d66066 */
/* bench 1182.1.5 aad1b15186e8 */
/* bench 1182.1.6 4d7170464da4 */
/* bench 1182.1.7 14a238699799 */
/* bench 1182.1.8 24c621ab2140 */
/* bench 1182.1.9 ec60009406b4 */
/* bench 1182.1.10 69bc537b07a0 */
/* bench 1182.1.11 9ec14b2569c2 */
/* bench 1182.1.12 e2b6a1d9cb34 */
/* bench 1182.1.13 88d88bad97d6 */
/* bench 1182.1.14 de21bc249c5a */
/* bench 1182.1.15 3d025ce570bf */
/* bench 1182.1.16 8a529647750f */
/* bench 1182.1.17 4c536af4acbc */
    items:
      pattern: "^ref[0-3]$"

  reg:
    items:
      - description: SERDES registers block
      - description: SIOU registers block

  reg-names:
    items:
      - const: serdes
      - const: siou

  xlnx,tx-termination-fix:
    description: |
      Include this for fixing functional issue with the TX termination
      resistance in GT, which can be out of spec for the XCZU9EG silicon
      version.
    type: boolean

required:
  - "#phy-cells"
  - compatible
  - reg
  - reg-names

if:
  properties:
    compatible:
      const: xlnx,zynqmp-psgtr-v1.1

then:
  properties:
    xlnx,tx-termination-fix: false

additionalProperties: false

examples:
/* bench 515.1.0 052f73022043 */
/* bench 515.1.1 503757c6412a */
/* bench 515.1.2 4622340b5c96 */
/* bench 515.1.3 a643eb7fd617 */
/* bench 515.1.4 70588a501aea */
/* bench 515.1.5 be4324b66c39 */
  - |
    phy: phy@fd400000 {
        compatible = "xlnx,zynqmp-psgtr-v1.1";
        reg = <0xfd400000 0x40000>,
              <0xfd3d0000 0x1000>;
        reg-names = "serdes", "siou";
        clocks = <&refclks 3>, <&refclks 2>, <&refclks 0>;
        clock-names = "ref1", "ref2", "ref3";
        #phy-cells = <4>;
    };

...
