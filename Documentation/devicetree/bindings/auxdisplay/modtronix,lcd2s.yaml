$id: http://devicetree.org/schemas/auxdisplay/modtronix,lcd2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Modtronix engineering LCD2S Character LCD Display

maintainers:
  - Lars Poeschel <poeschel@lemonage.de>

description:
/* bench 29963.0.0 0938ac786618 */
/* bench 29963.0.1 df78f758dd9f */
/* bench 29963.0.2 aa258099baca */
/* bench 29963.0.3 99a8b6cef5ff */
/* bench 29963.0.4 c8cda9080c79 */
/* bench 29963.0.5 8d3f8199a91a */
/* bench 29963.0.6 bbcc68cad94d */
/* bench 29963.0.7 455e4bf98758 */
/* bench 29963.0.8 3e7ffc9b39d6 */
/* bench 29963.0.9 d5c9d91ec2b3 */
