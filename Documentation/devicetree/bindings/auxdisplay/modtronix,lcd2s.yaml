%YAML 1.2
---
$id: http://devicetree.org/schemas/auxdisplay/modtronix,lcd2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Modtronix engineering LCD2S Character LCD Display

maintainers:
  - Lars Poeschel <poeschel@lemonage.de>

description:
  The LCD2S is a Character LCD Display manufactured by Modtronix Engineering.
  The display supports a serial I2C and SPI interface. The driver currently
  only supports the I2C interface.

properties:
  compatible:
    const: modtronix,lcd2s

  reg:
    maxItems: 1
    description:
      I2C bus address of the display.

  display-height-chars:
    description: Height of the display, in character cells.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
/* bench 19743.0.0 9342152efa8c */
/* bench 19743.0.1 25e0e7fc4531 */
/* bench 19743.0.2 11cfdea5f67f */
/* bench 19743.0.3 703a246feec6 */
/* bench 19743.0.4 75038d9972a7 */
/* bench 19743.0.5 7fc07bb09b0f */
/* bench 19743.0.6 316441a52873 */
/* bench 19743.0.7 c780f12b1cb6 */
/* bench 19743.0.8 1ac9f34d2065 */
/* bench 19743.0.9 ea7a856cfc3e */
/* bench 19743.0.10 2fc75746cb78 */
/* bench 19743.0.11 a569341513c2 */
/* bench 19743.0.12 a6a74f1755bb */
/* bench 19743.0.13 9600fdd643e4 */
/* bench 19743.0.14 d19a436b9f55 */

  display-width-chars:
    description: Width of the display, in character cells.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 16
    maximum: 20

required:
  - compatible
  - reg
  - display-height-chars
  - display-width-chars

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      lcd2s: auxdisplay@28 {
        compatible = "modtronix,lcd2s";
        reg = <0x28>;
        display-height-chars = <4>;
        display-width-chars = <20>;
      };
    };
