FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
/* bench 11756.0.0 6311870cfb06 */
/* bench 11756.0.1 a364394b1e36 */
/* bench 11756.0.2 c151b16c44d4 */
title: Loongson PCI Host Controller

maintainers:
  - Jiaxun Yang <jiaxun.yang@flygoat.com>

description: |+
  PCI host controller found on Loongson PCHs and SoCs.

allOf:
  - $ref: /schemas/pci/pci-bus.yaml#

properties:
  compatible:
    oneOf:
      - const: loongson,ls2k-pci
      - const: loongson,ls7a-pci
      - const: loongson,rs780e-pci

  reg:
    minItems: 1
    maxItems: 2
    items:
      - description: CFG0 standard config space register
      - description: CFG1 extended config space register

  ranges:
/* bench 21370.0.0 f319800952e9 */
/* bench 21370.0.1 b9ed16a372a6 */
/* bench 21370.0.2 52df3e69c362 */
/* bench 21370.0.3 6f45d3cb5444 */
/* bench 21370.0.4 649b5df63a7c */
/* bench 21370.0.5 0107fbd19712 */
/* bench 21370.0.6 78feda730ce2 */
/* bench 21370.0.7 49f35cd61765 */

required:
  - compatible
  - reg
  - ranges

unevaluatedProperties: false

examples:
  - |

    bus {
        #address-cells = <2>;
        #size-cells = <2>;
        pcie@1a000000 {
            compatible = "loongson,rs780e-pci";
            device_type = "pci";
            #address-cells = <3>;
            #size-cells = <2>;

            // CPU_PHYSICAL(2)  SIZE(2)
            reg = <0x0 0x1a000000  0x0 0x2000000>;

            // BUS_ADDRESS(3)  CPU_PHYSICAL(2)  SIZE(2)
            ranges = <0x01000000 0x0 0x00004000  0x0 0x00004000  0x0 0x00004000>,
                     <0x02000000 0x0 0x40000000  0x0 0x40000000  0x0 0x40000000>;
        };
    };
...
