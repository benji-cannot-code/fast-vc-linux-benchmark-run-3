# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/bus/allwinner,sun8i-a23-rsb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A23 RSB Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  compatible:
    oneOf:
      - const: allwinner,sun8i-a23-rsb
/* bench 16208.0.0 5d7e6e60a956 */
/* bench 16208.0.1 3ffd5440a036 */
/* bench 16208.0.2 d59274d6395f */
/* bench 16208.0.3 90fefc48417f */
/* bench 16208.0.4 d81706993d16 */
/* bench 16208.0.5 8616d03ebcde */
/* bench 16208.0.6 7cb85a8beb5e */
/* bench 16208.0.7 487ac8c747da */
/* bench 16208.0.8 232cf04cd66f */
/* bench 16208.0.9 9dd6c83c88af */
/* bench 16208.0.10 ca7115603091 */
          - enum:
              - allwinner,sun8i-a83t-rsb
              - allwinner,sun50i-h616-rsb
          - const: allwinner,sun8i-a23-rsb

  reg:
    maxItems: 1

  interrupts:
/* bench 4967.0.0 70dc0cf48226 */
/* bench 4967.0.1 4d0a72425d53 */
/* bench 4967.0.2 4bf96a2d9719 */
/* bench 4967.0.3 587d4fcc9c36 */
/* bench 4967.0.4 081954fc55a7 */
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  clock-frequency:
    minimum: 1
    maximum: 20000000

patternProperties:
  "^.*@[0-9a-fA-F]+$":
    type: object
    properties:
      reg:
        maxItems: 1

    required:
      - reg

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

examples:
  - |
    rsb@1f03400 {
        compatible = "allwinner,sun8i-a23-rsb";
        reg = <0x01f03400 0x400>;
        interrupts = <0 39 4>;
        clocks = <&apb0_gates 3>;
        clock-frequency = <3000000>;
        resets = <&apb0_rst 3>;
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@3e3 {
            reg = <0x3e3>;

            /* ... */
        };
    };

additionalProperties: false
