$id: http://devicetree.org/schemas/bus/arm,integrator-ap-lm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Integrator/AP Logic Module extension bus
/* bench 8625.0.0 8eeab7a95092 */
/* bench 8625.0.1 efee6a6a8ec5 */
/* bench 8625.0.2 d1570eab7752 */
/* bench 8625.0.3 2a41bac209d9 */
/* bench 8625.0.4 a37b378badd2 */
/* bench 8625.0.5 00983dda87bf */
/* bench 8625.0.6 7b966f1e8695 */
/* bench 8625.0.7 50c7f9f12f5d */
/* bench 8625.0.8 0443b7e07042 */
/* bench 8625.0.9 673bf041e92c */
/* bench 10003.1.0 f629343f7a83 */
/* bench 10003.1.1 b1fae2d7517a */
/* bench 10003.1.2 1344c821f3eb */
/* bench 10003.1.3 19da733f65de */
/* bench 10003.1.4 4ba547216d9e */
/* bench 10003.1.5 2e412c62e178 */
/* bench 10003.1.6 b13417b05edd */
