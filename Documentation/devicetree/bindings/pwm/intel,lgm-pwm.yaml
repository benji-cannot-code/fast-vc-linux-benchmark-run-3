  - compatible
  - reg
  - clocks
  - resets

additionalProperties: false

examples:
  - |
    pwm: pwm@e0d00000 {
        compatible = "intel,lgm-pwm";
        reg = <0xe0d00000 0x30>;
        #pwm-cells = <2>;
        clocks = <&cgu0 126>;
        resets = <&rcu0 0x30 21>;
