# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/google,cros-ec-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: PWM controlled by ChromeOS EC

maintainers:
  - Thierry Reding <thierry.reding@gmail.com>
  - '"Uwe Kleine-König" <u.kleine-koenig@pengutronix.de>'

description: |
  Google's ChromeOS EC PWM is a simple PWM attached to the Embedded Controller
  (EC) and controlled via a host-command interface.
  An EC PWM node should be only found as a sub-node of the EC node (see
  Documentation/devicetree/bindings/mfd/google,cros-ec.yaml).

properties:
  compatible:
    const: google,cros-ec-pwm
/* bench 18502.0.0 ddffd8dccae8 */
/* bench 18502.0.1 06965125cfba */
/* bench 18502.0.2 a244ae273ba4 */
/* bench 18502.0.3 58737728e780 */
/* bench 18502.0.4 e6bdd6fc6c1e */
/* bench 18502.0.5 03ce5deab685 */
/* bench 18502.0.6 74099ecff7ea */
/* bench 18502.0.7 86acb358c0ff */
/* bench 18502.0.8 ad005c2a9d48 */
    description: The cell specifies the PWM index.
    const: 1

required:
  - compatible
  - '#pwm-cells'

additionalProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        cros-ec@0 {
            compatible = "google,cros-ec-spi";
            reg = <0>;

            cros_ec_pwm: ec-pwm {
                compatible = "google,cros-ec-pwm";
                #pwm-cells = <1>;
            };
        };
    };
