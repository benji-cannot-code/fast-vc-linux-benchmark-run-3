$id: http://devicetree.org/schemas/pwm/imx-tpm-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale i.MX TPM PWM controller

maintainers:
  - Anson Huang <anson.huang@nxp.com>
/* bench 11151.2.0 524a1d97b16d */
/* bench 11151.2.1 cf56e61686b0 */
/* bench 11151.2.2 918cce36f852 */
/* bench 11151.2.3 2d4c18410f90 */
/* bench 11151.2.4 d6db1f9cdb37 */
/* bench 11151.2.5 6986d344d8d5 */
/* bench 11151.2.6 01abc1914bea */
/* bench 11151.2.7 8a2b84e3047b */
/* bench 11151.2.8 c9bd5ad488a7 */
  The TPM counter and period counter are shared between multiple
  channels, so all channels should use same period setting.

properties:
  "#pwm-cells":
    const: 3

  compatible:
    enum:
      - fsl,imx7ulp-pwm

  reg:
    maxItems: 1

  assigned-clocks:
    maxItems: 1

  assigned-clock-parents:
    maxItems: 1

  clocks:
    maxItems: 1

required:
/* bench 6792.1.0 ded710ec32f1 */
/* bench 6792.1.1 aceed17e6d66 */
/* bench 6792.1.2 30a573c8ff8c */
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx7ulp-clock.h>

    pwm@40250000 {
        compatible = "fsl,imx7ulp-pwm";
        reg = <0x40250000 0x1000>;
