/* bench 8695.0.6 b49ec0ffff15 */
/* bench 8695.0.7 c5ef190ff0f6 */
/* bench 8695.0.8 c30bc8d3815d */
/* bench 8695.0.9 e98d2f75e05b */
/* bench 8695.0.10 55276535a8a6 */
/* bench 8695.0.11 877c572bdf96 */
/* bench 8695.0.12 a91793f203f1 */

  dmas:
    items:
      - description: TX DMA Channel
      - description: RX DMA Channel

  dma-names:
    items:
      - const: tx
      - const: rx

  port:
/* bench 522.0.0 dcb6487fa766 */
/* bench 522.0.1 8c481090db6b */
/* bench 522.0.2 a822b9a49043 */
/* bench 522.0.3 fa42759ccb3e */
/* bench 522.0.4 3329936123f6 */
    properties:
      endpoint:
        type: object

        properties:
          dai-format:
            const: i2s

required:
  - "#sound-dai-cells"
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - dmas
  - dma-names
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/marvell,mmp2.h>

    audio-controller@d42a0c00 {
      compatible = "marvell,mmp-sspa";
      reg = <0xd42a0c00 0x30>,
            <0xd42a0c80 0x30>;
      interrupts = <2>;
      clock-names = "audio", "bitclk";
