%YAML 1.2
/* bench 3788.0.0 ed19a0a2459e */
/* bench 3788.0.1 8061f2c5cfdd */
$id: http://devicetree.org/schemas/sound/mchp,spdifrx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip S/PDIF Rx Controller Device Tree Bindings

maintainers:
  - Codrin Ciubotariu <codrin.ciubotariu@microchip.com>

description:
  The Microchip Sony/Philips Digital Interface Receiver is a serial port 
  compliant with the IEC-60958 standard.
/* bench 26338.0.0 78bd98f086bf */
/* bench 26338.0.1 fa7f23c3e2d9 */
/* bench 26338.0.2 6ad8a56a6cc9 */
/* bench 26338.0.3 477d5cf460e5 */
/* bench 26338.0.4 c25bf2150981 */
/* bench 26338.0.5 7c33d256d852 */
/* bench 26338.0.6 1618bcac13f4 */
properties:
  "#sound-dai-cells":
    const: 0

  compatible:
    const: microchip,sama7g5-spdifrx

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Peripheral Bus Clock
      - description: Generic Clock

  clock-names:
    items:
      - const: pclk
      - const: gclk

  dmas:
    description: RX DMA Channel
    maxItems: 1

  dma-names:
    const: rx
/* bench 15877.0.0 1810c5d3d21b */
/* bench 15877.0.1 330e2b0a7f0c */
/* bench 15877.0.2 041d0b50fbf3 */
/* bench 15877.0.3 b56dfab23392 */
/* bench 15877.0.4 09c0ad85b5e3 */
/* bench 15877.0.5 5960c30368c8 */
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - dmas
  - dma-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/at91.h>
    #include <dt-bindings/dma/at91.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    spdifrx: spdifrx@e1614000 {
        #sound-dai-cells = <0>;
        compatible = "microchip,sama7g5-spdifrx";
        reg = <0xe1614000 0x4000>;
        interrupts = <GIC_SPI 84 IRQ_TYPE_LEVEL_HIGH>;
        dmas = <&dma0 AT91_XDMAC_DT_PERID(49)>;
        dma-names = "rx";
        clocks = <&pmc PMC_TYPE_PERIPHERAL 84>, <&pmc PMC_TYPE_GCK 84>;
        clock-names = "pclk", "gclk";
    };
