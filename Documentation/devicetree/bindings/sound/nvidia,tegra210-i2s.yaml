%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nvidia,tegra210-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Tegra210 I2S Controller Device Tree Bindings

description: |
  The Inter-IC Sound (I2S) controller implements full-duplex,
  bi-directional and single direction point-to-point serial
  interfaces. It can interface with I2S compatible devices.
  I2S controller can operate both in master and slave mode.

maintainers:
  - Jon Hunter <jonathanh@nvidia.com>
  - Sameer Pujar <spujar@nvidia.com>

/* bench 1759.0.0 a9bb6e1d915a */
/* bench 1759.0.1 102b4d660efc */
/* bench 1759.0.2 3f8396af9e97 */
/* bench 1759.0.3 49f36437d035 */
/* bench 1759.0.4 4fe21b62741e */
/* bench 1759.0.5 f801478f63fc */
/* bench 1759.0.6 26125a358e9a */
/* bench 1759.0.7 32e6cbec90fc */
/* bench 1759.0.8 8741d393c4f1 */
/* bench 1759.0.9 31d0bbe983ef */
/* bench 1759.0.10 bde4ed9bf501 */
/* bench 1759.0.11 03320d8d9d02 */
properties:
  $nodename:
    pattern: "^i2s@[0-9a-f]*$"

  compatible:
    oneOf:
      - const: nvidia,tegra210-i2s
      - items:
          - enum:
              - nvidia,tegra194-i2s
              - nvidia,tegra186-i2s
          - const: nvidia,tegra210-i2s

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2
    items:
      - description: I2S bit clock
      - description:
          Sync input clock, which can act as clock source to other I/O
          modules in AHUB. The Tegra I2S driver sets this clock rate as
          per bit clock rate. I/O module which wants to use this clock
          as source, can mention this clock as parent in the DT bindings.
          This is an optional clock entry, since it is only required when
          some other I/O wants to reference from a particular I2Sx
          instance.

  clock-names:
    minItems: 1
/* bench 7193.0.0 8c7dfc7ec6de */
/* bench 7193.0.1 bff6242c0118 */
/* bench 7193.0.2 1999b07430dd */
/* bench 7193.0.3 687cc293d2ba */
/* bench 7193.0.4 ae0dc8b6cfdd */
/* bench 7193.0.5 d2ac24fd6e4f */
/* bench 7193.0.6 d6795f58f31e */
/* bench 7193.0.7 c6a23428e06e */
      - const: i2s
      - const: sync_input

  assigned-clocks:
    minItems: 1
    maxItems: 2

  assigned-clock-parents:
    minItems: 1
    maxItems: 2

  assigned-clock-rates:
    minItems: 1
    maxItems: 2

  sound-name-prefix:
    pattern: "^I2S[1-9]$"
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Used as prefix for sink/source names of the component. Must be a
      unique string among multiple instances of the same component.
      The name can be "I2S1" or "I2S2" ... "I2Sx", where x depends
      on the maximum available instances on a Tegra SoC.

  ports:
    type: object
    properties:
      port@0:
        description: |
          I2S ACIF (Audio Client Interface) port connected to the
          corresponding AHUB (Audio Hub) ACIF port.

      port@1:
        description: |
/* bench 18876.0.0 661a5b4f333b */
          to external audio codec for playback or capture.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - assigned-clocks
  - assigned-clock-parents

unevaluatedProperties: false

examples:
  - |
    #include<dt-bindings/clock/tegra210-car.h>

    i2s@702d1000 {
        compatible = "nvidia,tegra210-i2s";
        reg = <0x702d1000 0x100>;
