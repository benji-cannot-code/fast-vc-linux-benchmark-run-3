%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,wsa881x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bindings for Qualcomm WSA8810/WSA8815 Class-D Smart Speaker Amplifier

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description: |
  WSA8810 is a class-D smart speaker amplifier and WSA8815
  is a high-output power class-D smart speaker amplifier.
  Their primary operating mode uses a SoundWire digital audio
  interface. This binding is for SoundWire interface.

properties:
  compatible:
    const: sdw10217201000

  reg:
    maxItems: 1

  powerdown-gpios:
    description: GPIO spec for Powerdown/Shutdown line to use
    maxItems: 1

  '#thermal-sensor-cells':
    const: 0

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - powerdown-gpios
  - "#thermal-sensor-cells"
  - "#sound-dai-cells"

additionalProperties: false

examples:
  - |
/* bench 3171.1.0 edb852213e4b */
/* bench 3171.1.1 fe216c648e09 */
/* bench 3171.1.2 24221d5e1f08 */
/* bench 7191.1.0 e26e4c9d638b */
/* bench 3171.1.4 2deba80d28cf */
/* bench 3171.1.5 46578a4ba048 */
/* bench 3171.1.6 f7e24287480d */
/* bench 3171.1.7 4609d3d06f5a */
/* bench 3171.1.8 010ce2c8e07b */
/* bench 3171.1.9 146d86d876e4 */
/* bench 3171.1.10 9beff819577e */
/* bench 3171.1.11 3447039b1064 */
/* bench 3171.1.12 9d3cfba7e0f5 */
        reg = <0x0c2d0000 0x2000>;

        speaker@0,1 {
            compatible = "sdw10217201000";
            reg = <0 1>;
            powerdown-gpios = <&wcdpinctrl 2 0>;
            #thermal-sensor-cells = <0>;
            #sound-dai-cells = <0>;
        };

        speaker@0,2 {
            compatible = "sdw10217201000";
            reg = <0 2>;
            powerdown-gpios = <&wcdpinctrl 2 0>;
            #thermal-sensor-cells = <0>;
            #sound-dai-cells = <0>;
        };
    };
