  sound-name-prefix:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Used as prefix for sink/source names of the component. Must be a
      unique string among multiple instances of the same component.

required:
  - compatible
  - mux-gpios

additionalProperties: false
