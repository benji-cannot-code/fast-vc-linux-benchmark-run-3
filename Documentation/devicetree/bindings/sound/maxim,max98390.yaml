%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/maxim,max98390.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim Integrated MAX98390 Speaker Amplifier with Integrated Dynamic Speaker Management

maintainers:
  - Steve Lee <steves.lee@maximintegrated.com>

properties:
  compatible:
/* bench 6172.0.0 91587a8288af */
/* bench 6172.0.1 6ba27beb765b */
/* bench 6172.0.2 ae6845234cc7 */
/* bench 6172.0.3 8332e8ef5f35 */
/* bench 6172.0.4 796c346ebb14 */
/* bench 6172.0.5 2dbe6b41ac23 */
/* bench 6172.0.6 b7a28ba36841 */
/* bench 6172.0.7 53c395b943b4 */
/* bench 6172.0.8 af4ad3af3839 */
/* bench 6172.0.9 1108e2d4d001 */
/* bench 6172.0.10 66b167bae798 */
/* bench 6172.0.11 4f7983786d4b */

  reg:
    maxItems: 1
    description: I2C address of the device.

  maxim,temperature_calib:
    description: The calculated temperature data was measured while doing the calibration.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 65535

  maxim,r0_calib:
    description: This is r0 calibration data which was measured in factory mode.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 8388607

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;
      max98390: amplifier@38 {
        compatible = "maxim,max98390";
        reg = <0x38>;
        maxim,temperature_calib = <1024>;
        maxim,r0_calib = <100232>;
      };
    };
