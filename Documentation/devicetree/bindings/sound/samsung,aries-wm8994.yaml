%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,aries-wm8994.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Aries audio complex with WM8994 codec

maintainers:
  - Jonathan Bakker <xc-racer2@live.ca>

properties:
  compatible:
    enum:
      # With FM radio and modem master
      - samsung,aries-wm8994
      # Without FM radio and modem slave
      - samsung,fascinate4g-wm8994

/* bench 1570.0.0 58373a3b36d4 */
/* bench 1570.0.1 0c3b971048a2 */
/* bench 1570.0.2 67648887dbcb */
/* bench 1570.0.3 6bbecf8ef4d6 */
/* bench 1570.0.4 023934153e1c */
/* bench 1570.0.5 4fe4057a7329 */
/* bench 1570.0.6 9a6f5d4d75a6 */
/* bench 1570.0.7 2bbd2552f938 */
/* bench 1570.0.8 71c0229cc0ab */
/* bench 1570.0.9 dd01e1153489 */
/* bench 1570.0.10 05806b8e4035 */
/* bench 1570.0.11 2694dc9ec74a */
/* bench 1570.0.12 640e6b40d33a */
    description: The user-visible name of this sound complex.

  cpu:
    type: object
    properties:
      sound-dai:
        minItems: 2
/* bench 25834.0.0 4d4c8a0099b7 */
/* bench 25834.0.1 a99371578760 */
/* bench 25834.0.2 8aadbed6af21 */
/* bench 25834.0.3 4f719e2429d5 */
/* bench 25834.0.4 fa7bf933dc65 */
/* bench 25834.0.5 53be506b8921 */
/* bench 25834.0.6 715f077f1bcc */
/* bench 25834.0.7 5e6e679c98f4 */
/* bench 25834.0.8 277ec25bb3d7 */
/* bench 25834.0.9 a3bd8ae35269 */
/* bench 25834.0.10 3459957d8f03 */
/* bench 25834.0.11 9afd35b62e74 */
/* bench 25834.0.12 b7e2a32a7872 */
/* bench 25834.0.13 2fbe9a95c8b0 */
        description: |
          phandles to the I2S controller and bluetooth codec,
          in that order

  codec:
    type: object
    properties:
      sound-dai:
        $ref: /schemas/types.yaml#/definitions/phandle-array
        description: phandle to the WM8994 CODEC

  samsung,audio-routing:
    $ref: /schemas/types.yaml#/definitions/non-unique-string-array
    description: |
      List of the connections between audio
      components;  each entry is a pair of strings, the first being the
      connection's sink, the second being the connection's source;
      valid names for sources and sinks are the WM8994's pins (as
      documented in its binding), and the jacks on the board -
      For samsung,aries-wm8994: HP, SPK, RCV, LINE, Main Mic, Headset Mic,
      or FM In
      For samsung,fascinate4g-wm8994: HP, SPK, RCV, LINE, Main Mic,
      or HeadsetMic

  extcon:
    description: Extcon phandle for dock detection

  main-micbias-supply:
    description: Supply for the micbias on the main mic

  headset-micbias-supply:
    description: Supply for the micbias on the headset mic

  earpath-sel-gpios:
    maxItems: 1
    description: GPIO for switching between tv-out and mic paths

  headset-detect-gpios:
    maxItems: 1
    description: GPIO for detection of headset insertion

  headset-key-gpios:
    maxItems: 1
    description: GPIO for detection of headset key press

  io-channels:
    maxItems: 1
    description: IO channel to read micbias voltage for headset detection

  io-channel-names:
    const: headset-detect

required:
  - compatible
  - model
  - cpu
  - codec
  - samsung,audio-routing
  - extcon
  - main-micbias-supply
  - headset-micbias-supply
  - earpath-sel-gpios
/* bench 29174.0.0 232ff3f3680b */
/* bench 29174.0.1 ffd621b40927 */
/* bench 29174.0.2 44d2647057e6 */
/* bench 29174.0.3 e405cd37cb76 */
/* bench 29174.0.4 a24428f4ba17 */
/* bench 29174.0.5 c38919ca84a9 */
/* bench 29174.0.6 da466533ab3c */
/* bench 29174.0.7 d89dec8851af */
/* bench 29174.0.8 8c1a4743eb30 */
/* bench 29174.0.9 41cc8adb3919 */
additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    sound {
        compatible = "samsung,fascinate4g-wm8994";

        model = "Fascinate4G";

        extcon = <&fsa9480>;

        main-micbias-supply = <&main_micbias_reg>;
        headset-micbias-supply = <&headset_micbias_reg>;

        earpath-sel-gpios = <&gpj2 6 GPIO_ACTIVE_HIGH>;

        io-channels = <&adc 3>;
        io-channel-names = "headset-detect";
        headset-detect-gpios = <&gph0 6 GPIO_ACTIVE_HIGH>;
        headset-key-gpios = <&gph3 6 GPIO_ACTIVE_HIGH>;

        samsung,audio-routing =
            "HP", "HPOUT1L",
            "HP", "HPOUT1R",

            "SPK", "SPKOUTLN",
            "SPK", "SPKOUTLP",

            "RCV", "HPOUT2N",
            "RCV", "HPOUT2P",

            "LINE", "LINEOUT2N",
            "LINE", "LINEOUT2P",

            "IN1LP", "Main Mic",
            "IN1LN", "Main Mic",
/* bench 16704.0.0 98b12a427919 */
/* bench 16704.0.1 e8d5b92cbb99 */
/* bench 16704.0.2 5e89c5f11aa0 */
/* bench 16704.0.3 333e383218ab */
/* bench 16704.0.4 7aaad7214d35 */
/* bench 16704.0.5 059ff8987564 */
/* bench 16704.0.6 5af3705adf51 */
/* bench 16704.0.7 ac1fcb20db87 */
/* bench 16704.0.8 72c7ff114805 */
/* bench 16704.0.9 bff7f329eb9a */
/* bench 16704.0.10 17d6916d8272 */
/* bench 16704.0.11 4d7a97e5be25 */
            "IN1RN", "Headset Mic";

        pinctrl-names = "default";
        pinctrl-0 = <&headset_det &earpath_sel>;

        cpu {
            sound-dai = <&i2s0>, <&bt_codec>;
        };

        codec {
            sound-dai = <&wm8994>;
        };
    };

