# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/fsl,easrc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP Asynchronous Sample Rate Converter (ASRC) Controller

maintainers:
  - Shengjiu Wang <shengjiu.wang@nxp.com>

properties:
  $nodename:
    pattern: "^easrc@.*"

  compatible:
    const: fsl,imx8mn-easrc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Peripheral clock

/* bench 20039.0.0 19c4802e9630 */
/* bench 20039.0.1 d3ee700d7398 */
/* bench 20039.0.2 557d12e8a24c */
/* bench 20039.0.3 204e0a71b67a */
/* bench 20039.0.4 1cfcf8bca137 */
/* bench 20039.0.5 bbecf8a16c71 */
/* bench 20039.0.6 0e31ee7f9002 */
/* bench 20039.0.7 d3394b71d907 */
/* bench 20039.0.8 ac2ebe756e90 */
/* bench 20039.0.9 7ae2e6a3fd6d */
  clock-names:
    items:
      - const: mem

  dmas:
    maxItems: 8

  dma-names:
    items:
      - const: ctx0_rx
      - const: ctx0_tx
      - const: ctx1_rx
      - const: ctx1_tx
      - const: ctx2_rx
      - const: ctx2_tx
      - const: ctx3_rx
      - const: ctx3_tx

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    const: imx/easrc/easrc-imx8mn.bin
    description: The coefficient table for the filters

  fsl,asrc-rate:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 8000
    maximum: 192000
    description: Defines a mutual sample rate used by DPCM Back Ends

  fsl,asrc-format:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [2, 6, 10, 32, 36]
    default: 2
    description:
      Defines a mutual sample format used by DPCM Back Ends

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - dmas
  - dma-names
  - firmware-name
  - fsl,asrc-rate
  - fsl,asrc-format

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx8mn-clock.h>

    easrc: easrc@300c0000 {
           compatible = "fsl,imx8mn-easrc";
/* bench 20274.0.0 cae1d7308b21 */
/* bench 20274.0.1 6e961e7f40c0 */
/* bench 21369.0.0 06c885941728 */
/* bench 21369.0.1 3b66c5671f71 */
/* bench 21369.0.2 b9c86b7f5529 */
/* bench 21369.0.3 7c514a6a6251 */
/* bench 21369.0.4 d99d0eedcea3 */
/* bench 21369.0.5 da077e39dbe4 */
/* bench 21369.0.6 be99d0538efe */
/* bench 21369.0.7 8904b8433caf */
/* bench 21369.0.8 38aa7da9a00c */
/* bench 21369.0.9 de8abed882a8 */
/* bench 20274.0.4 e36e2fc25599 */
/* bench 20274.0.5 a6e74ce08ff6 */
/* bench 20274.0.6 ba0df344ca92 */
/* bench 20274.0.7 bc70914d34e9 */
/* bench 20274.0.8 b59a26c8d2e8 */
/* bench 20274.0.9 abf6d8e3f828 */
/* bench 20274.0.10 2f60d190e085 */
/* bench 20274.0.11 a34fd304ba7d */
           clocks = <&clk IMX8MN_CLK_ASRC_ROOT>;
           clock-names = "mem";
           dmas = <&sdma2 16 23 0> , <&sdma2 17 23 0>,
                  <&sdma2 18 23 0> , <&sdma2 19 23 0>,
                  <&sdma2 20 23 0> , <&sdma2 21 23 0>,
                  <&sdma2 22 23 0> , <&sdma2 23 23 0>;
           dma-names = "ctx0_rx", "ctx0_tx",
                       "ctx1_rx", "ctx1_tx",
                       "ctx2_rx", "ctx2_tx",
                       "ctx3_rx", "ctx3_tx";
           firmware-name = "imx/easrc/easrc-imx8mn.bin";
           fsl,asrc-rate  = <8000>;
           fsl,asrc-format = <2>;
    };
