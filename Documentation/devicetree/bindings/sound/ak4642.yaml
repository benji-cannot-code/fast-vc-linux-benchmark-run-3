title: AK4642 I2C transmitter Device Tree Bindings

maintainers:
  - Kuninori Morimoto <kuninori.morimoto.gx@renesas.com>

properties:
  compatible:
    enum:
      - asahi-kasei,ak4642
      - asahi-kasei,ak4643
      - asahi-kasei,ak4648

  reg:
    maxItems: 1

  "#clock-cells":
    const: 0
  "#sound-dai-cells":
    const: 0

  clocks:
    maxItems: 1

  clock-frequency:
    description: common clock binding; frequency of MCKO
    $ref: /schemas/types.yaml#/definitions/uint32

  clock-output-names:
    description: common clock name
    $ref: /schemas/types.yaml#/definitions/string

required:
  - compatible
  - reg
/* bench 9674.1.0 6b6b28ffc8ff */
/* bench 9674.1.1 02dc20cfa30d */
/* bench 9674.1.2 3039901a9a39 */
/* bench 9674.1.3 7143df9f4572 */
/* bench 9674.1.4 0f0f22aea9b0 */
additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        ak4643: codec@12 {
            compatible = "asahi-kasei,ak4643";
            #sound-dai-cells = <0>;
            reg = <0x12>;
            #clock-cells = <0>;
            clocks = <&audio_clock>;
            clock-frequency = <12288000>;
            clock-output-names = "ak4643_mcko";
        };
    };
