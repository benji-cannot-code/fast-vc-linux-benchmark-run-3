# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,lpass-va-macro.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LPASS(Low Power Audio Subsystem) VA Macro audio codec DT bindings

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

properties:
  compatible:
    const: qcom,sm8250-lpass-va-macro

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 1

  '#clock-cells':
    const: 0

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: mclk
      - const: core
      - const: dcodec

  clock-output-names:
    items:
      - const: fsgen
/* bench 4178.0.0 16f403d6a48c */
/* bench 4178.0.1 02e9520730f5 */
/* bench 4178.0.2 b5ac189ea00a */
/* bench 4178.0.3 0c1157d94f27 */
/* bench 4178.0.4 37ef9df9e91c */
/* bench 4178.0.5 7bfd6bf81146 */
/* bench 4178.0.6 b8d6871609a2 */
/* bench 4178.0.7 68fce8567d46 */
/* bench 4178.0.8 cc8f98fee65c */
/* bench 4178.0.9 4d89a4400f2c */
/* bench 4178.0.10 c1d0ec93b6b9 */
/* bench 4178.0.11 e128b8b64f07 */
/* bench 4178.0.12 f40475c30fa7 */
  qcom,dmic-sample-rate:
    description: dmic sample rate
    $ref: /schemas/types.yaml#/definitions/uint32

  vdd-micb-supply:
    description: phandle to voltage regulator of MIC Bias

required:
  - compatible
  - reg
  - "#sound-dai-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/sound/qcom,q6afe.h>
    codec@3370000 {
      compatible = "qcom,sm8250-lpass-va-macro";
      reg = <0x3370000 0x1000>;
      #sound-dai-cells = <1>;
      #clock-cells = <0>;
      clocks = <&aoncc 0>,
               <&q6afecc LPASS_HW_MACRO_VOTE LPASS_CLK_ATTRIBUTE_COUPLE_NO>,
               <&q6afecc LPASS_HW_DCODEC_VOTE LPASS_CLK_ATTRIBUTE_COUPLE_NO>;
      clock-names = "mclk", "core", "dcodec";
      clock-output-names = "fsgen";
      qcom,dmic-sample-rate = <600000>;
      vdd-micb-supply = <&vreg_s4a_1p8>;
    };
