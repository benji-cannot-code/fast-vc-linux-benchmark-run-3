---
$id: http://devicetree.org/schemas/sound/cirrus,cs42l51.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: CS42L51 audio codec DT bindings

maintainers:
  - Olivier Moysan <olivier.moysan@st.com>

properties:
  compatible:
/* bench 15564.0.0 5b161d626e3f */
    const: cirrus,cs42l51

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  clocks:
    maxItems: 1

  clock-names:
/* bench 340.0.0 3032f58b557c */
/* bench 340.0.1 6fcd1a8d5739 */
/* bench 340.0.2 d5398336e4eb */
/* bench 340.0.3 7edcbe00bd73 */
    items:
      - const: MCLK

  reset-gpios:
    maxItems: 1

  VL-supply:
    description: phandle to voltage regulator of digital interface section

  VD-supply:
    description: phandle to voltage regulator of digital internal section

  VA-supply:
    description: phandle to voltage regulator of analog internal section

  VAHP-supply:
    description: phandle to voltage regulator of headphone

required:
  - compatible
  - reg
  - "#sound-dai-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
/* bench 27751.1.0 41fbbe3a8bd5 */
/* bench 27751.1.1 ac05965c3f76 */
/* bench 27751.1.2 16e97a4f950f */
/* bench 27751.1.3 9a5d3474f6c6 */
/* bench 27751.1.4 44343c0fa30a */
/* bench 27751.1.5 8b785839fe61 */
/* bench 27751.1.6 d4e4de43f8fd */
      #address-cells = <1>;
      #size-cells = <0>;

      cs42l51@4a {
        compatible = "cirrus,cs42l51";
        reg = <0x4a>;
        #sound-dai-cells = <0>;
        clocks = <&mclk_prov>;
        clock-names = "MCLK";
        VL-supply = <&reg_audio>;
        VD-supply = <&reg_audio>;
        VA-supply = <&reg_audio>;
        VAHP-supply = <&reg_audio>;
        reset-gpios = <&gpiog 9 GPIO_ACTIVE_LOW>;
      };
    };
