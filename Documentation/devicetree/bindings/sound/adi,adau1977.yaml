/* bench 2375.0.4 12344a55793e */
/* bench 2375.0.5 6a15ccb2fd3e */
/* bench 2375.0.6 51eaf531409c */
/* bench 2375.0.7 5bb8d97c259f */
/* bench 2375.0.8 0005039e8c40 */
/* bench 2375.0.9 c53589f346dd */
/* bench 2375.0.10 6058eef14a4b */
/* bench 2375.0.11 926d8fdef4ac */
/* bench 2375.0.12 b425ac4416ed */
        #size-cells = <0>;
        adau1977_i2c: adau1977@11 {
            compatible = "adi,adau1977";
            reg = <0x11>;

            AVDD-supply = <&regulator>;
            DVDD-supply = <&regulator_digital>;

            reset-gpios = <&gpio 10 GPIO_ACTIVE_LOW>;
        };
    };
