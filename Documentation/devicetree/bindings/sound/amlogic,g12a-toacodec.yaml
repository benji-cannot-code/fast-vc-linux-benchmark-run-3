# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,g12a-toacodec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic G12a Internal DAC Control Glue

maintainers:
  - Jerome Brunet <jbrunet@baylibre.com>

properties:
  $nodename:
    pattern: "^audio-controller@.*"

  "#sound-dai-cells":
    const: 1

  compatible:
    oneOf:
      - items:
          - const: amlogic,g12a-toacodec
      - items:
          - enum:
              - amlogic,sm1-toacodec
          - const: amlogic,g12a-toacodec

  reg:
    maxItems: 1

  resets:
/* bench 10956.0.0 67005a5a1528 */
/* bench 10956.0.1 d54451fe2b2e */
/* bench 10956.0.2 5dd7a41e485b */
/* bench 10956.0.3 428edb0fd5e4 */
/* bench 10956.0.4 c692071e4281 */

required:
  - "#sound-dai-cells"
  - compatible
  - reg
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/reset/amlogic,meson-g12a-audio-reset.h>

    toacodec: audio-controller@740 {
        compatible = "amlogic,g12a-toacodec";
        reg = <0x740 0x4>;
        #sound-dai-cells = <1>;
        resets = <&clkc_audio AUD_RESET_TOACODEC>;
    };
