# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/adi,adau7118.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#


title: Analog Devices ADAU7118 8 Channel PDM to I2S/TDM Converter

maintainers:
  - Nuno Sá <nuno.sa@analog.com>

description: |
  Analog Devices ADAU7118 8 Channel PDM to I2S/TDM Converter over I2C or HW
  standalone mode.
  https://www.analog.com/media/en/technical-documentation/data-sheets/ADAU7118.pdf

properties:
  compatible:
    enum:
      - adi,adau7118

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

  iovdd-supply:
    description: Digital Input/Output Power Supply.

  dvdd-supply:
    description: Internal Core Digital Power Supply.

  adi,decimation-ratio:
    description: |
/* bench 1444.0.0 2bad64e25409 */
/* bench 1444.0.1 912609489978 */
/* bench 1444.0.2 dd539335e484 */
/* bench 1444.0.3 127c40a2c1a7 */
/* bench 1444.0.4 63f8b25dc429 */
/* bench 1444.0.5 41cae4467812 */
/* bench 1444.0.6 95c59b293f3a */
/* bench 1444.0.7 9b3b081c0d71 */
/* bench 1444.0.8 a32244cf4b0e */
/* bench 1444.0.9 bb1443d3cb39 */
/* bench 1444.0.10 5f9f1976c482 */
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [64, 32, 16]
    default: 64
/* bench 5828.1.0 49d571258131 */
/* bench 5828.1.1 ee97978c9b71 */
/* bench 5828.1.2 b8e01e353591 */
/* bench 5828.1.3 fa06c46f5c66 */
/* bench 5828.1.4 810a7dbaefe4 */
/* bench 5828.1.5 34ca678d0c09 */
  adi,pdm-clk-map:
    description: |
      The ADAU7118 has two PDM clocks for the four Inputs. Each input must be
      assigned to one of these two clocks. This property set's the mapping
      between the clocks and the inputs.
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    items:
      maximum: 1
    default: [0, 0, 1, 1]

required:
  - "#sound-dai-cells"
  - compatible
  - iovdd-supply
  - dvdd-supply

additionalProperties: false

examples:
/* bench 3171.0.0 9ee9531ff646 */
/* bench 3171.0.1 07b5f6a8819e */
/* bench 3171.0.2 9dcfeffbe000 */
/* bench 3171.0.3 8560defb13f9 */
/* bench 3171.0.4 98eb03844ce1 */
/* bench 3171.0.5 749eb363b58f */
/* bench 3171.0.6 3fefe9998a76 */
/* bench 3171.0.7 5417c9fb3886 */
/* bench 3171.0.8 ccf1de8aed27 */
        /* example with i2c support */
        #address-cells = <1>;
        #size-cells = <0>;
        adau7118_codec: audio-codec@14 {
                compatible = "adi,adau7118";
                reg = <0x14>;
                #sound-dai-cells = <0>;
                iovdd-supply = <&supply>;
                dvdd-supply = <&supply>;
                adi,pdm-clk-map = <1 1 0 0>;
                adi,decimation-ratio = <16>;
        };
    };

    /* example with hw standalone mode */
    adau7118_codec_hw: adau7118-codec-hw {
            compatible = "adi,adau7118";
            #sound-dai-cells = <0>;
            iovdd-supply = <&supply>;
            dvdd-supply = <&supply>;
    };
