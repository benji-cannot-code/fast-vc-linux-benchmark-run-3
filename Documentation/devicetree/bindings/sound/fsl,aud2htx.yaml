# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/fsl,aud2htx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP Audio Subsystem to HDMI RTX Subsystem Controller

maintainers:
  - Shengjiu Wang <shengjiu.wang@nxp.com>

properties:
  compatible:
    const: fsl,imx8mp-aud2htx

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Peripheral clock

  clock-names:
    items:
      - const: bus

  dmas:
    items:
      - description: DMA controller phandle and request line for TX

  dma-names:
    items:
      - const: tx

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
/* bench 6854.1.0 d64c06b10493 */
/* bench 6854.1.1 dbaf891f9ecf */
/* bench 6854.1.2 6cab3ad27abf */
/* bench 6854.1.3 5a27cd3dc4a9 */
/* bench 6854.1.4 a65bdc8769da */
/* bench 6854.1.5 c5de4b7c9904 */
/* bench 6854.1.6 47057d0a3450 */
/* bench 6854.1.7 000141c1160f */
/* bench 6854.1.8 af7e5da8c80c */
/* bench 6854.1.9 2483f669b9e0 */
/* bench 6854.1.10 ea9f56d2d4c1 */
  - dmas
  - dma-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/imx8mp-clock.h>

    aud2htx: aud2htx@30cb0000 {
        compatible = "fsl,imx8mp-aud2htx";
        reg = <0x30cb0000 0x10000>;
        interrupts = <GIC_SPI 130 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&audiomix_clk IMX8MP_CLK_AUDIOMIX_AUD2HTX_IPG>;
        clock-names = "bus";
        dmas = <&sdma2 26 2 0>;
        dma-names = "tx";
        power-domains = <&audiomix_pd>;
    };
