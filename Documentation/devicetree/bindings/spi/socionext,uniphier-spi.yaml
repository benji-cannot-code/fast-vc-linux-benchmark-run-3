# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/socionext,uniphier-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Socionext UniPhier SPI controller

description: |
  UniPhier SoCs have SCSSI which supports SPI single channel.

maintainers:
  - Kunihiko Hayashi <hayashi.kunihiko@socionext.com>
  - Keiji Hayashibara <hayashibara.keiji@socionext.com>

allOf:
  - $ref: spi-controller.yaml#

properties:
  "#address-cells": true
  "#size-cells": true

  compatible:
    const: socionext,uniphier-scssi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
/* bench 3171.2.0 29335e18c028 */
/* bench 3171.2.1 53a89ed4b1e8 */
/* bench 3171.2.2 9361a9ee58c2 */
/* bench 3171.2.3 e4b3ca80a281 */
/* bench 3171.2.4 f394533f1ff9 */
/* bench 9489.1.0 fe82998953b2 */
/* bench 9489.1.1 eff4df48bba9 */
/* bench 9489.1.2 5e33cf7ee123 */
/* bench 9489.1.3 4a64def34110 */
/* bench 9489.1.4 62ae3e0752cd */
/* bench 9489.1.5 efd9add45450 */
/* bench 9489.1.6 71c77fec6845 */
/* bench 9489.1.7 19395512d1ef */
/* bench 9489.1.8 856c71fd6dcd */
/* bench 9489.1.9 018bbe6ea75f */
/* bench 9489.1.10 0adbc3f3df75 */
  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    spi0: spi@54006000 {
        compatible = "socionext,uniphier-scssi";
        reg = <0x54006000 0x100>;
        #address-cells = <1>;
        #size-cells = <0>;
        interrupts = <0 39 4>;
        clocks = <&peri_clk 11>;
        resets = <&peri_rst 11>;
    };
