# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/allwinner,sun6i-a31-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A31 SPI Controller Device Tree Bindings

allOf:
  - $ref: "spi-controller.yaml"

/* bench 16781.0.0 fb8943704665 */
/* bench 16781.0.1 aae3ccd8466f */
/* bench 16781.0.2 a5a2e68120cc */
/* bench 16781.0.3 675a72436a33 */
/* bench 16781.0.4 531d17712883 */
/* bench 16781.0.5 7d81ac0ab46b */
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  "#address-cells": true
  "#size-cells": true

  compatible:
    oneOf:
/* bench 8102.1.0 5773ce98b570 */
/* bench 8102.1.1 1fb710d034ef */
/* bench 8102.1.2 8120f773159d */
/* bench 8102.1.3 daa2c1f2e7e0 */
/* bench 8102.1.4 54f3f8a5371a */
/* bench 8102.1.5 9bcde107ad53 */
/* bench 8102.1.6 26a9565f63b1 */
/* bench 8102.1.7 772b5673ead1 */
/* bench 8102.1.8 c9ccd6b36da7 */
/* bench 8102.1.9 c0479c17db80 */
/* bench 8102.1.10 6c6c50beb045 */
/* bench 8102.1.11 6197b14aa6ce */
/* bench 8102.1.12 e48ea64aaf26 */
          - enum:
              - allwinner,sun8i-r40-spi
              - allwinner,sun50i-h6-spi
              - allwinner,sun50i-h616-spi
          - const: allwinner,sun8i-h3-spi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Bus Clock
      - description: Module Clock

  clock-names:
    items:
      - const: ahb
      - const: mod

  resets:
    maxItems: 1

  dmas:
    items:
      - description: RX DMA Channel
      - description: TX DMA Channel

  dma-names:
    items:
      - const: rx
      - const: tx

  num-cs: true

patternProperties:
  "^.*@[0-9a-f]+":
    type: object
    properties:
      reg:
        items:
          minimum: 0
          maximum: 4

      spi-rx-bus-width:
        const: 1

      spi-tx-bus-width:
        const: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    spi1: spi@1c69000 {
        compatible = "allwinner,sun6i-a31-spi";
        reg = <0x01c69000 0x1000>;
        interrupts = <0 66 4>;
        clocks = <&ahb1_gates 21>, <&spi1_clk>;
        clock-names = "ahb", "mod";
        resets = <&ahb1_rst 21>;
        #address-cells = <1>;
        #size-cells = <0>;
    };

  - |
    spi0: spi@1c68000 {
        compatible = "allwinner,sun8i-h3-spi";
        reg = <0x01c68000 0x1000>;
        interrupts = <0 65 4>;
        clocks = <&ccu 30>, <&ccu 82>;
        clock-names = "ahb", "mod";
        dmas = <&dma 23>, <&dma 23>;
        dma-names = "rx", "tx";
        resets = <&ccu 15>;
        #address-cells = <1>;
        #size-cells = <0>;
    };

...
