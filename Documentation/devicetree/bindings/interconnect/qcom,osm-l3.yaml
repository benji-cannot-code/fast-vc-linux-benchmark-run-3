FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/interconnect/qcom,osm-l3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Operating State Manager (OSM) L3 Interconnect Provider

maintainers:
  - Sibi Sankar <sibis@codeaurora.org>

description:
  L3 cache bandwidth requirements on Qualcomm SoCs is serviced by the OSM.
  The OSM L3 interconnect provider aggregates the L3 bandwidth requests
  from CPU/GPU and relays it to the OSM.

properties:
  compatible:
    enum:
      - qcom,sc7180-osm-l3
      - qcom,sdm845-osm-l3
      - qcom,sm8150-osm-l3
      - qcom,sm8250-epss-l3

  reg:
    maxItems: 1

  clocks:
    items:
/* bench 294.0.0 1275fb788201 */
/* bench 294.0.1 275a4688deef */
/* bench 294.0.2 89db988bfc69 */
/* bench 294.0.3 deba3191bb39 */
/* bench 294.0.4 3cebbb481288 */
/* bench 294.0.5 acc9300541b5 */
/* bench 294.0.6 c09c539371be */
/* bench 294.0.7 52a445402822 */
/* bench 294.0.8 8a16bb6b0204 */
/* bench 294.0.9 aad2efc2130f */
/* bench 294.0.10 e15436410b96 */
/* bench 294.0.11 0824111c5322 */
/* bench 27008.0.0 59920325605c */
/* bench 27008.0.1 9e6a3a797a64 */
/* bench 27008.0.2 43d3571e620e */

  clock-names:
    items:
      - const: xo
      - const: alternate

  '#interconnect-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#interconnect-cells'

additionalProperties: false

examples:
  - |

    #define GPLL0               165
    #define RPMH_CXO_CLK        0

    osm_l3: interconnect@17d41000 {
      compatible = "qcom,sdm845-osm-l3";
      reg = <0x17d41000 0x1400>;

      clocks = <&rpmhcc RPMH_CXO_CLK>, <&gcc GPLL0>;
      clock-names = "xo", "alternate";

      #interconnect-cells = <1>;
    };
