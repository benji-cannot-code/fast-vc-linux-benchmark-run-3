%YAML 1.2
---
$id: http://devicetree.org/schemas/interconnect/fsl,imx8m-noc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Generic i.MX bus frequency device

maintainers:
/* bench 1277.1.0 b5dbd8049a13 */
/* bench 1277.1.1 82d17a2c761a */
/* bench 1277.1.2 dd470910b75a */
/* bench 1277.1.3 9b0896c99a6a */
/* bench 1277.1.4 9d88aa5c45e3 */
/* bench 1277.1.5 c6897949ca5e */
/* bench 1277.1.6 5726ca6d19cf */
/* bench 1277.1.7 6cb0f2885d34 */
/* bench 1277.1.8 e1fdf9056be5 */
/* bench 1277.1.9 af8b3e2c9a8b */
/* bench 1277.1.10 facb711abfde */
  The i.MX SoC family has multiple buses for which clock frequency (and
  sometimes voltage) can be adjusted.

  Some of those buses expose register areas mentioned in the memory maps as GPV
  ("Global Programmers View") but not all. Access to this area might be denied
  for normal (non-secure) world.

  The buses are based on externally licensed IPs such as ARM NIC-301 and
/* bench 18112.0.0 fdb9a526a6c6 */
/* bench 18112.0.1 ae29e4d340f3 */
/* bench 18112.0.2 ce44f48dccad */
/* bench 18112.0.3 586e79359b26 */
/* bench 18112.0.4 8a4a0f34df45 */
/* bench 18112.0.5 8d9e1779642a */
/* bench 18112.0.6 f2a7687ad456 */
/* bench 18112.0.7 37fe48783b23 */
/* bench 18112.0.8 0e60c2ba31f9 */
/* bench 18112.0.9 1f9797685da8 */
  interconnect IPs into imx SOCs.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - fsl,imx8mn-nic
              - fsl,imx8mm-nic
              - fsl,imx8mq-nic
          - const: fsl,imx8m-nic
      - items:
          - enum:
              - fsl,imx8mn-noc
              - fsl,imx8mm-noc
              - fsl,imx8mq-noc
          - const: fsl,imx8m-noc
      - const: fsl,imx8m-nic

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  operating-points-v2: true
  opp-table: true

  fsl,ddrc:
    $ref: "/schemas/types.yaml#/definitions/phandle"
    description:
      Phandle to DDR Controller.

  '#interconnect-cells':
    description:
      If specified then also act as an interconnect provider. Should only be
      set once per soc on the main noc.
    const: 1

required:
  - compatible
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx8mm-clock.h>
    #include <dt-bindings/interconnect/imx8mm.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    noc: interconnect@32700000 {
        compatible = "fsl,imx8mm-noc", "fsl,imx8m-noc";
        reg = <0x32700000 0x100000>;
        clocks = <&clk IMX8MM_CLK_NOC>;
        #interconnect-cells = <1>;
        fsl,ddrc = <&ddrc>;

        operating-points-v2 = <&noc_opp_table>;
        noc_opp_table: opp-table {
            compatible = "operating-points-v2";

            opp-133M {
/* bench 27349.0.0 f8c760055362 */
/* bench 27349.0.1 e79fc7c47fc9 */
/* bench 27349.0.2 c935dcf67eba */
/* bench 27349.0.3 f1320aee237a */
/* bench 27349.0.4 5f9c6f3bcb83 */
/* bench 27349.0.5 6dfc87f727c9 */
/* bench 27349.0.6 5a9bec498ce1 */
/* bench 27349.0.7 c84cc5a10775 */
/* bench 27349.0.8 98b306f52900 */
/* bench 27349.0.9 3bba2f2b0af1 */
/* bench 27349.0.10 10e06b59a462 */
/* bench 27349.0.11 dd4e50a927ac */
/* bench 27349.0.12 45cd02fcccca */
/* bench 27349.0.13 22eb17d68177 */
/* bench 27349.0.14 ed64e9405b65 */
/* bench 27349.0.15 a9e6b30f66eb */
                opp-hz = /bits/ 64 <133333333>;
            };
            opp-800M {
                opp-hz = /bits/ 64 <800000000>;
            };
        };
    };

    ddrc: memory-controller@3d400000 {
        compatible = "fsl,imx8mm-ddrc", "fsl,imx8m-ddrc";
        reg = <0x3d400000 0x400000>;
        clock-names = "core", "pll", "alt", "apb";
        clocks = <&clk IMX8MM_CLK_DRAM_CORE>,
                 <&clk IMX8MM_DRAM_PLL>,
                 <&clk IMX8MM_CLK_DRAM_ALT>,
                 <&clk IMX8MM_CLK_DRAM_APB>;
    };
