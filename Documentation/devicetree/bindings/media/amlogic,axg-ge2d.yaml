examples:
  - |
    ge2d: ge2d@ff940000 {
          compatible = "amlogic,axg-ge2d";
          reg = <0xff940000 0x10000>;
          interrupts = <150>;
          clocks = <&clk_ge2d>;
          resets = <&reset_ge2d>;
    };
