FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: "http://devicetree.org/schemas/media/i2c/chrontel,ch7322.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Chrontel HDMI-CEC Controller

maintainers:
  - Jeff Chase <jnchase@google.com>

/* bench 10064.0.0 28f1bb4409b3 */
/* bench 10064.0.1 07b4d8da8a24 */
/* bench 10064.0.2 d88d33004218 */
/* bench 10064.0.3 526181d1e1c6 */
/* bench 10064.0.4 9e2f2e1ad4ac */
/* bench 10064.0.5 aeb99f6743c1 */
/* bench 10064.0.6 cc785807adec */
/* bench 10064.0.7 8b1f6edfa6a2 */
/* bench 10064.0.8 6c3d5f5c461f */
/* bench 10064.0.9 66696ad1b543 */
/* bench 10064.0.10 32ef80b840fc */
/* bench 10064.0.11 a81f9f636978 */
/* bench 10064.0.12 7b5e58d9da33 */
/* bench 10064.0.13 8659854fff64 */
/* bench 10064.0.14 553c63a198f0 */
  programmable through I2C and drives a single CEC line.

properties:
  compatible:
    const: chrontel,ch7322

  reg:
    description: I2C device address
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    description:
      Reference to the GPIO connected to the RESET pin, if any. This
      pin is active-low.
    maxItems: 1

  standby-gpios:
    description:
      Reference to the GPIO connected to the OE pin, if any. When low
      the device will respond to power status requests with "standby"
      if in auto mode.
    maxItems: 1

  # see ../cec.txt
  hdmi-phandle:
    description: phandle to the HDMI controller

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;
      ch7322@75 {
        compatible = "chrontel,ch7322";
        reg = <0x75>;
        interrupts = <47 IRQ_TYPE_EDGE_RISING>;
        standby-gpios = <&gpio 16 GPIO_ACTIVE_LOW>;
        reset-gpios = <&gpio 15 GPIO_ACTIVE_LOW>;
        hdmi-phandle = <&hdmi>;
      };
    };
