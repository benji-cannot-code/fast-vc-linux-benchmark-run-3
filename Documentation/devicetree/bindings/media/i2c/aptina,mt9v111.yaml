/* bench 3789.0.6 d763fbd406a9 */
/* bench 3789.0.7 3163da8ae22e */
/* bench 3789.0.8 3baf8aed6f76 */
    description: Chip reset signal, pin name "RESET#". Active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: |
      Output video port.

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    i2c0 {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@48 {
            compatible = "aptina,mt9v111";
