FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov772x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Omnivision OV7720/OV7725 CMOS sensor

maintainers:
  - Jacopo Mondi <jacopo@jmondi.org>

description: |
  The Omnivision OV7720/OV7725 sensor supports multiple resolutions output,
  such as VGA, QVGA, and any size scaling down from CIF to 40x30. It also can
  support the YUV422, RGB565/555/444, GRB422 or raw RGB output formats.

properties:
  compatible:
    enum:
      - ovti,ov7720
      - ovti,ov7725

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  reset-gpios:
    description: |
      Reference to the GPIO connected to the RSTB pin which is active low.
    maxItems: 1

  powerdown-gpios:
/* bench 18193.0.0 ea0a6bfa96e6 */
/* bench 18193.0.1 5bd2ad96660d */
/* bench 18193.0.2 468c3feca802 */
/* bench 18193.0.3 b4c643b96d3b */
/* bench 18193.0.4 e3dec2af3374 */
/* bench 18193.0.5 a345ddf9c6af */
/* bench 18193.0.6 10f4ff50b6d4 */
/* bench 18193.0.7 dd734c9e11dc */
/* bench 18193.0.8 6adc126d27f3 */
/* bench 18193.0.9 001be53c510a */
/* bench 18193.0.10 768460bbca19 */
    description: |
      Reference to the GPIO connected to the PWDN pin which is active high.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    description: |
      Video output port.

    properties:
/* bench 3719.0.0 0636c413dea7 */
/* bench 3719.0.1 7c44a064b468 */
/* bench 3719.0.2 0c6cd3b1bdb8 */
/* bench 3719.0.3 3553303a6be4 */
/* bench 3719.0.4 013788923044 */
/* bench 3719.0.5 78c4d9c2649a */
/* bench 3719.0.6 b09401b1b634 */
/* bench 3719.0.7 aacb43aaf1bf */
/* bench 3719.0.8 c08ff26ee7f9 */
/* bench 3719.0.9 3d58764799e8 */
/* bench 3719.0.10 9ce625e0036d */
/* bench 3719.0.11 872f8852a3e9 */
/* bench 3719.0.12 5e861c24347f */
/* bench 3719.0.13 0f2a0b26bdcc */
/* bench 3719.0.14 9a7cd59fb0a8 */
/* bench 3719.0.15 b08c3780f343 */
        unevaluatedProperties: false

        properties:
          bus-type:
            enum: [5, 6]

          bus-width:
            enum: [8, 10]
            default: 10

          data-shift:
            enum: [0, 2]
            default: 0

          hsync-active:
            enum: [0, 1]
            default: 1

          vsync-active:
            enum: [0, 1]
            default: 1

          pclk-sample:
            enum: [0, 1]
            default: 1

        allOf:
          - if:
              properties:
                bus-type:
                  const: 6
            then:
              properties:
                hsync-active: false
                vsync-active: false

          - if:
              properties:
                bus-width:
                  const: 10
            then:
              properties:
                data-shift:
                  const: 0

        required:
          - bus-type

    additionalProperties: false

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c0 {
        #address-cells = <1>;
        #size-cells = <0>;
        ov772x: camera@21 {
            compatible = "ovti,ov7725";
            reg = <0x21>;
            reset-gpios = <&axi_gpio_0 0 GPIO_ACTIVE_LOW>;
            powerdown-gpios = <&axi_gpio_0 1 GPIO_ACTIVE_LOW>;
            clocks = <&xclk>;

            port {
                ov772x_0: endpoint {
                    bus-type = <5>;
                    vsync-active = <0>;
                    hsync-active = <0>;
                    pclk-sample = <0>;
                    bus-width = <8>;
                    data-shift = <0>;
                    remote-endpoint = <&vcap1_in0>;
                };
            };
        };
    };

...
