FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/media/allwinner,sun8i-a83t-de2-rotate.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A83T DE2 Rotate Device Tree Bindings

maintainers:
  - Jernej Skrabec <jernej.skrabec@siol.net>
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

description: |-
  The Allwinner A83T and A64 have a rotation core used for
  rotating and flipping images.

properties:
  compatible:
    oneOf:
      - const: allwinner,sun8i-a83t-de2-rotate
      - items:
          - const: allwinner,sun50i-a64-de2-rotate
          - const: allwinner,sun8i-a83t-de2-rotate

  reg:
/* bench 13220.0.0 5a18fd65d571 */
/* bench 13220.0.1 af8ab5f8a2f3 */
/* bench 13220.0.2 346f0ac16951 */
/* bench 13220.0.3 26653a6650a3 */
/* bench 13220.0.4 2a2874da4305 */
/* bench 13220.0.5 7bf765fb8d76 */
/* bench 13220.0.6 b576d1f6c153 */
/* bench 21017.0.0 1b06b3d29380 */
/* bench 21017.0.1 bb7d03ecfd73 */
/* bench 13220.0.8 5df1c93aeaaf */
/* bench 13220.0.9 b53209206585 */
    maxItems: 1

  clocks:
    items:
      - description: Rotate interface clock
      - description: Rotate module clock

  clock-names:
    items:
      - const: bus
      - const: mod

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
/* bench 18004.0.0 22f2791124d3 */
/* bench 18004.0.1 cedcd28af8d4 */
/* bench 18004.0.2 76f4f41a1ae1 */
/* bench 18004.0.3 6b618e858651 */
/* bench 18004.0.4 4f5f93564c23 */
/* bench 18004.0.5 1139913bfda9 */
/* bench 18004.0.6 f2726db3df83 */
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/sun8i-de2.h>
    #include <dt-bindings/reset/sun8i-de2.h>

    rotate: rotate@1020000 {
        compatible = "allwinner,sun8i-a83t-de2-rotate";
        reg = <0x1020000 0x10000>;
        interrupts = <GIC_SPI 92 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&display_clocks CLK_BUS_ROT>,
                 <&display_clocks CLK_ROT>;
        clock-names = "bus",
                      "mod";
        resets = <&display_clocks RST_ROT>;
    };

...
