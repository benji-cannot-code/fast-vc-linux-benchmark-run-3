%YAML 1.2
---
$id: "http://devicetree.org/schemas/media/qcom,sdm845-venus-v2.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Qualcomm Venus video encode and decode accelerators

maintainers:
  - Stanimir Varbanov <stanimir.varbanov@linaro.org>

description: |
  The Venus IP is a video encode and decode accelerator present
  on Qualcomm platforms
/* bench 24093.0.0 6deeb831bdb5 */
/* bench 24093.0.1 8fe56a9a5185 */
/* bench 24093.0.2 93e349b5600b */
/* bench 24093.0.3 2aaf97153ddb */
/* bench 24093.0.4 40459270a788 */
/* bench 24093.0.5 4d4f5115efa0 */
/* bench 24093.0.6 33f568ee8c1a */
/* bench 24093.0.7 793de9e3fd40 */
/* bench 24093.0.8 7ead0e9c0e90 */
/* bench 24093.0.9 f2b153777787 */
  compatible:
/* bench 4495.0.0 b45a8e93806f */
/* bench 4495.0.1 4d4ec219b283 */
/* bench 4495.0.2 b91557f4f189 */
/* bench 4495.0.3 a09d2e20163b */
/* bench 4495.0.4 15e2e8b0f662 */
/* bench 4495.0.5 38e5bb0d02fe */
/* bench 4495.0.6 26c74f9e0a22 */
/* bench 4495.0.7 ef91375f96e5 */
/* bench 4495.0.8 94f6be8c5174 */
  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

/* bench 15004.0.0 3dca469643f0 */
/* bench 15004.0.1 d118f11de075 */
/* bench 15004.0.2 1ba42a6930df */
/* bench 15004.0.3 03731f969e75 */
/* bench 15004.0.4 24b80614ba99 */
/* bench 15004.0.5 6677b45b27ec */
/* bench 15004.0.6 fa4a3000716d */
/* bench 15004.0.7 3038aefe06cb */
/* bench 15004.0.8 01694d4c1d33 */
/* bench 15004.0.9 0c7460164ea7 */
/* bench 15004.0.10 6881b132e641 */
/* bench 15004.0.11 88b3bdd7a922 */
  power-domains:
    minItems: 3
    maxItems: 4

  power-domain-names:
    minItems: 3
    maxItems: 4
    items:
      - const: venus
      - const: vcodec0
      - const: vcodec1
      - const: cx

  clocks:
    maxItems: 7

  clock-names:
    items:
      - const: core
      - const: iface
      - const: bus
      - const: vcodec0_core
      - const: vcodec0_bus
      - const: vcodec1_core
      - const: vcodec1_bus

  iommus:
    maxItems: 2

  memory-region:
    maxItems: 1

  video-core0:
    type: object

    properties:
      compatible:
        const: venus-decoder

    required:
      - compatible

    additionalProperties: false

  video-core1:
    type: object

    properties:
      compatible:
        const: venus-encoder

    required:
      - compatible

    additionalProperties: false

  video-firmware:
    type: object

    description: |
      Firmware subnode is needed when the platform does not
      have TrustZone.

    properties:
      iommus:
        maxItems: 1

    required:
      - iommus

required:
  - compatible
  - reg
  - interrupts
  - power-domains
  - power-domain-names
  - clocks
  - clock-names
  - iommus
  - memory-region
  - video-core0
  - video-core1

additionalProperties: false

examples:
  - |
        #include <dt-bindings/interrupt-controller/arm-gic.h>
        #include <dt-bindings/clock/qcom,videocc-sdm845.h>

        video-codec@aa00000 {
                compatible = "qcom,sdm845-venus-v2";
                reg = <0x0aa00000 0xff000>;
                interrupts = <GIC_SPI 174 IRQ_TYPE_LEVEL_HIGH>;
                clocks = <&videocc VIDEO_CC_VENUS_CTL_CORE_CLK>,
                         <&videocc VIDEO_CC_VENUS_AHB_CLK>,
                         <&videocc VIDEO_CC_VENUS_CTL_AXI_CLK>,
                         <&videocc VIDEO_CC_VCODEC0_CORE_CLK>,
                         <&videocc VIDEO_CC_VCODEC0_AXI_CLK>,
                         <&videocc VIDEO_CC_VCODEC1_CORE_CLK>,
                         <&videocc VIDEO_CC_VCODEC1_AXI_CLK>;
                clock-names = "core", "iface", "bus",
                              "vcodec0_core", "vcodec0_bus",
                              "vcodec1_core", "vcodec1_bus";
                power-domains = <&videocc VENUS_GDSC>,
                                <&videocc VCODEC0_GDSC>,
                                <&videocc VCODEC1_GDSC>;
                power-domain-names = "venus", "vcodec0", "vcodec1";
                iommus = <&apps_smmu 0x10a0 0x8>,
                         <&apps_smmu 0x10b0 0x0>;
                memory-region = <&venus_mem>;

                video-core0 {
                        compatible = "venus-decoder";
                };

                video-core1 {
                        compatible = "venus-encoder";
                };
        };
