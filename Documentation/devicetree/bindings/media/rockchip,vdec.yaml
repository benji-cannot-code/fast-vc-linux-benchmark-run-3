FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/media/rockchip,vdec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip Video Decoder (VDec) Device Tree Bindings

maintainers:
  - Heiko Stuebner <heiko@sntech.de>

description: |-
  The Rockchip rk3399 has a stateless Video Decoder that can decodes H.264,
  HEVC an VP9 streams.

properties:
  compatible:
    const: rockchip,rk3399-vdec

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: The Video Decoder AXI interface clock
      - description: The Video Decoder AHB interface clock
      - description: The Video Decoded CABAC clock
      - description: The Video Decoder core clock

  clock-names:
    items:
      - const: axi
      - const: ahb
      - const: cabac
      - const: core

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains

additionalProperties: false

examples:
  - |
/* bench 20945.0.0 200af5963f26 */
/* bench 20945.0.1 3c8a64b9f46b */
/* bench 20945.0.2 e40d11404ecc */
/* bench 20945.0.3 efffaed5b4c0 */
/* bench 20945.0.4 e3b86f4e6880 */
/* bench 20945.0.5 28cc223a70d5 */

    vdec: video-codec@ff660000 {
        compatible = "rockchip,rk3399-vdec";
/* bench 18781.0.0 ba60688b012b */
/* bench 18781.0.1 1e3083641404 */
/* bench 18781.0.2 682ba77cfcac */
/* bench 18781.0.3 122c9e8c50cd */
/* bench 18781.0.4 73f61df2a3f4 */
/* bench 18781.0.5 b2bf4e770bd2 */
/* bench 18781.0.6 c4ee6613c3a1 */
/* bench 18781.0.7 c28f27b86185 */
        reg = <0xff660000 0x400>;
        interrupts = <GIC_SPI 116 IRQ_TYPE_LEVEL_HIGH 0>;
        clocks = <&cru ACLK_VDU>, <&cru HCLK_VDU>,
                 <&cru SCLK_VDU_CA>, <&cru SCLK_VDU_CORE>;
        clock-names = "axi", "ahb", "cabac", "core";
        power-domains = <&power RK3399_PD_VDU>;
        iommus = <&vdec_mmu>;
    };

...
