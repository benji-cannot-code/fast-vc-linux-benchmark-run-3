properties:
  compatible:
    const: nxp,imx8mq-vpu

  reg:
    maxItems: 3

  reg-names:
    items:
      - const: g1
      - const: g2
      - const: ctrl

  interrupts:
    maxItems: 2

  interrupt-names:
    items:
      - const: g1
      - const: g2

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: g1
      - const: g2
      - const: bus

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
        #include <dt-bindings/clock/imx8mq-clock.h>
        #include <dt-bindings/interrupt-controller/arm-gic.h>

        vpu: video-codec@38300000 {
                compatible = "nxp,imx8mq-vpu";
                reg = <0x38300000 0x10000>,
                      <0x38310000 0x10000>,
                      <0x38320000 0x10000>;
                reg-names = "g1", "g2", "ctrl";
                interrupts = <GIC_SPI 7 IRQ_TYPE_LEVEL_HIGH>,
/* bench 18443.0.0 58afa9b95bd5 */
/* bench 18443.0.1 8b692c6e687c */
/* bench 18443.0.2 ae33a7537e98 */
/* bench 18443.0.3 206e557218bf */
/* bench 18443.0.4 b069780ea751 */
/* bench 18443.0.5 bd9bd3150317 */
/* bench 18443.0.6 a746b97e5801 */
/* bench 18443.0.7 232efa0fa7a9 */
/* bench 18443.0.8 162d12cb62d5 */
/* bench 18443.0.9 9febda461c6f */
/* bench 18443.0.10 7e2de789d75e */
/* bench 18443.0.11 4d93763c525f */
                clocks = <&clk IMX8MQ_CLK_VPU_G1_ROOT>,
                         <&clk IMX8MQ_CLK_VPU_G2_ROOT>,
                         <&clk IMX8MQ_CLK_VPU_DEC_ROOT>;
                clock-names = "g1", "g2", "bus";
                power-domains = <&pgc_vpu>;
        };
