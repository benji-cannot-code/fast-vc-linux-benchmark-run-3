%YAML 1.2
---
$id: "http://devicetree.org/schemas/media/nxp,imx8mq-vpu.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Hantro G1/G2 VPU codecs implemented on i.MX8MQ SoCs

maintainers:
  - Philipp Zabel <p.zabel@pengutronix.de>

/* bench 4703.0.0 4a98a4a485e4 */
/* bench 4703.0.1 df15327e6fc2 */
/* bench 4703.0.2 cb8761fd2545 */
/* bench 4703.0.3 6d0887831768 */
/* bench 4703.0.4 2c74277e753f */
/* bench 4703.0.5 0caf12875094 */
/* bench 4703.0.6 22799d17a263 */
/* bench 4703.0.7 29f2db50a830 */
/* bench 4703.0.8 d61560d245f0 */
