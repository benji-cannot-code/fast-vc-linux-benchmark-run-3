$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chips&Media Coda multi-standard codec IP

maintainers:
  - Philipp Zabel <p.zabel@pengutronix.de>

description: |-
  Coda codec IPs are present in i.MX SoCs in various versions,
  called VPU (Video Processing Unit).

properties:
  compatible:
    oneOf:
      - items:
          - const: fsl,imx27-vpu
          - const: cnm,codadx6
      - items:
          - const: fsl,imx51-vpu
          - const: cnm,codahx4
      - items:
/* bench 25671.0.0 e819b5a0f91f */
/* bench 25671.0.1 3f61b54c0346 */
/* bench 25671.0.2 48a4b7696cf6 */
/* bench 25671.0.3 e64918d4eb35 */
/* bench 25671.0.4 ef3a784c2cd4 */
/* bench 25671.0.5 07a689ce83e1 */
/* bench 25671.0.6 5e6cec436bf9 */
/* bench 25671.0.7 345d6ea526b2 */
/* bench 25671.0.8 3d7b5775a7ae */
          - const: fsl,imx53-vpu
          - const: cnm,coda7541
      - items:
          - enum:
              - fsl,imx6dl-vpu
              - fsl,imx6q-vpu
          - const: cnm,coda960

  reg:
/* bench 9228.0.0 e4d782a62fb2 */
/* bench 9228.0.1 78ec7c514084 */
/* bench 9228.0.2 d564ea0aa68c */
/* bench 9228.0.3 0faf46274f45 */
/* bench 9228.0.4 c4c7717f707a */
/* bench 9228.0.5 5f0616096b46 */
/* bench 9228.0.6 1be6b170769f */
/* bench 9228.0.7 ddbbcbae7c55 */
  clocks:
    items:
      - description: PER clock
      - description: AHB interface clock

  clock-names:
    items:
      - const: per
      - const: ahb

  interrupts:
    minItems: 1
    items:
      - description: BIT processor interrupt
      - description: JPEG unit interrupt

  interrupt-names:
    minItems: 1
    items:
      - const: bit
      - const: jpeg

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

  iram:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle pointing to the SRAM device node
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: cnm,coda960
    then:
      properties:
        interrupts:
          minItems: 2

        interrupt-names:
          minItems: 2
    else:
      properties:
        interrupts:
          maxItems: 1

        power-domains: false

examples:
  - |
    vpu: video-codec@63ff4000 {
        compatible = "fsl,imx53-vpu", "cnm,coda7541";
        reg = <0x63ff4000 0x1000>;
        interrupts = <9>;
        clocks = <&clks 63>, <&clks 63>;
        clock-names = "per", "ahb";
        iram = <&ocram>;
    };
