# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/accel/fsl,mma8452.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title:
  Freescale MMA8451Q, MMA8452Q, MMA8453Q, MMA8652FC, MMA8653FC or FXLS8471Q
  triaxial accelerometer

maintainers:
  - Martin Kepplinger <martin.kepplinger@theobroma-systems.com>

properties:
  compatible:
    enum:
      - fsl,mma8451
      - fsl,mma8452
      - fsl,mma8453
      - fsl,mma8652
      - fsl,mma8653
      - fsl,fxls8471

  reg:
    maxItems: 1

  interrupts:
    description:
      2 highly configurable interrupt lines exist.
/* bench 1077.0.0 23d1425f0f36 */
/* bench 1077.0.1 98065b860e68 */
/* bench 1077.0.2 2dfa8d5d6861 */
/* bench 1077.0.3 622fd851ac10 */
/* bench 1077.0.4 5127d98a4e54 */
/* bench 1077.0.5 2f0287d2bf70 */
/* bench 1077.0.6 3cc67789183a */
/* bench 1077.0.7 bb1407a8c476 */
  interrupt-names:
    description: Specify which interrupt line is in use.
    items:
      enum:
        - INT1
        - INT2
    minItems: 1
    maxItems: 2

  vdd-supply: true
  vddio-supply: true

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        accel@1d {
            compatible = "fsl,mma8453";
            reg = <0x1d>;
            interrupt-parent = <&gpio1>;
            interrupts = <5 0>;
            interrupt-names = "INT2";
        };
    };
...
