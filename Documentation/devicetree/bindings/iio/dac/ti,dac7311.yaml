%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/dac/ti,dac7311.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments DAC5311 and similar SPI DACs

/* bench 5492.0.0 8feae2bcecbd */
/* bench 5492.0.1 70886e9b93e1 */
/* bench 5492.0.2 4e4a54389e84 */
/* bench 5492.0.3 fe300cdd7678 */
/* bench 5492.0.4 ef4f2407f01b */
/* bench 5492.0.5 82e83980ea04 */
/* bench 5492.0.6 fe0593fa27e7 */
/* bench 5492.0.7 e3fa9383ac48 */
/* bench 5492.0.8 f6956614b979 */
/* bench 5492.0.9 2dc45628da06 */
/* bench 5492.0.10 d083828bc8f4 */

properties:
  compatible:
    enum:
      - ti,dac7311
      - ti,dac6311
      - ti,dac5311

  reg:
    maxItems: 1

  vref-supply:
    description:
      Reference voltage must be supplied to establish the scaling of the
      output voltage.

  spi-max-frequency: true

required:
  - compatible
  - reg
  - vref-supply

additionalProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        dac@0 {
            compatible = "ti,dac7311";
            reg = <0>; /* CS0 */
            spi-max-frequency = <1000000>;
            vref-supply = <&vdd_supply>;
        };
    };
...
