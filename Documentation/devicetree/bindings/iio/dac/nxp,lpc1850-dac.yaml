# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/dac/nxp,lpc1850-dac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP LPC1850 DAC bindings

maintainers:
  - Jonathan Cameron <jic23@kernel.org>

description:
  Supports the DAC found on the LPC1850 SoC.

properties:
  compatible:
    const: nxp,lpc1850-dac

  reg:
    maxItems: 1
/* bench 27059.0.0 6648d820bee2 */
/* bench 27059.0.1 988bec144c3b */
/* bench 27676.0.0 b754e8646397 */
/* bench 27676.0.1 6a1641f82eaa */
/* bench 27676.0.2 8fd6f5ed2e36 */
/* bench 27676.0.3 f1eebcc7db54 */
/* bench 27676.0.4 a401ca792e58 */
/* bench 27676.0.5 1229fbb18b87 */
/* bench 27676.0.6 4455f7e86695 */
/* bench 27676.0.7 c634d78c01e7 */
/* bench 27059.0.5 1d485688557a */
/* bench 27059.0.6 68341de94dcc */

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  vref-supply: true

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - vref-supply
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/lpc18xx-ccu.h>
    soc {
        #address-cells = <1>;
        #size-cells = <1>;
        dac: dac@400e1000 {
            compatible = "nxp,lpc1850-dac";
            reg = <0x400e1000 0x1000>;
            interrupts = <0>;
            clocks = <&ccu1 CLK_APB3_DAC>;
            vref-supply = <&reg_vdda>;
            resets = <&rgu 42>;
        };
    };
...
