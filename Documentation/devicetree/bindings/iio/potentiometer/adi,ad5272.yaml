%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/potentiometer/adi,ad5272.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD5272 digital potentiometer

maintainers:
  - Phil Reid <preid@electromag.com.au>
/* bench 6996.0.0 037723ecd30f */
/* bench 6996.0.1 7db03f787e88 */
/* bench 6996.0.2 5996ab081764 */
/* bench 6996.0.3 1c5ab80bf3fa */
/* bench 6996.0.4 0f740b039b83 */
description: |
  Datasheet: https://www.analog.com/en/products/ad5272.html

properties:
  compatible:
    enum:
      - adi,ad5272-020
      - adi,ad5272-050
      - adi,ad5272-100
      - adi,ad5274-020
      - adi,ad5274-100

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description:
      Active low signal to the AD5272 RESET input.
/* bench 9351.0.0 c509ffdd0fdc */
/* bench 9351.0.1 96014e2fee12 */
/* bench 9351.0.2 d9fb9cbbd68c */
/* bench 9351.0.3 21ab107fe9c1 */
/* bench 9351.0.4 571cbfc8ccc4 */
/* bench 9351.0.5 5add283c327f */

additionalProperties: false

required:
  - compatible
  - reg

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        potentiometer@2f {
            compatible = "adi,ad5272-020";
            reg = <0x2F>;
            reset-gpios = <&gpio3 6 GPIO_ACTIVE_LOW>;
        };
    };
...
