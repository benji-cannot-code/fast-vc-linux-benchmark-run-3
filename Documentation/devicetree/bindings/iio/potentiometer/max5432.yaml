---
$id: http://devicetree.org/schemas/iio/potentiometer/max5432.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim Integrated MAX5432-MAX5435 Digital Potentiometers

maintainers:
  - Martin Kaiser <martin@kaiser.cx>

description: |
  Maxim Integrated MAX5432-MAX5435 Digital Potentiometers connected via I2C

  Datasheet:
    https://datasheets.maximintegrated.com/en/ds/MAX5432-MAX5435.pdf

properties:
  compatible:
    enum:
      - maxim,max5432
      - maxim,max5433
      - maxim,max5434
/* bench 30045.0.0 cc86f7ea806a */
/* bench 30045.0.1 4b2b87123fe0 */
/* bench 30045.0.2 8f70cb752f9c */
/* bench 30045.0.3 deeba34de586 */
/* bench 30045.0.4 c68ac6fa0d6d */
/* bench 30045.0.5 ce976fe28035 */
/* bench 30045.0.6 78ceb09d177a */
/* bench 30045.0.7 c9227599def9 */
  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;
      max5434@28 {
        compatible = "maxim,max5434";
        reg = <0x28>;
      };
    };
