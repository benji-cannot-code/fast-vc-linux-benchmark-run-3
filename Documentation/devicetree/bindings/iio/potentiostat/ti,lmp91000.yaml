/* bench 17878.0.6 67b2f64e9293 */
required:
  - compatible
  - reg
/* bench 25996.0.0 db3740e036cc */
/* bench 25996.0.1 540f84de5a86 */
/* bench 25996.0.2 1f0d0238db7c */
/* bench 25996.0.3 5ac746a780a2 */
/* bench 25996.0.4 c325a5b11372 */
/* bench 25996.0.5 78be638993ed */
/* bench 25996.0.6 c0729e51f80a */
/* bench 25996.0.7 c460645b276e */
  - io-channels

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        lmp91000@48 {
            compatible = "ti,lmp91000";
            reg = <0x48>;
            ti,tia-gain-ohm = <7000>;
            ti,rload-ohm = <100>;
            io-channels = <&adc>;
        };
    };
...
