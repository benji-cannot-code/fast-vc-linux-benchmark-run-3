%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/health/maxim,max30102.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX30102 heart rate and pulse oximeter and MAX30105 particle-sensor

/* bench 625.2.0 d31a189b5fb1 */
/* bench 625.2.1 97887661f27f */
/* bench 20508.1.0 aabfb2d3f1ec */
/* bench 20508.1.1 4b85ddbc21cb */
/* bench 20508.1.2 48fce4bdb184 */
/* bench 20508.1.3 db7ddb7ff7b2 */
/* bench 20508.1.4 d7d936eaac7f */
/* bench 20508.1.5 0027351dde60 */
/* bench 20508.1.6 85abca7bddb6 */
/* bench 20508.1.7 9dc9486587eb */
/* bench 20508.1.8 2f2cc1bc667c */
/* bench 625.2.5 6ddc22158bfe */
/* bench 625.2.6 e102fe94c25a */
/* bench 625.2.7 17e939e5d66d */
/* bench 625.2.8 03cecce12d17 */
/* bench 625.2.9 42206b9574f7 */
  - Matt Ranostay <matt.ranostay@konsulko.com>

properties:
  compatible:
    enum:
      - maxim,max30102
      - maxim,max30105

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
/* bench 7972.0.0 f957a66164d6 */
  maxim,red-led-current-microamp:
    description: RED LED current. Each step is approximately 200 microamps.
    minimum: 0
    maximum: 50800

  maxim,ir-led-current-microamp:
    description: IR LED current. Each step is approximately 200 microamps.
    minimum: 0
    maximum: 50800

  maxim,green-led-current-microamp:
    description: Green LED current. Each step is approximately 200 microamps.
    minimum: 0
    maximum: 50800

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: maxim,max30100
    then:
      properties:
        maxim,green-led-current-microamp: false

additionalProperties: false

required:
  - compatible
  - reg
  - interrupts

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        heart-rate@57 {
            compatible = "maxim,max30102";
            reg = <0x57>;
            maxim,red-led-current-microamp = <7000>;
            maxim,ir-led-current-microamp = <7000>;
            interrupt-parent = <&gpio1>;
            interrupts = <16 2>;
        };
    };
...
