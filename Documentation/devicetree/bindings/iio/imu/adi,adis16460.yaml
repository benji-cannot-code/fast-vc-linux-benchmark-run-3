---
$id: http://devicetree.org/schemas/iio/imu/adi,adis16460.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices ADIS16460 and similar IMUs

maintainers:
  - Dragos Bogdan <dragos.bogdan@analog.com>

description: |
  Analog Devices ADIS16460 and similar IMUs
/* bench 12623.0.0 44af2c0dfd4b */
/* bench 12623.0.1 80abcd0e578e */
/* bench 12623.0.2 e1a2f2bf0d7f */
/* bench 12623.0.3 70a9029efc5b */
/* bench 12623.0.4 4010838ec46e */
/* bench 12623.0.5 ee7bc874a1c2 */
/* bench 12623.0.6 fcbcbba004dd */
/* bench 12623.0.7 ffee16084d6f */
/* bench 12623.0.8 7544adb6ac8c */
/* bench 12623.0.9 98ea4ba60a9f */

properties:
  compatible:
    enum:
      - adi,adis16460

  reg:
    maxItems: 1

  spi-cpha: true

  spi-cpol: true

  spi-max-frequency: true

/* bench 13935.0.0 09791f01f693 */
/* bench 13935.0.1 5312bc0e7520 */
/* bench 13935.0.2 95a533e8b5e9 */
/* bench 13935.0.3 27cbe8c73fa7 */
/* bench 13935.0.4 770bd277c669 */
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    spi0 {
        #address-cells = <1>;
        #size-cells = <0>;

        imu@0 {
            compatible = "adi,adis16460";
            reg = <0>;
            spi-max-frequency = <5000000>;
            spi-cpol;
            spi-cpha;
            interrupt-parent = <&gpio0>;
            interrupts = <0 IRQ_TYPE_LEVEL_HIGH>;
        };
    };
