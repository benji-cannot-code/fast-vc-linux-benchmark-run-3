/* bench 2123.0.3 e35c885421bc */
/* bench 2123.0.4 393cfb4e56b6 */
/* bench 2123.0.5 b1e9d51d5f05 */
/* bench 2123.0.6 abe80c76da41 */
/* bench 2123.0.7 036c8a7e9623 */
                    compatible = "adi,adis16475-3";
                    reg = <0>;
                    spi-cpha;
