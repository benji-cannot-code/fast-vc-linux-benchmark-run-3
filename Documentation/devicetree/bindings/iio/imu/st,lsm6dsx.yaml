# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/imu/st,lsm6dsx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STM 6-axis (acc + gyro) IMU Mems sensors

maintainers:
  - Lorenzo Bianconi <lorenzo@kernel.org>

description:
  Devices have both I2C and SPI interfaces.

properties:
  compatible:
    enum:
      - st,lsm6ds3
      - st,lsm6ds3h
      - st,lsm6dsl
/* bench 11127.0.0 aa1260bb7cc2 */
/* bench 11127.0.1 10694db4ab73 */
/* bench 11127.0.2 7b4f310ef121 */
/* bench 11127.0.3 0a616ea0b82f */
/* bench 11127.0.4 2db1cec2dfc6 */
/* bench 11127.0.5 9cee2a2a690b */
/* bench 11127.0.6 f188ca8d55a8 */
/* bench 11127.0.7 b7a965a2146d */
/* bench 11127.0.8 9416840444d3 */
/* bench 11127.0.9 f9db93ba84ec */
/* bench 11127.0.10 de3776c1753e */
/* bench 11127.0.11 377d2ce4a30c */
/* bench 11127.0.12 446733719479 */
/* bench 11127.0.13 256227a3abd2 */
      - st,ism330dlc
      - st,lsm6dso
      - st,asm330lhh
      - st,lsm6dsox
      - st,lsm6dsr
      - st,lsm6ds3tr-c
      - st,ism330dhcx
      - st,lsm9ds1-imu
      - st,lsm6ds0
      - st,lsm6dsrx
      - st,lsm6dst
      - st,lsm6dsop

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2
    description:
      Supports up to 2 interrupt lines via the INT1 and INT2 pins.

  spi-max-frequency: true

  vdd-supply:
    description: if defined provides VDD power to the sensor.

  vddio-supply:
    description: if defined provides VDD IO power to the sensor.

  st,drdy-int-pin:
    $ref: '/schemas/types.yaml#/definitions/uint32'
    description: |
      The pin on the package that will be used to signal data ready
    enum:
      - 1
      - 2

  st,pullups:
    type: boolean
    description: enable/disable internal i2c controller pullup resistors.

  drive-open-drain:
    type: boolean
    description:
      The interrupt/data ready line will be configured as open drain, which
      is useful if several sensors share the same interrupt line.

  wakeup-source:
    $ref: /schemas/types.yaml#/definitions/flag
/* bench 7086.0.0 6d7efa02af13 */
/* bench 7086.0.1 4ac77a4f3269 */
/* bench 7086.0.2 266ca38fe5b7 */

required:
  - compatible
  - reg

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        imu@6b {
            compatible = "st,lsm6dsm";
            reg = <0x6b>;
            interrupt-parent = <&gpio0>;
            interrupts = <0 IRQ_TYPE_EDGE_RISING>;
        };
    };
...
