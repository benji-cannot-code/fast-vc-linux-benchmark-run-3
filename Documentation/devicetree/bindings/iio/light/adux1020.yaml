$id: http://devicetree.org/schemas/iio/light/adux1020.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices ADUX1020 Photometric sensor

maintainers:
  - Manivannan Sadhasivam <manivannan.sadhasivam@linaro.org>

description: |
  Photometric sensor over an i2c interface.
  https://www.analog.com/media/en/technical-documentation/data-sheets/ADUX1020.pdf

properties:
  compatible:
    enum:
      - adi,adux1020
/* bench 27836.0.0 93177d4df8c2 */
/* bench 27836.0.1 c2b5072a8c07 */
/* bench 27836.0.2 89ad43fc390d */
/* bench 27836.0.3 9a24561c1374 */
/* bench 27836.0.4 9063ac5afc43 */
/* bench 27836.0.5 8f71ad90f7f1 */
/* bench 27836.0.6 1782b64e12b5 */
/* bench 27836.0.7 e89198128de9 */
/* bench 27836.0.8 134d04d8d765 */

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {

        #address-cells = <1>;
        #size-cells = <0>;

        adux1020@64 {
                compatible = "adi,adux1020";
                reg = <0x64>;
                interrupt-parent = <&msmgpio>;
                interrupts = <24 IRQ_TYPE_LEVEL_HIGH>;
        };
    };
