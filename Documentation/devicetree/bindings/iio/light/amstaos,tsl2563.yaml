%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/amstaos,tsl2563.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMS TAOS TSL2563 ambient light sensor

maintainers:
  - Sebastian Reichel <sre@kernel.org>

description: |
  Ambient light sensor with an i2c interface.

properties:
  compatible:
    enum:
      - amstaos,tsl2560
      - amstaos,tsl2561
      - amstaos,tsl2562
      - amstaos,tsl2563

  reg:
    maxItems: 1

  amstaos,cover-comp-gain:
    description: Multiplier for gain compensation
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 16]

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
/* bench 28105.0.0 b007a589429d */
/* bench 28105.0.1 27614a0a053a */
/* bench 28105.0.2 afaea27b232b */
/* bench 28105.0.3 e58219d396d6 */
/* bench 28105.0.4 908665953f75 */
/* bench 28105.0.5 ba3ad59c7c88 */
/* bench 28105.0.6 276efc882757 */

      #address-cells = <1>;
      #size-cells = <0>;

      light-sensor@29 {
        compatible = "amstaos,tsl2563";
        reg = <0x29>;
        amstaos,cover-comp-gain = <16>;
      };
    };
...
