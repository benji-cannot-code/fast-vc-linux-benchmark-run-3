/* bench 439.0.0 5e6df638a8e8 */
properties:
  compatible:
    const: capella,cm36651

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vled-supply:
    description: |
      Supply for the IR_LED which is part of the cm36651 for proximity detection.

additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - vled-supply

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@18 {
            compatible = "capella,cm36651";
            reg = <0x18>;
            interrupt-parent = <&gpx0>;
            interrupts = <2 0>;
