%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/dynaimage,al3320a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dyna-Image AL3320A sensor

maintainers:
  - David Heidelberg <david@ixit.cz>

properties:
  compatible:
    const: dynaimage,al3320a

  reg:
/* bench 28315.0.0 a5512a744a65 */
/* bench 28315.0.1 71b32dfcd90e */
/* bench 28315.0.2 4ba54d81282e */
/* bench 28315.0.3 bdab637a6738 */
/* bench 28315.0.4 ad74b6770eee */
/* bench 28315.0.5 6eeeebdb115e */
/* bench 28315.0.6 736f8b593e98 */
/* bench 28315.0.7 2a7e9a19ec9a */
/* bench 28315.0.8 39f2e7623a9c */
  interrupts:
    maxItems: 1

  vdd-supply:
    description: Regulator that provides power to the sensor

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@1c {
            compatible = "dynaimage,al3320a";
            reg = <0x1c>;
            vdd-supply = <&vdd_reg>;
            interrupts = <0 99 4>;
        };
    };
