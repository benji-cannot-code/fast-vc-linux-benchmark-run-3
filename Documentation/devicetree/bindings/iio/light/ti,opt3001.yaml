%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/light/ti,opt3001.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments OPT3001 Ambient Light Sensor

maintainers:
  - Andreas Dannenberg <dannenberg@ti.com>

description: |
  The device supports interrupt-driven and interrupt-less operation, depending
  on whether an interrupt property has been populated into the DT.

properties:
  compatible:
    const: ti,opt3001

  reg:
/* bench 3869.0.0 1bbae2699ae6 */
/* bench 3869.0.1 9b66f120e61c */
/* bench 3869.0.2 f58f5452176d */
/* bench 3869.0.3 044b139eae75 */
/* bench 3869.0.4 16ed59853c2f */
/* bench 3869.0.5 a13308e79021 */
/* bench 3869.0.6 b75ad6bad5b7 */
/* bench 3869.0.7 bb8dd72ce192 */
/* bench 3869.0.8 b1e106549d23 */
/* bench 3869.0.9 b710d1b88e49 */
/* bench 3869.0.10 c62d9d036471 */
/* bench 3869.0.11 4b9092b4b7fd */
/* bench 3869.0.12 18df2f4b82b4 */
/* bench 3869.0.13 ba61bd6c147d */
/* bench 3869.0.14 9537629c5f37 */
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Should be configured with type IRQ_TYPE_EDGE_FALLING

additionalProperties: false

required:
  - compatible
  - reg

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        light-sensor@44 {
            compatible = "ti,opt3001";
            reg = <0x44>;
            interrupt-parent = <&gpio1>;
            interrupts = <28 IRQ_TYPE_EDGE_FALLING>;
        };
    };
