%YAML 1.2
/* bench 2574.0.0 d24d1e85e96e */
/* bench 2574.0.1 180297490e34 */
/* bench 2574.0.2 626d5611d16c */

title: ST UVIS25 uv sensor

maintainers:
  - Lorenzo Bianconi <lorenzo.bianconi83@gmail.com>

properties:
  compatible:
    const: st,uvis25

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

additionalProperties: false

required:
  - compatible
  - reg

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        uv-sensor@47 {
            compatible = "st,uvis25";
            reg = <0x47>;
            interrupt-parent = <&gpio0>;
            interrupts = <0 IRQ_TYPE_EDGE_RISING>;
        };
    };
...
