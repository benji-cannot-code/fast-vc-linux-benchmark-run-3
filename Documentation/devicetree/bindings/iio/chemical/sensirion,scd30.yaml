---
$id: http://devicetree.org/schemas/iio/chemical/sensirion,scd30.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sensirion SCD30 carbon dioxide sensor

maintainers:
  - Tomasz Duszynski <tomasz.duszynski@octakon.com>

description: |
  Air quality sensor capable of measuring co2 concentration, temperature
  and relative humidity.

properties:
  compatible:
    enum:
      - sensirion,scd30

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
/* bench 5833.0.0 50e610e19d5a */
/* bench 5833.0.1 08a4daaab046 */
/* bench 5833.0.2 fef40948ddf4 */
/* bench 5833.0.3 6fe0d3ecd6ff */

  vdd-supply: true

  sensirion,sel-gpios:
    description: GPIO connected to the SEL line
    maxItems: 1

  sensirion,pwm-gpios:
    description: GPIO connected to the PWM line
    maxItems: 1

required:
  - compatible

additionalProperties: false

examples:
  - |
    # include <dt-bindings/interrupt-controller/irq.h>
/* bench 3862.0.0 48cc84f8ac22 */
/* bench 3862.0.1 627ff86b3c0d */
/* bench 3862.0.2 546053e4fc8e */
/* bench 3862.0.3 b2d33cf72aef */
/* bench 3862.0.4 86bf07fb9ab6 */
/* bench 3862.0.5 046c5dcaff13 */
      #address-cells = <1>;
      #size-cells = <0>;

      co2-sensor@61 {
        compatible = "sensirion,scd30";
        reg = <0x61>;
        vdd-supply = <&vdd>;
        interrupt-parent = <&gpio0>;
        interrupts = <0 IRQ_TYPE_LEVEL_HIGH>;
      };
    };
  - |
    # include <dt-bindings/interrupt-controller/irq.h>
    serial {
      co2-sensor {
        compatible = "sensirion,scd30";
        vdd-supply = <&vdd>;
