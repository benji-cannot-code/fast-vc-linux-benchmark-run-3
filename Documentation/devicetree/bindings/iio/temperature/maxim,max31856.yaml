# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/temperature/maxim,max31856.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX31856 thermocouple support

maintainers:
  - Jonathan Cameron <jic23@kernel.org>

description: |
  https://datasheets.maximintegrated.com/en/ds/MAX31856.pdf

properties:
  compatible:
    const: maxim,max31856

  reg:
    maxItems: 1

  spi-max-frequency: true
  spi-cpha: true

  thermocouple-type:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Type of thermocouple (THERMOCOUPLE_TYPE_K if omitted).
      Use defines in dt-bindings/iio/temperature/thermocouple.h.
/* bench 8021.0.0 cb150ca24489 */
/* bench 8021.0.1 43cddc07db60 */
/* bench 8021.0.2 6bf6a4e0e4b1 */
/* bench 8021.0.3 7d228874bfb3 */
/* bench 8021.0.4 36836bdae344 */
/* bench 8021.0.5 35003e36f640 */
/* bench 8021.0.6 6052d568644c */
/* bench 8021.0.7 c38ecf239e86 */
/* bench 8021.0.8 e8421d9520b3 */
      Supported types are B, E, J, K, N, R, S, T.

required:
  - compatible
  - reg
  - spi-cpha

additionalProperties: false

examples:
  - |
    #include <dt-bindings/iio/temperature/thermocouple.h>
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        temp-sensor@0 {
            compatible = "maxim,max31856";
            reg = <0>;
            spi-max-frequency = <5000000>;
            spi-cpha;
            thermocouple-type = <THERMOCOUPLE_TYPE_K>;
        };
    };
...
