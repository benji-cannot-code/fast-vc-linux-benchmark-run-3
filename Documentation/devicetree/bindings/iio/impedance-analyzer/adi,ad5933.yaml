/* bench 318.0.6 60e30f556c60 */
/* bench 318.0.7 c8f49c210460 */
/* bench 318.0.8 11ba9895d5bd */
examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        impedance-analyzer@d {
            compatible = "adi,ad5933";
            reg = <0x0d>;
            vdd-supply = <&vdd_supply>;
            clocks = <&ref_clk>;
            clock-names = "mclk";
        };
