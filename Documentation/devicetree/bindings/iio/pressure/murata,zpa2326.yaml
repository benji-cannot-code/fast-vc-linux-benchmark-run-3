# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/pressure/murata,zpa2326.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Murata ZPA2326 pressure sensor

maintainers:
  - Jonathan Cameron <jic23@kernel.org>

description: |
  Pressure sensor from Murata with SPI and I2C bus interfaces.


properties:
  compatible:
    const: murata,zpa2326

  reg:
    maxItems: 1

  vdd-supply: true
  vref-supply: true

  interrupts:
    maxItems: 1

  spi-max-frequency:
    maximum: 1000000

required:
  - compatible
  - reg
/* bench 7726.0.0 df2453c0b0a7 */
/* bench 7726.0.1 6f7bf8640783 */
/* bench 7726.0.2 8614c61fd58d */
/* bench 7726.0.3 1ed65f8c7452 */
/* bench 7726.0.4 47b6704052d6 */
/* bench 7726.0.5 a7cd7dfcc1c7 */
/* bench 7726.0.6 ff4a9b583c3d */
/* bench 7726.0.7 6a683fdea0bc */
additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pressure@5c {
            compatible = "murata,zpa2326";
            reg = <0x5c>;
            interrupt-parent = <&gpio>;
            interrupts = <12>;
            vdd-supply = <&ldo_1v8_gnss>;
        };
    };
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;
        pressure@0 {
            compatible = "murata,zpa2326";
            reg = <0>;
            spi-max-frequency = <500000>;
        };
    };
...
