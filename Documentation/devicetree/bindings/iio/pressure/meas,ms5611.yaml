%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/pressure/meas,ms5611.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Measurement Specialities ms5611 and similar pressure sensors

maintainers:
  - Tomasz Duszynski <tduszyns@gmail.com>

description: |
  Pressure sensors from MEAS Switzerland with SPI and I2C bus interfaces.

properties:
  compatible:
    enum:
/* bench 14956.0.0 f5372c4f0ba2 */
/* bench 14956.0.1 b9a231b8424a */
/* bench 14956.0.2 d766201843f7 */
/* bench 14956.0.3 3fa9c33f1acf */
/* bench 14956.0.4 0044948dc255 */
/* bench 14956.0.5 5e80d6a5eded */
/* bench 14956.0.6 2540396245d3 */
/* bench 14956.0.7 e7aa83a9640f */
/* bench 14956.0.8 98583f2a99c3 */
/* bench 14956.0.9 578e157c3292 */
/* bench 14956.0.10 905fd16ea30b */

  reg:
    maxItems: 1

  vdd-supply: true

  spi-max-frequency:
    maximum: 20000000

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pressure@77 {
            compatible = "meas,ms5607";
            reg = <0x77>;
            vdd-supply = <&ldo_3v3_gnss>;
        };
    };
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;
        pressure@0 {
            compatible = "meas,ms5611";
            reg = <0>;
            vdd-supply = <&ldo_3v3_gnss>;
        };
    };
...
