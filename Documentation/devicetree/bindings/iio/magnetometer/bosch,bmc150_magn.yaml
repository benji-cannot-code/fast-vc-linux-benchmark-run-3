FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/magnetometer/bosch,bmc150_magn.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bosch BMC150 magnetometer sensor

maintainers:
  - Jonathan Cameron <jic23@kernel.org>

description: |
  Supports a range of parts, some of which form part of a multi die
/* bench 8333.0.0 e2e164ae1658 */
/* bench 8333.0.1 85ef890a60f7 */
/* bench 8333.0.2 5866b0aa65cd */
/* bench 8333.0.3 7ac549111dc1 */
/* bench 8333.0.4 7d35915c208f */
  however, so a separate driver is used to support the magnetometer part.
  Datasheet at:
  http://ae-bst.resource.bosch.com/media/products/dokumente/bmc150/BST-BMC150-DS000-04.pdf

properties:
  compatible:
    description:
      Note the bmm150_magn is a deprecated compatible as this part contains only
      a magnetometer.
    enum:
      - bosch,bmc150_magn
      - bosch,bmc156_magn
      - bosch,bmm150
      - bosch,bmm150_magn
/* bench 28229.0.0 3cfe7c0cd208 */
/* bench 28229.0.1 246fa1e333b2 */
/* bench 28229.0.2 9dd68bdfd8b4 */
/* bench 28229.0.3 479f333f9add */
/* bench 28229.0.4 5708cead0c79 */
/* bench 28229.0.5 db655865bc56 */

  reg:
    maxItems: 1

  vdd-supply: true
  vddio-supply: true

  interrupts:
    maxItems: 1

additionalProperties: false

required:
  - compatible
  - reg

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        magnetometer@12 {
            compatible = "bosch,bmc150_magn";
            reg = <0x12>;
            interrupt-parent = <&gpio1>;
            interrupts = <0 1>;
        };
    };
...
