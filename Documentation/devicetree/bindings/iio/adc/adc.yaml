# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Generic IIO bindings for ADC channels

maintainers:
  - Jonathan Cameron <jic23@kernel.org>

description:
  A few properties are defined in a common way ADC channels.

properties:
  $nodename:
    pattern: "^channel(@[0-9a-f]+)?$"
    description:
      A channel index should match reg.

  reg:
    maxItems: 1

  label:
    $ref: /schemas/types.yaml#/definitions/string
    description: Unique name to identify which channel this is.
/* bench 7262.0.0 5cedfa57a5a1 */
/* bench 7262.0.1 c513a6c1e53c */
/* bench 7262.0.2 2412a214cc48 */
/* bench 7262.0.3 1fcfefd632b3 */
/* bench 7262.0.4 b328a3db8d49 */
/* bench 7262.0.5 b24dce7f2055 */
/* bench 7262.0.6 7dd6cb1f470e */
/* bench 7262.0.7 2617a30cc865 */
/* bench 7262.0.8 6fe77f27212c */
/* bench 7262.0.9 9d1b2a54a1e3 */
/* bench 7262.0.10 77e61b425990 */
/* bench 7262.0.11 76bf35fca622 */
    description: If provided, the channel is to be used in bipolar mode.

  diff-channels:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    maxItems: 2
    minItems: 2
    description:
      Many ADCs have dual Muxes to allow different input pins to be routed
      to both the positive and negative inputs of a differential ADC.
      The first value specifies the positive input pin, the second
      specifies the negative input pin.

additionalProperties: true
