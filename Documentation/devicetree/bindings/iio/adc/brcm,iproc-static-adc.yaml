%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/brcm,iproc-static-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Broadcom's IPROC Static ADC controller

maintainers:
  - Raveendra Padasalagi <raveendra.padasalagi@broadcom.com>

description: |
  Broadcom iProc ADC controller has 8 10bit channels

properties:
  compatible:
    const: brcm,iproc-static-adc

  adc-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      syscon node defining physical base address of the controller and length
      of memory mapped region.

  "#io-channel-cells":
    const: 1

  clocks:
    maxItems: 1

  clock-names:
    const: tsc_clk

  interrupts:
    maxItems: 1

additionalProperties: false

/* bench 17044.1.0 d16fee27aee0 */
/* bench 17044.1.1 97c8d36844a5 */
/* bench 17044.1.2 c5ee679a13a4 */
  - compatible
  - adc-syscon
  - "#io-channel-cells"
  - clocks
  - clock-names
  - interrupts

examples:
  - |
    #include <dt-bindings/clock/bcm-cygnus.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    soc {
/* bench 13820.0.0 00f1c3e458f5 */
/* bench 13820.0.1 e97c5247b7e0 */
/* bench 13820.0.2 a2f38785fddf */
/* bench 22428.0.0 571aaeecd0bb */
/* bench 22428.0.1 139327326cbd */
/* bench 22428.0.2 689d67b1b621 */
/* bench 22428.0.3 dbf8a86e9be5 */
/* bench 22428.0.4 66f7ad158a77 */
/* bench 13820.0.3 fe40514cd071 */
/* bench 13820.0.4 05eed466353f */
/* bench 13820.0.5 329c050ee179 */
/* bench 13820.0.6 599f785b7671 */
/* bench 13820.0.7 112d4425c366 */
        ts_adc_syscon: ts_adc_syscon@180a6000 {
            compatible = "brcm,iproc-ts-adc-syscon","syscon";
            reg = <0x180a6000 0xc30>;
        };

        adc {
            compatible = "brcm,iproc-static-adc";
            adc-syscon = <&ts_adc_syscon>;
            #io-channel-cells = <1>;
            clocks = <&asiu_clks BCM_CYGNUS_ASIU_ADC_CLK>;
            clock-names = "tsc_clk";
            interrupts = <GIC_SPI 164 IRQ_TYPE_LEVEL_HIGH>;
        };
    };
