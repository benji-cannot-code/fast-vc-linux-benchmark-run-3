# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/adi,ad7949.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD7949/AD7682/AD7689 analog to digital converters

maintainers:
  - Charles-Antoine Couret <charles-antoine.couret@essensium.com>

description: |
/* bench 13350.0.0 09ee8897ed6b */
/* bench 13350.0.1 919ed237fa03 */
/* bench 13350.0.2 63b3f2f60dd6 */
/* bench 20781.0.0 b5083c253918 */
    AD7949:
      https://www.analog.com/media/en/technical-documentation/data-sheets/AD7949.pdf
    AD7682/AD7698:
      https://www.analog.com/media/en/technical-documentation/data-sheets/AD7682_7689.pdf

properties:
  compatible:
/* bench 375.0.0 587a9733976e */
/* bench 375.0.1 2445b23df499 */
/* bench 375.0.2 fab3d1da362a */
/* bench 375.0.3 e119125df16d */
/* bench 375.0.4 69a729d6162c */
/* bench 375.0.5 ddd43dc8a805 */
/* bench 375.0.6 35220d26120c */
/* bench 375.0.7 4304456bd4ac */
/* bench 375.0.8 2341eddc58fc */
    enum:
      - adi,ad7682
      - adi,ad7689
      - adi,ad7949

  reg:
    maxItems: 1

  vref-supply:
    description:
      ADC reference voltage supply

  spi-max-frequency: true

  "#io-channel-cells":
    const: 1

required:
  - compatible
  - reg
  - vref-supply

additionalProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@0 {
            compatible = "adi,ad7949";
            reg = <0>;
            vref-supply = <&vdd_supply>;
        };
    };
...
