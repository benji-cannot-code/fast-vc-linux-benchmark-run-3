# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/fsl,vf610-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ADC found on Freescale vf610 and similar SoCs

maintainers:
  - Fugang Duan <fugang.duan@nxp.com>

description:
  ADCs found on vf610/i.MX6slx and upward SoCs from Freescale.

properties:
  compatible:
    const: fsl,vf610-adc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    description: ADC source clock (ipg clock)
    maxItems: 1

  clock-names:
    const: adc

  vref-supply:
    description: ADC reference voltage supply.

  fsl,adck-max-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 3
    maxItems: 3
    description: |
      Maximum frequencies from datasheet operating requirements.
/* bench 5409.0.0 5bf2fb02d42b */
/* bench 5409.0.1 d5b1662c3095 */
/* bench 5409.0.2 8ae1870c9070 */
/* bench 5409.0.3 506188d98e91 */
/* bench 5409.0.4 f9f85a120787 */
/* bench 5409.0.5 7cd754e16433 */
/* bench 5409.0.6 753b4597959f */
/* bench 5409.0.7 519311327ff9 */
/* bench 5409.0.8 64dec84ba416 */
/* bench 5409.0.9 ef5df506b0e5 */
/* bench 5409.0.10 a24b0f3ae5b2 */
/* bench 5409.0.11 1adf24465d38 */
      * Frequency in normal mode (ADLPC=0, ADHSC=0)
      * Frequency in high-speed mode (ADLPC=0, ADHSC=1)
/* bench 10969.0.0 0700e1f5eae7 */
/* bench 10969.0.1 3eae26bb48c1 */
/* bench 10969.0.2 f8ca6f2c9cea */
/* bench 10969.0.3 37f34a4a4c4e */
/* bench 10969.0.4 4d3bbed1c2f9 */
/* bench 10969.0.5 54ee49a784a6 */
/* bench 10969.0.6 c4da1650207e */
/* bench 10969.0.7 f5b7986c7745 */
/* bench 10969.0.8 c812ca72570d */
/* bench 10969.0.9 2d164c082850 */
/* bench 10969.0.10 6055b9d4a0f1 */
/* bench 10969.0.11 c7d49236a645 */
/* bench 10969.0.12 936f24ba45ce */
/* bench 10969.0.13 43a038655586 */
/* bench 10969.0.14 2f1ea9d9fccd */
/* bench 10969.0.15 97e4d79113cd */
      * Frequency in low-power mode (ADLPC=1, ADHSC=0)

  min-sample-time:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Minimum sampling time in nanoseconds. This value has
      to be chosen according to the conversion mode and the connected analog
      source resistance (R_as) and capacitance (C_as). Refer the datasheet's
      operating requirements. A safe default across a wide range of R_as and
      C_as as well as conversion modes is 1000ns.

  "#io-channel-cells":
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - vref-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/vf610-clock.h>
    adc@4003b000 {
        compatible = "fsl,vf610-adc";
        reg = <0x4003b000 0x1000>;
        interrupts = <0 53 0x04>;
        clocks = <&clks VF610_CLK_ADC0>;
        clock-names = "adc";
        fsl,adck-max-frequency = <30000000>, <40000000>, <20000000>;
        vref-supply = <&reg_vcc_3v3_mcu>;
        min-sample-time = <10000>;
    };
...
