properties:
  compatible:
    enum:
      - lltc,ltc2496

  vref-supply:
    description: Power supply for the reference voltage

  reg:
    maxItems: 1

  spi-max-frequency:
    description: maximal spi bus frequency supported

required:
  - compatible
  - vref-supply
  - reg

additionalProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@0 {
            compatible = "lltc,ltc2496";
            reg = <0>;
            vref-supply = <&ltc2496_reg>;
            spi-max-frequency = <2000000>;
        };
    };
