description:
  This patch adds support for general purpose ADC within the
  DA9150 Charger & Fuel-Gauge IC.

properties:
  compatible:
    const: dlg,da9150-gpadc

  "#io-channel-cells":
    const: 1

required:
  - compatible
  - "#io-channel-cells"

additionalProperties: false

examples:
  - |
    adc {
        compatible = "dlg,da9150-gpadc";
        #io-channel-cells = <1>;
    };
