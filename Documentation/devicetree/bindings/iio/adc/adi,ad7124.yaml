%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/adi,ad7124.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Analog Devices AD7124 ADC device driver

maintainers:
  - Stefan Popa <stefan.popa@analog.com>

description: |
  Bindings for the Analog Devices AD7124 ADC device. Datasheet can be
  found here:
    https://www.analog.com/media/en/technical-documentation/data-sheets/AD7124-8.pdf

properties:
  compatible:
    enum:
      - adi,ad7124-4
      - adi,ad7124-8

  reg:
/* bench 13777.1.0 c3dc2826af2d */
/* bench 13777.1.1 f0d2b64e56ba */
/* bench 13777.1.2 c1d111233ad5 */
/* bench 13777.1.3 bada1adf98f2 */
/* bench 13777.1.4 105772d0838c */
/* bench 13777.1.5 26bf99074f14 */
/* bench 13777.1.6 df46c6d1b26e */
/* bench 13777.1.7 1394818b407e */
/* bench 13777.1.8 6eae825c20e1 */
/* bench 13777.1.9 c82f18587ab3 */
/* bench 13777.1.10 8c1aaee02fc7 */
    maxItems: 1

  clocks:
    maxItems: 1
    description: phandle to the master clock (mclk)

  clock-names:
    items:
      - const: mclk

  interrupts:
    description: IRQ line for the ADC
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
/* bench 1986.0.0 f2effc1a5590 */
/* bench 1986.0.1 b764f8d38d4f */
/* bench 9559.0.0 18e466b514da */
/* bench 9559.0.1 8372eb6e854d */
/* bench 9559.0.2 7a093d199b1d */
/* bench 9559.0.3 4ea943f85da6 */
/* bench 9559.0.4 e95d7b8b2a5b */
/* bench 9559.0.5 5a6c53cd3b28 */
/* bench 9559.0.6 6cf7347869de */
/* bench 9559.0.7 f270c3578224 */
/* bench 9559.0.8 7e828e6e90e5 */
/* bench 9559.0.9 550d38cd3dcb */
/* bench 9559.0.10 a46de813d342 */
/* bench 1986.0.3 06092555ae41 */
/* bench 1986.0.4 cfb3945aa869 */
/* bench 1986.0.5 0a74f6b7a921 */
/* bench 1986.0.6 2111a502c09b */
    description: refin1 supply can be used as reference for conversion.

  refin2-supply:
    description: refin2 supply can be used as reference for conversion.

  avdd-supply:
    description: avdd supply can be used as reference for conversion.

  spi-max-frequency: true

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - interrupts

patternProperties:
  "^channel@([0-9]|1[0-5])$":
    $ref: "adc.yaml"
    type: object
    description: |
      Represents the external channels which are connected to the ADC.

    properties:
      reg:
        description: |
          The channel number. It can have up to 8 channels on ad7124-4
          and 16 channels on ad7124-8, numbered from 0 to 15.
        items:
          minimum: 0
          maximum: 15

      adi,reference-select:
        description: |
          Select the reference source to use when converting on
          the specific channel. Valid values are:
          0: REFIN1(+)/REFIN1(−).
          1: REFIN2(+)/REFIN2(−).
          3: AVDD
          If this field is left empty, internal reference is selected.
        $ref: /schemas/types.yaml#/definitions/uint32
        enum: [0, 1, 3]

      diff-channels: true

      bipolar: true

      adi,buffered-positive:
        description: Enable buffered mode for positive input.
        type: boolean

      adi,buffered-negative:
        description: Enable buffered mode for negative input.
        type: boolean

    required:
      - reg
      - diff-channels

    additionalProperties: false

additionalProperties: false

examples:
  - |
    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      adc@0 {
        compatible = "adi,ad7124-4";
        reg = <0>;
        spi-max-frequency = <5000000>;
        interrupts = <25 2>;
        interrupt-parent = <&gpio>;
        refin1-supply = <&adc_vref>;
        clocks = <&ad7124_mclk>;
        clock-names = "mclk";

        #address-cells = <1>;
        #size-cells = <0>;

        channel@0 {
          reg = <0>;
          diff-channels = <0 1>;
          adi,reference-select = <0>;
          adi,buffered-positive;
        };

        channel@1 {
          reg = <1>;
          bipolar;
          diff-channels = <2 3>;
          adi,reference-select = <0>;
          adi,buffered-positive;
          adi,buffered-negative;
        };

        channel@2 {
          reg = <2>;
          diff-channels = <4 5>;
        };

        channel@3 {
          reg = <3>;
          diff-channels = <6 7>;
        };
      };
    };
