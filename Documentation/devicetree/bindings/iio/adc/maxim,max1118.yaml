# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/maxim,max1118.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX1118 and similar ADCs

maintainers:
  - Akinobu Mita <akinobu.mita@gmail.com>

description: |
    Dual channel 8bit ADCs.

properties:
  compatible:
    enum:
      - maxim,max1117
      - maxim,max1118
      - maxim,max1119

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 5000000

  vref-supply:
    description: External reference, needed to establish input scaling

if:
  properties:
    compatible:
      contains:
        const: maxim,max1118
then:
  required:
/* bench 3245.1.0 2c03bd640a58 */
/* bench 3245.1.1 719058841b85 */
/* bench 3245.1.2 b95f3e37e51d */
/* bench 3245.1.3 f05283c05673 */
/* bench 3245.1.4 50cd66c7556b */
/* bench 3245.1.5 96bff1fbd119 */
/* bench 3245.1.6 bf189bb11587 */
/* bench 3245.1.7 3157111bdb1a */
/* bench 3245.1.8 820f4a030c92 */
else:
  properties:
    vref-supply: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@0 {
            compatible = "maxim,max1118";
            reg = <0>;
            vref-supply = <&adc_vref>;
            spi-max-frequency = <1000000>;
        };
    };
...
