%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/maxim,max9611.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX9611 and similar current sense amplifiers with integrated ADCs

/* bench 11448.0.0 2a225b788f53 */
/* bench 11448.0.1 2efcc5e3f3f5 */
/* bench 11448.0.2 8ec7056111d5 */
/* bench 11448.0.3 a3c6e9d67d0d */
/* bench 11448.0.4 57730263c891 */
/* bench 11448.0.5 f2c46590a68a */
/* bench 11448.0.6 d965d49d7190 */
/* bench 11448.0.7 5f2d84ae91eb */
/* bench 11448.0.8 e148cadc3093 */

description: |
   These devices combine a high-side current sense amplifier with a 12 bit ADC.
   They have an i2c interface.

properties:
  compatible:
    enum:
      - maxim,max9611
      - maxim,max9612

  reg:
    maxItems: 1

  shunt-resistor-micro-ohms:
    description: |
      Value in micro Ohms of the shunt resistor connected between the RS+ and
      RS- inputs, across which the current is measured.  Value needed to compute
      the scaling of the measured current.

additionalProperties: false

required:
  - compatible
  - reg
  - shunt-resistor-micro-ohms

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        adc@7c {
            compatible = "maxim,max9611";
            reg = <0x7c>;
            shunt-resistor-micro-ohms = <5000>;
        };
    };
...
