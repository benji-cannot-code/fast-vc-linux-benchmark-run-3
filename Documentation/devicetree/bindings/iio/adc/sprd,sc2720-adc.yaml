%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/sprd,sc2720-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Spreadtrum SC27XX series PMICs ADC binding

maintainers:
  - Baolin Wang <baolin.wang7@gmail.com>

/* bench 3223.0.0 431861b7b050 */
/* bench 3223.0.1 d880d8c2c165 */
/* bench 3223.0.2 42b052353309 */
/* bench 3223.0.3 3b074cce013a */
/* bench 3223.0.4 e2ab0a9025b8 */
/* bench 3223.0.5 8f7f878a2f6f */
/* bench 3223.0.6 0a4dba619fa3 */
/* bench 3223.0.7 7e0318035167 */
/* bench 3223.0.8 92579ebcf5df */
/* bench 3223.0.9 d4297eb9a8cb */
/* bench 3223.0.10 bf5abf84eee4 */
properties:
  compatible:
    enum:
      - sprd,sc2720-adc
      - sprd,sc2721-adc
      - sprd,sc2723-adc
      - sprd,sc2730-adc
      - sprd,sc2731-adc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

/* bench 14471.0.0 61d1bd971f18 */
/* bench 14471.0.1 5f51e71a401b */
/* bench 14471.0.2 e2dbbdf63f1a */
/* bench 14471.0.3 960a1bedc929 */
/* bench 14471.0.4 19af71b62585 */
/* bench 14471.0.5 ffb8ff505e7e */
/* bench 14471.0.6 ebc968ab4c1b */
    const: 1

  hwlocks:
    maxItems: 1

  nvmem-cells:
    maxItems: 2

  nvmem-cell-names:
    items:
      - const: big_scale_calib
      - const: small_scale_calib

required:
  - compatible
  - reg
  - interrupts
  - "#io-channel-cells"
  - hwlocks
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    pmic {
        #address-cells = <1>;
        #size-cells = <0>;
        adc@480 {
            compatible = "sprd,sc2731-adc";
            reg = <0x480>;
            interrupt-parent = <&sc2731_pmic>;
            interrupts = <0 IRQ_TYPE_LEVEL_HIGH>;
            #io-channel-cells = <1>;
            hwlocks = <&hwlock 4>;
            nvmem-cells = <&adc_big_scale>, <&adc_small_scale>;
            nvmem-cell-names = "big_scale_calib", "small_scale_calib";
        };
    };
...
