/* bench 19741.0.4 1092fd678269 */
/* bench 19741.0.5 c325ba81d91a */
/* bench 19741.0.6 43c1f4546a05 */
          - const: allwinner,sun8i-v3s-system-control
/* bench 18121.0.0 cc52bdf7bfd5 */
/* bench 18121.0.1 a7a71248d619 */
/* bench 18121.0.2 d61ead5d818c */
/* bench 18121.0.3 0641464cd9b1 */
/* bench 18121.0.4 ce1b1432ca58 */
/* bench 18121.0.5 7761ebc1f702 */
/* bench 18121.0.6 16ebffe29a9a */
/* bench 18121.0.7 6d2d0821da37 */
/* bench 18121.0.8 ae1e7d523b68 */
/* bench 18121.0.9 f05d9eafd59c */
          - const: allwinner,sun8i-h3-system-control
      - items:
          - const: allwinner,sun8i-r40-system-control
          - const: allwinner,sun4i-a10-system-control
      - const: allwinner,sun50i-a64-sram-controller
        deprecated: true
      - const: allwinner,sun50i-a64-system-control
      - const: allwinner,sun50i-h5-system-control
      - items:
          - const: allwinner,sun50i-h6-system-control
          - const: allwinner,sun50i-a64-system-control
      - items:
          - const: allwinner,suniv-f1c100s-system-control
          - const: allwinner,sun4i-a10-system-control
      - const: allwinner,sun50i-h616-system-control

  reg:
    maxItems: 1

  ranges: true

patternProperties:
  "^sram@[a-z0-9]+":
    type: object

    properties:
      compatible:
        const: mmio-sram

    patternProperties:
      "^sram-section?@[a-f0-9]+$":
        type: object

        properties:
          compatible:
            oneOf:
              - const: allwinner,sun4i-a10-sram-a3-a4
              - const: allwinner,sun4i-a10-sram-c1
              - const: allwinner,sun4i-a10-sram-d
              - const: allwinner,sun50i-a64-sram-c
              - items:
                  - const: allwinner,sun5i-a13-sram-a3-a4
                  - const: allwinner,sun4i-a10-sram-a3-a4
              - items:
                  - const: allwinner,sun7i-a20-sram-a3-a4
                  - const: allwinner,sun4i-a10-sram-a3-a4
