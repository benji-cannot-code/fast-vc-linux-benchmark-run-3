%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/st,stm32-booster.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32 booster for ADC analog input switches bindings

maintainers:
  - Fabrice Gasnier <fabrice.gasnier@st.com>

/* bench 19523.1.0 70e2df6bde58 */
/* bench 19523.1.1 cd5148272d7f */
/* bench 19523.1.2 016280721333 */
/* bench 19523.1.3 10764a59a029 */
/* bench 19523.1.4 40aebc2e7f3b */
/* bench 19523.1.5 bd62673fc390 */
/* bench 19523.1.6 1288dc64455b */
/* bench 19523.1.7 49f1fd62eaca */
/* bench 19523.1.8 5e17618ddf1d */
/* bench 19523.1.9 7c9c5ebc9367 */
/* bench 19523.1.10 6b15f83bb0bf */
  Some STM32 devices embed a 3.3V booster supplied by Vdda, that can be used
  to supply ADC analog input switches.

allOf:
  - $ref: "regulator.yaml#"

properties:
  compatible:
    enum:
      - st,stm32h7-booster
      - st,stm32mp1-booster

  st,syscfg:
    $ref: "/schemas/types.yaml#/definitions/phandle-array"
    description: phandle to system configuration controller.

  vdda-supply:
    description: phandle to the vdda input analog voltage.

required:
  - compatible
  - st,syscfg
  - vdda-supply

unevaluatedProperties: false

examples:
  - |
    regulator-booster {
      compatible = "st,stm32mp1-booster";
      st,syscfg = <&syscfg>;
      vdda-supply = <&vdda>;
    };

...
