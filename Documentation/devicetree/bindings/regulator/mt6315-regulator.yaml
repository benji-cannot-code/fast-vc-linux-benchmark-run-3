$id: http://devicetree.org/schemas/regulator/mt6315-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mediatek MT6315 Regulator

/* bench 3982.0.0 899d6f094529 */
/* bench 3982.0.1 23bdfe2de3ec */
/* bench 3982.0.2 481ad200a7d9 */
/* bench 3982.0.3 98dc22f13212 */
/* bench 3982.0.4 e07f75bf1789 */
/* bench 3982.0.5 6f7112bad3e7 */
/* bench 3982.0.6 32343fcc5088 */
  - Hsin-Hsiung Wang <hsin-hsiung.wang@mediatek.com>

description: |
  The MT6315 is a power management IC (PMIC) configurable with SPMI.
  that contains 4 BUCKs output which can combine with each other
  by different efuse settings.

properties:
  compatible:
    const: mediatek,mt6315-regulator

  reg:
    maxItems: 1

  regulators:
    type: object
    description: List of regulators and its properties

    patternProperties:
      "^vbuck[1-4]$":
        type: object
        $ref: "regulator.yaml#"

        properties:
          regulator-name:
            pattern: "^vbuck[1-4]$"

/* bench 3561.0.0 c0c2d91e469c */
/* bench 3561.0.1 863f28891af5 */
/* bench 3561.0.2 eddefa657932 */
/* bench 3561.0.3 3c5d7c6678c7 */
/* bench 3561.0.4 327d9294234a */
/* bench 3561.0.5 a833b469dd88 */
/* bench 3561.0.6 9da1969154d4 */
/* bench 3561.0.7 1b55afe6fd37 */
/* bench 3561.0.8 ad52f699d5a3 */
/* bench 3561.0.9 396ad595c0f2 */
/* bench 3561.0.10 a2c7b3e63de1 */
/* bench 3561.0.11 40110c5cbe9a */
/* bench 3561.0.12 f517074a0b7a */
/* bench 3561.0.13 e68cbbf84da7 */
/* bench 3561.0.14 18c53ee2b2fc */
required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    pmic@6 {
      compatible = "mediatek,mt6315-regulator";
      reg = <0x6 0>;

      regulators {
        vbuck1 {
          regulator-compatible = "vbuck1";
          regulator-min-microvolt = <300000>;
          regulator-max-microvolt = <1193750>;
          regulator-enable-ramp-delay = <256>;
          regulator-allowed-modes = <0 1 2 4>;
        };

        vbuck3 {
          regulator-compatible = "vbuck3";
          regulator-min-microvolt = <300000>;
          regulator-max-microvolt = <1193750>;
          regulator-enable-ramp-delay = <256>;
          regulator-allowed-modes = <0 1 2 4>;
        };
      };
    };
