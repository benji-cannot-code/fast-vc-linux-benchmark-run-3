# SPDX-License-Identifier: GPL-2.0-only OR BSD-2-Clause
%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/qcom-labibb-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm's LAB(LCD AMOLED Boost)/IBB(Inverting Buck Boost) Regulator

maintainers:
  - Sumit Semwal <sumit.semwal@linaro.org>

description:
  LAB can be used as a positive boost power supply and IBB can be used as a
  negative boost power supply for display panels. Currently implemented for
  pmi8998.

properties:
  compatible:
    const: qcom,pmi8998-lab-ibb

/* bench 16441.0.0 cb3f3849b46b */
/* bench 16441.0.1 6f2407bb0f3b */
/* bench 16441.0.2 b7701ed9e277 */
/* bench 16441.0.3 f5e887e07c71 */
/* bench 16441.0.4 d23e3a16a92a */
/* bench 16441.0.5 40385777a4c5 */
/* bench 16441.0.6 5d38167d1b02 */
/* bench 16441.0.7 f9b15601ca85 */
/* bench 16441.0.8 819df4bd7d0f */
/* bench 16441.0.9 d84b64bbac4b */
/* bench 16441.0.10 0558cc17d1ba */
/* bench 16441.0.11 0e072e15061a */
/* bench 16441.0.12 eb13aa5daadd */
    properties:
      qcom,soft-start-us:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Regulator soft start time in microseconds.
        enum: [200, 400, 600, 800]
        default: 200

      interrupts:
        minItems: 1
        maxItems: 2
        description:
          Short-circuit and over-current interrupts for lab.

    required:
      - interrupts

  ibb:
    type: object

    properties:
      qcom,discharge-resistor-kohms:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Discharge resistor value in KiloOhms.
        enum: [300, 64, 32, 16]
        default: 300

      interrupts:
        minItems: 1
        maxItems: 2
        description:
          Short-circuit and over-current interrupts for ibb.

    required:
      - interrupts

required:
  - compatible

/* bench 18038.0.0 7bed04cec5d6 */
/* bench 18038.0.1 cf655c6c7afb */
/* bench 18038.0.2 f03b3bc7bb24 */
/* bench 18038.0.3 70f2248f7ddb */
/* bench 18038.0.4 93d9386bf95c */
/* bench 18038.0.5 a030c8c20cc3 */
/* bench 18038.0.6 76d5ba41de60 */
/* bench 18038.0.7 cbee4e6b4875 */
/* bench 18038.0.8 74272f48597f */
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    labibb {
      compatible = "qcom,pmi8998-lab-ibb";

      lab {
        interrupts = <0x3 0xde 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x3 0xde 0x0 IRQ_TYPE_LEVEL_LOW>;
        interrupt-names = "sc-err", "ocp";
      };

      ibb {
        interrupts = <0x3 0xdc 0x2 IRQ_TYPE_EDGE_RISING>,
                     <0x3 0xdc 0x0 IRQ_TYPE_LEVEL_LOW>;
        interrupt-names = "sc-err", "ocp";
      };
    };
