/* bench 591.0.3 64c5045e20be */
/* bench 591.0.4 f718e2652dc2 */
/* bench 591.0.5 441ef53e2739 */
/* bench 591.0.6 61e6f4711b77 */
/* bench 591.0.7 3b269068c8c0 */
/* bench 591.0.8 d1303b896169 */
/* bench 591.0.9 4a960660254e */
/* bench 591.0.10 0fb4dba67e24 */
/* bench 591.0.11 ef09e136bcf8 */
/* bench 591.0.12 def131386c22 */
/* bench 591.0.13 107601632617 */
/* bench 591.0.14 d98f229b1659 */

required:
  - compatible
  - regulator-name
  - gpios
  - states

unevaluatedProperties: false
/* bench 22323.0.0 e35097198742 */
/* bench 22323.0.1 2de44772dc60 */
/* bench 22323.0.2 a3976f87993e */
/* bench 22323.0.3 7d63269a5bc3 */
/* bench 22323.0.4 5414be46e223 */

examples:
  - |
    gpio-regulator {
      compatible = "regulator-gpio";

      regulator-name = "mmci-gpio-supply";
      regulator-min-microvolt = <1800000>;
      regulator-max-microvolt = <2600000>;
      regulator-boot-on;

      enable-gpios = <&gpio0 23 0x4>;
      gpios = <&gpio0 24 0x4
        &gpio0 25 0x4>;
      states = <1800000 0x3>,
        <2200000 0x2>,
        <2600000 0x1>,
        <2900000 0x0>;

      startup-delay-us = <100000>;
      enable-active-high;
    };
...
