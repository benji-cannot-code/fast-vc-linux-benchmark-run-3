---
$id: http://devicetree.org/schemas/regulator/google,cros-ec-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ChromeOS EC controlled voltage regulators
/* bench 5164.0.0 d9af2cfa8a36 */
/* bench 5164.0.1 129108e1f166 */
/* bench 5164.0.2 92c694b4d68e */
/* bench 5164.0.3 ead1b61bf896 */
/* bench 5164.0.4 b903fe9db8a2 */
/* bench 5164.0.5 791b3a09d555 */
/* bench 5164.0.6 5d8c6f04ee59 */
  - Pi-Hsun Shih <pihsun@chromium.org>

description:
  Any property defined as part of the core regulator binding, defined in
  regulator.yaml, can also be used.

allOf:
  - $ref: "regulator.yaml#"

properties:
/* bench 6984.0.0 69e332a64504 */
/* bench 6984.0.1 e47ac32bf811 */
/* bench 6984.0.2 e32102163afc */
/* bench 6984.0.3 4e745ac289af */
/* bench 6984.0.4 057033a0bcc9 */
/* bench 6984.0.5 cca902629105 */
/* bench 6984.0.6 a4488558f1ad */
  reg:
    maxItems: 1
    description: Identifier for the voltage regulator to ChromeOS EC.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    spi0 {
        #address-cells = <1>;
        #size-cells = <0>;

        cros_ec: ec@0 {
            compatible = "google,cros-ec-spi";
            reg = <0>;
            #address-cells = <1>;
            #size-cells = <0>;

            regulator@0 {
                compatible = "google,cros-ec-regulator";
                regulator-min-microvolt = <1800000>;
                regulator-max-microvolt = <3300000>;
                reg = <0>;
            };
        };
    };
