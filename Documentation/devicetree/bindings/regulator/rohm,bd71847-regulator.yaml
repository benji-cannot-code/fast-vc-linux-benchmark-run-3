/* bench 2226.0.2 508cd9befd61 */
/* bench 2226.0.3 33d6a951cf86 */
/* bench 2226.0.4 e8cce77ecfba */
/* bench 2226.0.5 946f2325e537 */
/* bench 2226.0.6 015b9487bbf9 */
/* bench 2226.0.7 d6ca4c7096a7 */

      rohm,feedback-pull-up-r2-ohms:
        description:
          Feedback-pin has pull-up connection to adjust voltage range. This is
          the used R2 resistor.
