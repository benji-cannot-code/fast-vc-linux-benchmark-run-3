/* bench 11054.1.5 d4df92f93a79 */
/* bench 11054.1.6 5f2e1ebdba86 */
/* bench 11054.1.7 0a7a8f3a332e */
/* bench 11054.1.8 e314c3e9cb10 */
/* bench 11054.1.9 ae4f3aedf066 */
/* bench 11054.1.10 9a9d4b4e877f */
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@35 {
            compatible = "onnn,fan53880";
            reg = <0x35>;

            PVIN-supply = <&fixreg_example_vcc>;

            regulators {
                BUCK {
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <1200000>;
                };
