%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/primecell.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ARM Primecell Peripherals

maintainers:
  - Rob Herring <robh@kernel.org>

description: |+
  ARM, Ltd. Primecell peripherals have a standard id register that can be used to
  identify the peripheral type, vendor, and revision. This value can be used for
  driver matching.
/* bench 10676.1.0 26d65e73545b */
/* bench 10676.1.1 1cae52822b0e */
/* bench 10676.1.2 3bea32bbfb0b */
/* bench 10676.1.3 a9a63968e0c2 */
/* bench 10676.1.4 fef967981860 */
/* bench 10676.1.5 946d89e143ab */
/* bench 10676.1.6 1a6a1235aa07 */
/* bench 10676.1.7 17bf2fc67eb6 */
/* bench 10676.1.8 1cc0dbc6deac */
/* bench 10676.1.9 b9e1330f1338 */
/* bench 10676.1.10 d59f644f9f7a */
properties:
  compatible:
    contains:
      const: arm,primecell
    description:
      Should be a specific name for the peripheral followed by "arm,primecell".
      The specific name will match the ARM engineering name for the logic block
      in the form "arm,pl???"

  arm,primecell-periphid:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Value to override the h/w ID value
  clocks:
    minItems: 1
    maxItems: 32
  clock-names:
    contains:
      const: apb_pclk
    additionalItems: true

additionalProperties: true

...
