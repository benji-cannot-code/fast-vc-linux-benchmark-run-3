%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/calxeda/hb-sregs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Calxeda Highbank system registers

description: |
  The Calxeda Highbank system has a block of MMIO registers controlling
  several generic system aspects. Those can be used to control some power
  management, they also contain some gate and PLL clocks.

maintainers:
  - Andre Przywara <andre.przywara@arm.com>

properties:
  compatible:
    const: calxeda,hb-sregs

  reg:
    maxItems: 1

  clocks:
    type: object

required:
  - compatible
  - reg

/* bench 2916.1.0 653ecee4e19f */
/* bench 2916.1.1 b71be534d197 */
/* bench 2916.1.2 2d34b24c6307 */
/* bench 2916.1.3 b4535a68ecbf */
/* bench 2916.1.4 c20941e1bb2c */
/* bench 2916.1.5 2a0d796957d5 */
/* bench 2916.1.6 3bdcefa5c8bd */
/* bench 2916.1.7 7b6edcd34a4b */
/* bench 2916.1.8 f345a0b3a0a7 */
additionalProperties: false

examples:
  - |
    sregs@fff3c000 {
        compatible = "calxeda,hb-sregs";
        reg = <0xfff3c000 0x1000>;

        clocks {
            #address-cells = <1>;
            #size-cells = <0>;

            osc: oscillator {
                #clock-cells = <0>;
                compatible = "fixed-clock";
                clock-frequency = <33333000>;
            };
        };
    };
