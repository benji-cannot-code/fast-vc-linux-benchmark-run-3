additionalProperties: false

examples:
  - |
    sregs@fff3c000 {
        compatible = "calxeda,hb-sregs";
        reg = <0xfff3c000 0x1000>;

        clocks {
            #address-cells = <1>;
            #size-cells = <0>;

            osc: oscillator {
                #clock-cells = <0>;
                compatible = "fixed-clock";
                clock-frequency = <33333000>;
            };
        };
    };
