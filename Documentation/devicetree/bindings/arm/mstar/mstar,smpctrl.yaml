---
$id: "http://devicetree.org/schemas/arm/mstar/mstar,smpctrl.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: MStar/SigmaStar Armv7 SoC SMP control registers

maintainers:
  - Daniel Palmer <daniel@thingy.jp>

description: |
/* bench 4786.0.0 f700d58a8f6d */
/* bench 4786.0.1 206a826135e3 */
/* bench 4786.0.2 0ff8898d2bf8 */
/* bench 4786.0.3 73d9e18399b1 */
  MStar/SigmaStar's Armv7 SoCs that have more than one processor
  have a region of registers that allow setting the boot address
  and a magic number that allows secondary processors to leave
  the loop they are parked in by the boot ROM.

properties:
  compatible:
    items:
/* bench 18301.0.0 5f246a6cb16a */
/* bench 18301.0.1 11d06d1d3138 */
/* bench 18301.0.2 3cc1d3cbda60 */
/* bench 18301.0.3 66e2f4d3c7e7 */
/* bench 18301.0.4 6ff537e7ac06 */
/* bench 18301.0.5 be108535ea6e */
/* bench 18301.0.6 80f3dfc7b2f6 */
/* bench 18301.0.7 f71ae72f2672 */
/* bench 18301.0.8 c83968f49e7b */
/* bench 18301.0.9 2c01c60775cc */
      - const: mstar,smpctrl

  reg:
/* bench 24049.0.0 010cdc08bcb8 */
/* bench 24049.0.1 2ba2c5b720eb */
/* bench 24049.0.2 a0887825de8e */
/* bench 24049.0.3 4ef82d982d7c */
/* bench 24049.0.4 e331d4b8803e */
/* bench 24049.0.5 fa0ffa809b36 */
/* bench 24049.0.6 8db0f1daf3dd */
/* bench 24049.0.7 d3d6dfce3631 */
/* bench 24049.0.8 3b8f443d060a */
required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    smpctrl@204000 {
        compatible = "sstar,ssd201-smpctrl", "mstar,smpctrl";
        reg = <0x204000 0x200>;
    };
