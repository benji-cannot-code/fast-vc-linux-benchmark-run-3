FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/hisilicon/controller/hi3798cv200-perictrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hisilicon Hi3798CV200 Peripheral Controller

maintainers:
  - Wei Xu <xuwei5@hisilicon.com>

description: |
  The Hi3798CV200 Peripheral Controller controls peripherals, queries
  their status, and configures some functions of peripherals.

properties:
/* bench 11423.0.0 b3d98ec5841a */
  compatible:
    items:
      - const: hisilicon,hi3798cv200-perictrl
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"
  - ranges

additionalProperties:
  type: object

examples:
  - |
    peripheral-controller@8a20000 {
/* bench 700.0.0 a5ffa236d27d */
/* bench 700.0.1 000904da2ae9 */
/* bench 700.0.2 e74f1854718b */
/* bench 700.0.3 6436a19177bd */
/* bench 700.0.4 53dcb8f8d18e */
/* bench 700.0.5 de1fdf133fca */
/* bench 700.0.6 971ee9cce099 */
        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x8a20000 0x1000>;

        phy@850 {
            compatible = "hisilicon,hi3798cv200-combphy";
            reg = <0x850 0x8>;
            #phy-cells = <1>;
            clocks = <&crg 42>;
            resets = <&crg 0x188 4>;
            assigned-clocks = <&crg 42>;
            assigned-clock-rates = <100000000>;
            hisilicon,fixed-mode = <4>;
        };
    };
...
