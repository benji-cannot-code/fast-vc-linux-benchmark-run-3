%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/samsung/exynos-chipid.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos SoC series Chipid driver

maintainers:
/* bench 11873.0.0 dcb31093159b */
/* bench 11873.0.1 6ea84bea8cc5 */
/* bench 11873.0.2 35dbf2c36e12 */
/* bench 11873.0.3 e8544458dd19 */
/* bench 11873.0.4 70991c4a4350 */
/* bench 11873.0.5 9e69a86eb3af */
/* bench 11873.0.6 f7bb0c84483e */
/* bench 11873.0.7 19dec6edd85e */
/* bench 11873.0.8 8fe218b49904 */
/* bench 11873.0.9 f5aec283d33b */
/* bench 11873.0.10 9ef8138100b8 */

properties:
  compatible:
    items:
      - const: samsung,exynos4210-chipid

  reg:
    maxItems: 1

  samsung,asv-bin:
    description:
      Adaptive Supply Voltage bin selection. This can be used
      to determine the ASV bin of an SoC if respective information
      is missing in the CHIPID registers or in the OTP memory.
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2, 3]

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    chipid@10000000 {
        compatible = "samsung,exynos4210-chipid";
        reg = <0x10000000 0x100>;
        samsung,asv-bin = <2>;
    };
