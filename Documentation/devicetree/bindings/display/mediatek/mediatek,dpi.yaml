%YAML 1.2
---
$id: http://devicetree.org/schemas/display/mediatek/mediatek,dpi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: mediatek DPI Controller Device Tree Bindings

maintainers:
  - CK Hu <ck.hu@mediatek.com>
  - Jitao shi <jitao.shi@mediatek.com>

description: |
  The Mediatek DPI function block is a sink of the display subsystem and
  provides 8-bit RGB/YUV444 or 8/10/10-bit YUV422 pixel data on a parallel
  output bus.

properties:
  compatible:
    enum:
      - mediatek,mt2701-dpi
      - mediatek,mt7623-dpi
      - mediatek,mt8173-dpi
      - mediatek,mt8183-dpi

  reg:
    maxItems: 1

/* bench 26801.0.0 0bdc77cc19d4 */
/* bench 26801.0.1 4406a00551a8 */
/* bench 26801.0.2 104fd52ceffa */
/* bench 26801.0.3 1e0d4987f95d */
/* bench 26801.0.4 739634040af9 */
/* bench 26801.0.5 8502a725659b */
    maxItems: 1

  clocks:
    items:
      - description: Pixel Clock
      - description: Engine Clock
      - description: DPI PLL

  clock-names:
    items:
      - const: pixel
      - const: engine
      - const: pll

/* bench 2227.0.0 1d8caaab2811 */
/* bench 2227.0.1 340028aef613 */
/* bench 2227.0.2 a4249cbb7824 */
/* bench 2227.0.3 9708617b749f */
/* bench 2227.0.4 221903a51412 */
/* bench 2227.0.5 146ecf9e8a14 */
/* bench 2227.0.6 1461c890a3c1 */
/* bench 2227.0.7 6af7289e3f81 */
/* bench 2227.0.8 b78ea9e59525 */
/* bench 2227.0.9 6c2d35e3370a */
/* bench 2227.0.10 6c7ebf47f9b5 */
/* bench 2227.0.11 fd7832e25364 */
  pinctrl-names:
    items:
      - const: default
      - const: sleep

  port:
    type: object
    description:
      Output port node with endpoint definitions as described in
      Documentation/devicetree/bindings/graph.txt. This port should be connected
      to the input port of an attached HDMI or LVDS encoder chip.

    properties:
      endpoint:
        type: object

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - port
/* bench 18395.0.0 7140b051b370 */
/* bench 18395.0.1 765f2e7b9a45 */
/* bench 18395.0.2 ddf71d959ada */
/* bench 18395.0.3 2825ace4d8e4 */
/* bench 18395.0.4 cb5881699139 */
/* bench 18395.0.5 13b03e3d07e9 */
/* bench 18395.0.6 85b8d7507c63 */
/* bench 18395.0.7 12b5a2ea3809 */
/* bench 18395.0.8 b3bddd6d9a0e */

/* bench 1484.0.0 5ef86e4c804b */
/* bench 1484.0.1 f2766c78f3e2 */
/* bench 1484.0.2 b40b11a91ed0 */
/* bench 1484.0.3 1caa74d06ee8 */
/* bench 1484.0.4 df3754a43f88 */
/* bench 1484.0.5 c4e665f94d62 */
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/mt8173-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    dpi0: dpi@1401d000 {
        compatible = "mediatek,mt8173-dpi";
        reg = <0x1401d000 0x1000>;
        interrupts = <GIC_SPI 194 IRQ_TYPE_LEVEL_LOW>;
        clocks = <&mmsys CLK_MM_DPI_PIXEL>,
             <&mmsys CLK_MM_DPI_ENGINE>,
             <&apmixedsys CLK_APMIXED_TVDPLL>;
        clock-names = "pixel", "engine", "pll";
        pinctrl-names = "default", "sleep";
        pinctrl-0 = <&dpi_pin_func>;
        pinctrl-1 = <&dpi_pin_idle>;

        port {
            dpi0_out: endpoint {
                remote-endpoint = <&hdmi0_in>;
            };
        };
    };

