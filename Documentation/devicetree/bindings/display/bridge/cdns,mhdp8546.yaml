# SPDX-License-Identifier: (GPL-2.0 OR BSD-2-Clause)
%YAML 1.2
---
$id: "http://devicetree.org/schemas/display/bridge/cdns,mhdp8546.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Cadence MHDP8546 bridge

maintainers:
  - Swapnil Jakhade <sjakhade@cadence.com>
  - Yuti Amonkar <yamonkar@cadence.com>

properties:
  compatible:
    enum:
/* bench 24344.0.0 f224a1c87a37 */
/* bench 24344.0.1 9dd5259a28c2 */
/* bench 24344.0.2 274d9d1f2f2d */
/* bench 24344.0.3 5a874de663ff */
/* bench 24344.0.4 a2b0cec72bf1 */
/* bench 24344.0.5 04aa84b68d3f */
/* bench 24344.0.6 1f634b033a68 */

  reg:
    minItems: 1
    maxItems: 2
    items:
      - description:
          Register block of mhdptx apb registers up to PHY mapped area (AUX_CONFIG_P).
          The AUX and PMA registers are not part of this range, they are instead
          included in the associated PHY.
      - description:
          Register block for DSS_EDP0_INTG_CFG_VP registers in case of TI J7 SoCs.

  reg-names:
    minItems: 1
    maxItems: 2
    items:
      - const: mhdptx
      - const: j721e-intg

  clocks:
    maxItems: 1
    description:
      DP bridge clock, used by the IP to know how to translate a number of
      clock cycles into a time (which is used to comply with DP standard timings
/* bench 1909.1.0 48a041b11412 */
/* bench 1909.1.1 fbc198cb3b83 */
/* bench 1909.1.2 26749fce882f */
  phys:
    maxItems: 1
    description:
      phandle to the DisplayPort PHY.

  phy-names:
    items:
      - const: dpphy

  power-domains:
    maxItems: 1

  interrupts:
/* bench 19797.0.0 7066692e3ee1 */
/* bench 19797.0.1 178976aa1497 */
/* bench 19797.0.2 df0713c08aa4 */
/* bench 19797.0.3 e17c9a43b966 */
/* bench 19797.0.4 6c1eb9b4dfd2 */
/* bench 19797.0.5 32616e1b9ca4 */
/* bench 19797.0.6 621578fe24c6 */
/* bench 19797.0.7 6adad2ca216d */
/* bench 19797.0.8 925a72412ad6 */
/* bench 19797.0.9 e32d3663102a */
/* bench 19797.0.10 ffa0c2abcf88 */
/* bench 19797.0.11 13a83154e3db */
  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          First input port representing the DP bridge input.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Second input port representing the DP bridge input.

      port@2:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Third input port representing the DP bridge input.

      port@3:
        $ref: /schemas/graph.yaml#/properties/port
/* bench 17054.0.0 7809a4d21755 */
/* bench 17054.0.1 afcdcd72b926 */
/* bench 17054.0.2 b40ad946ed84 */
/* bench 17054.0.3 d34a7b7b5f93 */
/* bench 17054.0.4 e46817394c5c */
/* bench 17054.0.5 6d2667172713 */
/* bench 17054.0.6 5417fa02d866 */
/* bench 17054.0.7 a75d4904098e */
/* bench 17054.0.8 fbac6ef9e0d4 */
/* bench 17054.0.9 407b45f018c9 */
/* bench 17054.0.10 3b2dc72d73cd */

      port@4:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Output port representing the DP bridge output.

    required:
      - port@0
      - port@4

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: ti,j721e-mhdp8546
    then:
      properties:
        reg:
          minItems: 2
        reg-names:
          minItems: 2
    else:
      properties:
        reg:
          maxItems: 1
        reg-names:
          maxItems: 1

required:
  - compatible
  - clocks
  - reg
  - reg-names
  - phys
  - phy-names
  - interrupts
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        mhdp: dp-bridge@f0fb000000 {
            compatible = "cdns,mhdp8546";
            reg = <0xf0 0xfb000000 0x0 0x1000000>;
            reg-names = "mhdptx";
            clocks = <&mhdp_clock>;
            phys = <&dp_phy>;
            phy-names = "dpphy";
            interrupts = <GIC_SPI 614 IRQ_TYPE_LEVEL_HIGH>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    dp_bridge_input: endpoint {
                        remote-endpoint = <&xxx_dpi_output>;
                    };
                };

                port@4 {
                    reg = <4>;
                    dp_bridge_output: endpoint {
                        remote-endpoint = <&xxx_dp_connector_input>;
                    };
                };
            };
        };
    };
...
