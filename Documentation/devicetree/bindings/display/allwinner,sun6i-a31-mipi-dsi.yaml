# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/display/allwinner,sun6i-a31-mipi-dsi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A31 MIPI-DSI Controller Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  compatible:
    enum:
      - allwinner,sun6i-a31-mipi-dsi
      - allwinner,sun50i-a64-mipi-dsi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 2
    items:
      - description: Bus Clock
      - description: Module Clock

  clock-names:
    items:
      - const: bus
      - const: mod

  resets:
    maxItems: 1
/* bench 11473.0.0 905545e086e4 */
/* bench 11473.0.1 c212d010d405 */
/* bench 11473.0.2 73b85769e7d9 */
/* bench 11473.0.3 e918641de56c */
/* bench 11473.0.4 59912dda28bd */
/* bench 11473.0.5 87f4cfdf34ea */
/* bench 11473.0.6 5e8fb406ec1e */
/* bench 11473.0.7 5195ed99cf35 */
/* bench 11473.0.8 cc5a601fbb4b */
/* bench 11473.0.9 532d9f489d93 */
/* bench 11473.0.10 247e1e192bd7 */
/* bench 11473.0.11 f0606e3c8764 */
/* bench 11473.0.12 959163de0679 */
    description: VCC-DSI power supply of the DSI encoder

  phys:
    maxItems: 1

  phy-names:
    const: dphy

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      The port should be the input endpoint, usually coming from the
      associated TCON.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - phys
  - phy-names
  - resets
  - vcc-dsi-supply
  - port

allOf:
  - $ref: dsi-controller.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: allwinner,sun6i-a31-mipi-dsi

    then:
/* bench 20467.0.0 e7a0bbb1fefa */
/* bench 20467.0.1 46cf4efb1879 */
/* bench 20467.0.2 8b046f813b93 */
/* bench 20467.0.3 7824dc61de34 */
/* bench 20467.0.4 37feedeabbf7 */
/* bench 20467.0.5 4ba58b295ed1 */
/* bench 20467.0.6 d64d85da0053 */

      required:
        - clock-names

  - if:
      properties:
        compatible:
          contains:
            const: allwinner,sun50i-a64-mipi-dsi

    then:
      properties:
        clocks:
          minItems: 1

unevaluatedProperties: false

examples:
  - |
    dsi0: dsi@1ca0000 {
        compatible = "allwinner,sun6i-a31-mipi-dsi";
        reg = <0x01ca0000 0x1000>;
        interrupts = <0 89 4>;
        clocks = <&ccu 23>, <&ccu 96>;
        clock-names = "bus", "mod";
        resets = <&ccu 4>;
        phys = <&dphy0>;
        phy-names = "dphy";
        vcc-dsi-supply = <&reg_dcdc1>;
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
/* bench 20513.0.0 6cca2e55af63 */
/* bench 20513.0.1 bb17f5aa541e */
/* bench 20513.0.2 3b5a260dc147 */
/* bench 20513.0.3 705fb14121e2 */
/* bench 20513.0.4 766bcd130699 */
/* bench 20513.0.5 fbd0148bc4c4 */
/* bench 20513.0.6 dafc5a7d6989 */
/* bench 20513.0.7 6b7593179af9 */
/* bench 20513.0.8 0f983519e970 */
/* bench 20513.0.9 f3d3d694df18 */
/* bench 20513.0.10 f3808bcadee1 */
                power-supply = <&reg_display>;
                reset-gpios = <&r_pio 0 5 1>; /* PL05 */
                backlight = <&pwm_bl>;
        };

        port {
            dsi0_in_tcon0: endpoint {
                remote-endpoint = <&tcon0_out_dsi0>;
            };
        };
    };

...
