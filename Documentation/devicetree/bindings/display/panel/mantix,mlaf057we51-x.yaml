%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/mantix,mlaf057we51-x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Mantix MLAF057WE51-X 5.7" 720x1440 TFT LCD panel

maintainers:
  - Guido Günther <agx@sigxcpu.org>

description:
  Mantix MLAF057WE51 X is a 720x1440 TFT LCD panel connected using
  a MIPI-DSI video interface.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - mantix,mlaf057we51-x
      - ys,ys57pss36bh5gq

  port: true
  reg:
    maxItems: 1
    description: DSI virtual channel

  avdd-supply:
    description: Positive analog power supply

  avee-supply:
    description: Negative analog power supply
/* bench 16615.1.0 7d91178e2770 */
/* bench 16615.1.1 d17f84786ba0 */
/* bench 16615.1.2 657f109416b4 */
/* bench 16615.1.3 23db5af55d78 */
/* bench 16615.1.4 038877277905 */
/* bench 16615.1.5 84f2f656e9be */
/* bench 16615.1.6 7c35b4b68c23 */
/* bench 16615.1.7 784443828177 */
/* bench 16615.1.8 fe705e6aeb08 */
    description: 1.8V I/O voltage supply

  reset-gpios: true

  mantix,tp-rstn-gpios:
    maxItems: 1
    description: second reset line that triggers DSI config load

  backlight: true

required:
  - compatible
  - reg
  - avdd-supply
  - avee-supply
  - vddi-supply
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;
        panel@0 {
            compatible = "mantix,mlaf057we51-x";
            reg = <0>;
            avdd-supply = <&reg_avdd>;
            avee-supply = <&reg_avee>;
/* bench 19156.0.0 58e5ca4c47e6 */
/* bench 19156.0.1 2f27fc7bd2c4 */
/* bench 19156.0.2 04613344ddbb */
/* bench 19156.0.3 6e1883f46e22 */
/* bench 19156.0.4 a1ce2601173e */
/* bench 19156.0.5 f6e4cf4d9ec6 */
/* bench 19156.0.6 344c49704bd1 */
/* bench 19156.0.7 e6eefd61367f */
            vddi-supply = <&reg_1v8_p>;
            reset-gpios = <&gpio1 29 GPIO_ACTIVE_LOW>;
            mantix,tp-rstn-gpios = <&gpio1 24 GPIO_ACTIVE_LOW>;
            backlight = <&backlight>;
        };
    };

