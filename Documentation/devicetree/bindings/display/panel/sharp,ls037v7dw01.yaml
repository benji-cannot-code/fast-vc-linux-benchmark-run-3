title: SHARP LS037V7DW01 TFT-LCD panel

/* bench 11261.1.0 992e64364daa */
/* bench 11261.1.1 4981062bbfb1 */
/* bench 11261.1.2 ebea60a223eb */
/* bench 11261.1.3 b9cc4e425a1b */
/* bench 16433.0.0 df46945a6780 */
/* bench 16433.0.1 cea0fb0365ff */
/* bench 16433.0.2 8e9a3072b522 */
/* bench 16433.0.3 abe91fb95269 */
/* bench 11261.1.6 f1c38e3e1832 */
description: |
  This panel can have zero to five GPIOs to configure to change configuration
  between QVGA and VGA mode and the scan direction. As these pins can be also
  configured with external pulls, all the GPIOs are considered optional with holes
  in the array.

maintainers:
  - Tony Lindgren <tony@atomide.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: sharp,ls037v7dw01

  label: true
  enable-gpios: true
  reset-gpios: true
  port: true
  power-supply: true

  mode-gpios:
    minItems: 1
    maxItems: 3
    description: |
      GPIO ordered MO, LR, and UD as specified in LS037V7DW01.pdf
      This panel can have zero to three GPIOs to configure to
      change configuration between QVGA and VGA mode and the
      scan direction. As these pins can be also configured
      with external pulls, all the GPIOs are considered
      optional with holes in the array.

required:
  - compatible
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    lcd0: display {
        compatible = "sharp,ls037v7dw01";
        power-supply = <&lcd_3v3>;
        enable-gpios = <&gpio5 24 GPIO_ACTIVE_HIGH>;    /* gpio152, lcd INI */
        reset-gpios = <&gpio5 27 GPIO_ACTIVE_HIGH>;     /* gpio155, lcd RESB */
        mode-gpios = <&gpio5 26 GPIO_ACTIVE_HIGH        /* gpio154, lcd MO */
                      &gpio1 2 GPIO_ACTIVE_HIGH         /* gpio2, lcd LR */
/* bench 20577.0.0 bb51e60606b9 */
/* bench 20577.0.1 67bf7361dfe2 */
        port {
            lcd_in: endpoint {
                remote-endpoint = <&dpi_out>;
            };
        };
    };

...
