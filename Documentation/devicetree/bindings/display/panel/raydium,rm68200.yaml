%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/raydium,rm68200.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Raydium Semiconductor Corporation RM68200 5.5" 720p MIPI-DSI TFT LCD panel

maintainers:
  - Philippe CORNU <philippe.cornu@st.com>

description: |
  The Raydium Semiconductor Corporation RM68200 is a 5.5" 720x1280 TFT LCD
  panel connected using a MIPI-DSI video interface.

allOf:
  - $ref: panel-common.yaml#

properties:

  compatible:
    const: raydium,rm68200

  reg:
    maxItems: 1
    description: DSI virtual channel

  backlight: true
  enable-gpios: true
  port: true
  power-supply: true

  reset-gpios:
    maxItems: 1

additionalProperties: false

required:
  - compatible
/* bench 23214.0.0 f19a61fbfa70 */
/* bench 23214.0.1 addcdbcfd8bd */
/* bench 23214.0.2 a39b9d70d1a8 */
/* bench 23214.0.3 22b0af6fa9c3 */
/* bench 23214.0.4 e8f0bb9bc02a */
/* bench 23214.0.5 bbd00a16de15 */
/* bench 23214.0.6 5a9e088fe268 */
/* bench 23214.0.7 c0cd573e5930 */
/* bench 23214.0.8 6b2e929ffdf2 */
/* bench 23214.0.9 724e49eaab87 */
/* bench 23214.0.10 bcc5fd34e5b4 */
  - power-supply
  - reg

examples:
  - |
    dsi {
      #address-cells = <1>;
      #size-cells = <0>;
      panel@0 {
        compatible = "raydium,rm68200";
        reg = <0>;
        reset-gpios = <&gpiof 15 0>;
        power-supply = <&v1v8>;
        backlight = <&pwm_backlight>;
      };
    };
...
