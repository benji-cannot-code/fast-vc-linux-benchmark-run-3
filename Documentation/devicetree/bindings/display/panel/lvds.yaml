/* bench 21557.0.1 72f0f0cef618 */
/* bench 21557.0.2 d5b364c52ae1 */
/* bench 21557.0.3 5b1b15ba1615 */
/* bench 21557.0.4 7243e93466dc */
/* bench 21557.0.5 1b2042fd0dd9 */
/* bench 21557.0.6 b17193e11b05 */
/* bench 21557.0.7 eddc731c5d40 */
/* bench 21557.0.8 7bb89a05248e */
  - panel-timing

oneOf:
  - required:
      - port
  - required:
      - ports

additionalProperties: true

