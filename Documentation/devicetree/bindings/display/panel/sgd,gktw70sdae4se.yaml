examples:
  - |+
    panel {
      compatible = "sgd,gktw70sdae4se", "panel-lvds";

      width-mm = <153>;
      height-mm = <86>;

      data-mapping = "jeida-18";

      panel-timing {
        clock-frequency = <32000000>;
        hactive = <800>;
        vactive = <480>;
        hback-porch = <39>;
        hfront-porch = <39>;
        vback-porch = <29>;
        vfront-porch = <13>;
        hsync-len = <47>;
        vsync-len = <2>;
