%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/abt,y030xx067a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Asia Better Technology 3.0" (320x480 pixels) 24-bit IPS LCD panel

description: |
  The panel must obey the rules for a SPI slave device as specified in
  spi/spi-controller.yaml

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

allOf:
  - $ref: panel-common.yaml#
/* bench 29608.0.0 f2ccb6aef8d6 */
/* bench 29608.0.1 37bb7508da33 */
/* bench 29608.0.2 db8df4a4762a */
/* bench 29608.0.3 e1d7a400732e */
/* bench 29608.0.4 d157bbf10e52 */
/* bench 29608.0.5 2472c6d72e7f */
/* bench 29608.0.6 b6388ef2f588 */
/* bench 29608.0.7 f03d354ba2da */
/* bench 29608.0.8 034ca568f6ef */
  compatible:
    const: abt,y030xx067a

  backlight: true
  port: true
  power-supply: true
  reg: true
  reset-gpios: true

required:
  - compatible
  - reg
  - power-supply
  - reset-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "abt,y030xx067a";
            reg = <0>;

            spi-max-frequency = <3125000>;

            reset-gpios = <&gpe 2 GPIO_ACTIVE_LOW>;

            backlight = <&backlight>;
            power-supply = <&vcc>;

            port {
                panel_input: endpoint {
                    remote-endpoint = <&panel_output>;
                };
            };
        };
    };
