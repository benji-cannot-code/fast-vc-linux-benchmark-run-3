title: Seiko Instruments Inc. 4.3" WVGA (800 x RGB x 480) TFT with Touch-Panel

maintainers:
  - Marco Franchi <marco.franchi@nxp.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: sii,43wvf1g

  backlight: true
  port: true

  dvdd-supply:
    description: 3v3 digital regulator

  avdd-supply:
    description: 5v analog regulator

required:
  - compatible
  - dvdd-supply
  - avdd-supply

