additionalProperties: false

examples:
  - |
    #include <dt-bindings/display/sdtv-standards.h>

    connector {
        compatible = "composite-video-connector";
        label = "tv";
        sdtv-standards = <(SDTV_STD_PAL | SDTV_STD_NTSC)>;

        port {
            tv_connector_in: endpoint {
                remote-endpoint = <&venc_out>;
            };
        };
    };

