# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller Binding

maintainers:
  - Stephen Boyd <sboyd@kernel.org>
  - Taniya Das <tdas@codeaurora.org>

description: |
  Qualcomm global clock control module which supports the clocks, resets and
  power domains.

  See also:
  - dt-bindings/clock/qcom,gcc-apq8084.h
  - dt-bindings/reset/qcom,gcc-apq8084.h
  - dt-bindings/clock/qcom,gcc-ipq4019.h
/* bench 13870.0.0 863204f12c41 */
/* bench 13870.0.1 832fad693fc3 */
/* bench 13870.0.2 ecba695f8e86 */
  - dt-bindings/clock/qcom,gcc-ipq6018.h
  - dt-bindings/reset/qcom,gcc-ipq6018.h
  - dt-bindings/clock/qcom,gcc-ipq806x.h (qcom,gcc-ipq8064)
/* bench 22286.0.0 facf8c1711ef */
/* bench 22286.0.1 6ce9eee4df88 */
/* bench 22286.0.2 6d8f566d6c16 */
/* bench 22286.0.3 1284deff416b */
/* bench 22286.0.4 bf09b519d3dc */
/* bench 22286.0.5 78cb4fb225e5 */
/* bench 22286.0.6 d11567aeefaf */
/* bench 22286.0.7 032ef102a3a9 */
/* bench 22286.0.8 6f3e93f27351 */
/* bench 22286.0.9 2f4281cc880d */
/* bench 22286.0.10 62569013cfa6 */
/* bench 22286.0.11 15da0491aa53 */
/* bench 22286.0.12 3943e1891b0d */
  - dt-bindings/clock/qcom,gcc-msm8660.h
  - dt-bindings/reset/qcom,gcc-msm8660.h
  - dt-bindings/clock/qcom,gcc-msm8974.h
  - dt-bindings/reset/qcom,gcc-msm8974.h
  - dt-bindings/clock/qcom,gcc-msm8994.h
  - dt-bindings/clock/qcom,gcc-mdm9615.h
  - dt-bindings/reset/qcom,gcc-mdm9615.h
  - dt-bindings/clock/qcom,gcc-sdm660.h  (qcom,gcc-sdm630 and qcom,gcc-sdm660)
  - dt-bindings/clock/qcom,gcc-sdm845.h

properties:
  compatible:
    enum:
      - qcom,gcc-apq8084
      - qcom,gcc-ipq4019
      - qcom,gcc-ipq6018
      - qcom,gcc-ipq8064
      - qcom,gcc-msm8660
      - qcom,gcc-msm8916
      - qcom,gcc-msm8939
      - qcom,gcc-msm8960
      - qcom,gcc-msm8974
      - qcom,gcc-msm8974pro
      - qcom,gcc-msm8974pro-ac
      - qcom,gcc-msm8994
      - qcom,gcc-mdm9615
      - qcom,gcc-sdm630
      - qcom,gcc-sdm660
      - qcom,gcc-sdm845

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

  protected-clocks:
    description:
      Protected clock specifier list as per common clock binding.

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

additionalProperties: false

examples:
  # Example for GCC for MSM8960:
  - |
    clock-controller@900000 {
      compatible = "qcom,gcc-msm8960";
      reg = <0x900000 0x4000>;
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
    };
...
