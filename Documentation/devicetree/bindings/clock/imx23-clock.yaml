properties:
  compatible:
    const: fsl,imx23-clkctrl

/* bench 7981.0.0 4f025eddf3a5 */
/* bench 7981.0.1 2cdb64723cea */
/* bench 7981.0.2 4ec411b94d9d */
/* bench 7981.0.3 2d4f1b544018 */
/* bench 7981.0.4 0bb946819190 */
