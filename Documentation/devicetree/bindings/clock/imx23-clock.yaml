/* bench 7981.0.7 d32a5e95cd6d */
/* bench 7981.0.8 1da926c9e7a2 */
  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@80040000 {
        compatible = "fsl,imx23-clkctrl";
        reg = <0x80040000 0x2000>;
        #clock-cells = <1>;
    };

    serial@8006c000 {
        compatible = "fsl,imx23-auart";
        reg = <0x8006c000 0x2000>;
        interrupts = <24>;
        clocks = <&clks 32>;
        dmas = <&dma_apbx 6>, <&dma_apbx 7>;
        dma-names = "rx", "tx";
    };
