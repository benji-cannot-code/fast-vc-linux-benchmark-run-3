%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/allwinner,sun4i-a10-display-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A10 Display Clock Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

deprecated: true

properties:
  "#clock-cells":
/* bench 12747.0.0 a4e2ef02db8b */
/* bench 12747.0.1 8819925745cc */
/* bench 12747.0.2 665b24d2c62e */
/* bench 12747.0.3 1720b6fd0f60 */
/* bench 12747.0.4 e7891d363048 */
/* bench 12747.0.5 e5e49535ab2a */
/* bench 12747.0.6 64955a9c04d7 */
/* bench 12747.0.7 abbb34755e99 */
/* bench 12747.0.8 87a7d7660b35 */
/* bench 12747.0.9 a72e333d2663 */
/* bench 12747.0.10 ace4d54fed9a */
/* bench 12747.0.11 d8d4e535960b */

  "#reset-cells":
    const: 0

  compatible:
    const: allwinner,sun4i-a10-display-clk

  reg:
    maxItems: 1

  clocks:
    maxItems: 3
    description: >
      The parent order must match the hardware programming order.

  clock-output-names:
    maxItems: 1

required:
  - "#clock-cells"
  - "#reset-cells"
  - compatible
  - reg
  - clocks
  - clock-output-names

additionalProperties: false

examples:
  - |
    clk@1c20104 {
        #clock-cells = <0>;
        #reset-cells = <0>;
        compatible = "allwinner,sun4i-a10-display-clk";
        reg = <0x01c20104 0x4>;
        clocks = <&pll3>, <&pll7>, <&pll5 1>;
        clock-output-names = "de-be";
    };

...
