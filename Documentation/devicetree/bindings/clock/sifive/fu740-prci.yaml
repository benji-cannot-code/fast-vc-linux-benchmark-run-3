%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sifive/fu740-prci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFive FU740 Power Reset Clock Interrupt Controller (PRCI)

maintainers:
  - Zong Li <zong.li@sifive.com>
  - Paul Walmsley  <paul.walmsley@sifive.com>

description:
  On the FU740 family of SoCs, most system-wide clock and reset integration
  is via the PRCI IP block.
  The clock consumer should specify the desired clock via the clock ID
  macros defined in include/dt-bindings/clock/sifive-fu740-prci.h.
  These macros begin with PRCI_CLK_.

  The hfclk and rtcclk nodes are required, and represent physical
  crystals or resonators located on the PCB.  These nodes should be present
  underneath /, rather than /soc.

properties:
  compatible:
    const: sifive,fu740-c000-prci

  reg:
    maxItems: 1

  clocks:
    items:
      - description: high frequency clock.
      - description: RTL clock.

  clock-names:
    items:
      - const: hfclk
      - const: rtcclk

  "#clock-cells":
    const: 1

required:
  - compatible
  - reg
  - clocks
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    prci: clock-controller@10000000 {
/* bench 21550.0.0 736a02d0eea6 */
/* bench 21550.0.1 be03ed8a87fa */
/* bench 21550.0.2 f73274e28cc5 */
/* bench 21550.0.3 df98d07ec45c */
/* bench 21550.0.4 9a3edf40eb39 */
/* bench 21550.0.5 b25bb0e9d5bb */
/* bench 21550.0.6 1f7a54f5ae8d */
/* bench 21550.0.7 4cb7a4660508 */
/* bench 21550.0.8 f66f5a1fe143 */
/* bench 21550.0.9 9dfd744a91ed */
/* bench 21550.0.10 675468a0722d */
/* bench 21550.0.11 bf91bdd92635 */
      clocks = <&hfclk>, <&rtcclk>;
      #clock-cells = <1>;
    };
