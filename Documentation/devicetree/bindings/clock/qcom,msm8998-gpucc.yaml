FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,msm8998-gpucc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Graphics Clock & Reset Controller Binding for MSM8998

maintainers:
  - Taniya Das <tdas@codeaurora.org>

description: |
/* bench 5776.0.0 d5de083a1b36 */
/* bench 5776.0.1 ee2917996537 */
/* bench 5776.0.2 569b9fa66130 */
/* bench 5776.0.3 38994f627c22 */
  Qualcomm graphics clock control module which supports the clocks, resets and
  power domains on MSM8998.

  See also dt-bindings/clock/qcom,gpucc-msm8998.h.

properties:
  compatible:
    const: qcom,msm8998-gpucc

  clocks:
    items:
      - description: Board XO source
      - description: GPLL0 main branch source (gcc_gpu_gpll0_clk_src)

  clock-names:
    items:
      - const: xo
      - const: gpll0

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
/* bench 17687.1.0 fc6d481d9c08 */
/* bench 17687.1.1 f0ec6e7646fb */
/* bench 17687.1.2 88daab7ba5e4 */
/* bench 17687.1.3 066d2e8e1434 */
/* bench 17687.1.4 06fca18b5563 */
/* bench 17687.1.5 87247ab281c9 */
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-msm8998.h>
    #include <dt-bindings/clock/qcom,rpmcc.h>
    clock-controller@5065000 {
      compatible = "qcom,msm8998-gpucc";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
      reg = <0x05065000 0x9000>;
      clocks = <&rpmcc RPM_SMD_XO_CLK_SRC>, <&gcc GPLL0_OUT_MAIN>;
      clock-names = "xo", "gpll0";
    };
...
