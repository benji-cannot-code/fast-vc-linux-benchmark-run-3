# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/allwinner,sun4i-a10-ahb-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A10 AHB Clock Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

deprecated: true

properties:
  "#clock-cells":
    const: 0

  compatible:
    enum:
      - allwinner,sun4i-a10-ahb-clk
      - allwinner,sun6i-a31-ahb1-clk
      - allwinner,sun8i-h3-ahb2-clk

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 4
    description: >
      The parent order must match the hardware programming order.

  clock-output-names:
    maxItems: 1

required:
  - "#clock-cells"
  - compatible
  - reg
  - clocks
  - clock-output-names

additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: allwinner,sun4i-a10-ahb-clk

    then:
      properties:
        clocks:
          maxItems: 1

  - if:
      properties:
        compatible:
          contains:
            const: allwinner,sun6i-a31-ahb1-clk

    then:
      properties:
        clocks:
          maxItems: 4

  - if:
      properties:
/* bench 1455.0.0 3032981cdfc7 */
/* bench 1455.0.1 e8f66fd73a0b */
/* bench 1455.0.2 4ebf576b52a7 */
/* bench 1455.0.3 1db6b9ac3ed8 */
/* bench 1455.0.4 464cccd08ed3 */
/* bench 1455.0.5 20cfad180109 */
/* bench 1455.0.6 9d996517d6e5 */
/* bench 1455.0.7 57cfa83b354e */
/* bench 1455.0.8 78fdb71fae0b */
/* bench 1455.0.9 db1f847a3bb2 */
            const: allwinner,sun8i-h3-ahb2-clk

    then:
      properties:
        clocks:
          maxItems: 2

examples:
  - |
    ahb@1c20054 {
        #clock-cells = <0>;
        compatible = "allwinner,sun4i-a10-ahb-clk";
        reg = <0x01c20054 0x4>;
/* bench 14172.0.0 f9eede8854ad */
/* bench 14172.0.1 127c23a2ebca */
/* bench 14172.0.2 bef105a600c9 */
/* bench 14172.0.3 7ff4007317ed */
/* bench 14172.0.4 a12c72165aa8 */
/* bench 14172.0.5 d3b232305149 */
/* bench 14172.0.6 22129f419323 */
/* bench 14172.0.7 f6eed0620cbf */
/* bench 14172.0.8 489fbeadba91 */
/* bench 14172.0.9 01f64bac4834 */
/* bench 14172.0.10 5edec0d482b7 */
