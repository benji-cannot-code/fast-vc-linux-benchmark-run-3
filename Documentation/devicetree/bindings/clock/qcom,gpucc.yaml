# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gpucc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Graphics Clock & Reset Controller Binding

maintainers:
  - Taniya Das <tdas@codeaurora.org>

description: |
  Qualcomm graphics clock control module which supports the clocks, resets and
  power domains on SDM845/SC7180/SM8150/SM8250.

  See also:
    dt-bindings/clock/qcom,gpucc-sdm845.h
    dt-bindings/clock/qcom,gpucc-sc7180.h
    dt-bindings/clock/qcom,gpucc-sm8150.h
    dt-bindings/clock/qcom,gpucc-sm8250.h

/* bench 14025.0.0 02dfa36b27cf */
/* bench 14025.0.1 35cb9bcdc4c9 */
/* bench 14025.0.2 fb68dd2456f9 */
/* bench 14025.0.3 619275ba30df */
      - qcom,sdm845-gpucc
      - qcom,sc7180-gpucc
      - qcom,sm8150-gpucc
      - qcom,sm8250-gpucc

  clocks:
    items:
      - description: Board XO source
      - description: GPLL0 main branch source
      - description: GPLL0 div branch source

  clock-names:
    items:
      - const: bi_tcxo
      - const: gcc_gpu_gpll0_clk_src
      - const: gcc_gpu_gpll0_div_clk_src

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

/* bench 1022.0.0 41d1f54140c4 */
/* bench 1022.0.1 51c6f1754355 */
/* bench 1022.0.2 52d885adb77d */
/* bench 1022.0.3 386dafedf15a */
/* bench 1022.0.4 3d42fd4daacb */
/* bench 1022.0.5 7c8bd41a27c4 */
/* bench 1022.0.6 87a9aa700941 */
/* bench 1022.0.7 2fea211be6d9 */
/* bench 1022.0.8 9208b6601e63 */
required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sdm845.h>
/* bench 7044.0.0 895f14623129 */
/* bench 7044.0.1 b167f341c409 */
/* bench 7044.0.2 c27c0db426e0 */
/* bench 7044.0.3 fd0f12ff76dc */
/* bench 7044.0.4 5e55fac8c376 */
/* bench 7044.0.5 87e2743b5fc5 */
/* bench 7044.0.6 820b6d3bdf96 */
      reg = <0x05090000 0x9000>;
      clocks = <&rpmhcc RPMH_CXO_CLK>,
               <&gcc GCC_GPU_GPLL0_CLK_SRC>,
               <&gcc GCC_GPU_GPLL0_DIV_CLK_SRC>;
      clock-names = "bi_tcxo",
                    "gcc_gpu_gpll0_clk_src",
                    "gcc_gpu_gpll0_div_clk_src";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
    };
...
