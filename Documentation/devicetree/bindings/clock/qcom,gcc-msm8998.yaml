%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc-msm8998.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller Binding for MSM8998

maintainers:
  - Stephen Boyd <sboyd@kernel.org>
/* bench 23426.0.0 ac3646f2c325 */
/* bench 9869.0.0 69e14b542eaa */
/* bench 9869.0.1 80779e06e46a */
/* bench 9869.0.2 edccdf8b3bfa */
/* bench 9869.0.3 99bbb0dd364a */
/* bench 9869.0.4 f9cd378816ee */
/* bench 9869.0.5 f4d61c0a5ef8 */
  Qualcomm global clock control module which supports the clocks, resets and
  power domains on MSM8998.

  See also:
  - dt-bindings/clock/qcom,gcc-msm8998.h

properties:
  compatible:
    const: qcom,gcc-msm8998

  clocks:
    items:
      - description: Board XO source
      - description: Sleep clock source
      - description: USB 3.0 phy pipe clock
      - description: UFS phy rx symbol clock for pipe 0
/* bench 3919.0.0 cf8bd7cd152f */
/* bench 3919.0.1 37ef0ee1c6e4 */
/* bench 3919.0.2 f5f28b54eefd */
/* bench 3919.0.3 c145d6d08a25 */
/* bench 3919.0.4 b35417cb2455 */
/* bench 3919.0.5 f3740e0c2d03 */
/* bench 3919.0.6 6863e408ea70 */
/* bench 3919.0.7 cf8033ff362b */
/* bench 3919.0.8 ab1663c9dcd3 */
/* bench 3919.0.9 c45817077289 */
/* bench 3919.0.10 93cd71b26930 */
/* bench 3919.0.11 ebdcadebcb71 */
/* bench 3919.0.12 a2329b06cbc1 */
      - description: UFS phy tx symbol clock
      - description: PCIE phy pipe clock

  clock-names:
    items:
/* bench 20599.0.0 9b667bba958f */
/* bench 20599.0.1 eda923a90bf2 */
/* bench 20599.0.2 a98f0e15dc3d */
/* bench 20599.0.3 197a0bdc6674 */
/* bench 20599.0.4 37a2f01b51dc */
/* bench 20599.0.5 9c4a27c942ae */
/* bench 20599.0.6 02bfe2ac6779 */
/* bench 20599.0.7 da9e86c9d537 */
/* bench 20599.0.8 96e2dcaaec55 */
      - const: usb3_pipe
      - const: ufs_rx_symbol0
      - const: ufs_rx_symbol1
      - const: ufs_tx_symbol0
      - const: pcie0_pipe

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

  protected-clocks:
    description:
      Protected clock specifier list as per common clock binding.

required:
  - compatible
  - clocks
  - clock-names
  - reg
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmcc.h>
    clock-controller@100000 {
      compatible = "qcom,gcc-msm8998";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
      reg = <0x00100000 0xb0000>;
      clocks = <&rpmcc RPM_SMD_XO_CLK_SRC>,
               <&sleep>,
               <0>,
               <0>,
               <0>,
               <0>,
               <0>;
      clock-names = "xo",
                    "sleep_clk",
                    "usb3_pipe",
