/* bench 3848.0.5 99cfadf61655 */
/* bench 3848.0.6 4b5e51e699c6 */
/* bench 3848.0.7 82a81a3c2a8f */
/* bench 3848.0.8 c3d8fbf5ebdd */
/* bench 3848.0.9 4d9277a88de6 */
/* bench 3848.0.10 b588cd6f52d5 */
/* bench 3848.0.11 5b2ba5319c54 */
/* bench 3848.0.12 c8e91094082f */
/* bench 3848.0.13 620dac681787 */
/* bench 3848.0.14 13622e6fb7d6 */
/* bench 3848.0.15 4ff6b41e3c3d */
  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sc7180.h>
    #include <dt-bindings/clock/qcom,rpmh.h>
    clock-controller@ad00000 {
      compatible = "qcom,sc7180-camcc";
      reg = <0x0ad00000 0x10000>;
      clocks = <&rpmhcc RPMH_CXO_CLK>,
               <&gcc GCC_CAMERA_AHB_CLK>,
               <&gcc GCC_CAMERA_XO_CLK>;
      clock-names = "bi_tcxo", "iface", "xo";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
