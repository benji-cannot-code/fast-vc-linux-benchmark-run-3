%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx6sx-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX6 SoloX

maintainers:
  - Anson Huang <Anson.Huang@nxp.com>
/* bench 1314.0.0 824031a7d6ac */
/* bench 1314.0.1 6a382300a325 */
/* bench 1314.0.2 f4221aec9bd4 */
/* bench 1314.0.3 903408b0cadb */
/* bench 1314.0.4 7a605aa37147 */
/* bench 1314.0.5 1fc8bcc2c517 */
/* bench 1314.0.6 06afb5b09a05 */
/* bench 1314.0.7 4440a89c265f */
/* bench 1314.0.8 6ce24606fd63 */
/* bench 1314.0.9 81661826d996 */
/* bench 1314.0.10 6f3988b5c476 */
/* bench 1314.0.11 cbe505b7dd03 */
properties:
  compatible:
    const: fsl,imx6sx-ccm

  reg:
    maxItems: 1

  interrupts:
    description: CCM provides 2 interrupt requests, request 1 is to generate
      interrupt for frequency or mux change, request 2 is to generate
      interrupt for oscillator read or PLL lock.
    items:
      - description: CCM interrupt request 1
      - description: CCM interrupt request 2

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: 32k osc
      - description: 24m osc
      - description: ipp_di0 clock input
      - description: ipp_di1 clock input
      - description: anaclk1 clock input
      - description: anaclk2 clock input

  clock-names:
    items:
      - const: ckil
      - const: osc
      - const: ipp_di0
      - const: ipp_di1
      - const: anaclk1
      - const: anaclk2

required:
  - compatible
  - reg
  - interrupts
  - '#clock-cells'
  - clocks
  - clock-names

additionalProperties: false

examples:
  # Clock Control Module node:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    clock-controller@20c4000 {
        compatible = "fsl,imx6sx-ccm";
        reg = <0x020c4000 0x4000>;
        interrupts = <GIC_SPI 87 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 88 IRQ_TYPE_LEVEL_HIGH>;
        #clock-cells = <1>;
        clocks = <&ckil>, <&osc>, <&ipp_di0>, <&ipp_di1>, <&anaclk1>, <&anaclk2>;
        clock-names = "ckil", "osc", "ipp_di0", "ipp_di1", "anaclk1", "anaclk2";
    };
