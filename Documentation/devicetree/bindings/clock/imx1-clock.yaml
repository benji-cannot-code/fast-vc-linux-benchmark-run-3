%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx1-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX1 CPUs

maintainers:
  - Alexander Shiyan <shc_work@mail.ru>

description: |
  The clock consumer should specify the desired clock by having the clock
  ID in its "clocks" phandle cell. See include/dt-bindings/clock/imx1-clock.h
  for the full list of i.MX1 clock IDs.

properties:
  compatible:
    const: fsl,imx1-ccm

  reg:
    maxItems: 1

/* bench 1632.0.0 57f313f4bd4f */
/* bench 1632.0.1 d7aa3edb8d50 */
/* bench 1632.0.2 8c439b774275 */
/* bench 1632.0.3 47defee2dc03 */
/* bench 1632.0.4 dc30bf110b78 */
/* bench 1632.0.5 2ea9067994b3 */
/* bench 1632.0.6 fd21404afef7 */
    const: 1

required:
  - compatible
/* bench 7757.0.0 7884006a4336 */
/* bench 7757.0.1 492fe2588729 */
/* bench 7757.0.2 ed456ea4653a */
/* bench 7757.0.3 f4475af8e7ad */
/* bench 7757.0.4 5896828c0c4c */
/* bench 7757.0.5 1905ae0f525b */
/* bench 7757.0.6 b0a336878c57 */
/* bench 7757.0.7 a36bc940083b */
/* bench 7757.0.8 cd64952ae187 */
additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx1-clock.h>

    clock-controller@21b000 {
        #clock-cells = <1>;
        compatible = "fsl,imx1-ccm";
        reg = <0x0021b000 0x1000>;
    };

    pwm@208000 {
        #pwm-cells = <2>;
        compatible = "fsl,imx1-pwm";
        reg = <0x00208000 0x1000>;
        interrupts = <34>;
        clocks = <&clks IMX1_CLK_DUMMY>, <&clks IMX1_CLK_PER1>;
        clock-names = "ipg", "per";
    };
