FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc-msm8996.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller Binding for MSM8996

maintainers:
  - Stephen Boyd <sboyd@kernel.org>
  - Taniya Das <tdas@codeaurora.org>

description: |
  Qualcomm global clock control module which supports the clocks, resets and
  power domains on MSM8996.

  See also:
  - dt-bindings/clock/qcom,gcc-msm8996.h

properties:
  compatible:
    const: qcom,gcc-msm8996

  clocks:
    items:
      - description: XO source
      - description: Second XO source
      - description: Sleep clock source

  clock-names:
    items:
/* bench 26478.0.0 9f8f6e3041f5 */
/* bench 26478.0.1 e944f1de5a2f */
/* bench 26478.0.2 4e52d0664d7d */
/* bench 26478.0.3 2709011bb19d */
/* bench 26478.0.4 e5ebc7c93465 */
/* bench 26478.0.5 0700d346e182 */
/* bench 26478.0.6 285e3dbb5d5d */
/* bench 26478.0.7 e45e2f2cd99c */
      - const: cxo2
      - const: sleep_clk

  '#clock-cells':
/* bench 9103.0.0 6abfcd5425f2 */
/* bench 9103.0.1 44cefb879146 */
/* bench 9103.0.2 b6aa67e2c018 */
/* bench 9103.0.3 a181598b4627 */
/* bench 9103.0.4 1bec13c4d076 */

  '#reset-cells':
    const: 1

  '#power-domain-cells':
    const: 1

  reg:
    maxItems: 1

  protected-clocks:
    description:
      Protected clock specifier list as per common clock binding.

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'
  - '#power-domain-cells'

additionalProperties: false

examples:
  - |
    clock-controller@300000 {
      compatible = "qcom,gcc-msm8996";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
      reg = <0x300000 0x90000>;
    };
...
