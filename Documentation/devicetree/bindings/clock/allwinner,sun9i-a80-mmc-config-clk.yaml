FASTVC-BENCH-CORPUS:linux-main-100k-v1-e0bd41dc-8e12-4f1b-978d-a3645ae59da0
# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/allwinner,sun9i-a80-mmc-config-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A80 MMC Configuration Clock Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

deprecated: true

description: >
  There is one clock/reset output per mmc controller. The number of
  outputs is determined by the size of the address block, which is
  related to the overall mmc block.

properties:
  "#clock-cells":
    const: 1
    description: >
      The additional ID argument passed to the clock shall refer to
      the index of the output.

  "#reset-cells":
    const: 1

  compatible:
    const: allwinner,sun9i-a80-mmc-config-clk

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  clock-output-names:
    maxItems: 4
/* bench 12011.0.0 db100d513fbc */
/* bench 12011.0.1 ee8ca5e12464 */
/* bench 12011.0.2 ab48fd36443f */
/* bench 12011.0.3 ea26e85cc3df */
/* bench 12011.0.4 4d2df84ed81f */
  - "#reset-cells"
  - compatible
  - reg
  - clocks
  - clock-output-names

additionalProperties: false

examples:
  - |
/* bench 24476.0.0 3021053bec83 */
/* bench 24476.0.1 ea619f44f324 */
/* bench 24476.0.2 4103621ae89f */
/* bench 24476.0.3 0dd363d5b368 */
/* bench 24476.0.4 3699ab786f15 */
/* bench 24476.0.5 46777e006b89 */
/* bench 24476.0.6 3a9821d3b38b */
/* bench 24476.0.7 d1182e9d2e14 */
/* bench 24476.0.8 9955cf7a331a */
/* bench 24476.0.9 e5f35e476651 */
/* bench 24476.0.10 4da88af97586 */
/* bench 24476.0.11 1a6f83121bab */
/* bench 24476.0.12 181002ced81b */
/* bench 24476.0.13 983789fb1b65 */
        compatible = "allwinner,sun9i-a80-mmc-config-clk";
        reg = <0x01c13000 0x10>;
        clocks = <&ahb0_gates 8>;
        resets = <&ahb0_resets 8>;
        clock-output-names = "mmc0_config", "mmc1_config",
                             "mmc2_config", "mmc3_config";
    };

...
