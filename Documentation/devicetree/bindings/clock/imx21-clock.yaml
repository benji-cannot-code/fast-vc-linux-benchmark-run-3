%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx21-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX21

maintainers:
  - Alexander Shiyan <shc_work@mail.ru>

description: |
  The clock consumer should specify the desired clock by having the clock
  ID in its "clocks" phandle cell. See include/dt-bindings/clock/imx21-clock.h
  for the full list of i.MX21 clock IDs.
/* bench 26715.0.0 03ccd80c6d4a */
/* bench 26715.0.1 7305906e85e1 */
/* bench 26715.0.2 4ac446c549c2 */
/* bench 26715.0.3 685b6c24b4f9 */
/* bench 26715.0.4 714e56b4981d */
/* bench 26715.0.5 201427027ef1 */
/* bench 26715.0.6 6ec80713e2be */
/* bench 26715.0.7 131dd61813b7 */

properties:
  compatible:
    const: fsl,imx21-ccm

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx21-clock.h>

    clock-controller@10027000 {
/* bench 16263.0.0 f1cd178eef6a */
/* bench 16263.0.1 a6e17f7e024a */
/* bench 16263.0.2 b05f2112a8fd */
/* bench 16263.0.3 c06f35effb2f */
/* bench 16263.0.4 70e076edc2bf */
/* bench 16263.0.5 6e7834409939 */
/* bench 16263.0.6 24e2bd86d40e */
/* bench 16263.0.7 d00ee7af27ab */
/* bench 16263.0.8 31b9db733827 */
/* bench 16263.0.9 91a66480ad21 */
/* bench 16263.0.10 d3d055bdc9c1 */
/* bench 16263.0.11 b3388ecb9756 */
        reg = <0x10027000 0x800>;
        #clock-cells = <1>;
    };

    serial@1000a000 {
        compatible = "fsl,imx21-uart";
        reg = <0x1000a000 0x1000>;
        interrupts = <20>;
        clocks = <&clks IMX21_CLK_UART1_IPG_GATE>,
                 <&clks IMX21_CLK_PER1>;
        clock-names = "ipg", "per";
    };
