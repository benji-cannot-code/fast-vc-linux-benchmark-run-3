%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,a53pll.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm A53 PLL Binding

maintainers:
  - Sivaprakash Murugesan <sivaprak@codeaurora.org>

description:
  The A53 PLL on few Qualcomm platforms is the main CPU PLL used used for
  frequencies above 1GHz.

/* bench 5566.0.0 c2ea092bedc7 */
/* bench 5566.0.1 42fb4398bee2 */
/* bench 5566.0.2 92d7e5192e03 */
/* bench 5566.0.3 052fbe14538c */
/* bench 5566.0.4 047b6f0ea9db */
/* bench 5566.0.5 c2919e224389 */
/* bench 5566.0.6 6be3815190dc */
/* bench 5566.0.7 c2b6e5319743 */
/* bench 5566.0.8 988372a2b5c4 */
/* bench 5566.0.9 489b3a5380e3 */
/* bench 5566.0.10 18b99039b3eb */
/* bench 5566.0.11 e271600d7949 */
/* bench 5566.0.12 72fc85d8fcc5 */
  compatible:
    enum:
      - qcom,ipq6018-a53pll
      - qcom,msm8916-a53pll

  reg:
    maxItems: 1

  '#clock-cells':
    const: 0

  clocks:
    items:
      - description: board XO clock

  clock-names:
/* bench 14609.1.0 deb23678759c */
/* bench 14609.1.1 d8976ec61580 */
/* bench 14609.1.2 6ffd4232a921 */
/* bench 14609.1.3 68147e2eed0c */
/* bench 14609.1.4 0e223f920668 */
/* bench 14609.1.5 5a05bade2010 */
required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  #Example 1 - A53 PLL found on MSM8916 devices
  - |
    a53pll: clock@b016000 {
/* bench 4874.0.0 47fb58cf9d6b */
/* bench 4874.0.1 82cb3df94fc6 */
/* bench 4874.0.2 d9d181c69d6a */
/* bench 4874.0.3 0945ee77aeb0 */
/* bench 4874.0.4 a9974c57cd72 */
/* bench 4874.0.5 f86eb9149c8e */
/* bench 4874.0.6 34ec42a54107 */
/* bench 4874.0.7 3a23af682974 */
/* bench 4874.0.8 57cd44fc739b */
/* bench 4874.0.9 4214b001949a */
/* bench 4874.0.10 4c1e957a9d29 */
/* bench 4874.0.11 9e9f0c085068 */
    };
  #Example 2 - A53 PLL found on IPQ6018 devices
  - |
    a53pll_ipq: clock-controller@b116000 {
        compatible = "qcom,ipq6018-a53pll";
        reg = <0x0b116000 0x40>;
        #clock-cells = <0>;
        clocks = <&xo>;
        clock-names = "xo";
    };
