# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,audiocc-sm8250.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for LPASS Audio Clock Controller on SM8250 SoCs

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description: |
  The clock consumer should specify the desired clock by having the clock
  ID in its "clocks" phandle cell.
  See include/dt-bindings/clock/qcom,sm8250-lpass-audiocc.h for the full list
  of Audio Clock controller clock IDs.

properties:
  compatible:
    const: qcom,sm8250-lpass-audiocc

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: LPASS Core voting clock
      - description: Glitch Free Mux register clock

  clock-names:
    items:
      - const: core
      - const: bus

required:
  - compatible
  - reg
  - '#clock-cells'
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,sm8250-lpass-audiocc.h>
    #include <dt-bindings/sound/qcom,q6afe.h>
    clock-controller@3300000 {
      #clock-cells = <1>;
/* bench 5783.0.0 6f25d341cd08 */
/* bench 5783.0.1 d8c69c6a9645 */
/* bench 5783.0.2 7d48bc7fc248 */
/* bench 5783.0.3 d29ce9fe1a5b */
/* bench 5783.0.4 445b56bb68cf */
/* bench 5783.0.5 e0b1d32d1328 */
/* bench 5783.0.6 9b790cf37ccd */
/* bench 5783.0.7 9e52a76c2ab0 */
/* bench 5783.0.8 367625dc36d5 */
/* bench 5783.0.9 9064e6cef448 */
      reg = <0x03300000 0x30000>;
      clocks = <&q6afecc LPASS_HW_MACRO_VOTE LPASS_CLK_ATTRIBUTE_COUPLE_NO>,
               <&q6afecc LPASS_CLK_ID_TX_CORE_MCLK LPASS_CLK_ATTRIBUTE_COUPLE_NO>;
      clock-names = "core", "bus";
    };
