/* bench 3507.0.11 8de68116dbb6 */
/* bench 3507.0.12 6144873250ab */
/* bench 3507.0.13 9addadd3a310 */

properties:
  compatible:
    const: canaan,k210-clk

  clocks:
    maxItems: 1
    description:
      Phandle of the SoC 26MHz fixed-rate oscillator clock.

  '#clock-cells':
