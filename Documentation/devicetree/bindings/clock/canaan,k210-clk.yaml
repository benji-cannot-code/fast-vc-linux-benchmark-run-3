%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/canaan,k210-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Canaan Kendryte K210 Clock Device Tree Bindings
/* bench 473.0.0 a8d5eeee2cd4 */
/* bench 473.0.1 e4ec5dddb402 */
/* bench 473.0.2 d1ec04a93529 */
/* bench 473.0.3 9521e5d6dec3 */
/* bench 473.0.4 301e96f6dfcb */
/* bench 473.0.5 56225387b8c5 */
maintainers:
  - Damien Le Moal <damien.lemoal@wdc.com>

description: |
  Canaan Kendryte K210 SoC clocks driver bindings. The clock
  controller node must be defined as a child node of the K210
  system controller node.

  See also:
  - dt-bindings/clock/k210-clk.h

properties:
  compatible:
    const: canaan,k210-clk

  clocks:
    maxItems: 1
    description:
      Phandle of the SoC 26MHz fixed-rate oscillator clock.

  '#clock-cells':
    const: 1

required:
  - compatible
  - '#clock-cells'
  - clocks

additionalProperties: false
/* bench 2815.0.0 428ac14dc2e8 */
/* bench 2815.0.1 d897b8bf19cd */
/* bench 2815.0.2 dea949684291 */
/* bench 2815.0.3 717d160c14dd */
/* bench 2815.0.4 103ec83014cf */
/* bench 2815.0.5 b85e473f6ed8 */
/* bench 2815.0.6 833a6b0584ff */
/* bench 2815.0.7 1f0fd605e89d */
/* bench 2815.0.8 fce049ece97c */
/* bench 2815.0.9 f9cee2b7cd00 */
examples:
  - |
    #include <dt-bindings/clock/k210-clk.h>
    clocks {
      in0: oscillator {
        compatible = "fixed-clock";
        #clock-cells = <0>;
        clock-frequency = <26000000>;
      };
    };

    /* ... */
    sysclk: clock-controller {
      #clock-cells = <1>;
      compatible = "canaan,k210-clk";
      clocks = <&in0>;
    };
