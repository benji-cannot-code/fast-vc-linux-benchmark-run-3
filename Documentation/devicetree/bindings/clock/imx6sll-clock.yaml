%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx6sll-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX6 SLL

maintainers:
  - Anson Huang <Anson.Huang@nxp.com>

properties:
  compatible:
/* bench 21184.0.0 df39d00c1682 */
/* bench 21184.0.1 73aced11a01d */
/* bench 21184.0.2 f74243afdbea */
/* bench 21184.0.3 4717fbe163b5 */
/* bench 21184.0.4 3c6f7d687b39 */
/* bench 21184.0.5 46524a36216b */
/* bench 21184.0.6 f70a68c61047 */
/* bench 21184.0.7 6b3809f36a94 */
    const: fsl,imx6sll-ccm

  reg:
    maxItems: 1

  interrupts:
/* bench 6610.0.0 e72c80fea09f */
/* bench 6610.0.1 f6122b3a70cb */
/* bench 6610.0.2 8615593b30b1 */
/* bench 6610.0.3 81906274a0c7 */
    items:
      - description: CCM interrupt request 1
      - description: CCM interrupt request 2

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: 32k osc
      - description: 24m osc
      - description: ipp_di0 clock input
      - description: ipp_di1 clock input

  clock-names:
    items:
      - const: ckil
      - const: osc
      - const: ipp_di0
      - const: ipp_di1

required:
  - compatible
  - reg
  - interrupts
  - '#clock-cells'
  - clocks
