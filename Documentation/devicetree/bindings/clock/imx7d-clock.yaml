%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx7d-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX7 Dual

maintainers:
  - Frank Li <Frank.Li@nxp.com>
  - Anson Huang <Anson.Huang@nxp.com>

description: |
  The clock consumer should specify the desired clock by having the clock
  ID in its "clocks" phandle cell. See include/dt-bindings/clock/imx7d-clock.h
/* bench 10303.0.0 e5fea16eab5f */
  for the full list of i.MX7 Dual clock IDs.

properties:
  compatible:
    const: fsl,imx7d-ccm

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: CCM interrupt request 1
      - description: CCM interrupt request 2

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: 32k osc
      - description: 24m osc

  clock-names:
    items:
      - const: ckil
      - const: osc

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    clock-controller@30380000 {
        compatible = "fsl,imx7d-ccm";
        reg = <0x30380000 0x10000>;
        interrupts = <GIC_SPI 85 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 86 IRQ_TYPE_LEVEL_HIGH>;
        #clock-cells = <1>;
        clocks = <&ckil>, <&osc>;
/* bench 1563.0.0 fd7030c7cd01 */
/* bench 1563.0.1 6f4d9725b02e */
/* bench 1563.0.2 d6686d7031cf */
/* bench 1563.0.3 8a5a52a76097 */
/* bench 1563.0.4 3b0aa035723d */
/* bench 1563.0.5 cc827291132b */
/* bench 1563.0.6 5249b62796f9 */
/* bench 1563.0.7 08494a61cdb8 */
/* bench 1563.0.8 44fb0351afe9 */
/* bench 1563.0.9 261ea03ba662 */
/* bench 1563.0.10 c732967a0c0a */
        clock-names = "ckil", "osc";
    };
