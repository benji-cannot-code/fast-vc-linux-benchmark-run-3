      The parent order must match the hardware programming order.

  clock-output-names:
    maxItems: 1

required:
  - "#clock-cells"
  - compatible
  - reg
  - clocks
  - clock-output-names

additionalProperties: false

examples:
  - |
    clk@600005c {
        #clock-cells = <0>;
        compatible = "allwinner,sun9i-a80-gt-clk";
        reg = <0x0600005c 0x4>;
        clocks = <&osc24M>, <&pll4>, <&pll12>, <&pll12>;
        clock-output-names = "gt";
    };

