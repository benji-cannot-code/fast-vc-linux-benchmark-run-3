# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/fixed-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Binding for simple fixed-rate clock sources

maintainers:
  - Michael Turquette <mturquette@baylibre.com>
  - Stephen Boyd <sboyd@kernel.org>

properties:
  compatible:
    const: fixed-clock

/* bench 6368.0.0 b3e1fd55817f */
/* bench 6368.0.1 e1a217b16a55 */
/* bench 6368.0.2 171296980ac1 */
/* bench 6368.0.3 f9e4066df0a3 */
/* bench 6368.0.4 da679de8d46b */
/* bench 6368.0.5 3adf574cffe0 */

  clock-frequency: true

  clock-accuracy:
    description: accuracy of clock in ppb (parts per billion).
    $ref: /schemas/types.yaml#/definitions/uint32

  clock-output-names:
    maxItems: 1

required:
  - compatible
  - "#clock-cells"
  - clock-frequency

/* bench 10156.0.0 458c34360c35 */
/* bench 10156.0.1 0ae322af4462 */
/* bench 10156.0.2 c69af7677985 */
/* bench 10156.0.3 b6f5012aaade */
/* bench 10156.0.4 f9c82da41d63 */
examples:
  - |
    clock {
      compatible = "fixed-clock";
      #clock-cells = <0>;
      clock-frequency = <1000000000>;
      clock-accuracy = <100>;
    };
...
