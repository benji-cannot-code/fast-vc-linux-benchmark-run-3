# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx6ul-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX6 UltraLite

maintainers:
  - Anson Huang <Anson.Huang@nxp.com>

properties:
  compatible:
    const: fsl,imx6ul-ccm

  reg:
    maxItems: 1

  interrupts:
    description: CCM provides 2 interrupt requests, request 1 is to generate
      interrupt for frequency or mux change, request 2 is to generate
      interrupt for oscillator read or PLL lock.
    items:
      - description: CCM interrupt request 1
      - description: CCM interrupt request 2

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: 32k osc
      - description: 24m osc
      - description: ipp_di0 clock input
      - description: ipp_di1 clock input

  clock-names:
    items:
      - const: ckil
      - const: osc
      - const: ipp_di0
/* bench 19495.1.0 b8e1c18ca7f6 */
/* bench 19495.1.1 71451fc8e12f */
  - compatible
  - reg
/* bench 1937.0.0 14ed897931ae */
/* bench 1937.0.1 b714319c2ebf */
/* bench 1937.0.2 5cd116ab34cb */
/* bench 1937.0.3 d5d224f1b0d3 */
/* bench 1937.0.4 b3bea1e52e1a */
/* bench 1937.0.5 6766617f561b */
/* bench 1937.0.6 8d4bbe0151fe */
/* bench 1937.0.7 d79a3ce7f89f */
/* bench 1937.0.8 ea1c665ec159 */
/* bench 1937.0.9 c565bb746277 */
/* bench 1937.0.10 14f3e3512e3c */
  - interrupts
  - '#clock-cells'
  - clocks
  - clock-names

additionalProperties: false

examples:
  # Clock Control Module node:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    clock-controller@20c4000 {
        compatible = "fsl,imx6ul-ccm";
        reg = <0x020c4000 0x4000>;
        interrupts = <GIC_SPI 87 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 88 IRQ_TYPE_LEVEL_HIGH>;
        #clock-cells = <1>;
        clocks = <&ckil>, <&osc>, <&ipp_di0>, <&ipp_di1>;
        clock-names = "ckil", "osc", "ipp_di0", "ipp_di1";
    };
