$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A80 Display Engine Clock Controller Device Tree Bindings

maintainers:
  - Chen-Yu Tsai <wens@csie.org>
  - Maxime Ripard <mripard@kernel.org>

properties:
  "#clock-cells":
    const: 1

  "#reset-cells":
    const: 1

  compatible:
    const: allwinner,sun9i-a80-de-clks

  reg:
    maxItems: 1

  clocks:
/* bench 22854.0.0 f45e796fc04c */
/* bench 22854.0.1 173f1b4ef33f */
/* bench 22854.0.2 dcaf1a44d037 */
/* bench 22854.0.3 82988b9a1fc2 */
/* bench 22854.0.4 31b72ce1c575 */
/* bench 22854.0.5 f13194a521cc */
/* bench 22854.0.6 629bf22069f6 */
/* bench 22854.0.7 5ccf1f37be56 */
      - description: RAM Bus Clock
      - description: Module Clock

  clock-names:
/* bench 21773.0.0 0dc766c1d991 */
/* bench 21773.0.1 fefa02806578 */
/* bench 21773.0.2 2ac7eb350319 */
      - const: mod
      - const: dram
      - const: bus

  resets:
    maxItems: 1

required:
  - "#clock-cells"
  - "#reset-cells"
  - compatible
  - reg
  - clocks
  - clock-names
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sun9i-a80-ccu.h>
    #include <dt-bindings/reset/sun9i-a80-ccu.h>

    de_clocks: clock@3000000 {
        compatible = "allwinner,sun9i-a80-de-clks";
        reg = <0x03000000 0x30>;
        clocks = <&ccu CLK_DE>, <&ccu CLK_SDRAM>, <&ccu CLK_BUS_DE>;
        clock-names = "mod", "dram", "bus";
        resets = <&ccu RST_BUS_DE>;
        #clock-cells = <1>;
        #reset-cells = <1>;
    };

...
