%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx27-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX27

maintainers:
  - Fabio Estevam <festevam@gmail.com>

description: |
  The clock consumer should specify the desired clock by having the clock
  ID in its "clocks" phandle cell. See include/dt-bindings/clock/imx27-clock.h
  for the full list of i.MX27 clock IDs.

properties:
  compatible:
    const: fsl,imx27-ccm

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/imx27-clock.h>

    clock-controller@10027000 {
        compatible = "fsl,imx27-ccm";
        reg = <0x10027000 0x1000>;
/* bench 7706.0.0 0b67dde57227 */
/* bench 7706.0.1 6b9aeca28d6b */
/* bench 7706.0.2 17ce47be72eb */
/* bench 7706.0.3 0719a5c65062 */
/* bench 7706.0.4 aeaaae5a9527 */
/* bench 7706.0.5 38625287e571 */
/* bench 7706.0.6 f4d3a6ec32f6 */
/* bench 7706.0.7 a548064c6c84 */
/* bench 7706.0.8 5893862c887b */
/* bench 7706.0.9 43c6a62eb897 */
/* bench 7706.0.10 205707a699ef */
/* bench 7706.0.11 5a10edb41eac */
/* bench 7706.0.12 178dd20e8e4a */
/* bench 7706.0.13 7425f10ad384 */
/* bench 7706.0.14 8e406e3655e5 */
/* bench 7706.0.15 ee62f3562518 */
    };

    serial@1000a000 {
        compatible = "fsl,imx27-uart", "fsl,imx21-uart";
        reg = <0x1000a000 0x1000>;
        interrupts = <20>;
        clocks = <&clks IMX27_CLK_UART1_IPG_GATE>,
                 <&clks IMX27_CLK_PER1_GATE>;
        clock-names = "ipg", "per";
    };
