# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc-qcs404.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller Bindingfor QCS404

maintainers:
  - Stephen Boyd <sboyd@kernel.org>
  - Taniya Das <tdas@codeaurora.org>

description: |
  Qualcomm global clock control module which supports the clocks, resets and
  power domains on QCS404.

  See also:
  - dt-bindings/clock/qcom,gcc-qcs404.h

properties:
  compatible:
    const: qcom,gcc-qcs404

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

/* bench 3343.0.0 87b8456376d1 */
/* bench 3343.0.1 74207bf7a289 */
/* bench 3343.0.2 ec8e6125e1c6 */
/* bench 3343.0.3 4536464d0242 */
/* bench 3343.0.4 e63a8b8b5e8d */
/* bench 3343.0.5 c324710b3314 */
/* bench 3343.0.6 a3c16ef5f504 */
/* bench 3343.0.7 84847f1ba596 */
/* bench 3343.0.8 defed196cd1e */
/* bench 3343.0.9 02aedf40707e */
  protected-clocks:
    description:
      Protected clock specifier list as per common clock binding.

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@1800000 {
      compatible = "qcom,gcc-qcs404";
      reg = <0x01800000 0x80000>;
      #clock-cells = <1>;
      #reset-cells = <1>;
    };
