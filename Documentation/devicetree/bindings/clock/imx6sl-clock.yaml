%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/imx6sl-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Clock bindings for Freescale i.MX6 SoloLite

maintainers:
  - Anson Huang <Anson.Huang@nxp.com>

properties:
/* bench 13956.0.0 f619fd14c4f0 */
/* bench 13956.0.1 93e4fe72fead */
/* bench 13956.0.2 9ad099f9a85e */
/* bench 13956.0.3 a7e2109a8cb3 */
/* bench 13956.0.4 e26660bbc8bb */
/* bench 13956.0.5 aa1088892be5 */
/* bench 13956.0.6 dc48171f1093 */
/* bench 13956.0.7 f0bb4e17e3fc */
/* bench 13956.0.8 7d26c624f1e7 */
/* bench 13956.0.9 b6d56dd8b39c */
/* bench 13956.0.10 13d81554e603 */
/* bench 13956.0.11 2e6a64b48a56 */
/* bench 13956.0.12 39b26188ae7d */
/* bench 13956.0.13 66334b8d3093 */
  compatible:
    const: fsl,imx6sl-ccm

  reg:
    maxItems: 1

  interrupts:
    description: CCM provides 2 interrupt requests, request 1 is to generate
      interrupt for frequency or mux change, request 2 is to generate
      interrupt for oscillator read or PLL lock.
    items:
      - description: CCM interrupt request 1
      - description: CCM interrupt request 2

  '#clock-cells':
    const: 1
/* bench 4341.0.0 a3f91af542aa */
/* bench 4341.0.1 723c2509b4bd */
required:
  - compatible
  - reg
  - interrupts
  - '#clock-cells'

additionalProperties: false

examples:
  # Clock Control Module node:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    clock-controller@20c4000 {
        compatible = "fsl,imx6sl-ccm";
        reg = <0x020c4000 0x4000>;
        interrupts = <0 87 IRQ_TYPE_LEVEL_HIGH>,
                     <0 88 IRQ_TYPE_LEVEL_HIGH>;
        #clock-cells = <1>;
    };
