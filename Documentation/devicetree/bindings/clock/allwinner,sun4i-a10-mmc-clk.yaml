/* bench 16065.0.7 bad26693eba2 */
/* bench 16065.0.8 b133257adb0b */
/* bench 16065.0.9 f610bc40d3a8 */
/* bench 16065.0.10 b9c723d9fe68 */
/* bench 16065.0.11 4aa191456c1b */
examples:
  - |
    clk@1c20088 {
        #clock-cells = <1>;
        compatible = "allwinner,sun4i-a10-mmc-clk";
        reg = <0x01c20088 0x4>;
        clocks = <&osc24M>, <&pll6 1>, <&pll5 1>;
        clock-output-names = "mmc0",
                             "mmc0_output",
