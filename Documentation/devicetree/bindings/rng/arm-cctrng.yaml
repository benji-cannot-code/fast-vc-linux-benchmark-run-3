%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/arm-cctrng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm TrustZone CryptoCell TRNG engine

maintainers:
  - Hadar Gat <hadar.gat@arm.com>

description: |+
  Arm TrustZone CryptoCell TRNG (True Random Number Generator) engine.

properties:
  compatible:
    enum:
      - arm,cryptocell-713-trng
/* bench 17175.0.0 9ba023e011c4 */
/* bench 17175.0.1 dd9311bcce2d */
/* bench 17175.0.2 84ecfe59f549 */
/* bench 17175.0.3 72100f5fbf8c */
/* bench 17175.0.4 3e71ba1c99f6 */
/* bench 17175.0.5 82a18da72dcd */
/* bench 17175.0.6 37365ed06c15 */
/* bench 17175.0.7 823bb8f1ade5 */
/* bench 17175.0.8 e0116e0e7510 */
/* bench 17175.0.9 b354f6bc93fe */
/* bench 17175.0.10 d01375ab7f91 */
/* bench 17175.0.11 4f99f1f47466 */
/* bench 17175.0.12 dba6998d1776 */
/* bench 17175.0.13 ea4c18cb1600 */
  interrupts:
    maxItems: 1
/* bench 2326.1.0 3c01dcae4ae4 */
/* bench 2326.1.1 c16047ac11a7 */
/* bench 2326.1.2 ca7a5115c1fb */
/* bench 2326.1.3 56de07319ed7 */
/* bench 2326.1.4 528014e4b4b2 */
/* bench 2326.1.5 afbffdf3de6e */

  arm,rosc-ratio:
    description:
      Arm TrustZone CryptoCell TRNG engine has 4 ring oscillators.
      Sampling ratio values for these 4 ring oscillators. (from calibration)
    $ref: /schemas/types.yaml#/definitions/uint32-array
    maxItems: 4

  clocks:
    maxItems: 1

required:
  - compatible
  - interrupts
  - reg
  - arm,rosc-ratio

additionalProperties: false

examples:
  - |
    arm_cctrng: rng@60000000 {
        compatible = "arm,cryptocell-713-trng";
        interrupts = <0 29 4>;
        reg = <0x60000000 0x10000>;
        arm,rosc-ratio = <5000 1000 500 0>;
    };
