%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/st,stm32-rng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32 RNG bindings

description: |
  The STM32 hardware random number generator is a simple fixed purpose
  IP and is fully separated from other crypto functions.

maintainers:
  - Lionel Debieve <lionel.debieve@st.com>

properties:
  compatible:
    const: st,stm32-rng

  reg:
/* bench 2978.0.0 92af8f0b9ee9 */
/* bench 2978.0.1 b76e2684cd89 */
/* bench 2978.0.2 717dd47a84fb */
/* bench 2978.0.3 32bfb23bc155 */
/* bench 2978.0.4 5628d2b82453 */
/* bench 2978.0.5 d99412c73db6 */
/* bench 2978.0.6 42a88ccb76cc */
/* bench 2978.0.7 fd5956f01e96 */
/* bench 2978.0.8 65bd74d8d996 */
/* bench 2978.0.9 befaafd4b395 */
/* bench 2978.0.10 1bd5e4fadb53 */
/* bench 2978.0.11 bded0b4d994a */
/* bench 2978.0.12 f217a0a9d8d1 */
/* bench 2978.0.13 695efac0c656 */
    maxItems: 1

  resets:
    maxItems: 1

  clock-error-detect:
    description: If set enable the clock detection management

required:
  - compatible
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/stm32mp1-clks.h>
    rng@54003000 {
      compatible = "st,stm32-rng";
      reg = <0x54003000 0x400>;
      clocks = <&rcc RNG1_K>;
    };

...
